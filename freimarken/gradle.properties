# Kein Hintergrunddienst: Der Gradle-Daemon haelt unter Windows Dateien im Projektordner
# offen. Das Projekt liegt auf einer Freigabe, und der Manager sichert und raeumt dort auf -
# offene Dateien lassen das mit Zugriffsfehlern scheitern, die nach einem ganz anderen
# Problem aussehen. Der Preis sind ein paar Sekunden je Build.
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Dateiueberwachung aus: Auf einer SMB-Freigabe kann Windows sie nicht einrichten, und
# Gradle meldet bei jedem Build "Couldn't add watch". Die Meldung ist harmlos, verdeckt
# aber echte Warnungen.
org.gradle.vfs.watch=false

