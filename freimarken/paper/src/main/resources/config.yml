# DER BUNDESMARKT - was der Bund ankauft und zu welchem Preis.
#
# Die zweite gedeckelte Quelle (Plan 8.2: "Verkauf an den Bundesmarkt - kleines
# Sortiment, niedrige Preise"). Er ist mit Absicht KEINE zweite Arbeit, sondern die
# Verwertung des Erarbeiteten: Wer nur verkauft, soll nicht so viel bekommen wie wer
# arbeitet.
#
# DIE NIEDRIGEN PREISE SIND DIE SENKE. Der Bund zahlt weniger als ein Spieler im Laden,
# und genau diese Spanne ist der Anreiz, miteinander zu handeln statt mit dem Server.
# Darum gibt es hier KEINE Marktgebuehr - die fuenf Prozent aus dem Plan gehoeren zum
# Spielerhandel in der Markthalle, und zwei Senken auf denselben Verkauf waeren eine zu
# viel.
#
# GEZAHLT WIRD IN GANZEN MARK, gerechnet in PFENNIGEN. Der Bund nimmt nur so viele
# Stueck, wie eine ganze Mark ergeben: Von sieben Stein zu 20 Pfennigen nimmt er fuenf
# und zahlt eine Mark, zwei bleiben dir. Nichts geht verloren, und die Rechnung laesst
# sich nachvollziehen.
#
# EIN ORT: Verkauft wird nur in der Ankunftswelt (reisen.ankunftswelt), wo der
# Bundesmarkt steht. Die Liste darf man ueberall ansehen.
bundesmarkt:
  # Wie viele Mark ein Spieler an einem Tag hoechstens aus VERKAEUFEN bekommt.
  #
  # Ein EIGENER Deckel und nicht derselbe wie beim Verdienen: Mit einem gemeinsamen waere
  # jede der zwei Quellen durch die andere zu verschliessen - wer vormittags verkauft,
  # koennte nachmittags nicht mehr arbeiten.
  #
  # 5.000 ist ein Viertel des Verdienstdeckels. Bei 2.000 bis 5.000 Mark je Spielstunde
  # aus Arbeit ist das etwa eine Stunde: genug, damit Verkaufen sich lohnt, zu wenig,
  # damit es die Arbeit ersetzt. Die Ware ist beim Erarbeiten schon einmal bezahlt
  # worden; wer sie auch noch zum halben Tagessatz verwertet, verdient am selben Block
  # zweimal.
  #
  # EINE 0 HEISST: KEIN DECKEL [10.11.2026]. Dann kann ein Spieler beliebig viel am Tag
  # an den Bund verkaufen - begrenzt nur dadurch, was er zusammentraegt und welche
  # Schilder stehen. Bis zu diesem Tag war die 0 verboten (sie hiesse "niemand kann
  # verkaufen"); den Ankauf abzuschalten geht jetzt dadurch, dass kein Schild dafuer
  # steht, und darum ist die Zahl frei fuer die Einstellung, um die es wirklich geht.
  #
  # Mehr als Faktor 2 gegen diesen Wert braucht eine Bestaetigung unter
  # wirtschaft.sprung-bestaetigt.markt-tagesdeckel - es ist ein Geldwert. Das gilt auch
  # fuer die 0: Wer den Deckel abschaltet, traegt die Bestaetigung ein.
  tagesdeckel: 5000
  # DAS SORTIMENT STAND HIER BIS ZUM 10.11.2026 - eine Tafel mit 56 Materialien und
  # je einem Ankaufpreis in Pfennigen. Sie ist gefallen, und der Satz, der sie
  # ersetzt, ist einer des Betreibers: "es kann ja nur ge- und verkauft werden,
  # wofuer es ein Schild gibt."
  #
  # WAS DER BUND HANDELT, ENTSCHEIDEN SEINE SCHILDER. Ein Stand ist ein
  # gewoehnliches Shopschild mit dem Bundwort (handel.bundshop-wort) in der ersten
  # Zeile; der Preis steht darauf wie bei jedem anderen Laden. Damit ist alles
  # freigegeben - und abgeschaltet wird der Ankauf dadurch, dass kein Schild steht.
  #
  # /markt zeigt die Staende samt Ort und Preis. Wie viele es sind, sagt der
  # Startbericht in der Zeile der Kistenshops.

# Wie Spielzeit gemessen wird und wann ein Tag endet.
#
# Gezaehlt wird Anwesenheit mit Lebenszeichen, in Sekunden, und zwar aus der Differenz
# zweier Uhrablesungen - nicht aus der Zahl der Takte. Ein verspaeteter Takt zaehlt
# deshalb richtig, und ein lahmender Server verliert nichts.
#
# In der Datenbank steht immer nur schon VERSTRICHENE Zeit und nie ein laufender
# Zeitpunkt. Darum kann kein Absturz eine offene Sitzung hinterlassen, und es gibt kein
# Aufraeumen beim Start.
#
# Gezaehlt wird erst ab dem Einbau dieser Messung. Spielstunden von davor stehen nirgends:
# Die Minecraft-Statistik waere die einzige Quelle, und die ist fuer jedes Plugin
# schreibbar, nicht an eine Welt gebunden und von einer Weltkopie verdoppelt - sie kann die
# Zusage "die Datenbank ist die Wahrheit" nicht halten. Jeder faengt bei 0 an, und die
# Anzeige sagt das.
zeit:
  # In welcher Zone ein Tag beginnt und endet - die Tagesgrenze.
  #
  # Ein Zonenname wie Europe/Berlin oder UTC, also ein Eintrag aus der Zonendatenbank.
  # Ein fester Versatz wie "UTC+2" wird abgewiesen: Er kennt keine Sommerzeit, und die
  # Tagesgrenze laege vom letzten Sonntag im Maerz an um 01:00 Ortszeit. Ein Tippfehler
  # wird ebenfalls abgewiesen und faellt nicht stumm auf die Zone des Rechners zurueck.
  #
  # Was keine Pruefung faengt, ist der Name, der gueltig und trotzdem falsch ist: UTC statt
  # Europe/Berlin verschiebt die Grenze um eine Stunde, ohne dass etwas klagt. Dagegen
  # steht die Zeile im Startprotokoll, etwa "Tagesgrenze Europe/Berlin - naechster
  # Tageswechsel 04.11.2026 00:00 Ortszeit = 03.11.2026 23:00 UTC". Wer dort bei
  # Nachmittagslicht "00:00 Ortszeit = 00:00 UTC" liest, sieht den Fehler. Am Tag einer
  # Zeitumstellung nennt dieselbe Zeile den 23- oder 25-Stunden-Tag.
  #
  # Alle Zeitstempel in der Datenbank bleiben UTC; nur der TAG wird in dieser Zone
  # gerechnet, und zwar ausschliesslich in Java. MariaDB entscheidet die Tagesgrenze nicht
  # (die Verbindung steht fest auf UTC, dort ist zwischen 00:00 und 02:00 Ortszeit noch der
  # Vortag).
  #
  # NUR BEIM START GELESEN - /freimarken neuladen vergleicht und meldet, uebernimmt aber
  # nicht. Eine neue Zone im Betrieb verschoebe die Tagesgrenze mitten am Tag: Mit dem
  # ersten Verbraucher der Grenze (Tagesbonus, Ladenmiete, Verdienstdeckel) wuerde derselbe
  # Tag dann zweimal abgerechnet oder fiele aus.
  zone: "Europe/Berlin"

  # In welchem Abstand die gemessene Zeit in die Datenbank geschrieben wird.
  #
  # Ganze Zahl von 10 bis 600 Sekunden. Der Wert entscheidet NUR, wie oft geschrieben wird,
  # nicht wie viel gezaehlt wird. Er ist damit die eine Zahl, mit der Schreiblast gegen
  # Verlust bei einem Absturz getauscht wird: Bei 60 verliert ein Absturz bis zu 1 Minute je
  # anwesendem Spieler, bei 600 bis zu 10 - solange die Datenbank annimmt. Nach einem
  # Fehlschlag ist es ein Mehrfaches davon, siehe den Absatz zum Stillstand weiter unten.
  # Ein geordneter Neustart und ein Abmelden verlieren nichts - dort wird abgerechnet.
  #
  # Unter 10 Sekunden schreibt der Takt oefter, als jede Anzeige unterscheidet - zehn
  # Schreibzuege je Minute und Spieler fuer eine Zahl, die in Minuten dasteht.
  #
  # Dieser Wert bestimmt auch, wie oft der Server bei unerreichbarer Datenbank kurz stehen
  # bleibt: Ein Schreibversuch in eine tote Datenbank haelt den Hauptfaden an, bis die
  # Verbindung ihre Fristen abgewartet hat - wie lange das ist, steht in den Fristen der
  # Datenschicht und nicht hier, sonst stuende hier bald eine andere Zahl als dort.
  # Nach einem Fehlschlag laesst der Takt darum einige Schlaege lang das SCHREIBEN aus -
  # wie viele, sagt die Protokollzeile des Fehlschlags selbst. GERECHNET wird in diesen
  # Schlaegen weiter: Ihre Sekunden warten auf den naechsten erfolgreichen Schreibzug und
  # gehen auf jedem geordneten Weg mit - beim Abmelden mitten im Fenster, beim
  # Herunterfahren, beim Neustart des Plugins. Verloren ist allein der eine Takt, der
  # wirklich versucht wurde - und genau den nennt die Zeile.
  #
  # Der Preis dieses Fensters: Stuerzt der Server darin ab oder schiesst ein Waechter ihn
  # ab, sind nicht die Sekunden EINER Taktlaenge je Spieler weg, sondern auch die aller
  # ausgesetzten Schlaege davor. Darum ist ein grosser Takt zweimal teuer.
  #
  # Diese Zahl ist zugleich die Untergrenze fuer untaetig-minuten weiter unten: Die
  # Untaetigkeitsgrenze darf nicht kuerzer sein als der Takt (aufgerundet auf ganze
  # Minuten), sonst wirft ein verworfener Takt aktiv gespielte Zeit weg.
  #
  # NUR BEIM START GELESEN - und das ist kein Versehen: Der Abstand steckt im gestellten
  # Zeitgeber. Ihn beim Neuladen neu zu stellen hiesse, dass nach zwei Neuladen drei
  # Zeitgeber dieselbe Spielzeit dreifach schreiben.
  takt-sekunden: 60

  # Ab welcher Untaetigkeit ein Takt nicht mehr zaehlt.
  #
  # Ganze Zahl von 0 bis 1440 Minuten. 0 heisst ausdruecklich: Abwesenheit zaehlt mit - der
  # ehrliche Ausschalter fuer die Regel. Gemessen wird mit der Untaetigkeitsdauer, die der
  # Server selbst fuehrt.
  #
  # Die Grenze schliesst den Nachtlang im Startbildschirm aus, der ohne jede Absicht
  # passiert. Sie ist aber KEINE Sperre: Wer alle neun Minuten eine Taste drueckt, gilt
  # durchgehend als aktiv, und ein Makro oder ein beschwertes Tastenbrett erzeugt genau das.
  # Eine Hoeflichkeitsregel, keine Mauer - wer das Gegenteil braucht, braucht eine
  # Verhaltensmessung und nicht eine groessere Zahl hier.
  #
  # Die Grenze ist eine Stufe und kein Schnitt, also zugunsten des Spielers: Wer aufsteht,
  # bekommt bis zu diese 10 Minuten geschenkt. Ein Rang, der durch eine Pause verlorengeht,
  # erklaert sich niemandem. Umgekehrt wird ein verworfener Takt NICHT angespart und spaeter
  # ausgezahlt - sonst sammelte ein abwesender Spieler seine Stunden und kassierte sie mit
  # einem Schritt.
  #
  # WEIL die Grenze eine Stufe ist, darf sie nicht KUERZER sein als takt-sekunden: Bei
  # takt-sekunden: 600 und untaetig-minuten: 1 faellt der ganze Takt weg, sobald der Spieler
  # die letzte Minute stillsteht - 540 aktiv gespielte Sekunden waeren weg, ohne eine
  # Protokollzeile, und bei jedem Takt erneut. Erlaubt ist darum jede Zahl ab dem Takt in
  # ganzen Minuten aufgerundet (zu 60 s also 1, zu 90 s 2, zu 600 s 10) - oder die 0.
  #
  # Was passiert, wenn man es doch versucht: Das Paar wird abgewiesen, nicht abgeschnitten
  # und nicht geraten. Beim Start klagt das Protokoll mit dem Grund und nennt die kleinste
  # passende Zahl; es bleibt dann bei diesen 10 Minuten. Bei /freimarken neuladen wird
  # NICHTS uebernommen - auch die uebrigen Zeilen nicht, denn eine Klage haelt die ganze
  # Uebernahme an -, und die Antwort nennt denselben Grund.
  #
  # /freimarken neuladen uebernimmt diesen Wert. Er wird beim Gebrauch gefragt; es wird
  # dafuer kein Objekt gebaut und nichts angemeldet. Die eine Ausnahme: Wer takt-sekunden
  # verkuerzt und die Grenze mit ihm (etwa von 600/10 auf 60/1), hat ein stimmiges Paar in
  # der DATEI und trotzdem ein unstimmiges im BETRIEB - der laufende Takt ist noch der
  # lange, denn takt-sekunden wird nur beim Start gelesen. Dann bleibt die alte Grenze
  # stehen, und der Block "Nur beim Start gelesen" sagt es mit dem Grund; nach dem
  # naechsten Neustart gilt beides zusammen.
  untaetig-minuten: 10

# Der Tagesbonus (Plan 8.2, Teil H): Die dritte und kleinste Quelle neben Arbeit und
# Bundesmarkt. Er belohnt ZWEI verschiedene Dinge, und das ist der ganze Entwurf:
#
#   - das taegliche EINLOGGEN mit dem Grundbetrag,
#   - das REGELMAESSIGE Spielen mit der Serie, die jeden Tag in Folge mehr gibt.
#
# Gezahlt wird hoechstens EINMAL am Tag, und darueber wacht das Buchungsbuch und nicht
# eine Merkzeile: Gefragt wird, ob seit dem Tagesbeginn eine Buchung mit dem Grund
# tagesbonus steht. Darum kann kein Absturz und kein Neustart eine zweite Zahlung am
# selben Tag erzeugen - und darum braucht dieser Bonus keinen eigenen Tagesdeckel.
#
# Welcher Tag gemeint ist, sagt zeit.zone weiter unten - Mitternacht Ortszeit, nicht UTC.
#
# /freimarken neuladen uebernimmt alle fuenf Zeilen.
tagesbonus:
  # Was der ERSTE Tag einer Serie bringt, in ganzen Mark. Erlaubt ist 1 bis 1.000.000.
  #
  # 500 Mark sind rund zehn Minuten Arbeit (Plan 8.2 rechnet mit 2.000 bis 5.000 Mark je
  # Spielstunde) - sichtbar genug, dass das Einloggen sich lohnt, und zu wenig, um einen
  # Arbeitstag zu ersetzen. Der Bonus soll Regelmaessigkeit belohnen und keine zweite
  # Arbeit sein.
  #
  # Eine 0 wird abgewiesen: Sie hiesse, dass der Bonus eine Nachricht ueber 0 Mark
  # schickt. Wer ihn nicht will, soll das sagen muessen und nicht eine 0 einsetzen.
  grundbetrag: 500

  # Was jeder WEITERE Tag der Serie dazulegt, in ganzen Mark. Erlaubt ist 0 bis
  # 1.000.000; eine 0 ist erlaubt und heisst: jeder Tag bringt dasselbe.
  #
  # Mit 100 Mark je Tag und dem Hoechstbetrag darunter ist die Staffel: Tag 1 gibt 500,
  # Tag 2 gibt 600, ab Tag 16 dann 2.000. Sechzehn Tage sind lang genug, dass die Serie
  # sich wie ein Ziel anfuehlt, und kurz genug, dass ein Spieler sie erlebt.
  je-serientag: 100

  # Woran die Serie aufhoert zu wachsen, in ganzen Mark. Erlaubt ist der Grundbetrag
  # bis 1.000.000.
  #
  # 2.000 Mark sind ein Zehntel des Verdienstdeckels (verdienst.tagesdeckel). Strenger
  # als beim Bundesmarkt, der ein Viertel sein darf: Der Markt verwertet Erarbeitetes,
  # der Bonus verlangt gar nichts.
  #
  # DIESE ZEILE BRAUCHT ES. Ohne sie liefe eine lange Serie davon: Bei 100 Mark je Tag
  # waere der Bonus nach einem Jahr groesser als ein Tagesverdienst - und eingestellt
  # hat man ihn, als die Serien kurz waren.
  #
  # Ein Hoechstbetrag UNTER dem Grundbetrag wird abgewiesen, nicht abgeschnitten: Dann
  # gaelte der Grundbetrag nie, und seine Zeile hier waere eine Angabe ohne Wirkung.
  hoechstbetrag: 2000

  # Ab welcher LUECKE in Tagen die Serie reisst. Erlaubt ist 2 bis 366.
  #
  # Die Luecke ist der Abstand zwischen dem letzten Bonustag und heute. Bei 2 haelt die
  # Serie nur, wer gestern da war - wer einen Tag verpasst, faengt bei Tag 1 an. Das ist
  # die strenge und uebliche Lesart.
  #
  # Bei 3 wird ein verpasster Tag verziehen: Wer vorgestern da war, setzt fort. Das ist
  # freundlicher und nimmt der Serie etwas von ihrer Haerte - deine Entscheidung.
  #
  # Eine 1 wird abgewiesen: Sie liesse die Serie fuer JEDEN reissen, auch fuer den, der
  # gestern da war. Die Serie stuende dann immer auf 1, und man suchte den Fehler in der
  # Belohnung statt in dieser Zahl.
  serie-reisst-ab-luecke: 2

  # Wie viele TAETIGE Minuten des Tages vor dem Bonus liegen. Erlaubt ist 0 bis 1440.
  #
  # 0 heisst: Der Bonus faellt beim EINLOGGEN. So ist es gewollt - das taegliche
  # Einloggen soll belohnt werden, und eine Wartezeit davor macht aus einer Belohnung
  # eine Auflage.
  #
  # Wer das Einloggen allein nicht belohnen will, setzt hier Minuten ein. Dann zaehlen
  # TAETIGE Minuten aus dem Abschnitt messstelle und NICHT Anwesenheit: Anwesenheit ist
  # im Stehen zu haben, und genau dagegen ist diese Zahl gedacht. Gezahlt wird dann beim
  # ersten Taktschlag, der die Zahl erreicht - also bis zu zeit.takt-sekunden spaeter.
  #
  # Ein ganzer Tag (1440) wird abgewiesen: Der Bonus faellt dann genau am Tageswechsel,
  # also nie.
  mindest-minuten: 0
# Die Messstelle (Plan 8.8, Teil G): Woran das Plugin erkennt, dass ein Spieler nicht nur
# ANWESEND war, sondern auch TAETIG.
#
# Warum es die ueberhaupt gibt: zeit.untaetig-minuten schliesst den Nachtlang im
# Startbildschirm aus, der ohne Absicht passiert. Gegen Absicht ist sie keine Mauer - ein
# Makro oder ein beschwertes Tastenbrett erzeugt Lebenszeichen, und damit sind die vierzig
# Stunden bis Buerger IM STEHEN erreichbar. Gemessen wird dort Anwesenheit. Die Messstelle
# misst daneben eine zweite Zahl, damit spaeter eine Rangschwelle daran haengen kann, die
# nicht im Stehen erreichbar ist.
#
# Sie GREIFT IN NICHTS EIN. Kein Verdienst wird gesperrt, keine Spielzeit verworfen, kein
# Spieler gemeldet. Sie zaehlt eine zweite Zahl neben der ersten, und /playtime zeigt
# beide. Erkennung statt Verhinderung: Eine Schranke traefe zwangslaeufig auch den
# ehrlichen Spieler mit einer eintoenigen Arbeit, und was sie ihm wegnimmt, holt ihm
# niemand zurueck.
#
# Gemessen wird VIELFALT und nicht Menge. Eine Menge - wie viele Bloecke in der Stunde -
# laesst sich von einem Makro beliebig hochdrehen und trifft dabei genau die ehrlichen
# Spieler, die viel arbeiten. Die Vielfalt laesst sich nicht hochdrehen: Ein Makro gibt
# immer DASSELBE Zeichen, weil es genau eine Tastenfolge wiederholt.
#
# Es gibt KEINEN Ausschalter, und das ist Absicht - dieselbe Begruendung wie bei der Zahl
# der ausgesetzten Taktschlaege: Ein Schalter dafuer waere einer, mit dem man sich stumm
# die eigene Messung wegwirft, und sie ist spaeter die Grundlage einer Rangschwelle. Wer
# milde messen will, setzt verlangte-arten auf 1; dann genuegt EIN Zeichen.
#
# /freimarken neuladen uebernimmt alle drei Zeilen.
messstelle:
  # Wie viele VERSCHIEDENE Arten von Lebenszeichen ein Taktschlag braucht, um als taetig zu
  # zaehlen. Erlaubt ist 1 bis zur Laenge der Liste arten (siehe unten).
  #
  # Gerechnet gegen den Fall, den es treffen soll: Ein Makro am Pflastersteingenerator gibt
  # genau ein Zeichen (abbauen), eine Angelfarm ebenso (benutzen), ein beschwertes
  # Tastenbrett im Startbildschirm keines. Ein Mensch, der denselben Generator abbaut, geht
  # dabei hin und her, raeumt in eine Truhe oder setzt einen Block - er kommt auf zwei.
  #
  # Nicht 3: Beim kuerzesten erlaubten Takt von 10 Sekunden sind drei verschiedene
  # Taetigkeiten auch fuer einen Menschen nicht selbstverstaendlich, und die Messung soll
  # nicht an der Taktlaenge haengen.
  #
  # Eine Zahl GROESSER als die Laenge der Liste arten wird abgewiesen und nicht
  # abgeschnitten: Damit waere kein Taktschlag jemals taetig, und eine Null sieht in jeder
  # Anzeige aus wie ein leerer Server. Das Protokoll klagt dann mit Grund und nennt die
  # groesste passende Zahl.
  verlangte-arten: 2

  # Wie viele Bloecke ein Spieler in einem Taktschlag zuruecklegen muss, damit das Bewegen
  # als Lebenszeichen zaehlt. Erlaubt ist 1 bis 1000.
  #
  # Gemessen wird der ABSTAND zwischen Anfang und Ende des Schlages und nicht der gelaufene
  # Weg: Wer im Kreis laeuft, legt Weg zurueck und kommt nicht weiter - und genau das tut
  # ein Laufmakro an einer Wand. Die Hoehe zaehlt mit; ein Weltwechsel zaehlt immer, denn
  # ein Abstand zwischen zwei Welten hat keine Bedeutung.
  #
  # Acht Bloecke sind gerechnet gegen beide Richtungen: Eine gewackelte Maus und ein
  # beschwerter Taster tragen null bis zwei Bloecke weit (Rueckstoss, Rutschen auf Eis).
  # Nach oben ist es wenig - wer in 10 Sekunden normal laeuft, kommt gut vierzig weit.
  #
  # Eine 0 wird abgewiesen: Sie hiesse, dass auch Stillstehen als Bewegung zaehlt.
  mindest-strecke: 8

  # Welche Arten von Lebenszeichen ueberhaupt zaehlen. Es gibt sieben:
  #
  #   bewegen   mindest-strecke weit gekommen (wird gemessen, nicht gemeldet)
  #   abbauen   einen Block abgebaut
  #   setzen    einen Block gesetzt
  #   oeffnen   eine Oberflaeche geoeffnet - Truhe, Werkbank, Ofen, Trichter
  #   benutzen  einen Block oder Gegenstand mit dem RECHTEN Knopf benutzt
  #   kaempfen  ein Wesen angegriffen
  #   sprechen  geschrieben oder einen Befehl gegeben
  #
  # benutzen fehlt ab Werk, und das ist der wichtigste Satz dieses Abschnitts: Es ist keine
  # Art fuer sich, sondern die halbe Art zum Setzen - ein Block wird mit dem rechten Knopf
  # gesetzt, und derselbe Knopfdruck IST das Benutzen. Ein Makro, das Bloecke setzt, gaebe
  # damit zwei Zeichen aus einer Taste und zaehlte als taetig. Wer die Art dazunimmt, hat
  # eine mildere Messung - und dieses Paar.
  #
  # Der linke Knopf zaehlt NICHT als benutzen, auch wenn die Art dabei ist: Er feuert bei
  # jedem Schlag, und ein Makro am Generator bekaeme sonst abbauen UND benutzen.
  #
  # Eine LEERE Liste wird abgewiesen - sie hiesse, dass kein Taktschlag jemals taetig ist,
  # und das ist der stumme Ausschalter, den es nicht geben soll. Ein unbekannter Name wird
  # beklagt und uebersprungen, die uebrigen gelten weiter.
  arten:
    - bewegen
    - abbauen
    - setzen
    - oeffnen
    - kaempfen
    - sprechen

# Was eine eigene Stadt kostet - Plan 6.2 und 6.4, gebaut am 11.11.2026.
#
# NICHT zu verwechseln mit welten.freistaedte weiter unten: Jener Eintrag beschreibt die
# WELT (ihre Art, ihre Kante, ihr Tor), dieser hier, was das Gruenden kostet. Zwei
# gleichnamige Abschnitte auf zwei Ebenen - dieselbe Stolperstelle wie laeden: neben
# welten.altfurt.
#
# gruendungspreis und hoechstzahl uebernimmt /freimarken neuladen; welt NICHT - eine
# Welt ist zur Laufzeit nicht zu tauschen.
freistaedte:
  # In welcher Welt die Stadtfelder liegen - ohne Namensraum, wie bei laeden.welt.
  # Die Welt muss im Abschnitt welten: weiter unten stehen UND dort art: stadtfelder
  # tragen, sonst gilt keine Freistadt.
  #
  # NUR BEIM START GELESEN.
  welt: freistaedte

  # Was eine Freistadt kostet. Plan 6.2 nennt 400.000 Mark, und die Zahl steht dort neben
  # der Preisstaffel: Die sechste Parzelle kostet genau so viel. Eine Stadt ist damit ein
  # Ziel fuer achtzig bis zweihundert Spielstunden und nicht fuer einen Nachmittag.
  #
  # Ganze Zahl von 0 bis 8388607 Mark. 0 heisst: Wer das Recht hat, gruendet umsonst -
  # erlaubt, braucht aber die Bestaetigung oben unter sprung-bestaetigt.
  gruendungspreis: 400000

  # Wie viele Staedte ein Spieler ohne besonderes Recht haelt.
  #
  # Mehr erlaubt das Recht freimarken.freistaedte.<zahl> (je Rang, in raenge.leiter unter
  # zahlen: freistaedte) und obendrauf freimarken.extra.freistaedte.<zahl> (eine
  # Mitgliedschaft). Es gilt die hoechste Zahl aus Recht UND Datei, der Zuschlag kommt
  # darauf - wie bei den Parzellen und den Inseln.
  #
  # Ganze Zahl von 0 bis 399 - mehr Felder hat die Welt nicht. Eine 0 heisst: Es wird gar
  # nicht gegruendet; brauchbar, solange die Welt noch vorbereitet wird. ABER NUR, WENN
  # AUCH KEINE RANGSTUFE freistaedte VERGIBT - sonst gilt die Zahl aus dem Recht, und die
  # 0 hier wirkt nicht. Der Startlauf sagt genau das in einer eigenen Zeile.
  #
  # Eine Eins, weil es nur 399 Felder gibt und eine Stadt 256x256 Bloecke ist. Wer zwei
  # haelt, nimmt sie einem anderen weg - und zwei halbleere Staedte sind schlechter als
  # eine volle.
  hoechstzahl: 1

  # Wie viele ZELLEN ein einzelnes Grundstueck umfassen darf [12.11.2026].
  #
  # Eine Zelle ist 16x16 Bloecke, also genau ein Chunk; ein Stadtfeld traegt 16x16 =
  # 256 davon. Die 256 hier heisst darum: KEINE Begrenzung - ein Grundstueck darf ein
  # ganzes Feld sein. Das ist die Entscheidung fuer die Preisfreiheit aus Plan 16: Wer
  # 400.000 Mark fuer eine Stadt zahlt, soll sie zuschneiden duerfen, wie er will.
  #
  # Eine 0 heisst ebenfalls "ohne Grenze" - dieselbe Lesart wie beim Tagesdeckel. Wer
  # kleinteilige Staedte will, traegt eine kleine Zahl ein: 4 ergibt hoechstens 32x32
  # Bloecke je Grundstueck, 1 genau einen Chunk.
  #
  # Neuladbar: Die Zahl wird beim Zuschneiden gefragt und nicht beim Start kopiert.
  # Eine Aenderung trifft nur NEUE Grundstuecke - was schon zugeschnitten ist, bleibt.
  hoechstzellen: 256

  # Was der Staat von einem GRUNDSTUECKSVERKAUF nimmt, in Prozent [12.11.2026].
  #
  # Dieselbe Lesart wie bei den drei Marktgebuehren im Abschnitt handel: unten:
  #
  #   * 0 heisst keine Gebuehr. Das ist die ausgelieferte Einstellung - erst soll der
  #     Handel laufen, die Senke kommt spaeter.
  #   * Erlaubt ist 0 bis 50. Ueber der Haelfte waere die Gebuehr hoeher als der
  #     Erloes, und dann verkauft niemand mehr.
  #   * Abgezogen wird sie dem VERKAEUFER, nie als Aufschlag auf den Preis. Der Preis
  #     im Angebot ist, was der Kaeufer zahlt.
  #   * Abgerundet und auf die ganze Summe: Bei 5 Prozent auf 19 Mark sind das 0 Mark,
  #     und wo die gerechnete Gebuehr 0 ist, faellt auch keine Gebuehrzeile.
  #
  # Die Zahl steht HIER und nicht unter handel:, weil jener Abschnitt den Kistenshops
  # gehoert und von Shopwerte gelesen wird - einer Klasse, die mit Grundstuecken nichts
  # zu tun hat. Was beide Bereiche teilen, ist die RECHNUNG: Shopregel.gebuehrAuf.
  #
  # Neuladbar: Die Zahl wird beim Kauf gefragt und nicht beim Start kopiert.
  verkaufsgebuehr-prozent: 0

  # Was die STADTBUERGER einer NEU GEGRUENDETEN Stadt im Gemeinschaftsgebiet duerfen
  # [12.11.2026, Teil D].
  #
  # Stadtbuerger ist, wem in der Stadt ein Grundstueck gehoert - nicht der Stadtbesitzer
  # selbst, und kein Mitbauer. Auf seinem eigenen Grundstueck darf ein Buerger immer
  # alles; diese Liste gilt fuer das UEBRIGE Stadtgebiet, also fuer alles, was der
  # Stadtbesitzer noch nicht vergeben hat.
  #
  # Drei Rechte sind einstellbar, und sie stehen NEBENEINANDER - keines schliesst ein
  # anderes ein:
  #
  #   * bauen     - Bloecke setzen und abbauen, Eimer, Feuer, Bilderrahmen, Tiere
  #   * benutzen  - Tueren, Klinken, Zauntore, Knoepfe, Hebel, Druckplatten
  #   * behaelter - Truhen, Oefen, Trichter, Fasser, Kistenloren
  #
  # NUR DIE VORGABE FUER NEUE STAEDTE. Jeder Stadtbesitzer stellt seine Stadt danach
  # selbst ein, mit /freistadt rechte - eine Aenderung hier beruehrt bestehende Staedte
  # nicht. Das ist dieselbe Lesart wie bei der Ladenmiete: Was einmal gilt, gilt weiter.
  #
  # LEER IST DIE AUSGELIEFERTE EINSTELLUNG, und das ist die sichere Richtung: Eine
  # frische Stadt gibt nichts her, bis ihr Besitzer sich entscheidet. Wer seinen Spielern
  # von Anfang an die Tueren oeffnen will, schreibt hier:
  #
  #   buergerrechte:
  #     - benutzen
  #
  # Ein Wort, das keines der drei ist, bricht den Start mit Namen ab - lieber das als ein
  # Recht, das der Betreiber gegeben hat und das lautlos nicht gilt.
  buergerrechte: []
  # DIE AUFLAGE [Plan 16]. Eine Freistadt bekommt ihren Teleporter und das Recht, neue
  #   Kistenshops in ihrem Gebiet entstehen zu lassen, erst wenn sie BEIDES hat:
  #     - einen Regeltext (/freistadt regeln <text>) und
  #     - mindestens ein vergebenes Grundstueck, also mindestens einen Stadtbuerger.
  #   Der Zweck steht im Plan: Das verhindert Geisterstaedte, die Flaeche blockieren.
  #
  # LAUFEND geprueft und nicht nur beim Gruenden. Eine Stadt, die ihre Regeln loescht
  #   oder deren letztes vergebenes Grundstueck zurueckgekauft wird, verliert BEIDES
  #   wieder - den Teleporter UND das Ladenrecht. In einer eingelebten Stadt setzt dann
  #   niemand mehr ein neues Shopschild, bis sie die Auflage wieder erfuellt; die
  #   bestehenden Laeden handeln weiter. Eine Auflage, die nur einmal geprueft wird,
  #   ist nach dem ersten Verkauf stumm.
  #
  # IMMER HINEIN duerfen der Stadtbesitzer, seine Mitbauer und die Stadtbuerger - auch
  #   wenn die Auflage offen ist. Ohne diese Ausnahme waere die Gruendung eine Falle
  #   ueber 400.000 Mark: Eine frische Stadt hat nie ein vergebenes Grundstueck, ihr
  #   Besitzer kaeme also nicht hinein, um eines zuzuschneiden.
  #
  # ZWEI Schalter fuer EINE Auflage, damit sich die beiden Wirkungen trennen lassen.
  #   Auf false wirkt die Auflage an dieser Stelle nicht; der Startbericht sagt es dann
  #   ausdruecklich, denn eine abgeschaltete Regel sieht im Spiel aus wie eine kaputte.
  #
  # teleporter: Wer nicht hinein darf, liest WARUM und bleibt stehen - der
  #   Stadtbesitzer, seine Mitbauer und die Stadtbuerger duerfen immer.
  #
  # ladenrecht: In einer Stadt ohne erfuellte Auflage entsteht KEIN NEUER Kistenshop.
  #   DREI Dinge dazu, und alle drei ueberraschen sonst:
  #     - BESTEHENDE Shops handeln weiter, auch in einer Stadt, die ihre Auflage
  #       verliert. Ein Riegel, der sie mitnaehme, loeschte Laeden wegen einer
  #       Einstellung - und die Ware darin gehoert Spielern.
  #     - Der STADTBESITZER ist NICHT ausgenommen, anders als beim Teleporter. Dort
  #       muss er hinein, sonst kaeme er nicht in seine eigene Stadt; hier sperrt ihn
  #       nichts ein - Regeln setzt er mit einem Befehl, ein Grundstueck schneidet er
  #       zu, und beides geht ohne einen einzigen Laden. Mit einer Ausnahme fuer ihn
  #       baute er seine ganze Markthalle und erfuellte die Auflage nie.
  #     - BUNDSHOPS gehen durch: Sie gehoeren niemandem, die Stadt lizenziert sie
  #       nicht, und aufstellen kann sie nur, wer freimarken.shop.bund hat.
  auflage:
    teleporter: true
    ladenrecht: true

  # DER VERFALL [Plan 16]. Eine Freistadt, die lange unbesucht ist UND keinen
  #   Stadtbuerger hat, ist eine Geisterstadt: Sie blockiert ein Feld, einen Namen und
  #   einen Platz in der Hoechstzahl ihres Besitzers, und niemand hat etwas davon.
  #
  # WAS GESCHIEHT: Sie geht in den Zustand "verfallen". Dort baut NIEMAND mehr, auch ihr
  #   Besitzer nicht - so sieht man, dass sie aufgehoert hat. Feld, Name und das
  #   Guthaben ihrer Stadtkasse behaelt sie; verloren geht nichts.
  #
  # WIE SIE WIEDER AUFWACHT: Ihr BESITZER betritt sie. Das genuegt - im naechsten
  #   Minutentakt ist sie wieder aktiv, und er liest es. Ein Fremder weckt sie NICHT,
  #   sonst hielte ein Durchgangsverkehr jede Geisterstadt am Leben.
  #
  # ENTFERNT WIRD SIE NICHT VON SELBST. Das Feld bleibt belegt, bis das Team sie raeumt
  #   oder ihr Besitzer sie aufgibt. Eine Stadt mit 400.000 Mark Einsatz loescht kein
  #   Zeitgeber von allein.
  #
  # ZWEI WARNUNGEN SIND ZWEI STUFEN und nicht zwei verschickte Nachrichten: Der
  #   Stadtbesitzer liest beim ANMELDEN, in welcher Stufe seine Stadt steht - und so
  #   lange wieder, bis er etwas tut. Ein Zaehler "schon gewarnt" stuende falsch, sobald
  #   eine Nachricht verloren geht, und ein Besuch waere keine Entwarnung.
  #
  # EIN STADTBUERGER HAELT SIE DAUERHAFT. Wer ein Grundstueck vergeben hat, dessen Stadt
  #   verfaellt nie - auch unbesucht nicht. Das ist die zweite Haelfte der Regel aus
  #   Plan 16, und sie ist der billigste Weg heraus.
  verfall:
    # Auf false verfaellt keine Stadt und es wird nicht gewarnt. Der Startbericht sagt
    # es dann ausdruecklich - eine abgeschaltete Regel sieht im Spiel aus wie eine
    # kaputte.
    an: true

    # Nach wie vielen Tagen OHNE BESUCH eine Stadt faellig ist. 365 sind die zwoelf
    # Monate aus Plan 16. Gezaehlt wird ab dem letzten Besuch, und hatte sie noch
    # keinen, ab ihrer GRUENDUNG - nicht ab 1970.
    #
    # In TAGEN und nicht in Monaten, wie jede Frist dieses Plugins: Mit Monaten haengt
    # die Frist am Gruendungsdatum, und eine Stadt vom 31. Januar verfiele dreissig Tage
    # eher als eine vom 1. Februar.
    #
    # Eine 0 ist NICHT erlaubt - sie liesse jede Stadt am Tag ihrer Gruendung verfallen.
    # Wer den Verfall nicht will, setzt an auf false.
    unbesucht-tage: 365

    # Wie viele Tage VOR dem Verfall die erste Warnung gilt. Eine 0 heisst: keine erste
    # Warnung.
    warnung-frueh-tage: 60

    # Und die zweite, dringendere. Sie MUSS naeher am Verfall liegen als die erste -
    # sonst liest ein Stadtbesitzer nie die erste. Vertauscht gilt die ganze Vorgabe,
    # mit einer Klage im Startbericht.
    warnung-spaet-tage: 14

  # WAS DER BESITZER BEIM ENDE SEINER STADT ZURUECKBEKOMMT, in Prozent des Preises, den
  #   er WIRKLICH gezahlt hat - nicht des heutigen aus der Zeile darueber. Wer fuer
  #   400.000 gegruendet hat, soll nicht darunter leiden, dass der Preis seitdem
  #   gesunken ist; die Stadtzeile traegt ihren Preis selbst.
  #
  # Gezahlt wird bei /freistadt aufgeben UND wenn das Team eine Stadt raeumt. In beiden
  #   Faellen kommt das GUTHABEN DER STADTKASSE dazu - sonst waere es verloren.
  #
  # 0 bis 100. Ueber 100 waere das Gruenden eine Geldquelle: Wer gruendet und aufgibt,
  #   machte Gewinn. Eine 0 ist erlaubt, macht das Aufgeben aber unattraktiv - dann
  #   laesst ein Besitzer seine Stadt lieber verfallen, und genau die soll verschwinden.
  erstattung-prozent: 50

  # DIE LADENGEBUEHR - was ein Kistenshop der Stadt zahlt, in deren Feld er steht. Das
  #   Geld geht in die STADTKASSE und ist damit neben der Marktgebuehr die zweite
  #   Einnahme einer Stadt.
  #
  # BEIDE GETRENNT EINSTELLBAR, und jede 0 ist ein Ausschalter:
  ladengebuehr:
    # EINMALIG beim Anlegen eines neuen Kistenshops in der Stadt. Wer nicht zahlen kann,
    #   bekommt keinen Shop - und liest, was fehlt.
    #
    # NICHT 0 ab Werk, obwohl das die bequemere Vorgabe waere: Die zweite Einnahme einer
    #   Stadt (handel.<lage> fuer die Marktgebuehr) liegt ebenfalls bei 0, und mit zwei
    #   Nullen waere die Stadtkasse eine Kasse, in die nie etwas fliesst. Ein Betreiber,
    #   der sie im Spiel ansieht, hielte sie fuer kaputt.
    anlage: 250

    # TAEGLICH je Kistenshop in der Stadt, abgebucht im selben Lauf wie die Ladenmiete.
    #
    # 0 AB WERK, und das ist Absicht: Eine Tagesgebuehr hat eine Folge, die eine
    #   einmalige nicht hat - WER SIE NICHT ZAHLEN KANN, VERLIERT SEINEN SHOP. Das
    #   Schild wird abgebaut; die WARE BLEIBT IN DER KISTE, wie bei jedem Abbau. Ob ein
    #   Server das will, entscheidet sein Betreiber und nicht diese Vorgabe.
    #
    # Wer sie einschaltet, waehlt klein: Bei 10 Mark und zwanzig Shops zahlt ein
    #   Haendler 200 Mark am Tag, und das ist schon eine Entscheidung.
    tag: 0

# DIE MEERINSELN VON HAFENWERDER (Plan 6.2, Schritt 10).
#
# Nicht zu verwechseln mit welten.hafenwerder weiter unten: Jener Eintrag beschreibt die
# WELT (ihre Art, ihre Kante, ihr Tor), dieser hier die Inseln darin. Anders als bei den
# Freistaedten heissen die beiden nicht gleich, und das ist hier der Vorteil - bei
# freistaedte: neben welten.freistaedte ist schon mehr als einmal der falsche Abschnitt
# gemeint gewesen.
#
# welt uebernimmt /freimarken neuladen NICHT - eine Welt ist zur Laufzeit nicht zu
# tauschen.
inseln:
  # In welcher Welt die Inselfelder liegen - ohne Namensraum, wie bei laeden.welt.
  # Die Welt muss im Abschnitt welten: weiter unten stehen UND dort art: inseln tragen,
  # sonst gilt keine Insel.
  #
  # NUR BEIM START GELESEN.
  welt: hafenwerder

  # Was eine Meerinsel kostet. Plan 6.2 nennt 75.000 Mark - rund drei Parzellen aus der
  # Staffel (25.000, 50.000, 100.000) und ein Fuenftel einer Freistadt. Damit ist die
  # Insel das, was Plan 4.1 von ihr sagt: ein "ruhiger Rueckzug mit Status" und kein
  # Lebenswerk.
  #
  # Ein FESTPREIS und keine Staffel: Die Staffel der Marktstadt verdoppelt mit jeder
  # Parzelle, weil dort das Flaechenhorten gebremst werden soll. Hier bremst die
  # hoechstzahl, und 75.000 sind der Preis fuer DIE Insel - nicht fuer die erste von
  # vielen.
  #
  # Ganze Zahl von 0 bis 8388607 Mark. 0 heisst: Wer das Recht hat, nimmt eine Insel
  # umsonst - erlaubt, braucht aber die Bestaetigung oben unter sprung-bestaetigt.
  preis: 75000

  # Wie viele Inseln ein Spieler ohne besonderes Recht haelt.
  #
  # Eine, wie bei der Freistadt, und der Grund ist hier noch schaerfer: Inselflaeche gibt
  # es in einem Archipel nur einmal, und eine Insel ist unteilbar - wer zwei haelt, haelt
  # die zweite leer.
  #
  # MEHR GIBT ES UEBER DAS RECHT, nicht ueber diese Zahl: freimarken.inseln.<n> setzt
  # die Grenze fuer einen Rang (in raenge.leiter unter zahlen: inseln),
  # freimarken.extra.inseln.<n> legt etwas darauf (Mitgliedschaft). Dieselbe Bauart wie
  # bei den Parzellen - damit die Rangzahlen in der Rechteverwaltung bleiben und nicht im
  # Programm.
  #
  # DIE VORSILBE HEISST NACH DER SACHE UND NICHT NACH DEM BEFEHL: inseln neben /werder,
  # wolken neben /wolke. Hier stand bis zum 20.11.2026 die Vorsilbe des BEFEHLS
  # (werder.anzahl) - ein Recht, das es nicht gibt. Wer dem Kommentar folgte, vergab es
  # klaglos, und niemand fragte je danach.
  #
  # Ganze Zahl von 0 bis 323 (so viele Inseln hat die Welt). 0 heisst: Es wird keine
  # vergeben - der Weg, die Inseln abzuschalten, ohne das Recht anzufassen. Das gilt nur,
  # solange keine Rangstufe inseln vergibt: Sonst zaehlt die Zahl aus dem Recht. Der
  # Startlauf sagt es.
  hoechstzahl: 1

# DAS EIGENE ANGELGUT VON HAFENWERDER (Plan 4.1, Schritt 10).
#
# DIE ERSTE BEUTETABELLE DIESES PROJEKTS. Bis zum 18.11.2026 gab es nirgends eine Stelle,
# die bestimmt, WAS man faengt - das Angelereignis wurde nur gelesen, um den Fang zu
# bezahlen. Was im Wasser hing, war vollstaendig Vanilla.
#
# SIE GILT NUR IN DER INSELWELT (inseln.welt weiter oben) und nur im OFFENEN WASSER -
# dieselben Tore wie die Zahlung. Plan 4.1 sagt es so: "Das besondere Angelgut gibt es
# nur im Meer."
#
# DER TAUSCH SITZT VOR DER ZAHLUNG: Die Lohntafel (verdienst.loehne) bezahlt den
# GETAUSCHTEN Fang. Wer einem der Faenge unten eine Lohnzeile gibt, erreicht sie damit -
# ab Werk hat nur nautilus_shell eine (reeder.fischen, 3000 Pfennige).
#
# Alle drei Zeilen uebernimmt /freimarken neuladen.
angeln:
  # Ob die Tabelle ueberhaupt greift. false heisst: In Hafenwerder faengt man, was
  # Vanilla gibt - und zwar sofort, ohne die Tabelle anzufassen.
  #
  # true oder false, nicht ja oder nein: YAML kennt true/false (und yes/no/on/off), und
  # ein "ja" ist dort ein WORT. Es wuerde beklagt und verworfen - dieselbe Schreibweise
  # wie bei freistaedte.auflage.teleporter weiter oben.
  an: true

  # Wie oft die Tabelle den Fang ersetzt, in Prozent (0 bis 100).
  #
  # ZWANZIG, und die Zahl hat zwei Seiten: Weniger, und ein Angler merkt es nicht; mehr,
  # und die Fische aus der Lohntafel werden selten - dann verdient der Fischer in
  # Hafenwerder WENIGER als ueberall sonst, und das ist die Umkehrung von Plan 9.1.
  #
  # Alles, was nicht aus der Tabelle kommt, bleibt Vanilla: Fische, Schrott und die
  # Schatzstuecke, auf die reeder.fischen rechnet.
  haeufigkeit-prozent: 20

  # DIE TABELLE: Gegenstand und Gewicht. Je hoeher das Gewicht, je oefter der Fang; die
  # Summe aller Gewichte ist der Nenner. Erlaubt ist 1 bis 1000000 - eine 0 ist eine
  # Zeile, die nie greift, und die gehoert heraus.
  #
  # WARUM GERADE DIESE NEUN: Hafenwerder hat keine Hoehlen und keine Bauwerke - kein
  # Erz, kein Prismarin, keinen Schwamm, keine Korallen ausser denen, die der Bewuchs
  # setzt. Was hier steht, ist darum kein Zusatzverdienst, sondern der einzige Weg zu
  # diesen Dingen, und ein Grund, nach Hafenwerder zu fahren (Plan 4.1: "Faenge, die es
  # sonst nirgends gibt").
  #
  # DAS MEERESHERZ mit Gewicht 1 ist der Reiz der ganzen Tabelle: Mit ihm und acht
  # Schneckenhaeusern wird ein Aquisator gebaut. Das ist ein Inselziel fuer Wochen - und
  # durch Angeln gibt es es in Vanilla nirgends. Bei 20 Prozent Haeufigkeit und Gewicht
  # 1 von 83 kommt es auf etwa zwei von tausend Faengen; der Startbericht nennt die Zahl.
  #
  # Ein Name, den dieser Server nicht kennt, kostet NUR SEINE ZEILE: Der Start beklagt
  # ihn, die uebrigen Faenge gelten. Erwartet wird der nackte Name wie cod oder
  # heart_of_the_sea, ohne minecraft: davor.
  #
  # Eine LEERE Liste ist erlaubt und bedeutet etwas: wieder Vanilla, ohne den Schalter
  # oben zu finden.
  faenge:
    tropical_fish: 30
    nautilus_shell: 12
    prismarine_shard: 10
    sea_pickle: 8
    prismarine_crystals: 6
    brain_coral_block: 6
    horn_coral_block: 6
    sponge: 4
    heart_of_the_sea: 1

# DIE SKYBLOCKINSELN VON WOLKENWERDER (Plan 4.1 und 6.2, Schritt 11).
#
# Hier steht, was eine Wolkeninsel kostet und wie viele einer halten darf. Die WELT
# selbst - ihre Art, ihre Kante, ihr Tor - steht weiter unten unter welten.wolkenwerder;
# das sind zwei verschiedene Fragen und darum zwei Abschnitte.
wolken:
  # In welcher Welt die Wolkenfelder liegen - ohne Namensraum.
  #
  # NUR BEIM START GELESEN. Die Welt muss im Abschnitt welten: weiter unten stehen UND
  # dort art: wolken tragen, sonst entsteht sie nicht. Die Bindung gilt in BEIDE
  # Richtungen: Genau eine Welt darf wolken tragen, und das muss die aus dieser Zeile
  # sein. Eine zweite haette Felder, aber kein Buch und keinen Schutz - eine Leere, in
  # der jeder baut.
  welt: wolkenwerder

  # Was eine Insel kostet, in Mark. GRATIS ab Werk, und das ist eine Entscheidung des
  # Plans: 6.2 nennt die Skyblockinsel neben der ersten Parzelle als einen der ZWEI
  # gratis Einstiege - "wer nur bauen will, zahlt nie etwas".
  #
  # ACHTUNG BEIM AENDERN: Von 0 aus ist JEDE Zahl ein Sprung ueber das Doppelte, und der
  # braucht die Bestaetigung unter wirtschaft.sprung-bestaetigt.wolken-kauf. Die Klage
  # beim Start nennt die fertige Zeile.
  preis: 0

  # Wie viele Inseln ein Spieler ohne besonderes Recht haelt.
  #
  # Eine, und zwar genau WEIL sie gratis ist: Wer zwei nehmen darf, nimmt die zweite mit
  # und laesst sie leer liegen - und ein Rasterfeld gibt es nur einmal.
  #
  # Mehr gibt es ueber das RECHT, also je Rang:
  #     freimarken.wolken.<n>         setzt die Zahl auf n
  #     freimarken.extra.wolken.<n>   legt n auf die Zahl darauf
  # Die Zahl hier ist nur die Untergrenze fuer jeden, der kein solches Recht hat.
  #
  # Eine 0 ist erlaubt und heisst: Es wird keine Insel vergeben. Das ist der Weg,
  # Wolkenwerder zuzumachen, ohne das Recht anzufassen - aber nur, solange auch keine
  # Rangstufe wolken vergibt (raenge.leiter), denn sonst gilt die Zahl aus dem Recht. Der
  # Startlauf sagt es in einer eigenen Zeile. Hoechstens 1443 - so viele Felder hat die
  # Welt.
  hoechstzahl: 1

  # Welche Biome ein Spieler fuer seine Insel waehlen darf (/wolke biom).
  #
  # Ein Biom ist nicht nur eine Farbe: Es entscheidet, WAS erscheint und WAS waechst -
  # und damit, was auf einer Insel in der Leere ueberhaupt zu bekommen ist. swamp gibt
  # SCHLEIM (und damit Kolben), snowy_plains gibt Eis (und damit Wasser),
  # mushroom_fields laesst KEIN Monster erscheinen, desert laesst es nie regnen.
  #
  # ERFINDEN KANN MAN KEINES: Erlaubt sind nur die zehn, die der Weltgenerator abgibt -
  # plains, forest, desert, jungle, savanna, taiga, snowy_plains, swamp,
  # mushroom_fields, cherry_grove. Ein anderer Name wird beklagt und uebersprungen, die
  # uebrigen Zeilen gelten. Der Grund ist technisch und hart: Die Farbtafel einer Welt
  # wird GENAU EINMAL beim Anlegen gesetzt, und was dort fehlt, laesst sich darin nie
  # mehr setzen.
  #
  # Eine LEERE Liste ist erlaubt und heisst etwas anderes als eine fehlende: keine
  # Biomwahl. Wer alle Zeilen herausnimmt, will sie nicht - und bekommt sie nicht aus
  # der Vorgabe zurueck.
  biome: [plains, forest, desert, jungle, savanna, taiga, snowy_plains, swamp,
          mushroom_fields, cherry_grove]

  # Was in der Truhe auf einer frischen Insel liegt - der Anfang des ganzen Spiels.
  #
  # DIES IST DER SCHWIERIGKEITSGRAD. In einer Welt aus Leere gibt es nichts, was
  # nicht aus dieser Truhe oder dem Kobbelsteingenerator kommt - eine Zeile weniger
  # ist eine Aufgabe mehr, und eine leere Truhe ist erlaubt.
  #
  # OHNE lava_bucket GIBT ES KEIN SPIEL: Aus der Lava und dem geschmolzenen Eis
  # entsteht der Generator, aus ihm der Stein, aus dem Stein der Ofen und die
  # Spitzhacke. Der Startbericht sagt es, wenn diese Zeile fehlt.
  #
  # Warum gerade diese zehn:
  #   lava_bucket    das Herz des Generators
  #   ice            Wasser; es schmilzt im Tageslicht. Zwei Stuecke, damit ein
  #                  Fehlgriff nicht das Spiel beendet
  #   bone_meal      damit Gras auf der Wiese waechst - daraus kommen die ersten
  #                  Samen, und ohne Samen gibt es kein Brot
  #   melon_slice, pumpkin_seeds, sugar_cane, brown_mushroom, red_mushroom,
  #   cactus         Pflanzen, die nirgendwo sonst zu bekommen sind
  #   sand           der Boden fuer den Kaktus; Sand entsteht hier sonst nicht
  #
  # Je Zeile ein Gegenstandsname und eine Anzahl von 1 bis 64. Ein Name, den
  # Minecraft nicht kennt, kostet NUR SEINE ZEILE. Die Reihenfolge in der Truhe
  # ist nicht die dieser Datei, sondern alphabetisch - so sieht jede Insel gleich
  # aus, auch nach einem Neustart.
  starttruhe:
    lava_bucket: 1
    ice: 2
    bone_meal: 5
    melon_slice: 1
    pumpkin_seeds: 1
    sugar_cane: 1
    brown_mushroom: 1
    red_mushroom: 1
    cactus: 1
    sand: 2

  # DER KOBBELSTEINGENERATOR - das Herz von Wolkenwerder.
  #
  # In einer Welt aus Leere gibt es kein Erz: keine Hoehle, kein Gestein, keine Ader.
  # Was ein Spieler an Metall bekommt, bekommt er aus Lava und Wasser. Diese Tabelle
  # entscheidet also nicht ueber eine Bequemlichkeit, sondern ueber den ganzen
  # Spielverlauf dieser Welt.
  #
  # ZWEI DINGE STEIGEN MIT DER INSEL-STUFE, und beide stehen hier getrennt:
  #   WIE OFT   ueberhaupt ein Erz kommt - grund-prozent plus je-stufe-prozent,
  #             gedeckelt durch hoechst-prozent
  #   WELCHE    Erze in Frage kommen - jede Zeile der Tabelle traegt ihre ab-stufe
  #
  # Die Insel-Stufe ist die Zahl der erfuellten Herausforderungen (/wolke aufgaben).
  # Sie zaehlt NUR die Herausforderungen; die Punktzahl der Rangliste aendert die
  # Ausbeute nicht.
  #
  # GETAUSCHT WIRD NUR AUF EINER INSEL. Ein Generator in der Leere zwischen den
  # Feldern gibt reinen Kobbelstein - dort gehoert niemandem etwas, und es gibt keine
  # Stufe, nach der gerechnet werden koennte.
  erze:
    # Ob ueberhaupt getauscht wird. Ein false macht aus Wolkenwerder eine Welt, in
    # der es nie Erz gibt - das ist spielbar, aber es ist ein anderes Spiel.
    an: true

    # Wie oft bei Stufe 0 ein Erz statt Kobbelstein kommt, in Prozent.
    #
    # 15 heisst: etwa jeder siebte Block. Das ist absichtlich spuerbar - die erste
    # Spitzhacke soll aus dem Generator kommen und nicht aus der Truhe.
    grund-prozent: 15

    # Was jede Insel-Stufe darauflegt, in Prozentpunkten.
    #
    # Klein halten: Bei 2 und dem Deckel unten ist die hoechste Ausbeute ab Stufe 13
    # erreicht, und bis dahin ist jede Herausforderung zu spueren. Eine 20 hier waere
    # ein Fortschritt, der nach zwei Aufgaben vorbei ist - der Startbericht sagt, ab
    # welcher Stufe der Deckel greift.
    je-stufe-prozent: 2

    # Wo es aufhoert - auch bei hoher Stufe.
    #
    # Mehr als jeder dritte Block waere kein Generator mehr, sondern eine Ader: Der
    # Kobbelstein, aus dem Oefen, Treppen und ganze Inseln gebaut werden, kaeme zu
    # selten. Der Deckel darf NICHT unter grund-prozent liegen - dann saenke die
    # Ausbeute mit der ersten Stufe, und beim Start gilt die ganze Vorgabe.
    hoechst-prozent: 40

    # Ob ein getauschter Block eine BLOCKMARKE bekommt und sein Abbau damit keinen
    # Lohn zahlt.
    #
    # true, und das ist eine Geldentscheidung: Ohne Marke zahlt verdienst.loehne fuer
    # jedes Erz aus dem Generator - ein Automat laeuft Tag und Nacht und druckt Geld.
    # Der Spieler behaelt das Erz, er bekommt nur kein Mark dafuer.
    marken: true

    # WAS der Generator ausspuckt. Je Zeile ein Gegenstandsname und darunter:
    #
    #   gewicht   wie schwer die Zeile im Vergleich zu den anderen wiegt (1 bis
    #             1000000). Gezogen wird unter allen Zeilen, deren ab-stufe erreicht
    #             ist - ein Gewicht von 50 gegen 1 kommt fuenfzigmal so oft.
    #   ab-stufe  ab welcher Insel-Stufe die Zeile ueberhaupt mitspielt. Darf fehlen
    #             und heisst dann 0, also von Anfang an.
    #
    # Ein Name, den Minecraft nicht kennt, kostet NUR SEINE ZEILE. cobblestone und
    # stone gehoeren hier nicht hinein - das sind die Bloecke, AUS denen getauscht
    # wird, eine Zeile darueber taete nichts.
    #
    # Eine LEERE Tabelle ist erlaubt und heisst: nur Kobbelstein, ohne den Schalter
    # oben anzufassen.
    #
    # Warum gerade diese neun:
    #   coal_ore, copper_ore   von Anfang an - ohne Kohle kein Ofen, ohne Ofen kein
    #                          Eisen
    #   iron_ore ab 1          damit die ERSTE Herausforderung wirklich etwas
    #                          aufschliesst
    #   gold_ore, redstone_ore ab 2
    #   lapis_ore ab 3         er ist nur zum Verzaubern da
    #   emerald_ore ab 4       in Vanilla das seltenste Erz, hier das Geld fuer den
    #                          Bundesmarkt
    #   diamond_ore ab 5
    #   ancient_debris ab 8    Netherit in einer Welt ohne Nether - das eine Ziel, das
    #                          weit genug weg ist, um eines zu sein
    tabelle:
      coal_ore:
        gewicht: 50
        ab-stufe: 0
      copper_ore:
        gewicht: 30
        ab-stufe: 0
      iron_ore:
        gewicht: 25
        ab-stufe: 1
      gold_ore:
        gewicht: 12
        ab-stufe: 2
      redstone_ore:
        gewicht: 12
        ab-stufe: 2
      lapis_ore:
        gewicht: 8
        ab-stufe: 3
      emerald_ore:
        gewicht: 3
        ab-stufe: 4
      diamond_ore:
        gewicht: 3
        ab-stufe: 5
      ancient_debris:
        gewicht: 1
        ab-stufe: 8

  # DIE HERAUSFORDERUNGEN - und damit die INSEL-STUFE.
  #
  # Die Stufe einer Insel ist die Zahl ihrer erfuellten Herausforderungen, und an ihr
  # haengt die Ausbeute des Generators oben: Eisen ab Stufe 1, Diamant ab 5, Netherit
  # ab 8. Eine Welt ohne Herausforderungen hat damit keinen Fortschritt - jede Insel
  # bliebe fuer immer bei Kohle und Kupfer.
  #
  # DIE ZAHL DER AUFGABEN IST DIE HOECHSTE STUFE. Wer vier eintraegt und oben den
  # Diamanten ab Stufe fuenf stehen laesst, hat ein Erz, das in dieser Welt niemand je
  # bekommt. Der Startbericht nennt beide Zahlen nebeneinander.
  #
  # ABGEGEBEN wird mit /wolke abgeben <name>, und zwar AUF DER INSEL: Es zaehlt das
  # Feld, auf dem der Spieler steht - nicht, wem die Insel gehoert. Abgeben darf, wer
  # dort bauen darf, also Eigentuemer UND Mitbauer. Die Belohnung bekommt, wer abgibt,
  # die Stufe bekommt die Insel.
  #
  # JEDE AUFGABE EINMAL JE INSEL. Wer seine Insel freigibt, gibt ihren Fortschritt mit
  # auf - der naechste Spieler auf diesem Feld faengt bei Stufe 0 an.
  #
  # DIE NAMEN DER AUFGABEN STEHEN IN DER SPRACHDATEI, nicht hier: je Aufgabe eine
  # Zeile wolke.aufgabe.<name> in sprache.yml. Das ist dieselbe Teilung wie bei den
  # Berufen - was es gibt, steht hier, wie es heisst, dort. Eine Aufgabe ohne Zeile
  # wird beim Start gemeldet und faellt weg; sonst stuende ihr Schluessel im Spiel.
  #
  # KEINE VORAUSSETZUNG ZWISCHEN DEN AUFGABEN: Wer Diamanten hat, darf die
  # Diamantaufgabe als erste abgeben. Das ist kein Loch, sondern folgt aus der Welt
  # selbst - Diamant kommt nur aus dem Generator, und der gibt ihn erst ab Stufe 5.
  # Die Erztabelle IST die Reihenfolge.
  aufgaben:
    # Ob es ueberhaupt Herausforderungen gibt. Ein false laesst jede Insel auf Stufe 0
    # und macht die Mindeststufen oben zu Zeilen, die nie greifen.
    an: true

    # Die Aufgaben IN DIESER REIHENFOLGE - so stehen sie auch auf der Tafel im Spiel.
    # Von leicht nach schwer ist eine Aussage ueber das Spiel, und sie wird gehalten.
    #
    # Je Eintrag:
    #   verlangt    je Zeile ein Gegenstand und eine Anzahl von 1 bis 3456 (eine
    #               Doppeltruhe voll). Die Gegenstaende werden GENOMMEN - ganz oder gar
    #               nicht.
    #   belohnung   was es dafuer gibt, in Mark. Darf fehlen und heisst dann 0: eine
    #               Aufgabe nur fuer die Stufe.
    #
    # Ein Gegenstand, den Minecraft nicht kennt, laesst die GANZE Aufgabe wegfallen -
    # anders als bei der Erztabelle oben. Der Grund: Eine Aufgabe, der ein verlangtes
    # Stueck fehlt, ist eine andere Aufgabe, und zwar eine leichtere.
    #
    # Der Name links darf hoechstens 32 Zeichen lang sein - so lang ist die Spalte, in
    # der der Fortschritt steht.
    #
    # Nichts hier verlangt etwas, das es nur ausserhalb von Wolkenwerder gibt: kein
    # Dorf, keinen Nether, keinen Handel. Eine Insel in der Leere waere sonst eine
    # Aufgabe, die nicht zu loesen ist.
    liste:
      erster-stein:
        verlangt:
          cobblestone: 64
        belohnung: 50
      holzfaeller:
        verlangt:
          oak_log: 64
        belohnung: 100
      kohlebrenner:
        verlangt:
          coal: 16
          furnace: 1
        belohnung: 150
      baecker:
        verlangt:
          bread: 16
        belohnung: 200
      steinmetz:
        verlangt:
          stone_bricks: 64
        belohnung: 250
      erstes-eisen:
        verlangt:
          iron_ingot: 16
        belohnung: 400
      kupferschmied:
        verlangt:
          copper_ingot: 32
        belohnung: 500
      goldschmied:
        verlangt:
          gold_ingot: 16
        belohnung: 800
      rotsteinkundiger:
        verlangt:
          redstone: 32
        belohnung: 1000
      diamantschleifer:
        verlangt:
          diamond: 4
        belohnung: 2000

  # WAS EIN BIOMWECHSEL KOSTET, in Mark - und zwar JEDES MAL.
  #
  # Auch der Wechsel auf dasselbe Biom kostet. Das ist Absicht: Hinter dem Wechsel steht
  # das Umsetzen der Biomzellen eines ganzen Feldes - 32 x 32 x 96 Zellen -, und das ist
  # Arbeit, die der Server jedes Mal leistet. Ein Riegel "du hast dieses Biom schon"
  # waere ausserdem eine Falle: Nach einem abgebrochenen Umsetzen kaeme man nie wieder
  # an die Umsetzung heran.
  #
  # Das Biom entscheidet, WAS erscheint und WAS waechst - es ist nach der Insel selbst
  # die zweite grosse Entscheidung eines Spielers. Ein kostenloser Wechsel waere ein
  # Schalter, den man im Wechsel umlegt, bis das Erscheinen passt.
  #
  # ACHTUNG BEIM AENDERN: Eine Verdoppelung braucht die Bestaetigung unter
  # wirtschaft.sprung-bestaetigt.wolken-biom. Eine 0 ist erlaubt und heisst: gratis.
  # Wechseln darf nur der EIGENTUEMER, nicht ein Mitbauer.
  biomwechsel: 2000

  # DIE PUNKTZAHL - die Rangliste von Wolkenwerder (/wolke punkte, /wolke rangliste).
  #
  # DIE PUNKTZAHL ENTSCHEIDET NICHTS. Sie steht in der Rangliste, und das ist alles -
  # die Erzausbeute haengt an der STUFE und damit an den Herausforderungen oben. Eine
  # Rangliste, die die Ausbeute aendert, waere ein Grund, Bloecke zu stapeln, statt zu
  # spielen.
  #
  # GEZAEHLT WIRD IN HAPPEN: Ein Wolkenfeld ist 128 Bloecke breit und reicht ueber die
  # ganze Welthoehe - 64 Chunks mit mehr als sechs Millionen Bloecken. In einem Zug
  # gezaehlt stuende der Server eine Sekunde oder laenger, und zwar fuer alle.
  punkte:
    # Wie viele Chunks ein Takt zaehlt (1 bis 64). Ein Takt ist ein Tick.
    #
    # Bei 1 braucht eine Zaehlung 64 Takte, also gut drei Sekunden - unmerklich. Bei 64
    # ist sie in EINEM Takt fertig, und der Server steht, solange sie laeuft. Der
    # Startbericht rechnet beides vor.
    chunks-je-takt: 1

    # Wie lange eine INSEL nach einer Zaehlung warten muss, in Sekunden.
    #
    # Die Abklingzeit haengt an der Insel und nicht am Spieler: Gezaehlt wird ein Feld,
    # und zehn Mitbauer koennten es sonst zehnmal hintereinander zaehlen lassen. Eine 0
    # ist erlaubt und heisst: ohne Pause.
    abklingzeit-sekunden: 120

    # WAS gezaehlt wird. Je Zeile ein Blockname und seine Punkte (1 bis 1000000).
    #
    # Was nicht darin steht, zaehlt NICHT - und das ist der Sinn der Tabelle: Eine Insel
    # aus einer Million Kobbelsteinen ist keine Leistung, der Generator gibt sie
    # umsonst. Darum stehen hier die Bloecke, die ARBEIT kosten.
    #
    # Die Zahlen sind eine Rangfolge und keine Rechnung: Ein Diamantblock ist neun
    # Diamanten, also neunmal so viel wie ein Eisenblock neun Barren. Netherit steht
    # darueber, weil es in einer Welt ohne Nether nur aus der letzten Erzstufe kommt.
    #
    # Ein Name, den Minecraft nicht kennt, kostet NUR SEINE ZEILE. Eine LEERE Tabelle
    # ist erlaubt und heisst: keine Punkte - die Rangliste zeigt die Inseln dann in der
    # Reihenfolge ihres Alters.
    tabelle:
      coal_block: 9
      copper_block: 9
      iron_block: 45
      gold_block: 90
      redstone_block: 45
      lapis_block: 72
      emerald_block: 450
      diamond_block: 900
      netherite_block: 3600
      beacon: 2000
      enchanting_table: 500
      anvil: 150
      hay_block: 9
      bookshelf: 30
      glass: 2
      bricks: 4
      oak_log: 2
      melon: 5
      pumpkin: 5
      cactus: 5
      sugar_cane: 3
      brown_mushroom_block: 4
      red_mushroom_block: 4

# Die Markthalle (Plan 7.1, Schritt 8 Teil A): Welche Ladeneinheiten es gibt.
#
# Eine Ladeneinheit ist ein ORT - ein kleiner Raum in der Markthalle und die Truhe darin.
# Wer sie mietet und wie lange, kommt mit Teil B; hier stehen nur die Staende.
#
# WARUM HIER DREI PROBESTAENDE STEHEN UND KEINE HALLE: Die Markthalle ist eines der zehn
# Gebaeude, die von Hand in Altfurt entstehen (Plan 2.1) - das Programm setzt dort keine
# Bloecke. Entschieden am 08.11.2026: Drei kleine Staende genuegen, um Mieten, Verlaengern,
# Kuendigen, den taeglichen Lauf und den Ladenschutz im Spiel zu pruefen; die Halle kann
# spaeter drumherum wachsen, die Quader bleiben stehen.
#
# WARUM EIN QUADER UND KEIN RASTERFELD: Altfurt hat kein Raster, es ist gewachsenes
# Gelaende. Plan 6.1 hat genau diesen Fall vorgesehen - fuer Besitz, der nicht am Raster
# haengt, kommt der Quader als eigene Angabe.
#
# WARUM DIE TRUHE DAZUGEHOERT: In Altfurt stehen alle Spieler im Abenteuermodus, und der
# verbietet das Setzen von Bloecken - ein Mieter kann sich keine Truhe hinstellen. Die
# Einheit kommt darum mit ihrer Truhe aus dem Bauwerk, und der Mieter fuellt sie nur.
# Die Truhe MUSS innerhalb ihrer Einheit stehen, sonst waere sie ungeschuetzt.
#
# NUR BEIM START GELESEN. /freimarken neuladen verschiebt keinen Laden: Ein Mieter haette
# sonst von einem Augenblick auf den anderen einen anderen Raum, und seine Truhe stuende
# beim Nachbarn. Die Antwort auf neuladen sagt das ausdruecklich.
laeden:
  # In welcher Welt die Halle steht - ohne Namensraum, wie bei reisen.ankunftswelt.
  # Die Welt muss im Abschnitt welten: weiter unten stehen, sonst gilt keine Einheit.
  #
  # NUR BEIM START GELESEN.
  welt: altfurt

  # Die Miete je Tag. Plan 7.1 nennt sie die STAERKSTE Geldsenke des Servers: laufend,
  # sichtbar, freiwillig. Abgebucht wird taeglich, nicht beim Abschluss.
  #
  # ANPASSBAR MIT BESTANDSSCHUTZ: Jeder Vertrag traegt die Miete, die bei SEINEM
  # Abschluss galt. Eine Erhoehung hier trifft nur neue Vertraege - wer fuer 500
  # gemietet hat, zahlt 500 weiter, auch nach einer Verlaengerung. Wer den neuen Satz
  # will, kuendigt und mietet neu.
  #
  # Eine 0 ist NICHT erlaubt: Das waere ein Laden, den der taegliche Lauf nie beruehrt -
  # also einer, der nie wegen Zahlungsausfall frei wird. Wer Laeden verschenken will,
  # nimmt eine 1.
  miete-je-tag: 500

  # Die Kaution, hinterlegt beim Abschluss. Bei ORDENTLICHER Kuendigung kommt sie
  # zurueck, bei Raeumung wegen Zahlungsausfall nicht - das ist ihr ganzer Zweck: Sie
  # macht das Weglaufen teurer als das Kuendigen.
  #
  # Auch sie steht in der Vertragszeile: Wer mit 5.000 gemietet hat, bekommt 5.000
  # zurueck, auch wenn hier inzwischen 9.000 steht.
  #
  # 0 ist erlaubt und heisst: ohne Kaution. Ein Wert ZWISCHEN 0 und miete-je-tag wird
  # verworfen - darunter kostet das Weglaufen weniger als ein Miettag, und die Kaution
  # bewirkt das Gegenteil von dem, wofuer sie da ist.
  kaution: 5000

  # Die Ladenlizenz - EINMALIG je Spieler, nicht je Laden. Wer sie bezahlt hat, mietet
  # danach beliebig oft, ohne sie erneut zu zahlen.
  #
  # Dass sie bezahlt ist, steht im Buchungsbuch und nirgends sonst (Grund laden_lizenz
  # in /mark verlauf). Es gibt keine Spalte dafuer - eine zweite Wahrheit wuerde nach
  # dem ersten Absturz von der ersten abweichen, und dann zahlt ein Spieler 50.000 Mark
  # ein zweites Mal.
  #
  # 0 ist erlaubt und heisst: wer das Recht freimarken.laden.mieten hat, darf mieten.
  lizenz: 50000

  # Wie viele Tage ein Abschluss und jede Verlaengerung gelten. Das ist NICHT der
  # Zahlungstakt - gezahlt wird taeglich. Die Dauer sagt, wann ein Vertrag OHNE ZUTUN
  # endet; sie ist der Griff gegen den Spieler, der aufhoert zu spielen und noch Geld
  # auf dem Konto hat.
  #
  # Verlaengern kostet nichts und geht, sobald weniger als diese Zahl an Tagen uebrig
  # ist. Damit liegt das Ende nie weiter als zwei Mietdauern MINUS einen Tag voraus -
  # bei 7 also 13, weil der letzte Tag mitzaehlt. Ohne diese Schranke koennte ein
  # reicher Spieler einen Stand fuer Jahre binden, ohne ihn zu benutzen. Eine eigene
  # Zeile dafuer gibt es nicht: Die Schranke IST diese Zahl.
  #
  # Diese Zahl ist KEIN Preis. Die Miete steht oben je TAG - 7 Tage kosten dieselben
  # 500 Mark am Tag wie 30, und Kaution und Lizenz bleiben, wie sie sind. Eine kleine
  # Zahl macht Laeden also nicht guenstiger, sondern nur schneller wieder frei: Wer
  # aufhoert zu spielen, gibt seinen Stand nach einer Woche her und nicht nach einem
  # Monat. Seine Ware ist dabei nicht verloren - sie wandert ins Abholfach, und die
  # Kaution kommt bei Ablauf zurueck.
  mietdauer-tage: 7

  # Nach wie vielen Tagen OHNE ZAHLUNG IN FOLGE der Laden geraeumt wird.
  #
  # Bei 3 heisst das: Der erste Ausfall warnt, der zweite warnt, der dritte raeumt. Es
  # gibt also ZWEI Warnungen und nicht drei - die Zahl heisst nach dem, was sie zaehlt,
  # und nicht nach ihrer Wirkung.
  #
  # Was beim Raeumen passiert: Der Vertrag ist weg, die Kaution VERFAELLT, und der
  # Inhalt der Ladentruhe wandert ins Abholfach - der wird NIE geloescht und wartet
  # beliebig lange auf /laden abholfach. Zahlt der Spieler vorher wieder, sind die
  # Ausfaelle erledigt; gezaehlt werden nur die in Folge.
  #
  # Eine 1 ist erlaubt und heisst: Der erste Ausfall raeumt. Dann liest der Spieler
  # NIE eine Warnung, weil Warnung und Raeumung in denselben Augenblick fallen - der
  # Startbericht sagt es noch einmal, wenn hier eine 1 steht. Wer eine Warnung will,
  # nimmt mindestens 2.
  #
  # Eine 0 wird abgewiesen, und zwar nicht wegen Haerte: Bei 0 waere JEDER Vertrag
  # raeumungsreif, auch der heute abgeschlossene mit 0 Ausfaellen. Der erste Lauf
  # raeumte die ganze Halle.
  #
  # Eine Zahl ab der Mietdauer (oben 7) macht die Regel wirkungslos: Dann laeuft der
  # Vertrag immer vorher ab, und beim Ablauf kommt die Kaution zurueck.
  ausfaelle-bis-raeumung: 3

  # Je Einheit ein Block mit drei Zeilen. Der Name steht auch im Befehl
  # /laden mieten <name>, also nur kleine Buchstaben, Ziffern und Striche.
  #
  #   von / bis  die zwei Ecken des Raumes, je drei ganze Zahlen, BEIDE eingeschlossen
  #   truhe      wo die Ladentruhe steht - drei ganze Zahlen, INNERHALB von von/bis
  #
  # So sieht ein Eintrag aus, wenn die Halle steht:
  #
  #   einheiten:
  #     halle-1:
  #       von: [60, 71, 4]
  #       bis: [64, 75, 8]
  #       truhe: [62, 71, 6]
  #     halle-2:
  #       von: [66, 71, 4]
  #       bis: [70, 75, 8]
  #       truhe: [68, 71, 6]
  #
  # Was geprueft wird und was dann geschieht:
  #
  #   - Eine Einheit ueber 4.096 Bloecken (16 Kantenlaenge) wird verworfen. Das ist kein
  #     Marktstand mehr; wer eine Null zu viel tippt, vermietet sonst halb Altfurt.
  #   - Eine Truhe ausserhalb ihrer Einheit wird verworfen - sie waere ungeschuetzt.
  #   - Zwei Einheiten, die sich Bloecke teilen, werden BEIDE verworfen. Welche gilt,
  #     entschiede sonst die Reihenfolge dieser Datei, und dann koennte ein Mieter in der
  #     Truhe seines Nachbarn stehen. Dieselbe Antwort wie bei den Toren.
  #   - Eine Einheit hinter der Weltgrenze wird verworfen - dort kaeme niemand hin.
  #   - Eine kaputte Einheit kostet nur sich selbst. Die uebrigen gelten weiter; ein
  #     Server, der wegen eines Tippfehlers in einem von zwanzig Staenden nicht startet,
  #     ist schlimmer als einer mit neunzehn.
  #
  # Die Reihenfolge dieser Eintraege ist die Reihenfolge in /laden liste - hier ordnest du.
  #
  # WOHER DIE ZAHLEN KOMMEN, und das gehoert hierher und nicht in ein Protokoll:
  # Sie sind GEGEBEN und nicht gemessen [18.11.2026]. Altfurt ist art: flach, und
  # Vanillas Superflach legt Grundgestein auf y -64, zwei Schichten Dreck und Gras auf
  # y -61. Der hoechste feste Block ist damit UEBERALL y -61 und der erste freie y -60 -
  # keine Spanne, kein Wasser, kein Baum, und keine Zahl, die bei der naechsten Welt
  # daneben liegt.
  #
  # Bis zum 18.11.2026 stand hier eine Messung vom 02.11. an einer gewachsenen Welt,
  # die es nicht mehr gibt - mit der Warnung, dass diese Quader wertlos sind, sobald
  # ein Server Altfurt neu anlegt. Genau das war eingetreten: Im Altfurt des damals
  # festgeschriebenen Startwerts liegen alle drei Staende in der Luft ueber dem Meer.
  #
  # Der Quader beginnt bei y=-61, schliesst also den FUSSBODEN selbst ein. Das ist
  # Absicht: So deckt der Ladenschutz auch den Boden, und niemand hackt dem Mieter den
  # Block unter seiner Truhe weg. Die Truhe steht darum eine Ebene hoeher, auf y=-60.
  einheiten:
    # Westreihe, sechs Bloecke hinter der Torreihe bei z=0.
    stand-1:
      von: [60, -61, 6]
      bis: [64, -57, 10]
      truhe: [62, -60, 8]
    # Dieselbe Reihe, mit einer LUECKE von fuenf Bloecken zu stand-1 (z 11..15).
    # Die Luecke ist die eigentliche Probe fuer den Ladenschutz: Dort darf jeder
    # bauen, in den beiden Quadern nur der Mieter.
    stand-2:
      von: [60, -61, 16]
      bis: [64, -57, 20]
      truhe: [62, -60, 18]
    # Ostseite, gegenueber von stand-2. Die Mittelachse x 65..79 zwischen Torreihe
    # und Spawn (72/-60/12) bleibt damit frei - dort laeuft jeder Ankommende durch.
    stand-3:
      von: [80, -61, 16]
      bis: [84, -57, 20]
      truhe: [82, -60, 18]
# Der Handel an Kistenshops (Plan 7.4). Ein Kistenshop ist eine Kiste mit einem Schild
# daran: erste Zeile der Besitzer, zweite die Menge je Handel, dritte die Preise in der
# Form "B 100 : S 80", vierte die Ware oder ein Fragezeichen. Rechtsklick kauft,
# Linksklick verkauft. Dieselbe Form wie auf dem Lumia-Vorbild, belegt fuer den
# 11.01.2016.
#
# HANDELN DARF JEDER, IMMER UND UEBERALL (entschieden 08.11.2026). Wo ein Shop STEHEN
# darf, entscheidet dagegen der Bauschutz: auf der eigenen Parzelle, im gemieteten Laden,
# in der Wildnis. Ein Shopschild und seine Kiste sind danach UEBERALL geschuetzt, auch am
# Wegesrand, wo keine Parzelle greift - sonst waere ein Shop in der Wildnis von jedem
# abbaubar.
handel:
  # DIE MARKTGEBUEHR - je LAGE ein eigener Satz.
  #
  # Eine Lage ist Shopart mal Richtung, und das sind drei Zeilen und nicht eine. Der
  # Grund ist die Entscheidung des Nutzers vom 08.11.2026: Auch WANN eine Gebuehr faellt,
  # soll hier stehen und nicht im Programm. Vorher gab es zwei Zeilen, die das nicht
  # sagen konnten - diese Datei meinte "beim Verkauf", der Quelltext meinte "bei jedem
  # Handel", und beides stand da.
  #
  # Fuer alle drei gilt dasselbe:
  #
  #   * 0 heisst: keine Gebuehr. Das ist die ausgelieferte Einstellung - erst soll der
  #     Handel laufen, die Senke kommt spaeter.
  #   * Erlaubt ist 0 bis 50. Ueber der Haelfte waere die Gebuehr hoeher als der Erloes,
  #     und dann verkauft niemand mehr: eine Steuer, die ihre eigene Grundlage abschafft.
  #   * Abgezogen wird sie IMMER dem, der das Geld BEKOMMT - nie als Aufschlag auf den
  #     Preis. Der Preis auf dem Schild ist, was der Kunde zahlt.
  #   * Gerundet wird ABGERUNDET und auf die GANZE Summe, nicht je Stueck. Bei 5 Prozent
  #     auf 19 Mark sind das 0 Mark - wer rundet, rundet zugunsten des Spielers. Und wo
  #     die gerechnete Gebuehr 0 ist, faellt auch keine Gebuehrzeile im Buchungsbuch.

  # KUNDE KAUFT bei einem Spielershop (Rechtsklick). Das Geld bekommt der BESITZER, also
  # zahlt er die Gebuehr - von 1.000 Mark Umsatz bleiben ihm bei 5 Prozent 950.
  marktgebuehr-spielershop-kauf-prozent: 0

  # KUNDE VERKAUFT an einen Spielershop (Linksklick). Das Geld bekommt der KUNDE, also
  # zahlt er die Gebuehr. Das war die Lage, die vorher als die einzige dastand.
  marktgebuehr-spielershop-verkauf-prozent: 0

  # KUNDE VERKAUFT an einen BUNDSHOP, also an einen Shop ohne Besitzer. Getrennt, weil es
  # etwas anderes ist: Beim Spielershop zahlt jemand etwas an den Staat, hier verkauft er
  # AN den Staat. Die Gebuehr senkt also den Ankaufpreis, ohne die Tafel in
  # bundesmarkt.ankauf anzufassen. Plan 7.4 sieht hier spaeter 5 Prozent vor; bis dahin
  # steht auch diese auf 0.
  marktgebuehr-bundshop-verkauf-prozent: 0

  # Die vierte Lage - KUNDE KAUFT bei einem Bundshop - hat ABSICHTLICH keinen Schluessel.
  # Dort bekommt niemand Geld, dem eine Gebuehr abzuziehen waere: Der Bund hat kein Konto,
  # sein Geld kommt aus dem Nichts und verschwindet dorthin. Ein Schluessel dafuer waere
  # eine Zahl, die du einstellen koenntest und die nie wirkt.

  # Das Wort in der ERSTEN Schildzeile, das aus einem Shop einen Bundshop macht: ohne
  # Besitzer, mit unbegrenztem Vorrat, unbegrenztem Platz und unbegrenztem Geld.
  # Gross- und Kleinschreibung sind gleich - "bund" wirkt wie "Bund".
  #
  # Anlegen darf das nur, wer das Recht freimarken.shop.bund hat. Das ist ein eigenes
  # Recht und nicht das Teamrecht freimarken.bauen.ueberall: Wer einen Bundshop anlegt,
  # legt einen Preis des Servers fest, und das ist eine andere Vollmacht als die, einen
  # Block auf fremdem Grund zu setzen.
  #
  # LEER lassen heisst: Bundshops sind ueber ein Schild nicht anzulegen. Das ist erlaubt.
  # Hoechstens 15 Zeichen - laenger liesse sich das Wort in eine Schildzeile gar nicht
  # tippen, und die Einstellung wirkte nie.
  bundshop-wort: Bund

  # Wie viele Shops EINE Seite von /shop liste zeigt. Erlaubt ist 1 bis 100.
  #
  # Zehn, weil der Chat etwa zehn Zeilen zeigt, ohne dass der Kopf der Liste
  #   weggescrollt ist - wer den Kopf nicht mehr sieht, weiss nicht, welche Seite er
  #   liest. Dieselbe Zahl und derselbe Grund wie bei blockbuch.zeilen-je-abfrage.
  #
  # Das ist eine SEITENGROESSE und kein Schnitt: Wer mehr Laeden hat, blaettert mit
  #   /shop liste 2 weiter. Darum gibt es hier auch kein "unbegrenzt" - der Chat ist
  #   kein Anzeigemittel fuer hundert Zeilen.
  #
  # Eine 0 ist KEINE Abschaltung, sondern eine Klage: Ein Befehl, der stumm nichts
  #   mehr zeigt, sieht aus wie ein kaputter Server. Wer die Liste nicht will, nimmt
  #   das Recht freimarken.shop.
  zeilen-je-seite: 10
# DIE FREIE TRUHE (Plan 7.2, Schritt 8 Teil D): eine offene Kiste in der Markthalle.
# Jeder darf hineinlegen, jeder darf herausnehmen. Kostet nichts, schafft Gemeinschaft,
# entsorgt Ueberschuss - und sie ist die einzige Kiste dieses Servers, an der der
# Besitzschutz nicht gilt.
#
# GEZAEHLT WIRD DIE DIFFERENZ UND NICHT DER KLICK. Aus einer offenen Truhe nimmt man mit
# Linksklick, Rechtsklick, Shift-Klick, Doppelklick auf einen Stapel, mit der
# Zahlentaste, durch Ziehen ueber mehrere Felder und mit Q aus dem offenen Fenster
# heraus. Das sind sieben Wege zur selben Tat, und ein Programm, das sechs davon kennt,
# hat keinen Deckel. Darum wird beim Oeffnen der Inhalt gezaehlt, beim Schliessen wieder,
# und die Differenz ist die Entnahme.
#
# GEZAEHLT WIRD ABER NUR, WENN ES EINEN GRUND GIBT: einen Deckel (entnahme-je-tag) oder
# eine Verbotsliste (verbotene-gegenstaende). Ab Werk steht beides auf "aus", und dann ist
# die Freie Truhe eine gewoehnliche offene Kiste, die jede Nacht geleert wird: Alle duerfen
# GEMEINSAM hineinsehen, und kein Tagesstand wird gelesen oder geschrieben. Sobald eines
# von beiden eingetragen ist, wird gezaehlt - und weil die Differenz dann genau EINEM
# Spieler gehoeren muss, sieht auch nur EINER zur Zeit hinein. Welche von beiden
# Betriebsarten gilt, sagt der Startbericht in einer Zeile.
#
# DER TRICHTERSCHUTZ GILT IMMER: Ein Trichter an der Truhe wird nicht bedient, in beiden
# Richtungen. Er haengt nicht an der Zaehlung, sondern daran, dass die Truhe Spielern
# gehoert und nicht Maschinen.
#
# ANGERECHNET WIRD, WAS ER BEHAELT. Wer ueber dem Deckel liegt, bekommt den Ueberschuss
# beim Schliessen zurueck in die Truhe gelegt - die Plaetze sind frei, er hat sie gerade
# geleert. Wer die Sachen vorher wegwirft, hat darum keinen Tagesstand ohne Ware.
#
# HINEINLEGEN ZAEHLT GAR NICHT. Ein Deckel auf das Schenken machte aus der
# Gemeinschaftstruhe eine Abgabestelle mit Quote.
freie-truhe:
  # Wie viele Stueck ein Spieler an einem TAG behalten darf.
  #
  # AUSGELIEFERT WIRD 0, ALSO KEIN DECKEL [entschieden 10.11.2026]. Plan 7.2
  # empfiehlt "etwa 16 Gegenstaende je Spieler und Tag"; der Betreiber hat anders
  # entschieden: Die Truhe steht am Spawn, wo niemand bauen darf, und was darin
  # liegt, hat jemand freiwillig hineingelegt. Der Deckel ist gebaut und geprueft -
  # wer ihn braucht, traegt hier eine Zahl ein.
  #
  # 0 HEISST KEIN DECKEL - dieselbe Form und derselbe Grund wie bei
  # bundesmarkt.tagesdeckel: eine ZAHL und kein true/false, denn Bukkit liest jedes
  # Wort ausser "true" stumm als false. Abgeschaltet wird die Truhe nicht hiermit,
  # sondern dadurch, dass unter truhen: keine Stelle steht.
  #
  # Der Deckel gilt je SPIELER und nicht je Truhe: Wer zwei Truhen aufstellt,
  # verschenkt damit nicht zwei Tagesmengen. Er gilt bis zur Tagesgrenze aus
  # zeit.zone - dieselbe, nach der auch Tagesbonus, Verdienstdeckel und Ladenmiete
  # rechnen.
  #
  # Erlaubt ist 0 bis 3456 - eine volle Doppelkiste, also mehr, als in der Truhe
  # ueberhaupt liegen kann. Eine groessere Zahl waere ein Deckel, den niemand
  # erreicht; dafuer gibt es die 0.
  #
  # EINE ZAHL HIER SCHALTET AUCH DAS "EINER ZUR ZEIT" EIN: Gezaehlt wird der
  # Unterschied zwischen Oeffnen und Schliessen, und der muss GENAU EINEM Spieler
  # gehoeren - sonst bekommt der, der zuletzt schliesst, die Entnahme des anderen
  # angerechnet. Solange hier 0 steht UND verbotene-gegenstaende leer ist, wird nichts
  # gezaehlt: Dann duerfen alle gemeinsam hineinsehen, und kein Tagesstand wird
  # gelesen oder geschrieben. Der Startbericht sagt, was gilt.
  entnahme-je-tag: 0
  # WO die Freien Truhen stehen - je Truhe drei ganze Zahlen (x, y, z) in der Ladenwelt
  # aus laeden.welt.
  #
  # KEINE VORGABE, und das ist Absicht: Eine Truhe steht dort, wo jemand sie hingestellt
  # hat. Eine geratene Koordinate zeigte in unerschlossenes Gelaende, und dort stuende
  # dann eine Kiste, aus der jeder nehmen darf. Ohne Eintrag gibt es keine Freie Truhe,
  # und die Wache wird gar nicht angemeldet.
  #
  # DIESE STELLEN GELTEN NUR FUER DIE VORHANDENE WELT - genauso wie die Quader der
  # Ladeneinheiten weiter oben und die acht Torquader unter reisen.tore. Altfurt ist
  # art: flach, der Boden liegt also ueberall auf y -61 und der erste freie Block auf
  # y -60; eine Truhe steht auf -60. Wer die Welt neu anlegt, behaelt diese Hoehen -
  # eine Ebene hat keine zweite Gestalt.
  #
  # EINE DOPPELKISTE braucht BEIDE Haelften, je eine Zeile: Welche Haelfte angeklickt
  # wird, entscheidet der Spieler. Eine Stelle in einer LADENEINHEIT wird abgewiesen -
  # dort kaeme niemand ausser dem Mieter heran, und der nimmt ohne Deckel.
  #
  # Ab Werk steht hier keine Zeile. Eine DOPPELTRUHE in der Halle von Altfurt saehe
  # etwa so aus - beide Haelften, je eine Zeile (die Stellen sind ein Beispiel und keine
  # Empfehlung):
  #   truhen:
  #     - [72, -60, 20]
  #     - [73, -60, 20]
  #
  # NUR BEIM START GELESEN - /freimarken neuladen verschiebt keine Truhe. Die beiden
  # Nachbarschluessel dieses Abschnitts sind neuladbar, dieser nicht: Eine Stelle,
  # die sich waehrend eines offenen Fensters aendert, rechnete die Entnahme eines
  # Spielers gegen den Inhalt einer anderen Kiste ab. Dieselbe Trennung wie bei den
  # Ladeneinheiten weiter oben.
  truhen: []
  # Was NICHT heraus darf.
  #
  # AUSGELIEFERT WIRD EINE LEERE LISTE: NICHTS ist verboten [entschieden
  # 10.11.2026]. Plan 7.2 empfiehlt "keine geschriebenen Buecher und keine
  # Shulkerkisten - sonst wandert Besitz hinein, der dort nicht hingehoert"; der
  # Betreiber stellt die Truhe selbst auf, und wer am Spawn etwas hineinlegt, hat es
  # hineinlegen wollen.
  #
  # Was ein Verbot bewirkt, wenn eines eingetragen ist: Der Gegenstand wird beim
  # SCHLIESSEN aus der Truhe genommen und dem Spieler zurueckgegeben, mit einer
  # Zeile dazu. Hineinlegen wird NICHT abgewiesen - in eine offene Kiste legt man
  # auf ebenso vielen Wegen, wie man herausnimmt. Zurueck geht nur, was DIESER
  # Spieler neu hineingelegt hat; was schon vorher darin lag, raeumt der taegliche
  # Lauf.
  #
  # Erwartet wird der nackte Materialname, klein oder gross, ohne minecraft: davor.
  # Ein Name, den dieser Server nicht kennt, wird beklagt und uebersprungen - ein
  # Tippfehler soll nicht stumm in der Liste stehen.
  #
  # Die Namen aus dem Plan, falls du sie doch willst (das LEERE Buch
  # writable_book steht mit Absicht nicht dabei: Es traegt keinen Verfasser und ist
  # ein gewoehnlicher Gegenstand):
  #   verbotene-gegenstaende:
  #     - written_book
  #     - shulker_box
  #     - white_shulker_box
  #     - orange_shulker_box
  #     - magenta_shulker_box
  #     - light_blue_shulker_box
  #     - yellow_shulker_box
  #     - lime_shulker_box
  #     - pink_shulker_box
  #     - gray_shulker_box
  #     - light_gray_shulker_box
  #     - cyan_shulker_box
  #     - purple_shulker_box
  #     - blue_shulker_box
  #     - brown_shulker_box
  #     - green_shulker_box
  #     - red_shulker_box
  #     - black_shulker_box
  #
  # AUCH EIN VERBOT SCHALTET DIE ZAEHLUNG EIN, und damit das "einer zur Zeit":
  # Zurueck geht nur, was NEU hineingekommen ist, und das ist derselbe Unterschied,
  # auf dem der Deckel rechnet. Sehen zwei zugleich hinein, bekaeme der Schliessende
  # die Einlage des anderen in die Hand.
  verbotene-gegenstaende: []
# Reisen zwischen den Welten (Plan 4.3): zwei Wege, kein dritter - die Tore am
# Bundesmarkt und /warp <name>. Selbstgebaute Nether- und Endportale werden gesperrt:
# Sie fuehren nicht in freimarken:nether, sondern in die Haupt-Nether des Servers, eine
# Welt ohne Grenze, ohne Schutz und ohne Vorgenerierung.
reisen:
  # Die Welt, in der die Tore stehen - und in der ein neuer Spieler ankommt. Plan
  # Abschnitt 2: "Hauptstadt (Welt mit Spawn) = Altfurt".
  #
  # Diese Zeile setzt die Respawn-Welt des Servers. Der Eintrag wird dauerhaft in die
  # level.dat der Hauptwelt geschrieben; das Protokoll nennt beim Start die vorige Welt,
  # damit sie zurueckzustellen ist. Leer heisst: nicht anfassen.
  #
  # NUR BEIM START GELESEN - /freimarken neuladen aendert daran nichts. Ein zweites Lesen
  # aenderte nicht ein Feld, sondern eine Weltdatei; ausserdem haengen Torwache,
  # Ankunftswache und das Warpverzeichnis daran. Weltnamen sind nach Plan 12a.6 ohnehin
  # nur lesbar.
  ankunftswelt: altfurt

# Das Blockbuch (Moderation): wer wann wo was getan hat.
#
# NUR BEIM START GELESEN - /freimarken neuladen aendert hier nichts. Was aufgeschrieben
# wird, aendert sich im Betrieb nicht sinnvoll: Ein Umschalten mitten im Lauf
# hinterliesse ein Buch, dessen Luecken niemand mehr erklaeren kann. Das Protokoll nennt
# beim Start, was WIRKLICH gilt - je Welt eine Zeile.
#
# ES GIBT HIER KEIN true UND KEIN false, und das ist kein Versehen: Bukkit liest jedes
# andere Wort stumm als false. Aus einem "benutzen: ja" wuerde ein abgeschaltetes
# Blockbuch ohne eine Zeile Klage, und du suchtest Monate spaeter nach Zeilen, die es nie
# gab. Darum stehen hier LISTEN VON NAMEN - eine unbekannte Zeile wird beklagt, mit dem
# Namen, den du getippt hast.
blockbuch:
  # Wie lange eine Zeile bleibt, in Tagen. Erlaubt ist 1 bis 3650.
  #
  # Dreissig Tage sind lang genug fuer die Moderation - eine Beschwerde kommt selten am
  # selben Tag - und kurz genug, dass die Tabelle nicht unbegrenzt waechst. Aufgeraeumt
  # wird am taeglichen Lauf, zusammen mit der Ladenmiete.
  aufbewahrung-tage: 30

  # Wie viele Zeilen EIN Aufraeumschlag hoechstens loescht. Erlaubt ist 1 bis 20000.
  #
  # Begrenzt, weil das Aufraeumen im Hauptfaden des Spielservers laeuft, auf der einen
  # Datenbankverbindung. Ein unbegrenztes Loeschen auf der groessten Tabelle dieses
  # Plugins haelt den Server an - und zwar genau am ersten faelligen Tageswechsel, wenn
  # Wochen auf einmal weggehen. Was ein Schlag nicht schafft, nimmt der naechste; die
  # Zeilen laufen nicht weg.
  je-aufraeumen: 500

  # DIE VORGABE: Was eine Welt aufschreibt, die unten keine eigene Liste hat.
  #
  # Erlaubt sind vier Namen:
  #   setzen      ein Block wurde gesetzt
  #   abbauen     ein Block wurde abgebaut
  #   benutzen    ein Block wurde benutzt - Truhe, Ofen, Trichter (siehe
  #               benutzbare-bloecke weiter unten)
  #   abgewiesen  AUCH die misslungenen Versuche. Das ist keine Tat, sondern ihr Ausgang:
  #               Das Wort wirkt QUER zu den drei Taten und schaltet keine davon zu. Ein
  #               Dutzend abgewiesener Versuche an einer fremden Parzelle in zwei Minuten
  #               ist der Fund, nach dem du suchst - und es ist einer, bei dem gar nichts
  #               passiert ist.
  #
  # Eine LEERE Liste [] heisst: nichts aufschreiben. Das ist der Weg, das Blockbuch
  # abzuschalten; es wird dann auch kein Zuhoerer angemeldet.
  #
  # benutzen fehlt hier mit Absicht - es ist die mit Abstand haeufigste Tat. Wer eine
  # Minute durch sein Haus laeuft, oeffnet ein Dutzend Tueren, und niemand fragt je
  # danach. Gib es der Welt, in der die Frage "wer war in meiner Truhe" wirklich
  # gestellt wird.
  taten: [setzen, abbauen, abgewiesen]

  # Welche Bloecke die Tat "benutzen" ueberhaupt aufschreibt.
  #
  # Ohne diese Liste schriebe jeder Rechtsklick auf Erde eine Zeile - und wer mit einem
  # Block in der Hand baut, erzeugt beides: einen Rechtsklick UND eine Setzung, also
  # zwei Zeilen fuer eine Tat. Die Vorgabe nennt, was man abschliesst.
  #
  # Nackte Namen, ohne minecraft: davor. Ein unbekannter Name wird beklagt. Fuer setzen
  # und abbauen gilt diese Liste NICHT - wer ein Haus abreisst, reisst Bretter ab, keine
  # Truhen.
  #
  # Eine leere Liste [] schaltet "benutzen" ganz ab, auch wenn es oben eingetragen ist;
  # das Protokoll sagt es dann beim Start.
  benutzbare-bloecke:
    - chest
    - trapped_chest
    - barrel
    - shulker_box
    - ender_chest
    - hopper
    - dispenser
    - dropper
    - furnace
    - blast_furnace
    - smoker
    - brewing_stand
    - beacon
    - lectern
    - decorated_pot

  # Wie weit der Blick von /freimarken blockbuch reicht, in Bloecken. Erlaubt ist 1 bis
  # 100.
  #
  # Etwas mehr als die Reichweite, in der ein Spieler bauen kann: Ein Moderator steht
  # oft nicht genau an dem Loch, das er untersucht, und soll nicht erst heranlaufen
  # muessen. Ueber hundert trifft der Strahl irgendetwas, und niemand wuesste mehr,
  # welchen Block er gefragt hat - darum die Grenze.
  #
  # Siehst du keinen Block an, sagt der Befehl es und nennt diese Zahl. Nach einem
  # Spieler fragt /freimarken blockbuch spieler <name> - das geht auch von der Konsole.
  reichweite: 6

  # Wie viele Zeilen EINE Abfrage hoechstens zeigt. Erlaubt ist 1 bis 100.
  #
  # Zehn ist, was der Chat auf einen Blick zeigt. Mehr hiesse, dass die ersten Zeilen
  # nach oben herauslaufen - und das sind bei "neueste zuerst" genau die, auf die es
  # ankommt. Die Ueberschrift nennt die Zahl der GEZEIGTEN Zeilen, nicht die aller
  # vorhandenen.
  zeilen-je-abfrage: 10

  # JE WELT eine eigene Liste - sie gilt STATT der Vorgabe und nicht zusaetzlich.
  #
  # Eine Welt, die hier nicht steht, folgt der Vorgabe oben. Das ist Absicht: Eine neu
  # gebaute Welt soll nicht stumm ohne Buch dastehen. Eine Welt, die es laut welten:
  # nicht gibt, wird beklagt - eine Auswahl fuer eine Welt, die es nicht gibt, ist eine
  # Zeile, die nie wirkt.
  welten:
    # Die Marktstadt ist die eine Welt, in der die Truhenfrage wirklich gestellt wird:
    # Hier stehen die Laeden, hier liegt fremde Ware, und hier ist "wer war in meiner
    # Kiste" der ganze Zweck des Buchs.
    marktstadt: [setzen, abbauen, benutzen, abgewiesen]
    # Der Nether und das End sind ausgenommen: Dort baut niemand dauerhaft, es gibt
    # keine Parzellen, und eine Zeile je abgebautem Netherrack ist die groesste
    # Schreiblast fuer die geringste Frage.
    nether: []
    end: []

welten:
  # NUR BEIM START GELESEN - /freimarken neuladen aendert hier nichts. Welten entstehen
  # einmal, eine bestehende behaelt ihre Umgebung, und die Zahlenbereiche von
  # /freimarken parzelle stecken im Befehlsbaum, der genau einmal angemeldet wird.
  #
  # Eine Welt je Eintrag - die Reihenfolge hier ist die Reihenfolge beim Anlegen.
  #
  # art:      raster      das Parzellenraster der Marktstadt
  #           gewoehnlich gewoehnliches Minecraft: Gelaende, Erze, Baeume, Tiere
  #           leer        Leere, ohne einen einzigen Block
  #           flach       Superflach - eine Grasebene ohne Berge, Hoehlen und
  #                       Wasser [09.11.2026]. Fuer Welten, in denen das Gelaende
  #                       STOERT: Jeder von Hand eingemessene Quader - die sieben
  #                       Tore, die Ladeneinheiten - braucht ebenen Boden, und
  #                       gewoehnliches Gelaende gibt ihn nur mit Glueck. Ein
  #                       gewuerfelter Startwert gab am 02.11. eine rote Wueste mit
  #                       2 Bloecken Spanne, ein anderer am 09.11. Bergland mit 29.
  #                       Auf einer flachen Welt ist die Frage nicht da. Der
  #                       startwert wirkt hier nicht - eine Ebene ist eine Ebene.
  #           stadtfelder Stadtfelder in der Leere [11.11.2026] - die Welt der
  #                       Freistaedte. Ein festes Raster aus Feldern zu 256x256,
  #                       durch 32 Bloecke Leere getrennt, am Feldrand eine
  #                       unsichtbare Wand von der Weltunterkante aufwaerts. Eine
  #                       Stadt ist damit ein ORT und kein Nachbar: hinein kommt man
  #                       nur mit /warp freistadt <name>. Der startwert wirkt auch
  #                       hier nicht - das Gelaende kommt aus der Rechnung.
  #           inseln      Gleiche Inseln in gleichem Abstand [18.11.2026] - die Welt
  #                       Hafenwerder. Ein festes Raster aus Feldern zu 128x128, durch
  #                       128 Bloecke offenes Meer getrennt. Das FELD ist das Eigentum,
  #                       und darin liegt die Insel mit neun Bloecken eigenem Wasser
  #                       rundherum - ihr Hafen. Keine Barriere wie bei den
  #                       Stadtfeldern: Hinueberschwimmen soll man duerfen, nur bauen
  #                       nicht. Plan 4.1 sagte "natuerlich gewachsen" und 6.2 einen
  #                       FESTPREIS von 75.000 Mark; beides zusammen geht nicht, denn
  #                       die eine Insel laege im Flachwasser und die naechste halb im
  #                       Berg. Darum ist jede Insel dieselbe Insel, nur anderswo -
  #                       dieselbe Entscheidung wie am 11.11. bei den Freistaedten. Der
  #                       startwert wirkt auch hier nicht.
  #           wolken      Leere mit einem Raster [18.11.2026] - die Welt
  #                       Wolkenwerder. Felder zu 128x128, durch 384 Bloecke Leere
  #                       getrennt; eine Rasterzelle ist damit 512 Bloecke und genau
  #                       eine Regionsdatei. Der Generator erzeugt davon GENAU EIN
  #                       Feld: 0/0, die Ankunftsplattform aus Steinziegeln mit
  #                       Gelaender, auf Hoehe 64. Jede Startinsel - 9x9 Wiese, zwei
  #                       Schichten Erde, eine Eiche, eine Truhe - setzt das Plugin,
  #                       wenn jemand sie nimmt. Darum ist hier NICHTS vorzugenerieren,
  #                       und der Start mahnt es auch nicht an.
  #                       KEINE Barriere zwischen den Feldern, anders als bei den
  #                       Stadtfeldern: In einer Skyblockwelt ist der Fall ins Nichts
  #                       die Regel, mit der jeder rechnet. Gebaut wird in der Leere
  #                       trotzdem nicht - das verbietet die Schutzwache.
  #                       Der startwert wirkt auch hier nicht; es gibt kein Gelaende.
  #           Pflichtangabe. Eine fehlende Art wird NICHT geraten: "gewoehnlich" als
  #           Vorgabe wuerde aus der Marktstadt beim naechsten Start eine Welt mit
  #           Huegeln und Baeumen machen, mitten in den bezahlten Parzellen.
  #           raster traegt allein marktstadt, und marktstadt traegt nichts anderes.
  #           Steht dort etwas anderes, startet Freimarken nicht - das ist Absicht: So
  #           wird die Marktstadt nicht als falsche Welt angelegt. Und eine ZWEITE
  #           Rasterwelt bekaeme Mauern und Wege, aber kein Besitzbuch und keinen
  #           Schutz; dort duerfte jeder ueberall bauen.
  # umgebung: normal (Vorgabe), nether, ende
  #           Nur beim Anlegen. Eine bestehende Welt behaelt ihre Umgebung; eine
  #           geaenderte Zeile landet nur im Protokoll.
  # kante:    Wunschkante der Weltgrenze in Bloecken, eine ganze Zahl von 32 bis
  #           59999968. Fehlt sie oder ist sie 0, wird keine gesetzt - ausser bei der
  #           Marktstadt, die ohne Grenze keine Parzellennummern hat und dann auf den
  #           Planwert 3000 zurueckfaellt. Die Grenze waechst nur nach aussen, nie nach
  #           innen. Ein Punkt trennt hier keine Tausender: 6.000 liest YAML als 6.
  # spielmodus: ueberleben (Vorgabe), abenteuer, kreativ, zuschauer
  #           Wird beim Betreten der Welt gesetzt - Minecraft kennt keinen Spielmodus je
  #           Welt. Wer das Recht freimarken.spielmodus.frei hat, wird nie umgestellt;
  #           ohne diese Ausnahme wuerde ein Baumeister im Kreativmodus beim Betreten
  #           Altfurts mitten im Bauen heruntergestuft.
  # tor:      Der Quader am Bundesmarkt, der HIERHER fuehrt - zwei Ecken, je drei ganze
  #           Zahlen, beide eingeschlossen:
  #               tor:
  #                 von: [58, -60, 0]
  #                 bis: [60, -58, 0]
  #           Das Tor steht am Eintrag der ZIELwelt und nicht in einer eigenen Liste:
  #           So bleibt eine neue Welt ein Eintrag und ist nicht ein Eintrag plus ein
  #           vergessenes Tor. Geprueft wird beim Start, dass kein Tor in der
  #           Ankunftswelt selbst steht, keines ausserhalb ihrer Grenze liegt und keine
  #           zwei Tore sich Bloecke teilen - sonst entschiede die Reihenfolge der
  #           Eintraege, wohin ein Spieler reist.
  #
  # Neue Welten kommen beim Update NICHT von selbst in diese Datei - eine vorhandene
  # config.yml wird nie ueberschrieben. Was hier fehlt, nennt das Protokoll beim Start
  # einzeln; der Block muss dann von Hand hierher.
  marktstadt:
    art: raster

    # Das Tor steht am Bundesmarkt in Altfurt und fuehrt HIERHER.
    #
    # DIE REIHE IST NICHT MEHR EINGEMESSEN, sondern GEGEBEN [18.11.2026]:
    # Altfurt ist art: flach, der Boden also ueberall y -61 und der erste
    # freie Block y -60. Darum steht JEDES der acht Tore auf z=0 mit
    # y -60..-58, drei Bloecke breit und drei hoch, in Schritten von vier
    # (x 58, 62, 66, 70, 74, 78, 82, 86) - dazwischen je eine tragende
    # Saeule. Die Wand reicht damit von x 57 bis x 89.
    #
    # Bis zum 18.11.2026 waren die Zahlen an einer gewachsenen Welt vom
    # 02.11. gemessen, die es nicht mehr gibt. Acht Tore brauchen
    # 1 + 8*4 = 33 Bloecke; das damals gemessene flache Feld war 32 breit -
    # das achte Tor hatte gar keinen Platz. Auf einer Ebene gibt es diese
    # Grenze nicht.
    #
    # Das Mauerwerk ist von Hand zu bauen (Plan 2.1 nennt die Gebaeude). Bis dahin ist
    # das Tor eine unsichtbare Tuer - das Protokoll sagt beim Start, welche Tore noch
    # ohne Bauwerk sind.
    tor:
      von: [58, -60, 0]
      bis: [60, -58, 0]
    # Wunschkante der Weltgrenze in Bloecken; Plan Abschnitt 4 nennt 3.000.
    #
    # Gerechnet wird daraus ABGERUNDET auf ganze Rasterzellen (64 Parzelle + 7 Weg = 71)
    # und auf eine gerade Zellenzahl: Aus 3.000 werden 42 Parzellen je Achse mit den
    # Nummern -21 bis 20, zusammen 1.764. Die Grenze wird dann 2.989 Bloecke breit
    # (42 x 71 + 7) und liegt um -3,5/-3,5 - genau auf der Aussenkante des umlaufenden
    # Mauer-Weg-Rings. So kann eine Grenze nie mitten durch eine Parzelle laufen.
    # Ohne Rest gehen Kanten der Form 142 x n + 7 auf: 2.989, 3.131, 4.267.
    #
    # GROESSER geht jederzeit, KLEINER NICHT: Beim Start gilt immer der groessere Wert aus
    # dieser Zeile und der Grenze, die schon in der Welt steht. Ein kleinerer Wert hier
    # landet nur im Protokoll. Eine bezahlte Parzelle darf nie vor die Tuer geraten.
    kante: 3000

    # Nur noetig, wenn die Kante auf mehr als das Doppelte steigen soll - weil Kleiner
    # nicht geht, ist auch ein zu grosser Wert nicht zurueckzunehmen. Hier gehoert dann
    # genau der Text hin, den das Protokoll beim letzten Start genannt hat, etwa
    # "2989 -> 8000". Steht etwas anderes, bleibt die Grenze, die in der Welt steht.
    sprung-bestaetigt: ""

  # Gebaut, nicht gewachsen: Hier stehen Bundesmarkt und die Gebaeude aus Plan 2.1.
  # Spielmodus Abenteuer setzt Schritt 3, Teil C.
  #
  # EINE EBENE UND KEINE LANDSCHAFT [entschieden 18.11.2026]: Altfurt ist
  #   art: flach. Jeder von Hand eingemessene Quader hier - die acht Tore unten,
  #   die Ladeneinheiten weiter oben - ist eine Zahl in dieser Datei, und auf
  #   gewachsenem Gelaende ist jede davon ein Glueckstreffer. Zweimal ist das
  #   schiefgegangen: Am 09.11.2026 war die am 02.11. eingemessene Welt weg und
  #   mit ihr die Grundlage der Torquader; am 18.11.2026 lag im Altfurt des
  #   danach festgeschriebenen Startwerts die GANZE Torreihe unter Wasser. Auf
  #   einer Ebene gibt es die Frage nicht - der Boden ist ueberall y -61.
  #
  # DER STARTWERT DES GELAENDES gilt darum fuer die GEWACHSENEN Welten -
  #   hochwald, kornmark, nether, end [eingefuehrt 09.11.2026]. Er ist die Zeile,
  #   die ein Einmessen dauerhaft macht: OHNE ihn gehoeren eingemessene Zahlen zu
  #   genau EINER zufaellig erzeugten Welt, und wird sie geloescht, kann niemand
  #   sie nachmessen. Fuer Altfurt steht hier keiner mehr - auf einer Ebene waere
  #   er eine Zahl, die nie wirkt.
  # WIRKT NUR BEIM ANLEGEN. Eine Welt, die schon da ist, behaelt ihren Startwert -
  #   genau wie ihre Umgebung. Der Startbericht klagt laut, wenn beides
  #   auseinandergeht; wer das Gelaende dieser Zeile wirklich will, muss die Welt
  #   loeschen und verliert alles Gebaute darin.
  # JE WELT EIN ANDERER WERT. Gleicher Startwert und gleiche Umgebung heisst in
  #   Minecraft dasselbe Gelaende, Block fuer Block - zwei Welten waeren dann zwei
  #   Namen fuer eine Landschaft. Die Liste klagt darueber.
  # DIE ZAHLEN SIND BELIEBIG GEWAEHLT und duerfen geaendert werden, solange die Welt
  #   noch nicht existiert. Danach nicht mehr - siehe oben. Eine ganze Zahl, auch
  #   negativ; 0 ist erlaubt und ist ein Startwert wie jeder andere. KEIN Wort:
  #   Minecraft rechnet im Menue Woerter selbst in Zahlen um, hier wird das nicht
  #   nachgebaut - weicht die Rechnung eines Tages ab, liegt jeder eingemessene
  #   Quader daneben. Und kein Punkt als Tausendertrenner: YAML liest 1.000 als 1.0.
  # Die Marktstadt hat KEINEN: Ihr Gelaende kommt aus dem Parzellengenerator, ein
  #   Startwert waere dort eine Zahl, die nie wirkt.
  altfurt:
    # FLACH und nicht gewoehnlich [entschieden 18.11.2026]. Altfurt ist
    # eine GEBAUTE Stadt und keine gewachsene Landschaft: Jeder Quader
    # hier - acht Tore, drei Ladeneinheiten - ist eine Zahl in dieser
    # Datei, und auf gewachsenem Gelaende ist jede davon ein
    # Glueckstreffer. Gemessen am 18.11.2026 im Altfurt des Startwerts
    # 110926001: 73 Prozent der Umgebung des Nullpunkts ist Meer, die
    # ganze Torreihe liegt unter Wasser (Boden y 47..53, Wasser bis
    # y 62), und der Start klagt ueber alle acht Tore. Auf einer Ebene
    # ist die Frage gar nicht da - der Boden ist ueberall y -61.
    #
    # KEIN Startwert, denn er wirkt hier nicht (Weltangabe.startwertWirkt:
    # eine Ebene ist eine Ebene, gleich welche Zahl darueber steht). Eine
    # Zahl hier waere eine, die nie wirkt - dieselbe Antwort wie bei den
    # Freistaedten. Wer Altfurt doch gewachsen will, setzt art:
    # gewoehnlich UND einen Startwert und misst danach jeden Quader neu.
    art: flach
    kante: 800
    # Abenteuer in ganz Altfurt [entschieden 02.11.2026]. Altfurt wird nie
    # zurueckgesetzt - solange hier Ueberleben gilt, kann jeder Besucher im Rohbau
    # graben, und jedes Loch bleibt. Der Modus ist diese Zeile, ein abgebautes Stadttor
    # nicht. Baumeister bekommen freimarken.spielmodus.frei.
    spielmodus: abenteuer
    # Kein tor: Hier stehen die Tore, ein Tor nach nebenan waere keines.

  # Die Welt der Freistaedte: Stadtfelder in der Leere, eines je Stadt.
  freistaedte:
    # STADTFELDER [entschieden 11.11.2026, Plan 6.4]: ein festes Raster aus Feldern zu
    # 256x256, durch 32 Bloecke Leere getrennt und mit unsichtbarem Rand aus
    # Barrierebloecken. Eine Freistadt ist damit ein ORT und kein Nachbar - hinein kommt
    # man nur mit /warp freistadt <name>, nicht zu Fuss.
    #
    # KEIN Startwert: Das Gelaende kommt aus der Rechnung (Stadtfeldplan) und nicht aus
    # einer Zahl. Eine Zahl hier waere eine, die nie wirkt.
    #
    # Die Kante ist ein WUNSCH und kein Mass: Sie wird auf ganze Stadtfelder
    # abgerundet, sonst schnitte die Grenze mitten durch Bauland. Aus 6000 werden
    # 20 Felder je Achse (Nummern -10 bis 9) und die wirkliche Kante 5792 um -16/-16.
    # Das sind 400 Felder, davon 399 zu gruenden: Feld 0/0 ist das ANKUNFTSFELD, dort
    # landet das Tor aus Altfurt. Was wirklich gilt, steht beim Start im Protokoll.
    art: stadtfelder
    kante: 6000
    tor:
      von: [62, -60, 0]
      bis: [64, -58, 0]

  # Archipel mit eigenem Angelgut (Plan 4.1), eine Insel je Feld.
  hafenwerder:
    # INSELN [entschieden 18.11.2026, Plan 4.1 und 6.2]: ein festes Raster aus Feldern
    # zu 128x128, durch 128 Bloecke offenes Meer getrennt. Die Insel in jedem Feld ist
    # dieselbe: ein gerundetes Quadrat, 110 Bloecke breit an der breitesten Stelle und
    # 11.364 Bloecke Land, davon 1.600 Sandstrand. Darunter ein Hang, der am Rand des
    # eigenen Feldes auf den Meeresgrund trifft; das Wasser ist sieben Bloecke tief, die
    # Wasserlinie liegt auf 62 und die Wiese auf 63.
    #
    # ACHTUNG BEI EINER BESTEHENDEN WELT: Bis zum 18.11.2026 stand hier gewoehnlich.
    # Was in einer schon erzeugten Welt im Boden liegt, bleibt liegen - nur NEUE Chunks
    # folgen dieser Zeile, und das waere eine Welt aus zwei Haelften. Der Start sagt es
    # als Klage ("wurde als GEWOEHNLICH angelegt, die Liste sagt INSELN"). Wer die Art
    # wirklich wechselt, loescht den Weltordner einmal.
    #
    # KEIN Startwert: Das Gelaende kommt aus der Rechnung (Inselplan) und nicht aus
    # einer Zahl. Die 110926003, die hier bis zum 18.11. stand, waere eine, die nie
    # wirkt.
    #
    # Die Kante ist ein WUNSCH und kein Mass: Sie wird auf ganze Inselfelder
    # abgerundet, sonst schnitte die Grenze mitten durch bezahltes Eigentum. Aus 5000
    # werden 18 Felder je Achse (Nummern -9 bis 8) und die wirkliche Kante 4736 um
    # -64/-64. Das sind 324 Felder, davon 323 zu nehmen: Feld 0/0 ist die
    # ANKUNFTSINSEL, dort landet das Tor aus Altfurt. Was wirklich gilt, steht beim
    # Start im Protokoll.
    art: inseln
    kante: 5000
    # Plan 2.1: "Hafen von Altfurt - Tor nach Hafenwerder".
    tor:
      von: [66, -60, 0]
      bis: [68, -58, 0]

  wolkenwerder:
    # WOLKEN [18.11.2026, Plan 4.1 und 6.2]: die Skyblockwelt. Leere mit einem Raster
    # aus Feldern zu 128x128, durch 384 Bloecke Leere getrennt. Erzeugt wird davon nur
    # Feld 0/0 - die Ankunftsplattform; jede Startinsel setzt das Plugin.
    #
    # NEU ANGELEGT: Diese Welt gab es bis zum 18.11.2026 nicht. Wer trotzdem einen
    # Ordner wolkenwerder hat (etwa aus einem Versuch mit art: leer), loescht ihn
    # einmal - was in einer schon erzeugten Welt im Boden liegt, bleibt liegen, und nur
    # NEUE Chunks folgen dieser Zeile. Der Start sagt es als Klage.
    #
    # KEIN Startwert: Es gibt kein Gelaende, das er wuerfeln koennte.
    #
    # Die Kante ist ein WUNSCH und kein Mass: Aus 20000 werden 38 Felder je Achse
    # (Nummern -19 bis 18) und die wirkliche Kante 19840 um -192/-192. Das sind 1444
    # Felder, davon 1443 zu nehmen: Feld 0/0 ist das ANKUNFTSFELD, dort landet das Tor
    # aus Altfurt. Viermal so viele wie Hafenwerder, und das hat einen Grund - die
    # Insel hier ist GRATIS (Plan 6.2, der zweite der zwei gratis Einstiege), und von
    # etwas Gratisem werden mehr Stuecke genommen. Kosten tut es nichts: Eine leere
    # Welt hat keine Chunks, solange niemand eine Insel nimmt.
    art: wolken
    kante: 20000
    # Plan 2.1: "Wolkenturm - Tor nach Wolkenwerder".
    #
    # Das achte Tor der Reihe [18.11.2026]. Es setzt sie um eine Oeffnung fort und
    # endet bei x=89. Auf der Ebene braucht es dafuer keine Messung mehr -
    # gebaut werden muss die Oeffnung aber, wie die sieben anderen auch.
    tor:
      von: [86, -60, 0]
      bis: [88, -58, 0]

  # Freibau; eine Sicherung kostet 5.000 Mark.
  hochwald:
    art: gewoehnlich
    startwert: 110926004
    kante: 5000
    # Plan 2.1: "Forsttor - Tor zum Hochwald".
    tor:
      von: [70, -60, 0]
      bis: [72, -58, 0]

  # Farmwelt. Wird bei jeder neuen Minecraft-Version zurueckgesetzt und neu
  # vorgeneriert - deshalb haengt an ihr kein Besitz (Plan 4.2).
  kornmark:
    art: gewoehnlich
    startwert: 110926005
    kante: 2000
    # Plan 2.1: "Kornpforte - Tor nach Kornmark".
    tor:
      von: [74, -60, 0]
      bis: [76, -58, 0]

  nether:
    art: gewoehnlich
    startwert: 110926006
    umgebung: nether
    kante: 2000
    tor:
      von: [78, -60, 0]
      bis: [80, -58, 0]

  # "end" und nicht "ende": Der Schluessel ist der Weltname, und den fuehrt Plan
  # Abschnitt 4 so. Weltnamen sind nach Plan 12a.6 nur lesbar - an ihnen haengen
  # Sicherungen und spaeter Datensaetze. Die Umgebung heisst dagegen deutsch.
  end:
    art: gewoehnlich
    startwert: 110926007
    umgebung: ende
    kante: 2000
    tor:
      von: [82, -60, 0]
      bis: [84, -58, 0]
