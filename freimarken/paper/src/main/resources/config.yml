# Wie Spielzeit gemessen wird und wann ein Tag endet.
#
# Gezaehlt wird Anwesenheit mit Lebenszeichen, in Sekunden, und zwar aus der Differenz
# zweier Uhrablesungen - nicht aus der Zahl der Takte. Ein verspaeteter Takt zaehlt
# deshalb richtig, und ein lahmender Server verliert nichts.
#
# In der Datenbank steht immer nur schon VERSTRICHENE Zeit und nie ein laufender
# Zeitpunkt. Darum kann kein Absturz eine offene Sitzung hinterlassen, und es gibt kein
# Aufraeumen beim Start.
#
# Gezaehlt wird erst ab dem Einbau dieser Messung. Spielstunden von davor stehen nirgends:
# Die Minecraft-Statistik waere die einzige Quelle, und die ist fuer jedes Plugin
# schreibbar, nicht an eine Welt gebunden und von einer Weltkopie verdoppelt - sie kann die
# Zusage "die Datenbank ist die Wahrheit" nicht halten. Jeder faengt bei 0 an, und die
# Anzeige sagt das.
zeit:
  # In welcher Zone ein Tag beginnt und endet - die Tagesgrenze.
  #
  # Ein Zonenname wie Europe/Berlin oder UTC, also ein Eintrag aus der Zonendatenbank.
  # Ein fester Versatz wie "UTC+2" wird abgewiesen: Er kennt keine Sommerzeit, und die
  # Tagesgrenze laege vom letzten Sonntag im Maerz an um 01:00 Ortszeit. Ein Tippfehler
  # wird ebenfalls abgewiesen und faellt nicht stumm auf die Zone des Rechners zurueck.
  #
  # Was keine Pruefung faengt, ist der Name, der gueltig und trotzdem falsch ist: UTC statt
  # Europe/Berlin verschiebt die Grenze um eine Stunde, ohne dass etwas klagt. Dagegen
  # steht die Zeile im Startprotokoll, etwa "Tagesgrenze Europe/Berlin - naechster
  # Tageswechsel 04.11.2026 00:00 Ortszeit = 03.11.2026 23:00 UTC". Wer dort bei
  # Nachmittagslicht "00:00 Ortszeit = 00:00 UTC" liest, sieht den Fehler. Am Tag einer
  # Zeitumstellung nennt dieselbe Zeile den 23- oder 25-Stunden-Tag.
  #
  # Alle Zeitstempel in der Datenbank bleiben UTC; nur der TAG wird in dieser Zone
  # gerechnet, und zwar ausschliesslich in Java. MariaDB entscheidet die Tagesgrenze nicht
  # (die Verbindung steht fest auf UTC, dort ist zwischen 00:00 und 02:00 Ortszeit noch der
  # Vortag).
  #
  # NUR BEIM START GELESEN - /freimarken neuladen vergleicht und meldet, uebernimmt aber
  # nicht. Eine neue Zone im Betrieb verschoebe die Tagesgrenze mitten am Tag: Mit dem
  # ersten Verbraucher der Grenze (Tagesbonus, Ladenmiete, Verdienstdeckel) wuerde derselbe
  # Tag dann zweimal abgerechnet oder fiele aus.
  zone: "Europe/Berlin"

  # In welchem Abstand die gemessene Zeit in die Datenbank geschrieben wird.
  #
  # Ganze Zahl von 10 bis 600 Sekunden. Der Wert entscheidet NUR, wie oft geschrieben wird,
  # nicht wie viel gezaehlt wird. Er ist damit die eine Zahl, mit der Schreiblast gegen
  # Verlust bei einem Absturz getauscht wird: Bei 60 verliert ein Absturz bis zu 1 Minute je
  # anwesendem Spieler, bei 600 bis zu 10 - solange die Datenbank annimmt. Nach einem
  # Fehlschlag ist es ein Mehrfaches davon, siehe den Absatz zum Stillstand weiter unten.
  # Ein geordneter Neustart und ein Abmelden verlieren nichts - dort wird abgerechnet.
  #
  # Unter 10 Sekunden schreibt der Takt oefter, als jede Anzeige unterscheidet - zehn
  # Schreibzuege je Minute und Spieler fuer eine Zahl, die in Minuten dasteht.
  #
  # Dieser Wert bestimmt auch, wie oft der Server bei unerreichbarer Datenbank kurz stehen
  # bleibt: Ein Schreibversuch in eine tote Datenbank haelt den Hauptfaden an, bis die
  # Verbindung ihre Fristen abgewartet hat - wie lange das ist, steht in den Fristen der
  # Datenschicht und nicht hier, sonst stuende hier bald eine andere Zahl als dort.
  # Nach einem Fehlschlag laesst der Takt darum einige Schlaege lang das SCHREIBEN aus -
  # wie viele, sagt die Protokollzeile des Fehlschlags selbst. GERECHNET wird in diesen
  # Schlaegen weiter: Ihre Sekunden warten auf den naechsten erfolgreichen Schreibzug und
  # gehen auf jedem geordneten Weg mit - beim Abmelden mitten im Fenster, beim
  # Herunterfahren, beim Neustart des Plugins. Verloren ist allein der eine Takt, der
  # wirklich versucht wurde - und genau den nennt die Zeile.
  #
  # Der Preis dieses Fensters: Stuerzt der Server darin ab oder schiesst ein Waechter ihn
  # ab, sind nicht die Sekunden EINER Taktlaenge je Spieler weg, sondern auch die aller
  # ausgesetzten Schlaege davor. Darum ist ein grosser Takt zweimal teuer.
  #
  # Diese Zahl ist zugleich die Untergrenze fuer untaetig-minuten weiter unten: Die
  # Untaetigkeitsgrenze darf nicht kuerzer sein als der Takt (aufgerundet auf ganze
  # Minuten), sonst wirft ein verworfener Takt aktiv gespielte Zeit weg.
  #
  # NUR BEIM START GELESEN - und das ist kein Versehen: Der Abstand steckt im gestellten
  # Zeitgeber. Ihn beim Neuladen neu zu stellen hiesse, dass nach zwei Neuladen drei
  # Zeitgeber dieselbe Spielzeit dreifach schreiben.
  takt-sekunden: 60

  # Ab welcher Untaetigkeit ein Takt nicht mehr zaehlt.
  #
  # Ganze Zahl von 0 bis 1440 Minuten. 0 heisst ausdruecklich: Abwesenheit zaehlt mit - der
  # ehrliche Ausschalter fuer die Regel. Gemessen wird mit der Untaetigkeitsdauer, die der
  # Server selbst fuehrt.
  #
  # Die Grenze schliesst den Nachtlang im Startbildschirm aus, der ohne jede Absicht
  # passiert. Sie ist aber KEINE Sperre: Wer alle neun Minuten eine Taste drueckt, gilt
  # durchgehend als aktiv, und ein Makro oder ein beschwertes Tastenbrett erzeugt genau das.
  # Eine Hoeflichkeitsregel, keine Mauer - wer das Gegenteil braucht, braucht eine
  # Verhaltensmessung und nicht eine groessere Zahl hier.
  #
  # Die Grenze ist eine Stufe und kein Schnitt, also zugunsten des Spielers: Wer aufsteht,
  # bekommt bis zu diese 10 Minuten geschenkt. Ein Rang, der durch eine Pause verlorengeht,
  # erklaert sich niemandem. Umgekehrt wird ein verworfener Takt NICHT angespart und spaeter
  # ausgezahlt - sonst sammelte ein abwesender Spieler seine Stunden und kassierte sie mit
  # einem Schritt.
  #
  # WEIL die Grenze eine Stufe ist, darf sie nicht KUERZER sein als takt-sekunden: Bei
  # takt-sekunden: 600 und untaetig-minuten: 1 faellt der ganze Takt weg, sobald der Spieler
  # die letzte Minute stillsteht - 540 aktiv gespielte Sekunden waeren weg, ohne eine
  # Protokollzeile, und bei jedem Takt erneut. Erlaubt ist darum jede Zahl ab dem Takt in
  # ganzen Minuten aufgerundet (zu 60 s also 1, zu 90 s 2, zu 600 s 10) - oder die 0.
  #
  # Was passiert, wenn man es doch versucht: Das Paar wird abgewiesen, nicht abgeschnitten
  # und nicht geraten. Beim Start klagt das Protokoll mit dem Grund und nennt die kleinste
  # passende Zahl; es bleibt dann bei diesen 10 Minuten. Bei /freimarken neuladen wird
  # NICHTS uebernommen - auch die uebrigen Zeilen nicht, denn eine Klage haelt die ganze
  # Uebernahme an -, und die Antwort nennt denselben Grund.
  #
  # /freimarken neuladen uebernimmt diesen Wert. Er wird beim Gebrauch gefragt; es wird
  # dafuer kein Objekt gebaut und nichts angemeldet. Die eine Ausnahme: Wer takt-sekunden
  # verkuerzt und die Grenze mit ihm (etwa von 600/10 auf 60/1), hat ein stimmiges Paar in
  # der DATEI und trotzdem ein unstimmiges im BETRIEB - der laufende Takt ist noch der
  # lange, denn takt-sekunden wird nur beim Start gelesen. Dann bleibt die alte Grenze
  # stehen, und der Block "Nur beim Start gelesen" sagt es mit dem Grund; nach dem
  # naechsten Neustart gilt beides zusammen.
  untaetig-minuten: 10

# Der Tagesbonus (Plan 8.2, Teil H): Die dritte und kleinste Quelle neben Arbeit und
# Bundesmarkt. Er belohnt ZWEI verschiedene Dinge, und das ist der ganze Entwurf:
#
#   - das taegliche EINLOGGEN mit dem Grundbetrag,
#   - das REGELMAESSIGE Spielen mit der Serie, die jeden Tag in Folge mehr gibt.
#
# Gezahlt wird hoechstens EINMAL am Tag, und darueber wacht das Buchungsbuch und nicht
# eine Merkzeile: Gefragt wird, ob seit dem Tagesbeginn eine Buchung mit dem Grund
# tagesbonus steht. Darum kann kein Absturz und kein Neustart eine zweite Zahlung am
# selben Tag erzeugen - und darum braucht dieser Bonus keinen eigenen Tagesdeckel.
#
# Welcher Tag gemeint ist, sagt zeit.zone weiter unten - Mitternacht Ortszeit, nicht UTC.
#
# /freimarken neuladen uebernimmt alle fuenf Zeilen.
tagesbonus:
  # Was der ERSTE Tag einer Serie bringt, in ganzen Mark. Erlaubt ist 1 bis 1.000.000.
  #
  # 500 Mark sind rund zehn Minuten Arbeit (Plan 8.2 rechnet mit 2.000 bis 5.000 Mark je
  # Spielstunde) - sichtbar genug, dass das Einloggen sich lohnt, und zu wenig, um einen
  # Arbeitstag zu ersetzen. Der Bonus soll Regelmaessigkeit belohnen und keine zweite
  # Arbeit sein.
  #
  # Eine 0 wird abgewiesen: Sie hiesse, dass der Bonus eine Nachricht ueber 0 Mark
  # schickt. Wer ihn nicht will, soll das sagen muessen und nicht eine 0 einsetzen.
  grundbetrag: 500

  # Was jeder WEITERE Tag der Serie dazulegt, in ganzen Mark. Erlaubt ist 0 bis
  # 1.000.000; eine 0 ist erlaubt und heisst: jeder Tag bringt dasselbe.
  #
  # Mit 100 Mark je Tag und dem Hoechstbetrag darunter ist die Staffel: Tag 1 gibt 500,
  # Tag 2 gibt 600, ab Tag 16 dann 2.000. Sechzehn Tage sind lang genug, dass die Serie
  # sich wie ein Ziel anfuehlt, und kurz genug, dass ein Spieler sie erlebt.
  je-serientag: 100

  # Woran die Serie aufhoert zu wachsen, in ganzen Mark. Erlaubt ist der Grundbetrag
  # bis 1.000.000.
  #
  # 2.000 Mark sind ein Zehntel des Verdienstdeckels (verdienst.tagesdeckel). Strenger
  # als beim Bundesmarkt, der ein Viertel sein darf: Der Markt verwertet Erarbeitetes,
  # der Bonus verlangt gar nichts.
  #
  # DIESE ZEILE BRAUCHT ES. Ohne sie liefe eine lange Serie davon: Bei 100 Mark je Tag
  # waere der Bonus nach einem Jahr groesser als ein Tagesverdienst - und eingestellt
  # hat man ihn, als die Serien kurz waren.
  #
  # Ein Hoechstbetrag UNTER dem Grundbetrag wird abgewiesen, nicht abgeschnitten: Dann
  # gaelte der Grundbetrag nie, und seine Zeile hier waere eine Angabe ohne Wirkung.
  hoechstbetrag: 2000

  # Ab welcher LUECKE in Tagen die Serie reisst. Erlaubt ist 2 bis 366.
  #
  # Die Luecke ist der Abstand zwischen dem letzten Bonustag und heute. Bei 2 haelt die
  # Serie nur, wer gestern da war - wer einen Tag verpasst, faengt bei Tag 1 an. Das ist
  # die strenge und uebliche Lesart.
  #
  # Bei 3 wird ein verpasster Tag verziehen: Wer vorgestern da war, setzt fort. Das ist
  # freundlicher und nimmt der Serie etwas von ihrer Haerte - deine Entscheidung.
  #
  # Eine 1 wird abgewiesen: Sie liesse die Serie fuer JEDEN reissen, auch fuer den, der
  # gestern da war. Die Serie stuende dann immer auf 1, und man suchte den Fehler in der
  # Belohnung statt in dieser Zahl.
  serie-reisst-ab-luecke: 2

  # Wie viele TAETIGE Minuten des Tages vor dem Bonus liegen. Erlaubt ist 0 bis 1440.
  #
  # 0 heisst: Der Bonus faellt beim EINLOGGEN. So ist es gewollt - das taegliche
  # Einloggen soll belohnt werden, und eine Wartezeit davor macht aus einer Belohnung
  # eine Auflage.
  #
  # Wer das Einloggen allein nicht belohnen will, setzt hier Minuten ein. Dann zaehlen
  # TAETIGE Minuten aus dem Abschnitt messstelle und NICHT Anwesenheit: Anwesenheit ist
  # im Stehen zu haben, und genau dagegen ist diese Zahl gedacht. Gezahlt wird dann beim
  # ersten Taktschlag, der die Zahl erreicht - also bis zu zeit.takt-sekunden spaeter.
  #
  # Ein ganzer Tag (1440) wird abgewiesen: Der Bonus faellt dann genau am Tageswechsel,
  # also nie.
  mindest-minuten: 0
# Die Messstelle (Plan 8.8, Teil G): Woran das Plugin erkennt, dass ein Spieler nicht nur
# ANWESEND war, sondern auch TAETIG.
#
# Warum es die ueberhaupt gibt: zeit.untaetig-minuten schliesst den Nachtlang im
# Startbildschirm aus, der ohne Absicht passiert. Gegen Absicht ist sie keine Mauer - ein
# Makro oder ein beschwertes Tastenbrett erzeugt Lebenszeichen, und damit sind die vierzig
# Stunden bis Buerger IM STEHEN erreichbar. Gemessen wird dort Anwesenheit. Die Messstelle
# misst daneben eine zweite Zahl, damit spaeter eine Rangschwelle daran haengen kann, die
# nicht im Stehen erreichbar ist.
#
# Sie GREIFT IN NICHTS EIN. Kein Verdienst wird gesperrt, keine Spielzeit verworfen, kein
# Spieler gemeldet. Sie zaehlt eine zweite Zahl neben der ersten, und /playtime zeigt
# beide. Erkennung statt Verhinderung: Eine Schranke traefe zwangslaeufig auch den
# ehrlichen Spieler mit einer eintoenigen Arbeit, und was sie ihm wegnimmt, holt ihm
# niemand zurueck.
#
# Gemessen wird VIELFALT und nicht Menge. Eine Menge - wie viele Bloecke in der Stunde -
# laesst sich von einem Makro beliebig hochdrehen und trifft dabei genau die ehrlichen
# Spieler, die viel arbeiten. Die Vielfalt laesst sich nicht hochdrehen: Ein Makro gibt
# immer DASSELBE Zeichen, weil es genau eine Tastenfolge wiederholt.
#
# Es gibt KEINEN Ausschalter, und das ist Absicht - dieselbe Begruendung wie bei der Zahl
# der ausgesetzten Taktschlaege: Ein Schalter dafuer waere einer, mit dem man sich stumm
# die eigene Messung wegwirft, und sie ist spaeter die Grundlage einer Rangschwelle. Wer
# milde messen will, setzt verlangte-arten auf 1; dann genuegt EIN Zeichen.
#
# /freimarken neuladen uebernimmt alle drei Zeilen.
messstelle:
  # Wie viele VERSCHIEDENE Arten von Lebenszeichen ein Taktschlag braucht, um als taetig zu
  # zaehlen. Erlaubt ist 1 bis zur Laenge der Liste arten (siehe unten).
  #
  # Gerechnet gegen den Fall, den es treffen soll: Ein Makro am Pflastersteingenerator gibt
  # genau ein Zeichen (abbauen), eine Angelfarm ebenso (benutzen), ein beschwertes
  # Tastenbrett im Startbildschirm keines. Ein Mensch, der denselben Generator abbaut, geht
  # dabei hin und her, raeumt in eine Truhe oder setzt einen Block - er kommt auf zwei.
  #
  # Nicht 3: Beim kuerzesten erlaubten Takt von 10 Sekunden sind drei verschiedene
  # Taetigkeiten auch fuer einen Menschen nicht selbstverstaendlich, und die Messung soll
  # nicht an der Taktlaenge haengen.
  #
  # Eine Zahl GROESSER als die Laenge der Liste arten wird abgewiesen und nicht
  # abgeschnitten: Damit waere kein Taktschlag jemals taetig, und eine Null sieht in jeder
  # Anzeige aus wie ein leerer Server. Das Protokoll klagt dann mit Grund und nennt die
  # groesste passende Zahl.
  verlangte-arten: 2

  # Wie viele Bloecke ein Spieler in einem Taktschlag zuruecklegen muss, damit das Bewegen
  # als Lebenszeichen zaehlt. Erlaubt ist 1 bis 1000.
  #
  # Gemessen wird der ABSTAND zwischen Anfang und Ende des Schlages und nicht der gelaufene
  # Weg: Wer im Kreis laeuft, legt Weg zurueck und kommt nicht weiter - und genau das tut
  # ein Laufmakro an einer Wand. Die Hoehe zaehlt mit; ein Weltwechsel zaehlt immer, denn
  # ein Abstand zwischen zwei Welten hat keine Bedeutung.
  #
  # Acht Bloecke sind gerechnet gegen beide Richtungen: Eine gewackelte Maus und ein
  # beschwerter Taster tragen null bis zwei Bloecke weit (Rueckstoss, Rutschen auf Eis).
  # Nach oben ist es wenig - wer in 10 Sekunden normal laeuft, kommt gut vierzig weit.
  #
  # Eine 0 wird abgewiesen: Sie hiesse, dass auch Stillstehen als Bewegung zaehlt.
  mindest-strecke: 8

  # Welche Arten von Lebenszeichen ueberhaupt zaehlen. Es gibt sieben:
  #
  #   bewegen   mindest-strecke weit gekommen (wird gemessen, nicht gemeldet)
  #   abbauen   einen Block abgebaut
  #   setzen    einen Block gesetzt
  #   oeffnen   eine Oberflaeche geoeffnet - Truhe, Werkbank, Ofen, Trichter
  #   benutzen  einen Block oder Gegenstand mit dem RECHTEN Knopf benutzt
  #   kaempfen  ein Wesen angegriffen
  #   sprechen  geschrieben oder einen Befehl gegeben
  #
  # benutzen fehlt ab Werk, und das ist der wichtigste Satz dieses Abschnitts: Es ist keine
  # Art fuer sich, sondern die halbe Art zum Setzen - ein Block wird mit dem rechten Knopf
  # gesetzt, und derselbe Knopfdruck IST das Benutzen. Ein Makro, das Bloecke setzt, gaebe
  # damit zwei Zeichen aus einer Taste und zaehlte als taetig. Wer die Art dazunimmt, hat
  # eine mildere Messung - und dieses Paar.
  #
  # Der linke Knopf zaehlt NICHT als benutzen, auch wenn die Art dabei ist: Er feuert bei
  # jedem Schlag, und ein Makro am Generator bekaeme sonst abbauen UND benutzen.
  #
  # Eine LEERE Liste wird abgewiesen - sie hiesse, dass kein Taktschlag jemals taetig ist,
  # und das ist der stumme Ausschalter, den es nicht geben soll. Ein unbekannter Name wird
  # beklagt und uebersprungen, die uebrigen gelten weiter.
  arten:
    - bewegen
    - abbauen
    - setzen
    - oeffnen
    - kaempfen
    - sprechen
# Die Markthalle (Plan 7.1, Schritt 8 Teil A): Welche Ladeneinheiten es gibt.
#
# Eine Ladeneinheit ist ein ORT - ein kleiner Raum in der Markthalle und die Truhe darin.
# Wer sie mietet und wie lange, kommt mit Teil B; hier stehen nur die Staende.
#
# WARUM HIER DREI PROBESTAENDE STEHEN UND KEINE HALLE: Die Markthalle ist eines der zehn
# Gebaeude, die von Hand in Altfurt entstehen (Plan 2.1) - das Programm setzt dort keine
# Bloecke. Entschieden am 08.11.2026: Drei kleine Staende genuegen, um Mieten, Verlaengern,
# Kuendigen, den taeglichen Lauf und den Ladenschutz im Spiel zu pruefen; die Halle kann
# spaeter drumherum wachsen, die Quader bleiben stehen.
#
# WARUM EIN QUADER UND KEIN RASTERFELD: Altfurt hat kein Raster, es ist gewachsenes
# Gelaende. Plan 6.1 hat genau diesen Fall vorgesehen - fuer Besitz, der nicht am Raster
# haengt, kommt der Quader als eigene Angabe.
#
# WARUM DIE TRUHE DAZUGEHOERT: In Altfurt stehen alle Spieler im Abenteuermodus, und der
# verbietet das Setzen von Bloecken - ein Mieter kann sich keine Truhe hinstellen. Die
# Einheit kommt darum mit ihrer Truhe aus dem Bauwerk, und der Mieter fuellt sie nur.
# Die Truhe MUSS innerhalb ihrer Einheit stehen, sonst waere sie ungeschuetzt.
#
# NUR BEIM START GELESEN. /freimarken neuladen verschiebt keinen Laden: Ein Mieter haette
# sonst von einem Augenblick auf den anderen einen anderen Raum, und seine Truhe stuende
# beim Nachbarn. Die Antwort auf neuladen sagt das ausdruecklich.
laeden:
  # In welcher Welt die Halle steht - ohne Namensraum, wie bei reisen.ankunftswelt.
  # Die Welt muss im Abschnitt welten: weiter unten stehen, sonst gilt keine Einheit.
  welt: altfurt

  # Die Miete je Tag. Plan 7.1 nennt sie die STAERKSTE Geldsenke des Servers: laufend,
  # sichtbar, freiwillig. Abgebucht wird taeglich, nicht beim Abschluss.
  #
  # ANPASSBAR MIT BESTANDSSCHUTZ: Jeder Vertrag traegt die Miete, die bei SEINEM
  # Abschluss galt. Eine Erhoehung hier trifft nur neue Vertraege - wer fuer 500
  # gemietet hat, zahlt 500 weiter, auch nach einer Verlaengerung. Wer den neuen Satz
  # will, kuendigt und mietet neu.
  #
  # Eine 0 ist NICHT erlaubt: Das waere ein Laden, den der taegliche Lauf nie beruehrt -
  # also einer, der nie wegen Zahlungsausfall frei wird. Wer Laeden verschenken will,
  # nimmt eine 1.
  miete-je-tag: 500

  # Die Kaution, hinterlegt beim Abschluss. Bei ORDENTLICHER Kuendigung kommt sie
  # zurueck, bei Raeumung wegen Zahlungsausfall nicht - das ist ihr ganzer Zweck: Sie
  # macht das Weglaufen teurer als das Kuendigen.
  #
  # Auch sie steht in der Vertragszeile: Wer mit 5.000 gemietet hat, bekommt 5.000
  # zurueck, auch wenn hier inzwischen 9.000 steht.
  #
  # 0 ist erlaubt und heisst: ohne Kaution. Ein Wert ZWISCHEN 0 und miete-je-tag wird
  # verworfen - darunter kostet das Weglaufen weniger als ein Miettag, und die Kaution
  # bewirkt das Gegenteil von dem, wofuer sie da ist.
  kaution: 5000

  # Die Ladenlizenz - EINMALIG je Spieler, nicht je Laden. Wer sie bezahlt hat, mietet
  # danach beliebig oft, ohne sie erneut zu zahlen.
  #
  # Dass sie bezahlt ist, steht im Buchungsbuch und nirgends sonst (Grund laden_lizenz
  # in /mark verlauf). Es gibt keine Spalte dafuer - eine zweite Wahrheit wuerde nach
  # dem ersten Absturz von der ersten abweichen, und dann zahlt ein Spieler 50.000 Mark
  # ein zweites Mal.
  #
  # 0 ist erlaubt und heisst: wer das Recht freimarken.laden.mieten hat, darf mieten.
  lizenz: 50000

  # Wie viele Tage ein Abschluss und jede Verlaengerung gelten. Das ist NICHT der
  # Zahlungstakt - gezahlt wird taeglich. Die Dauer sagt, wann ein Vertrag OHNE ZUTUN
  # endet; sie ist der Griff gegen den Spieler, der aufhoert zu spielen und noch Geld
  # auf dem Konto hat.
  #
  # Verlaengern kostet nichts und geht, sobald weniger als diese Zahl an Tagen uebrig
  # ist. Damit liegt das Ende nie weiter als zwei Mietdauern MINUS einen Tag voraus -
  # bei 7 also 13, weil der letzte Tag mitzaehlt. Ohne diese Schranke koennte ein
  # reicher Spieler einen Stand fuer Jahre binden, ohne ihn zu benutzen. Eine eigene
  # Zeile dafuer gibt es nicht: Die Schranke IST diese Zahl.
  #
  # Diese Zahl ist KEIN Preis. Die Miete steht oben je TAG - 7 Tage kosten dieselben
  # 500 Mark am Tag wie 30, und Kaution und Lizenz bleiben, wie sie sind. Eine kleine
  # Zahl macht Laeden also nicht guenstiger, sondern nur schneller wieder frei: Wer
  # aufhoert zu spielen, gibt seinen Stand nach einer Woche her und nicht nach einem
  # Monat. Seine Ware ist dabei nicht verloren - sie wandert ins Abholfach, und die
  # Kaution kommt bei Ablauf zurueck.
  mietdauer-tage: 7

  # Nach wie vielen Tagen OHNE ZAHLUNG IN FOLGE der Laden geraeumt wird.
  #
  # Bei 3 heisst das: Der erste Ausfall warnt, der zweite warnt, der dritte raeumt. Es
  # gibt also ZWEI Warnungen und nicht drei - die Zahl heisst nach dem, was sie zaehlt,
  # und nicht nach ihrer Wirkung.
  #
  # Was beim Raeumen passiert: Der Vertrag ist weg, die Kaution VERFAELLT, und der
  # Inhalt der Ladentruhe wandert ins Abholfach - der wird NIE geloescht und wartet
  # beliebig lange auf /laden abholfach. Zahlt der Spieler vorher wieder, sind die
  # Ausfaelle erledigt; gezaehlt werden nur die in Folge.
  #
  # Eine 1 ist erlaubt und heisst: Der erste Ausfall raeumt. Dann liest der Spieler
  # NIE eine Warnung, weil Warnung und Raeumung in denselben Augenblick fallen - der
  # Startbericht sagt es noch einmal, wenn hier eine 1 steht. Wer eine Warnung will,
  # nimmt mindestens 2.
  #
  # Eine 0 wird abgewiesen, und zwar nicht wegen Haerte: Bei 0 waere JEDER Vertrag
  # raeumungsreif, auch der heute abgeschlossene mit 0 Ausfaellen. Der erste Lauf
  # raeumte die ganze Halle.
  #
  # Eine Zahl ab der Mietdauer (oben 7) macht die Regel wirkungslos: Dann laeuft der
  # Vertrag immer vorher ab, und beim Ablauf kommt die Kaution zurueck.
  ausfaelle-bis-raeumung: 3

  # Je Einheit ein Block mit drei Zeilen. Der Name steht auch im Befehl
  # /laden mieten <name>, also nur kleine Buchstaben, Ziffern und Striche.
  #
  #   von / bis  die zwei Ecken des Raumes, je drei ganze Zahlen, BEIDE eingeschlossen
  #   truhe      wo die Ladentruhe steht - drei ganze Zahlen, INNERHALB von von/bis
  #
  # So sieht ein Eintrag aus, wenn die Halle steht:
  #
  #   einheiten:
  #     halle-1:
  #       von: [60, 71, 4]
  #       bis: [64, 75, 8]
  #       truhe: [62, 71, 6]
  #     halle-2:
  #       von: [66, 71, 4]
  #       bis: [70, 75, 8]
  #       truhe: [68, 71, 6]
  #
  # Was geprueft wird und was dann geschieht:
  #
  #   - Eine Einheit ueber 4.096 Bloecken (16 Kantenlaenge) wird verworfen. Das ist kein
  #     Marktstand mehr; wer eine Null zu viel tippt, vermietet sonst halb Altfurt.
  #   - Eine Truhe ausserhalb ihrer Einheit wird verworfen - sie waere ungeschuetzt.
  #   - Zwei Einheiten, die sich Bloecke teilen, werden BEIDE verworfen. Welche gilt,
  #     entschiede sonst die Reihenfolge dieser Datei, und dann koennte ein Mieter in der
  #     Truhe seines Nachbarn stehen. Dieselbe Antwort wie bei den Toren.
  #   - Eine Einheit hinter der Weltgrenze wird verworfen - dort kaeme niemand hin.
  #   - Eine kaputte Einheit kostet nur sich selbst. Die uebrigen gelten weiter; ein
  #     Server, der wegen eines Tippfehlers in einem von zwanzig Staenden nicht startet,
  #     ist schlimmer als einer mit neunzehn.
  #
  # Die Reihenfolge dieser Eintraege ist die Reihenfolge in /laden liste - hier ordnest du.
  #
  # WOHER DIE ZAHLEN KOMMEN, und das gehoert hierher und nicht in ein Protokoll:
  # Gemessen wurden sie am 02.11.2026 an den Regionsdateien von Altfurt, nicht heute -
  # der Probeserver von damals ist aufgeraeumt, seine Weltdaten gibt es nicht mehr.
  # Belegt ist damit: Das Feld x 56..87 / z -4..27 ist das flachste trockene Feld in
  # der Naehe des Nullpunkts, sein Boden liegt durchgehend zwischen y 70 und y 72, und
  # alle 1.024 Deckbloecke sind red_sand - kein Baum, kein Fels, kein Bauwerk. Auf der
  # Linie z=12 ist der Boden an x 56/60/64/68/72/76/80/84 ueberall genau y=71.
  #
  # WAS DAS HEISST: Die Hoehe JEDES EINZELNEN Blockes unter den Staenden ist nicht
  # gemessen, nur die Spanne des ganzen Feldes auf einem Raster von vier Bloecken. Wo
  # der Boden y=70 ist, ist die unterste Quaderschicht Luft; wo er y=72 ist, steht ein
  # Block darin. Beides ist kein Fehler - beim Bauen der Halle planiert man das. Pruefen
  # kostet einen Befehl: /tp 62 73 8 und hinsehen.
  #
  # UND DIE WARNUNG DAZU: Altfurt hat KEINEN festen Startwert (welten.altfurt.art ist
  # gewoehnlich, ein Startwert steht nirgends). Legt ein Server Altfurt NEU an, ist das
  # Gelaende anders - dann sind diese Quader wertlos, und zwar genauso die sieben
  # Torquader unter reisen.tore. Fuer die vorhandene Welt stimmen sie.
  #
  # Der Quader beginnt bei y=71, schliesst also den FUSSBODEN selbst ein. Das ist
  # Absicht: So deckt der Ladenschutz auch den Boden, und niemand hackt dem Mieter den
  # Block unter seiner Truhe weg. Die Truhe steht darum eine Ebene hoeher, auf y=72.
  einheiten:
    # Westreihe, sechs Bloecke hinter der Torreihe bei z=0.
    stand-1:
      von: [60, 71, 6]
      bis: [64, 75, 10]
      truhe: [62, 72, 8]
    # Dieselbe Reihe, mit einer LUECKE von fuenf Bloecken zu stand-1 (z 11..15).
    # Die Luecke ist die eigentliche Probe fuer den Ladenschutz: Dort darf jeder
    # bauen, in den beiden Quadern nur der Mieter.
    stand-2:
      von: [60, 71, 16]
      bis: [64, 75, 20]
      truhe: [62, 72, 18]
    # Ostseite, gegenueber von stand-2. Die Mittelachse x 65..79 zwischen Torreihe
    # und Spawn (72/72/12) bleibt damit frei - dort laeuft jeder Ankommende durch.
    stand-3:
      von: [80, 71, 16]
      bis: [84, 75, 20]
      truhe: [82, 72, 18]
# Der Handel an Kistenshops (Plan 7.4). Ein Kistenshop ist eine Kiste mit einem Schild
# daran: erste Zeile der Besitzer, zweite die Menge je Handel, dritte die Preise in der
# Form "B 100 : S 80", vierte die Ware oder ein Fragezeichen. Rechtsklick kauft,
# Linksklick verkauft. Dieselbe Form wie auf dem Lumia-Vorbild, belegt fuer den
# 11.01.2016.
#
# HANDELN DARF JEDER, IMMER UND UEBERALL (entschieden 08.11.2026). Wo ein Shop STEHEN
# darf, entscheidet dagegen der Bauschutz: auf der eigenen Parzelle, im gemieteten Laden,
# in der Wildnis. Ein Shopschild und seine Kiste sind danach UEBERALL geschuetzt, auch am
# Wegesrand, wo keine Parzelle greift - sonst waere ein Shop in der Wildnis von jedem
# abbaubar.
handel:
  # DIE MARKTGEBUEHR - je LAGE ein eigener Satz.
  #
  # Eine Lage ist Shopart mal Richtung, und das sind drei Zeilen und nicht eine. Der
  # Grund ist die Entscheidung des Nutzers vom 08.11.2026: Auch WANN eine Gebuehr faellt,
  # soll hier stehen und nicht im Programm. Vorher gab es zwei Zeilen, die das nicht
  # sagen konnten - diese Datei meinte "beim Verkauf", der Quelltext meinte "bei jedem
  # Handel", und beides stand da.
  #
  # Fuer alle drei gilt dasselbe:
  #
  #   * 0 heisst: keine Gebuehr. Das ist die ausgelieferte Einstellung - erst soll der
  #     Handel laufen, die Senke kommt spaeter.
  #   * Erlaubt ist 0 bis 50. Ueber der Haelfte waere die Gebuehr hoeher als der Erloes,
  #     und dann verkauft niemand mehr: eine Steuer, die ihre eigene Grundlage abschafft.
  #   * Abgezogen wird sie IMMER dem, der das Geld BEKOMMT - nie als Aufschlag auf den
  #     Preis. Der Preis auf dem Schild ist, was der Kunde zahlt.
  #   * Gerundet wird ABGERUNDET und auf die GANZE Summe, nicht je Stueck. Bei 5 Prozent
  #     auf 19 Mark sind das 0 Mark - wer rundet, rundet zugunsten des Spielers. Und wo
  #     die gerechnete Gebuehr 0 ist, faellt auch keine Gebuehrzeile im Buchungsbuch.

  # KUNDE KAUFT bei einem Spielershop (Rechtsklick). Das Geld bekommt der BESITZER, also
  # zahlt er die Gebuehr - von 1.000 Mark Umsatz bleiben ihm bei 5 Prozent 950.
  marktgebuehr-spielershop-kauf-prozent: 0

  # KUNDE VERKAUFT an einen Spielershop (Linksklick). Das Geld bekommt der KUNDE, also
  # zahlt er die Gebuehr. Das war die Lage, die vorher als die einzige dastand.
  marktgebuehr-spielershop-verkauf-prozent: 0

  # KUNDE VERKAUFT an einen BUNDSHOP, also an einen Shop ohne Besitzer. Getrennt, weil es
  # etwas anderes ist: Beim Spielershop zahlt jemand etwas an den Staat, hier verkauft er
  # AN den Staat. Die Gebuehr senkt also den Ankaufpreis, ohne die Tafel in
  # bundesmarkt.ankauf anzufassen. Plan 7.4 sieht hier spaeter 5 Prozent vor; bis dahin
  # steht auch diese auf 0.
  marktgebuehr-bundshop-verkauf-prozent: 0

  # Die vierte Lage - KUNDE KAUFT bei einem Bundshop - hat ABSICHTLICH keinen Schluessel.
  # Dort bekommt niemand Geld, dem eine Gebuehr abzuziehen waere: Der Bund hat kein Konto,
  # sein Geld kommt aus dem Nichts und verschwindet dorthin. Ein Schluessel dafuer waere
  # eine Zahl, die du einstellen koenntest und die nie wirkt.

  # Das Wort in der ERSTEN Schildzeile, das aus einem Shop einen Bundshop macht: ohne
  # Besitzer, mit unbegrenztem Vorrat, unbegrenztem Platz und unbegrenztem Geld.
  # Gross- und Kleinschreibung sind gleich - "bund" wirkt wie "Bund".
  #
  # Anlegen darf das nur, wer das Recht freimarken.shop.bund hat. Das ist ein eigenes
  # Recht und nicht das Teamrecht freimarken.bauen.ueberall: Wer einen Bundshop anlegt,
  # legt einen Preis des Servers fest, und das ist eine andere Vollmacht als die, einen
  # Block auf fremdem Grund zu setzen.
  #
  # LEER lassen heisst: Bundshops sind ueber ein Schild nicht anzulegen. Das ist erlaubt.
  # Hoechstens 15 Zeichen - laenger liesse sich das Wort in eine Schildzeile gar nicht
  # tippen, und die Einstellung wirkte nie.
  bundshop-wort: Bund

  # Wie viele Shops EINE Seite von /shop liste zeigt. Erlaubt ist 1 bis 100.
  #
  # Zehn, weil der Chat etwa zehn Zeilen zeigt, ohne dass der Kopf der Liste
  #   weggescrollt ist - wer den Kopf nicht mehr sieht, weiss nicht, welche Seite er
  #   liest. Dieselbe Zahl und derselbe Grund wie bei blockbuch.zeilen-je-abfrage.
  #
  # Das ist eine SEITENGROESSE und kein Schnitt: Wer mehr Laeden hat, blaettert mit
  #   /shop liste 2 weiter. Darum gibt es hier auch kein "unbegrenzt" - der Chat ist
  #   kein Anzeigemittel fuer hundert Zeilen.
  #
  # Eine 0 ist KEINE Abschaltung, sondern eine Klage: Ein Befehl, der stumm nichts
  #   mehr zeigt, sieht aus wie ein kaputter Server. Wer die Liste nicht will, nimmt
  #   das Recht freimarken.shop.
  zeilen-je-seite: 10
# Reisen zwischen den Welten (Plan 4.3): zwei Wege, kein dritter - die Tore am
# Bundesmarkt und /warp <name>. Selbstgebaute Nether- und Endportale werden gesperrt:
# Sie fuehren nicht in freimarken:nether, sondern in die Haupt-Nether des Servers, eine
# Welt ohne Grenze, ohne Schutz und ohne Vorgenerierung.
reisen:
  # Die Welt, in der die Tore stehen - und in der ein neuer Spieler ankommt. Plan
  # Abschnitt 2: "Hauptstadt (Welt mit Spawn) = Altfurt".
  #
  # Diese Zeile setzt die Respawn-Welt des Servers. Der Eintrag wird dauerhaft in die
  # level.dat der Hauptwelt geschrieben; das Protokoll nennt beim Start die vorige Welt,
  # damit sie zurueckzustellen ist. Leer heisst: nicht anfassen.
  #
  # NUR BEIM START GELESEN - /freimarken neuladen aendert daran nichts. Ein zweites Lesen
  # aenderte nicht ein Feld, sondern eine Weltdatei; ausserdem haengen Torwache,
  # Ankunftswache und das Warpverzeichnis daran. Weltnamen sind nach Plan 12a.6 ohnehin
  # nur lesbar.
  ankunftswelt: altfurt

# Das Blockbuch (Moderation): wer wann wo was getan hat.
#
# NUR BEIM START GELESEN - /freimarken neuladen aendert hier nichts. Was aufgeschrieben
# wird, aendert sich im Betrieb nicht sinnvoll: Ein Umschalten mitten im Lauf
# hinterliesse ein Buch, dessen Luecken niemand mehr erklaeren kann. Das Protokoll nennt
# beim Start, was WIRKLICH gilt - je Welt eine Zeile.
#
# ES GIBT HIER KEIN true UND KEIN false, und das ist kein Versehen: Bukkit liest jedes
# andere Wort stumm als false. Aus einem "benutzen: ja" wuerde ein abgeschaltetes
# Blockbuch ohne eine Zeile Klage, und du suchtest Monate spaeter nach Zeilen, die es nie
# gab. Darum stehen hier LISTEN VON NAMEN - eine unbekannte Zeile wird beklagt, mit dem
# Namen, den du getippt hast.
blockbuch:
  # Wie lange eine Zeile bleibt, in Tagen. Erlaubt ist 1 bis 3650.
  #
  # Dreissig Tage sind lang genug fuer die Moderation - eine Beschwerde kommt selten am
  # selben Tag - und kurz genug, dass die Tabelle nicht unbegrenzt waechst. Aufgeraeumt
  # wird am taeglichen Lauf, zusammen mit der Ladenmiete.
  aufbewahrung-tage: 30

  # Wie viele Zeilen EIN Aufraeumschlag hoechstens loescht. Erlaubt ist 1 bis 20000.
  #
  # Begrenzt, weil das Aufraeumen im Hauptfaden des Spielservers laeuft, auf der einen
  # Datenbankverbindung. Ein unbegrenztes Loeschen auf der groessten Tabelle dieses
  # Plugins haelt den Server an - und zwar genau am ersten faelligen Tageswechsel, wenn
  # Wochen auf einmal weggehen. Was ein Schlag nicht schafft, nimmt der naechste; die
  # Zeilen laufen nicht weg.
  je-aufraeumen: 500

  # DIE VORGABE: Was eine Welt aufschreibt, die unten keine eigene Liste hat.
  #
  # Erlaubt sind vier Namen:
  #   setzen      ein Block wurde gesetzt
  #   abbauen     ein Block wurde abgebaut
  #   benutzen    ein Block wurde benutzt - Truhe, Ofen, Trichter (siehe
  #               benutzbare-bloecke weiter unten)
  #   abgewiesen  AUCH die misslungenen Versuche. Das ist keine Tat, sondern ihr Ausgang:
  #               Das Wort wirkt QUER zu den drei Taten und schaltet keine davon zu. Ein
  #               Dutzend abgewiesener Versuche an einer fremden Parzelle in zwei Minuten
  #               ist der Fund, nach dem du suchst - und es ist einer, bei dem gar nichts
  #               passiert ist.
  #
  # Eine LEERE Liste [] heisst: nichts aufschreiben. Das ist der Weg, das Blockbuch
  # abzuschalten; es wird dann auch kein Zuhoerer angemeldet.
  #
  # benutzen fehlt hier mit Absicht - es ist die mit Abstand haeufigste Tat. Wer eine
  # Minute durch sein Haus laeuft, oeffnet ein Dutzend Tueren, und niemand fragt je
  # danach. Gib es der Welt, in der die Frage "wer war in meiner Truhe" wirklich
  # gestellt wird.
  taten: [setzen, abbauen, abgewiesen]

  # Welche Bloecke die Tat "benutzen" ueberhaupt aufschreibt.
  #
  # Ohne diese Liste schriebe jeder Rechtsklick auf Erde eine Zeile - und wer mit einem
  # Block in der Hand baut, erzeugt beides: einen Rechtsklick UND eine Setzung, also
  # zwei Zeilen fuer eine Tat. Die Vorgabe nennt, was man abschliesst.
  #
  # Nackte Namen, ohne minecraft: davor. Ein unbekannter Name wird beklagt. Fuer setzen
  # und abbauen gilt diese Liste NICHT - wer ein Haus abreisst, reisst Bretter ab, keine
  # Truhen.
  #
  # Eine leere Liste [] schaltet "benutzen" ganz ab, auch wenn es oben eingetragen ist;
  # das Protokoll sagt es dann beim Start.
  benutzbare-bloecke:
    - chest
    - trapped_chest
    - barrel
    - shulker_box
    - ender_chest
    - hopper
    - dispenser
    - dropper
    - furnace
    - blast_furnace
    - smoker
    - brewing_stand
    - beacon
    - lectern
    - decorated_pot

  # Wie weit der Blick von /freimarken blockbuch reicht, in Bloecken. Erlaubt ist 1 bis
  # 100.
  #
  # Etwas mehr als die Reichweite, in der ein Spieler bauen kann: Ein Moderator steht
  # oft nicht genau an dem Loch, das er untersucht, und soll nicht erst heranlaufen
  # muessen. Ueber hundert trifft der Strahl irgendetwas, und niemand wuesste mehr,
  # welchen Block er gefragt hat - darum die Grenze.
  #
  # Siehst du keinen Block an, sagt der Befehl es und nennt diese Zahl. Nach einem
  # Spieler fragt /freimarken blockbuch spieler <name> - das geht auch von der Konsole.
  reichweite: 6

  # Wie viele Zeilen EINE Abfrage hoechstens zeigt. Erlaubt ist 1 bis 100.
  #
  # Zehn ist, was der Chat auf einen Blick zeigt. Mehr hiesse, dass die ersten Zeilen
  # nach oben herauslaufen - und das sind bei "neueste zuerst" genau die, auf die es
  # ankommt. Die Ueberschrift nennt die Zahl der GEZEIGTEN Zeilen, nicht die aller
  # vorhandenen.
  zeilen-je-abfrage: 10

  # JE WELT eine eigene Liste - sie gilt STATT der Vorgabe und nicht zusaetzlich.
  #
  # Eine Welt, die hier nicht steht, folgt der Vorgabe oben. Das ist Absicht: Eine neu
  # gebaute Welt soll nicht stumm ohne Buch dastehen. Eine Welt, die es laut welten:
  # nicht gibt, wird beklagt - eine Auswahl fuer eine Welt, die es nicht gibt, ist eine
  # Zeile, die nie wirkt.
  welten:
    # Die Marktstadt ist die eine Welt, in der die Truhenfrage wirklich gestellt wird:
    # Hier stehen die Laeden, hier liegt fremde Ware, und hier ist "wer war in meiner
    # Kiste" der ganze Zweck des Buchs.
    marktstadt: [setzen, abbauen, benutzen, abgewiesen]
    # Der Nether und das End sind ausgenommen: Dort baut niemand dauerhaft, es gibt
    # keine Parzellen, und eine Zeile je abgebautem Netherrack ist die groesste
    # Schreiblast fuer die geringste Frage.
    nether: []
    end: []

welten:
  # NUR BEIM START GELESEN - /freimarken neuladen aendert hier nichts. Welten entstehen
  # einmal, eine bestehende behaelt ihre Umgebung, und die Zahlenbereiche von
  # /freimarken parzelle stecken im Befehlsbaum, der genau einmal angemeldet wird.
  #
  # Eine Welt je Eintrag - die Reihenfolge hier ist die Reihenfolge beim Anlegen.
  #
  # art:      raster      das Parzellenraster der Marktstadt
  #           gewoehnlich gewoehnliches Minecraft: Gelaende, Erze, Baeume, Tiere
  #           leer        Leere, ohne einen einzigen Block
  #           flach       Superflach - eine Grasebene ohne Berge, Hoehlen und
  #                       Wasser [09.11.2026]. Fuer Welten, in denen das Gelaende
  #                       STOERT: Jeder von Hand eingemessene Quader - die sieben
  #                       Tore, die Ladeneinheiten - braucht ebenen Boden, und
  #                       gewoehnliches Gelaende gibt ihn nur mit Glueck. Ein
  #                       gewuerfelter Startwert gab am 02.11. eine rote Wueste mit
  #                       2 Bloecken Spanne, ein anderer am 09.11. Bergland mit 29.
  #                       Auf einer flachen Welt ist die Frage nicht da. Der
  #                       startwert wirkt hier nicht - eine Ebene ist eine Ebene.
  #           Pflichtangabe. Eine fehlende Art wird NICHT geraten: "gewoehnlich" als
  #           Vorgabe wuerde aus der Marktstadt beim naechsten Start eine Welt mit
  #           Huegeln und Baeumen machen, mitten in den bezahlten Parzellen.
  #           raster traegt allein marktstadt, und marktstadt traegt nichts anderes.
  #           Steht dort etwas anderes, startet Freimarken nicht - das ist Absicht: So
  #           wird die Marktstadt nicht als falsche Welt angelegt. Und eine ZWEITE
  #           Rasterwelt bekaeme Mauern und Wege, aber kein Besitzbuch und keinen
  #           Schutz; dort duerfte jeder ueberall bauen.
  # umgebung: normal (Vorgabe), nether, ende
  #           Nur beim Anlegen. Eine bestehende Welt behaelt ihre Umgebung; eine
  #           geaenderte Zeile landet nur im Protokoll.
  # kante:    Wunschkante der Weltgrenze in Bloecken, eine ganze Zahl von 32 bis
  #           59999968. Fehlt sie oder ist sie 0, wird keine gesetzt - ausser bei der
  #           Marktstadt, die ohne Grenze keine Parzellennummern hat und dann auf den
  #           Planwert 3000 zurueckfaellt. Die Grenze waechst nur nach aussen, nie nach
  #           innen. Ein Punkt trennt hier keine Tausender: 6.000 liest YAML als 6.
  # spielmodus: ueberleben (Vorgabe), abenteuer, kreativ, zuschauer
  #           Wird beim Betreten der Welt gesetzt - Minecraft kennt keinen Spielmodus je
  #           Welt. Wer das Recht freimarken.spielmodus.frei hat, wird nie umgestellt;
  #           ohne diese Ausnahme wuerde ein Baumeister im Kreativmodus beim Betreten
  #           Altfurts mitten im Bauen heruntergestuft.
  # tor:      Der Quader am Bundesmarkt, der HIERHER fuehrt - zwei Ecken, je drei ganze
  #           Zahlen, beide eingeschlossen:
  #               tor:
  #                 von: [58, 71, 0]
  #                 bis: [60, 73, 0]
  #           Das Tor steht am Eintrag der ZIELwelt und nicht in einer eigenen Liste:
  #           So bleibt eine neue Welt ein Eintrag und ist nicht ein Eintrag plus ein
  #           vergessenes Tor. Geprueft wird beim Start, dass kein Tor in der
  #           Ankunftswelt selbst steht, keines ausserhalb ihrer Grenze liegt und keine
  #           zwei Tore sich Bloecke teilen - sonst entschiede die Reihenfolge der
  #           Eintraege, wohin ein Spieler reist.
  #
  # Nicht enthalten: wolkenwerder. Es waere eine Welt aus Leere, in der jeder Ankommende
  # faellt - die Startinsel und die Skyblock-Mechaniken kommen mit Schritt 11.
  #
  # Neue Welten kommen beim Update NICHT von selbst in diese Datei - eine vorhandene
  # config.yml wird nie ueberschrieben. Was hier fehlt, nennt das Protokoll beim Start
  # einzeln; der Block muss dann von Hand hierher.
  marktstadt:
    art: raster

    # Das Tor steht am Bundesmarkt in Altfurt und fuehrt HIERHER. Die Reihe ist am
    # 02.11.2026 eingemessen: flachstes trockenes 32x32 um den Ursprung ist 56/-4 bis
    # 87/27, Boden y 70..72, durchgehend red_sand. Die Tore stehen auf z=0, je drei
    # Bloecke breit mit einem Block Abstand; y 71..73 deckt jeden Stand in der Reihe,
    # denn der Boden wechselt dort zwischen 70 und 71.
    #
    # Das Mauerwerk ist von Hand zu bauen (Plan 2.1 nennt die Gebaeude). Bis dahin ist
    # das Tor eine unsichtbare Tuer - das Protokoll sagt beim Start, welche Tore noch
    # ohne Bauwerk sind.
    tor:
      von: [58, 71, 0]
      bis: [60, 73, 0]
    # Wunschkante der Weltgrenze in Bloecken; Plan Abschnitt 4 nennt 3.000.
    #
    # Gerechnet wird daraus ABGERUNDET auf ganze Rasterzellen (64 Parzelle + 7 Weg = 71)
    # und auf eine gerade Zellenzahl: Aus 3.000 werden 42 Parzellen je Achse mit den
    # Nummern -21 bis 20, zusammen 1.764. Die Grenze wird dann 2.989 Bloecke breit
    # (42 x 71 + 7) und liegt um -3,5/-3,5 - genau auf der Aussenkante des umlaufenden
    # Mauer-Weg-Rings. So kann eine Grenze nie mitten durch eine Parzelle laufen.
    # Ohne Rest gehen Kanten der Form 142 x n + 7 auf: 2.989, 3.131, 4.267.
    #
    # GROESSER geht jederzeit, KLEINER NICHT: Beim Start gilt immer der groessere Wert aus
    # dieser Zeile und der Grenze, die schon in der Welt steht. Ein kleinerer Wert hier
    # landet nur im Protokoll. Eine bezahlte Parzelle darf nie vor die Tuer geraten.
    kante: 3000

    # Nur noetig, wenn die Kante auf mehr als das Doppelte steigen soll - weil Kleiner
    # nicht geht, ist auch ein zu grosser Wert nicht zurueckzunehmen. Hier gehoert dann
    # genau der Text hin, den das Protokoll beim letzten Start genannt hat, etwa
    # "2989 -> 8000". Steht etwas anderes, bleibt die Grenze, die in der Welt steht.
    sprung-bestaetigt: ""

  # Gebaut, nicht gewachsen: Hier stehen Bundesmarkt und die Gebaeude aus Plan 2.1.
  # Spielmodus Abenteuer setzt Schritt 3, Teil C - heute ist es eine gewoehnliche Welt.
  # DER STARTWERT DES GELAENDES - und das ist die Zeile, die ein Einmessen
  #   dauerhaft macht [eingefuehrt 09.11.2026]. Jeder von Hand eingemessene Quader
  #   (die sieben Tore unten, die Ladeneinheiten weiter oben) ist eine Zahl in
  #   dieser Datei, und das Gelaende ist es nicht. OHNE Startwert gehoeren diese
  #   Zahlen zu genau EINER zufaellig erzeugten Welt: Wird sie geloescht, sind sie
  #   wertlos, und niemand kann sie nachmessen. Am 09.11.2026 war genau das der
  #   Fall - die am 02.11. eingemessene Welt war weg, und mit ihr die Grundlage der
  #   Torquader.
  # WIRKT NUR BEIM ANLEGEN. Eine Welt, die schon da ist, behaelt ihren Startwert -
  #   genau wie ihre Umgebung. Der Startbericht klagt laut, wenn beides
  #   auseinandergeht; wer das Gelaende dieser Zeile wirklich will, muss die Welt
  #   loeschen und verliert alles Gebaute darin.
  # JE WELT EIN ANDERER WERT. Gleicher Startwert und gleiche Umgebung heisst in
  #   Minecraft dasselbe Gelaende, Block fuer Block - zwei Welten waeren dann zwei
  #   Namen fuer eine Landschaft. Die Liste klagt darueber.
  # DIE ZAHLEN SIND BELIEBIG GEWAEHLT und duerfen geaendert werden, solange die Welt
  #   noch nicht existiert. Danach nicht mehr - siehe oben. Eine ganze Zahl, auch
  #   negativ; 0 ist erlaubt und ist ein Startwert wie jeder andere. KEIN Wort:
  #   Minecraft rechnet im Menue Woerter selbst in Zahlen um, hier wird das nicht
  #   nachgebaut - weicht die Rechnung eines Tages ab, liegt jeder eingemessene
  #   Quader daneben. Und kein Punkt als Tausendertrenner: YAML liest 1.000 als 1.0.
  # Die Marktstadt hat KEINEN: Ihr Gelaende kommt aus dem Parzellengenerator, ein
  #   Startwert waere dort eine Zahl, die nie wirkt.
  altfurt:
    art: gewoehnlich
    startwert: 110926001
    kante: 800
    # Abenteuer in ganz Altfurt [entschieden 02.11.2026]. Altfurt wird nie
    # zurueckgesetzt - solange hier Ueberleben gilt, kann jeder Besucher im Rohbau
