# Freimarken - Einstellungen
#
# Diese Datei liegt auf dem Server unter plugins/Freimarken/config.yml. Dort stehen
# Zugangsdaten - sie gehoert nicht ins Git-Verzeichnis und nicht in ein Backup, das
# weitergegeben wird.

datenbank:
  # Leer heisst: Es wird nichts gespeichert. Parzellen und Guthaben gelten dann nur bis zum
  # naechsten Neustart. Gut zum Ausprobieren, nichts fuer den Betrieb.
  #
  # Beispiel: jdbc:mariadb://192.168.178.88:3306/freimarken
  # Die Zugangsdaten legt skripte/mariadb_einrichten.bat an und schreibt sie nach
  # data/freimarken/datenbank.properties - von dort hierher uebertragen.
  #
  # NUR BEIM START GELESEN - /freimarken neuladen aendert daran nichts. An der Verbindung
  # haengen Lager, Kasse und Besitzbuch; sie im Betrieb zu tauschen hiesse, die halbe
  # Ablage auszuwechseln. Eine nachgetragene Datenbank greift erst nach einem Neustart.
  # Nach Plan 12a.6 gehoeren diese drei Zeilen auch nicht ins Dashboard: Zugangsdaten
  # haben in einem weitergegebenen Backup nichts zu suchen.
  url: ""
  benutzer: ""
  passwort: ""

# Was Grund und Boden kosten. Plan 12a.6: "Alles, was sich sinnvoll anpassen laesst, ist
# im Dashboard anpassbar." Diese Datei ist die Zwischenstufe dorthin - was dort spaeter
# als Feld mit Begruendung steht, steht hier als Kommentar.
#
# Drei Schranken liegen auf jeder Zahl hier, und alle drei haben denselben Grund: Ein zu
# billiger Preis macht Mark, und die liegen binnen Minuten auf vielen Konten -
# zurueckzuholen nur mit einer Ruecksicherung des ganzen Servers.
#
#   1. Gelesen wird ROH und am Typ geprueft. Ein Punkt trennt in YAML keine Tausender:
#      aus 25.000 wird 25. Anfuehrungszeichen machen aus einer Zahl Text, und daraus
#      liest Bukkit stillschweigend eine 0.
#   2. Der Bereich. Er ist gerechnet und nicht geschaetzt: Der Preis der letzten Stufe
#      ist grundpreis mal 2 hoch 40, und das muss in eine 64-Bit-Zahl passen. Darueber
#      waere der Preis NEGATIV, also eine Gutschrift beim Kauf.
#   3. Mehr als Faktor 2 gegenueber dem ausgelieferten Wert braucht eine zweite
#      Bestaetigung unter sprung-bestaetigt. Verglichen wird immer mit dem AUSGELIEFERTEN
#      Wert und nie mit dem laufenden - sonst verlangte dieselbe Datei nach einem
#      Neustart einen anderen Text, und ein eingetragener Wert gaelte ploetzlich nicht
#      mehr.
#
# Vor allen dreien steht die Datei selbst: Laesst sie sich nicht lesen - ein Tabulator als
# Einrueckung, ein offenes Anfuehrungszeichen -, dann liefert Bukkit stillschweigend die
# ausgelieferten Werte. Ein Neuladen uebernimmt dann NICHTS, und beim Start bleibt
# Freimarken aus; die Meldung nennt die Zeile. Lieber kein Parzellensystem als ein falsch
# bepreistes.
#
# Was keine dieser Schranken faengt, ist der Wert, der im Bereich liegt und trotzdem
# falsch ist - 2.500 statt 25.000. Deshalb steht bei jedem Start und jedem Neuladen die
# Staffel im Klartext im Protokoll: "2. Parzelle 25000 - 3. 50000 - 4. 100000". Wer dort
# "2. Parzelle 25" liest, sieht den Vertipper, den keine Zahlengrenze sieht.
wirtschaft:
  parzelle:
    # Was die ZWEITE Parzelle kostet; jede weitere verdoppelt. Die erste ist immer
    # gratis - wer nur bauen will, zahlt nie etwas.
    #
    # Ganze Zahl von 0 bis 8388607 Mark. 0 heisst: jede Parzelle gratis, und die Bremse
    # gegen Flaechenhorten ist aus. Das ist erlaubt, braucht aber die Bestaetigung
    # unten, weil es der grosse Sprung nach unten ist.
    #
    # Mit 25.000 kostet die sechste Parzelle genau 400.000 Mark - so viel wie eine
    # Freistadt. Ab der siebten ist Horten teurer als Gruenden, und genau das soll die
    # Staffel bewirken (Plan 8).
    grundpreis: 25000

    # Gebuehr je Feld der NEUEN Gruppe beim Zusammenlegen: Vier Felder kosten viermal
    # diesen Betrag. Eine der wenigen Senken, die ausschliesslich diejenigen zahlen, die
    # ohnehin viel besitzen.
    #
    # Ganze Zahl von 0 bis 4294967298 Mark je Feld.
    zusammenlegung-je-feld: 10000

  # Die zweite Bestaetigung fuer einen Sprung ueber den Faktor 2. Hier gehoert genau der
  # Text hin, den das Protokoll beim letzten Start genannt hat, etwa "25000 -> 100000".
  # Steht etwas anderes, gilt der ausgelieferte Wert - nicht der getippte.
  #
  # Die Bestaetigung gilt nur fuer genau diesen Sprung: Wer sie eintraegt und spaeter eine
  # andere Zahl setzt, wird erneut gefragt. Ein Dauerfreibrief waere keine Rueckfrage.
  sprung-bestaetigt:
    grundpreis: ""
    zusammenlegung-je-feld: ""
    startguthaben: ""
    wechselgebuehr: ""

parzellen:
  # Wie viele Parzellen ein Spieler ohne besonderes Recht haben darf.
  # Mehr erlaubt das Recht freimarken.parzellen.<zahl>, etwa freimarken.parzellen.8.
  # Die hoechste Zahl gewinnt, dieser Wert ist die Untergrenze.
  #
  # Ganze Zahl ab 1. Eine 0 hiesse, niemand darf eine Parzelle - und das sieht in einer
  # Einstellungsdatei aus wie ein Tippfehler, weil es einer ist. Wer das Parzellensystem
  # abschalten will, nimmt das Recht weg. /freimarken neuladen uebernimmt diesen Wert.
  hoechstzahl: 4

  # Wie viele Felder eine zusammengelegte Gruppe haben darf. Mehr erlaubt das Recht
  # freimarken.gruppe.<zahl>, nach derselben Regel wie oben.
  #
  # Das ist eine eigene Grenze und nicht dieselbe wie hoechstzahl: Wie viele Parzellen
  # jemand besitzt, bremst das Flaechenhorten; wie viele davon er zu EINEM Grundstueck
  # verbinden darf, entscheidet, wie gross ein einzelnes Bauwerk werden kann. Vier Felder
  # im Quadrat sind 135 x 135 Bloecke.
  #
  # Ganze Zahl ab 1, wie oben. /freimarken neuladen uebernimmt diesen Wert.
  gruppe-hoechstzahl: 4

hinweise:
  # Eine Zeile, die der Spieler zusaetzlich sieht, wenn sein RANG die Grenze setzt: beim
  # Kauf einer weiteren Parzelle, beim Zusammenlegen und auf einer freien Parzelle, die er
  # nicht mehr nehmen darf. Was der Rang erlaubt, steht schon in der Zeile davor - hier
  # gehoert hin, wie es auf DIESEM Server weitergeht.
  #
  # Beispiele:
  #   "Mehr Parzellen gibt es mit dem Rang Buerger - rund 40 Spielstunden und eine
  #    bebaute Parzelle."
  #   "Mehr Parzellen gibt es mit dem Rang Buerger - oder als Zuschlag obendrauf mit
  #    einer Mitgliedschaft."
  #
  # Versprich hier nichts, was es nicht gibt - weder einen Befehl noch einen Weg. Der Satz
  # erscheint genau in dem Augenblick, in dem der Spieler abgewiesen wurde; ein Hinweis
  # auf einen Shop oder einen /rang-Befehl, den es nicht gibt, ist dann aergerlicher als
  # gar keiner.
  #
  # Und er darf den Raengen nicht widersprechen. Nach Plan 9 haengt die Parzellengrenze an
  # den drei erspielbaren Raengen (Reisender, Siedler, Buerger); die beiden kaufbaren
  # (Foerderer, Stifter) geben einen ZUSCHLAG darauf: +2 bzw. +4 Parzellen und +1 bzw. +2
  # Felder je Grundstueck, ueber die Rechte freimarken.extra.parzellen.<n> und
  # freimarken.extra.gruppe.<n>.
  #
  # Der Zuschlag ersetzt den erspielten Rang nicht, er kommt obendrauf - wer am ersten Tag
  # zahlt, hat 1+2 Parzellen und nicht 4. Wirb hier also mit dem Zuschlag und nicht mit
  # "kauf dir mehr Parzellen": Sonst erwartet ein Neuling, dass Geld die vierzig Stunden
  # bis Buerger ersetzt, und das tut es nicht.
  #
  # Den Zuschlag gibt es nur mit einer Mitgliedschaft, nicht fuer Goldmark (Plan 8.4).
  #
  # Leer lassen heisst: kein Hinweis. /freimarken neuladen uebernimmt diese Zeile.
  rang-werbung: "Mehr erlaubt ein hoeherer Rang."

kasse:
  # Was ein Spieler beim ersten Mal an Mark mitbringt. Die erste Parzelle ist ohnehin
  # gratis; dieser Betrag entscheidet, wie weit es ohne Verdienen reicht.
  #
  # Ganze Zahl ab 0 Mark; mehr als Faktor 2 gegenueber 50.000 braucht die Bestaetigung
  # unter wirtschaft.sprung-bestaetigt.startguthaben.
  #
  # NUR BEIM START GELESEN - /freimarken neuladen vergleicht und meldet, uebernimmt aber
  # nicht. Der Grund: Fuer ein noch nicht eroeffnetes Konto geben die Kassen diesen Wert
  # als Guthaben zurueck. Ein neuer Wert im Betrieb aenderte also rueckwirkend, was jeder
  # Spieler mitbringt, der noch nie gebucht hat - genau der Fehler, den die
  # Eroeffnungsbuchung am 02.11.2026 behoben hat. Der Betrag friert im Augenblick der
  # Eroeffnung ein (Beitritt oder erste Buchung, je was zuerst kommt).
  startguthaben: 50000

# DIE BERUFE - was ein Spieler waehlen darf, was ein Wechsel kostet und was ihn bremst.
#
# Ein Spieler haelt zwei Grundberufe und eine Spezialisierung. Das WAEHLEN ist gratis,
# solange ein Platz frei ist - ein Neuling soll seine ersten drei Berufe nicht bezahlen
# muessen. Bezahlt wird das AUFGEBEN, und danach laeuft eine Sperrfrist. Andersherum
# waere beides umgehbar: erst aufgeben, einen Tag warten, dann gratis etwas anderes
# waehlen.
#
# Was ein Beruf EINBRINGT, steht noch nirgends - das kommt mit seinem eigenen Bauschritt.
# Heute wirkt allein die Wahl.
#
# DIE WORTE zu den Berufen stehen NICHT hier, sondern in der sprache.yml unter
# beruf.name.<schluessel>. Worte gehoeren in die Sprachdatei; hier stehen die Schluessel,
# und die stehen in der Datenbank.
berufe:
  # Was das Aufgeben eines Berufs kostet.
  #
  # Ganze Zahl von 0 bis 4611686018427387903 Mark. 0 heisst: Aufgeben ist gratis, und von
  # den zwei Bremsen bleibt allein die Sperrfrist. Mehr als Faktor 2 gegenueber 5.000
  # braucht die Bestaetigung unter wirtschaft.sprung-bestaetigt.wechselgebuehr.
  #
  # Mit 5.000 kostet ein Wechsel etwa zwei Spielstunden Arbeit - zu teuer fuers Umschalten
  # zwischen zwei Aufgaben, zu billig, um jemanden auf einem Beruf festzuhalten, der ihm
  # nicht gefaellt.
  #
  # /freimarken neuladen uebernimmt diesen Wert.
  wechselgebuehr: 5000

  # Wie lange nach dem Aufgeben kein weiterer Zug geht - weder aufgeben noch waehlen.
  #
  # Ganze Zahl von 0 bis 720 Stunden, und zwar in GANZEN Stunden. 0 heisst ausdruecklich:
  # keine Sperrfrist, der ehrliche Ausschalter fuer die Regel; dann bremst allein die
  # Gebuehr. Gemessen wird ab dem Augenblick des Aufgebens, in UTC. Ein Neustart
  # verlaengert und verkuerzt sie nicht: In der Datenbank steht der Zeitpunkt und kein
  # laufender Zaehler.
  #
  # Die Frist ist die wirksamere der zwei Bremsen. Gegen eine Gebuehr hilft Geld, gegen
  # eine Frist hilft nichts. Mit 24 Stunden kann jeder einmal am Tag umdenken.
  #
  # /freimarken neuladen uebernimmt diesen Wert. Eine kuerzere Frist gilt sofort auch fuer
  # einen Spieler, der schon wartet - gerechnet wird bei jedem Versuch neu, und es steht
  # dafuer kein Zeitgeber.
  sperrfrist-stunden: 24

  # Wie viele Grundberufe und wie viele Spezialisierungen ein Spieler gleichzeitig halten
  # darf.
  #
  # hoechstens-grundberufe ist eine ganze Zahl ab 1. Keine 0: Sie hiesse, niemand darf
  # einen Beruf - und das sieht in einer Einstellungsdatei aus wie ein Tippfehler, weil es
  # einer ist. Wer die Berufe abschalten will, nimmt das Recht freimarken.beruf weg.
  #
  # hoechstens-spezialisierungen darf 0 sein und heisst dann: keine Spezialisierungen.
  # Das ist ein echter Betriebsfall - dann braucht niemand das Recht
  # freimarken.beruf.spezialisierung.
  #
  # Keine der beiden Zahlen darf groesser sein, als die Liste unten hergibt: Wer drei
  # Grundberufe erlaubt und nur zwei eintraegt, verspricht einen Platz, den niemand
  # fuellen kann. Das wird abgewiesen, und die Klage nennt beide Zahlen.
  #
  # SPEZIALISIERUNGEN BRAUCHEN EIN RECHT: freimarken.beruf.spezialisierung. Ein Recht und
  # keine Rangzahl hier - Raenge sind auf diesem Server Rechte, und eine zweite Quelle
  # dafuer antwortete eines Tages anders.
  #
  # /freimarken neuladen uebernimmt beide Werte. Ein kleinerer Wert nimmt niemandem einen
  # Beruf weg, den er schon hat - er verhindert nur den naechsten.
  hoechstens-grundberufe: 2
  hoechstens-spezialisierungen: 1

  liste:
    # NUR BEIM START GELESEN - /freimarken neuladen aendert hier nichts. An dieser Liste
    # haengen die Vervollstaendigung von /beruf, die im Befehlsbaum steckt und genau
    # einmal angemeldet wird, und die Zuordnung Grundberuf/Spezialisierung, mit der jede
    # Berufszeile in der Datenbank gelesen wird.
    #
    # EIN EINTRAG JE GRUNDBERUF - die Reihenfolge hier ist die Reihenfolge in /beruf liste
    # und bei der Vervollstaendigung. Alphabetisch sortiert waere eine Entscheidung, die
    # dir niemand gesagt hat.
    #
    # spezialisierungen: Die Berufe, die diesen Grundberuf voraussetzen, als Liste in
    #           eckigen Klammern. Leere Klammern sind erlaubt und heissen: Zu diesem
    #           Grundberuf gibt es keine Spezialisierung. Die Zeile MUSS dann trotzdem da
    #           sein - ein Eintrag ganz ohne Inhalt ("bergmann:" und nichts darunter) wird
    #           beim Laden der Datei weggeworfen, und der Beruf fehlt dann stumm. Welche
    #           Berufe wirklich gelten, nennt das Protokoll beim Start in einer Zeile.
    #           Eine ZWEITE Spezialisierung je Grundberuf ist ein Eintrag und kein Umbau -
    #           der Spieler waehlt dann eine von beiden.
    #           Die Liste steht am Grundberuf und nicht als eigener Abschnitt: So ist ein
    #           neuer Beruf ein Eintrag und nicht ein Eintrag plus eine vergessene
    #           Zuordnung. Dieselbe Entscheidung wie beim tor: der Welten unten.
    #           Steht derselbe Name unter zwei Grundberufen oder traegt er den Namen eines
    #           Grundberufs, fallen ALLE Nennungen weg - sonst entschiede die Reihenfolge
    #           der Eintraege, was er voraussetzt. Die Klage nennt jede Stelle.
    #           Eine Spezialisierung auf eine Spezialisierung gibt es nicht: Es sind genau
    #           zwei Rollen, und ein Beruf in der Mitte zaehlte in beiden Platztoepfen.
    #
    # DER SCHLUESSEL darf nur Kleinbuchstaben, Ziffern und Bindestrich tragen und muss mit
    # einem Buchstaben beginnen; hoechstens 32 Zeichen. KEIN Punkt und kein Unterstrich,
    # anders als bei einem Weltnamen: Der Punkt ist in der sprache.yml der Trenner, und
    # beruf.name.berg.mann waere dort eine Ebene tiefer statt ein Name. Hier geprueft und
    # nicht erst beim Gebrauch: Der Schluessel steht in einer Datenbankspalte, und ein zu
    # langer Name wuerde dort stumm abgeschnitten - zwei Berufe fielen zusammen, und ein
    # Spieler verloere einen.
    #
    # DAS WORT, das ein Spieler liest, steht in der sprache.yml unter
    # beruf.name.<schluessel>. Wer hier einen Schluessel hinzufuegt, braucht dort eine
    # Zeile dazu, sonst startet Freimarken nicht. Lieber ein verweigerter Start als ein
    # Zunfthaus, in dem "bergmann" steht.
    #
    # Neue Berufe kommen beim Update NICHT von selbst in diese Datei - eine vorhandene
    # config.yml wird nie ueberschrieben. Was hier fehlt, nennt das Protokoll beim Start.
    # Verdient wird an: Erze, Stein, Tiefe - der Steinmetz zusaetzlich an veredelten
    # Bausteinen und Statuen.
    bergmann:
      spezialisierungen: [steinmetz]
    # Holz und Aufforstung - der Zimmermann an Balken, Tueren, Fachwerk.
    holzfaeller:
      spezialisierungen: [zimmermann]
    # Acker, Tiere, Zucht - der Mueller an Nahrung und Vorratshaltung.
    bauer:
      spezialisierungen: [mueller]
    # Fang, mit einem Bonus auf Hafenwerder - der Reeder an Seehandel und Bootsrennen.
    fischer:
      spezialisierungen: [reeder]
    # Monster und Beute - der Gerber an Leder und Ruestung.
    jaeger:
      spezialisierungen: [gerber]
    # GESETZTE Bloecke, und nur die: Ein Block zahlt nur einmal, und die Markierung dafuer
    # kommt mit ihrem eigenen Bauschritt. Der Architekt verdient an grossen Bauten und am
    # Auftragsbau.
    baumeister:
      spezialisierungen: [architekt]

# Wie Spielzeit gemessen wird und wann ein Tag endet.
#
# Gezaehlt wird Anwesenheit mit Lebenszeichen, in Sekunden, und zwar aus der Differenz
# zweier Uhrablesungen - nicht aus der Zahl der Takte. Ein verspaeteter Takt zaehlt
# deshalb richtig, und ein lahmender Server verliert nichts.
#
# In der Datenbank steht immer nur schon VERSTRICHENE Zeit und nie ein laufender
# Zeitpunkt. Darum kann kein Absturz eine offene Sitzung hinterlassen, und es gibt kein
# Aufraeumen beim Start.
#
# Gezaehlt wird erst ab dem Einbau dieser Messung. Spielstunden von davor stehen nirgends:
# Die Minecraft-Statistik waere die einzige Quelle, und die ist fuer jedes Plugin
# schreibbar, nicht an eine Welt gebunden und von einer Weltkopie verdoppelt - sie kann die
# Zusage "die Datenbank ist die Wahrheit" nicht halten. Jeder faengt bei 0 an, und die
# Anzeige sagt das.
zeit:
  # In welcher Zone ein Tag beginnt und endet - die Tagesgrenze.
  #
  # Ein Zonenname wie Europe/Berlin oder UTC, also ein Eintrag aus der Zonendatenbank.
  # Ein fester Versatz wie "UTC+2" wird abgewiesen: Er kennt keine Sommerzeit, und die
  # Tagesgrenze laege vom letzten Sonntag im Maerz an um 01:00 Ortszeit. Ein Tippfehler
  # wird ebenfalls abgewiesen und faellt nicht stumm auf die Zone des Rechners zurueck.
  #
  # Was keine Pruefung faengt, ist der Name, der gueltig und trotzdem falsch ist: UTC statt
  # Europe/Berlin verschiebt die Grenze um eine Stunde, ohne dass etwas klagt. Dagegen
  # steht die Zeile im Startprotokoll, etwa "Tagesgrenze Europe/Berlin - naechster
  # Tageswechsel 04.11.2026 00:00 Ortszeit = 03.11.2026 23:00 UTC". Wer dort bei
  # Nachmittagslicht "00:00 Ortszeit = 00:00 UTC" liest, sieht den Fehler. Am Tag einer
  # Zeitumstellung nennt dieselbe Zeile den 23- oder 25-Stunden-Tag.
  #
  # Alle Zeitstempel in der Datenbank bleiben UTC; nur der TAG wird in dieser Zone
  # gerechnet, und zwar ausschliesslich in Java. MariaDB entscheidet die Tagesgrenze nicht
  # (die Verbindung steht fest auf UTC, dort ist zwischen 00:00 und 02:00 Ortszeit noch der
  # Vortag).
  #
  # NUR BEIM START GELESEN - /freimarken neuladen vergleicht und meldet, uebernimmt aber
  # nicht. Eine neue Zone im Betrieb verschoebe die Tagesgrenze mitten am Tag: Mit dem
  # ersten Verbraucher der Grenze (Tagesbonus, Ladenmiete, Verdienstdeckel) wuerde derselbe
  # Tag dann zweimal abgerechnet oder fiele aus.
  zone: "Europe/Berlin"

  # In welchem Abstand die gemessene Zeit in die Datenbank geschrieben wird.
  #
  # Ganze Zahl von 10 bis 600 Sekunden. Der Wert entscheidet NUR, wie oft geschrieben wird,
  # nicht wie viel gezaehlt wird. Er ist damit die eine Zahl, mit der Schreiblast gegen
  # Verlust bei einem Absturz getauscht wird: Bei 60 verliert ein Absturz bis zu 1 Minute je
  # anwesendem Spieler, bei 600 bis zu 10 - solange die Datenbank annimmt. Nach einem
  # Fehlschlag ist es ein Mehrfaches davon, siehe den Absatz zum Stillstand weiter unten.
  # Ein geordneter Neustart und ein Abmelden verlieren nichts - dort wird abgerechnet.
  #
  # Unter 10 Sekunden schreibt der Takt oefter, als jede Anzeige unterscheidet - zehn
  # Schreibzuege je Minute und Spieler fuer eine Zahl, die in Minuten dasteht.
  #
  # Dieser Wert bestimmt auch, wie oft der Server bei unerreichbarer Datenbank kurz stehen
  # bleibt: Ein Schreibversuch in eine tote Datenbank haelt den Hauptfaden an, bis die
  # Verbindung ihre Fristen abgewartet hat - wie lange das ist, steht in den Fristen der
  # Datenschicht und nicht hier, sonst stuende hier bald eine andere Zahl als dort.
  # Nach einem Fehlschlag laesst der Takt darum einige Schlaege lang das SCHREIBEN aus -
  # wie viele, sagt die Protokollzeile des Fehlschlags selbst. GERECHNET wird in diesen
  # Schlaegen weiter: Ihre Sekunden warten auf den naechsten erfolgreichen Schreibzug und
  # gehen auf jedem geordneten Weg mit - beim Abmelden mitten im Fenster, beim
  # Herunterfahren, beim Neustart des Plugins. Verloren ist allein der eine Takt, der
  # wirklich versucht wurde - und genau den nennt die Zeile.
  #
  # Der Preis dieses Fensters: Stuerzt der Server darin ab oder schiesst ein Waechter ihn
  # ab, sind nicht die Sekunden EINER Taktlaenge je Spieler weg, sondern auch die aller
  # ausgesetzten Schlaege davor. Darum ist ein grosser Takt zweimal teuer.
  #
  # Diese Zahl ist zugleich die Untergrenze fuer untaetig-minuten weiter unten: Die
  # Untaetigkeitsgrenze darf nicht kuerzer sein als der Takt (aufgerundet auf ganze
  # Minuten), sonst wirft ein verworfener Takt aktiv gespielte Zeit weg.
  #
  # NUR BEIM START GELESEN - und das ist kein Versehen: Der Abstand steckt im gestellten
  # Zeitgeber. Ihn beim Neuladen neu zu stellen hiesse, dass nach zwei Neuladen drei
  # Zeitgeber dieselbe Spielzeit dreifach schreiben.
  takt-sekunden: 60

  # Ab welcher Untaetigkeit ein Takt nicht mehr zaehlt.
  #
  # Ganze Zahl von 0 bis 1440 Minuten. 0 heisst ausdruecklich: Abwesenheit zaehlt mit - der
  # ehrliche Ausschalter fuer die Regel. Gemessen wird mit der Untaetigkeitsdauer, die der
  # Server selbst fuehrt.
  #
  # Die Grenze schliesst den Nachtlang im Startbildschirm aus, der ohne jede Absicht
  # passiert. Sie ist aber KEINE Sperre: Wer alle neun Minuten eine Taste drueckt, gilt
  # durchgehend als aktiv, und ein Makro oder ein beschwertes Tastenbrett erzeugt genau das.
  # Eine Hoeflichkeitsregel, keine Mauer - wer das Gegenteil braucht, braucht eine
  # Verhaltensmessung und nicht eine groessere Zahl hier.
  #
  # Die Grenze ist eine Stufe und kein Schnitt, also zugunsten des Spielers: Wer aufsteht,
  # bekommt bis zu diese 10 Minuten geschenkt. Ein Rang, der durch eine Pause verlorengeht,
  # erklaert sich niemandem. Umgekehrt wird ein verworfener Takt NICHT angespart und spaeter
  # ausgezahlt - sonst sammelte ein abwesender Spieler seine Stunden und kassierte sie mit
  # einem Schritt.
  #
  # WEIL die Grenze eine Stufe ist, darf sie nicht KUERZER sein als takt-sekunden: Bei
  # takt-sekunden: 600 und untaetig-minuten: 1 faellt der ganze Takt weg, sobald der Spieler
  # die letzte Minute stillsteht - 540 aktiv gespielte Sekunden waeren weg, ohne eine
  # Protokollzeile, und bei jedem Takt erneut. Erlaubt ist darum jede Zahl ab dem Takt in
  # ganzen Minuten aufgerundet (zu 60 s also 1, zu 90 s 2, zu 600 s 10) - oder die 0.
  #
  # Was passiert, wenn man es doch versucht: Das Paar wird abgewiesen, nicht abgeschnitten
  # und nicht geraten. Beim Start klagt das Protokoll mit dem Grund und nennt die kleinste
  # passende Zahl; es bleibt dann bei diesen 10 Minuten. Bei /freimarken neuladen wird
  # NICHTS uebernommen - auch die uebrigen Zeilen nicht, denn eine Klage haelt die ganze
  # Uebernahme an -, und die Antwort nennt denselben Grund.
  #
  # /freimarken neuladen uebernimmt diesen Wert. Er wird beim Gebrauch gefragt; es wird
  # dafuer kein Objekt gebaut und nichts angemeldet. Die eine Ausnahme: Wer takt-sekunden
  # verkuerzt und die Grenze mit ihm (etwa von 600/10 auf 60/1), hat ein stimmiges Paar in
  # der DATEI und trotzdem ein unstimmiges im BETRIEB - der laufende Takt ist noch der
  # lange, denn takt-sekunden wird nur beim Start gelesen. Dann bleibt die alte Grenze
  # stehen, und der Block "Nur beim Start gelesen" sagt es mit dem Grund; nach dem
  # naechsten Neustart gilt beides zusammen.
  untaetig-minuten: 10

# Reisen zwischen den Welten (Plan 4.3): zwei Wege, kein dritter - die Tore am
# Bundesmarkt und /warp <name>. Selbstgebaute Nether- und Endportale werden gesperrt:
# Sie fuehren nicht in freimarken:nether, sondern in die Haupt-Nether des Servers, eine
# Welt ohne Grenze, ohne Schutz und ohne Vorgenerierung.
reisen:
  # Die Welt, in der die Tore stehen - und in der ein neuer Spieler ankommt. Plan
  # Abschnitt 2: "Hauptstadt (Welt mit Spawn) = Altfurt".
  #
  # Diese Zeile setzt die Respawn-Welt des Servers. Der Eintrag wird dauerhaft in die
  # level.dat der Hauptwelt geschrieben; das Protokoll nennt beim Start die vorige Welt,
  # damit sie zurueckzustellen ist. Leer heisst: nicht anfassen.
  #
  # NUR BEIM START GELESEN - /freimarken neuladen aendert daran nichts. Ein zweites Lesen
  # aenderte nicht ein Feld, sondern eine Weltdatei; ausserdem haengen Torwache,
  # Ankunftswache und das Warpverzeichnis daran. Weltnamen sind nach Plan 12a.6 ohnehin
  # nur lesbar.
  ankunftswelt: altfurt

welten:
  # NUR BEIM START GELESEN - /freimarken neuladen aendert hier nichts. Welten entstehen
  # einmal, eine bestehende behaelt ihre Umgebung, und die Zahlenbereiche von
  # /freimarken parzelle stecken im Befehlsbaum, der genau einmal angemeldet wird.
  #
  # Eine Welt je Eintrag - die Reihenfolge hier ist die Reihenfolge beim Anlegen.
  #
  # art:      raster      das Parzellenraster der Marktstadt
  #           gewoehnlich gewoehnliches Minecraft: Gelaende, Erze, Baeume, Tiere
  #           leer        Leere, ohne einen einzigen Block
  #           Pflichtangabe. Eine fehlende Art wird NICHT geraten: "gewoehnlich" als
  #           Vorgabe wuerde aus der Marktstadt beim naechsten Start eine Welt mit
  #           Huegeln und Baeumen machen, mitten in den bezahlten Parzellen.
  #           raster traegt allein marktstadt, und marktstadt traegt nichts anderes.
  #           Steht dort etwas anderes, startet Freimarken nicht - das ist Absicht: So
  #           wird die Marktstadt nicht als falsche Welt angelegt. Und eine ZWEITE
  #           Rasterwelt bekaeme Mauern und Wege, aber kein Besitzbuch und keinen
  #           Schutz; dort duerfte jeder ueberall bauen.
  # umgebung: normal (Vorgabe), nether, ende
  #           Nur beim Anlegen. Eine bestehende Welt behaelt ihre Umgebung; eine
  #           geaenderte Zeile landet nur im Protokoll.
  # kante:    Wunschkante der Weltgrenze in Bloecken, eine ganze Zahl von 32 bis
  #           59999968. Fehlt sie oder ist sie 0, wird keine gesetzt - ausser bei der
  #           Marktstadt, die ohne Grenze keine Parzellennummern hat und dann auf den
  #           Planwert 3000 zurueckfaellt. Die Grenze waechst nur nach aussen, nie nach
  #           innen. Ein Punkt trennt hier keine Tausender: 6.000 liest YAML als 6.
  # spielmodus: ueberleben (Vorgabe), abenteuer, kreativ, zuschauer
  #           Wird beim Betreten der Welt gesetzt - Minecraft kennt keinen Spielmodus je
  #           Welt. Wer das Recht freimarken.spielmodus.frei hat, wird nie umgestellt;
  #           ohne diese Ausnahme wuerde ein Baumeister im Kreativmodus beim Betreten
  #           Altfurts mitten im Bauen heruntergestuft.
  # tor:      Der Quader am Bundesmarkt, der HIERHER fuehrt - zwei Ecken, je drei ganze
  #           Zahlen, beide eingeschlossen:
  #               tor:
  #                 von: [58, 71, 0]
  #                 bis: [60, 73, 0]
  #           Das Tor steht am Eintrag der ZIELwelt und nicht in einer eigenen Liste:
  #           So bleibt eine neue Welt ein Eintrag und ist nicht ein Eintrag plus ein
  #           vergessenes Tor. Geprueft wird beim Start, dass kein Tor in der
  #           Ankunftswelt selbst steht, keines ausserhalb ihrer Grenze liegt und keine
  #           zwei Tore sich Bloecke teilen - sonst entschiede die Reihenfolge der
  #           Eintraege, wohin ein Spieler reist.
  #
  # Nicht enthalten: wolkenwerder. Es waere eine Welt aus Leere, in der jeder Ankommende
  # faellt - die Startinsel und die Skyblock-Mechaniken kommen mit Schritt 11.
  #
  # Neue Welten kommen beim Update NICHT von selbst in diese Datei - eine vorhandene
  # config.yml wird nie ueberschrieben. Was hier fehlt, nennt das Protokoll beim Start
  # einzeln; der Block muss dann von Hand hierher.
  marktstadt:
    art: raster

    # Das Tor steht am Bundesmarkt in Altfurt und fuehrt HIERHER. Die Reihe ist am
    # 02.11.2026 eingemessen: flachstes trockenes 32x32 um den Ursprung ist 56/-4 bis
    # 87/27, Boden y 70..72, durchgehend red_sand. Die Tore stehen auf z=0, je drei
    # Bloecke breit mit einem Block Abstand; y 71..73 deckt jeden Stand in der Reihe,
    # denn der Boden wechselt dort zwischen 70 und 71.
    #
    # Das Mauerwerk ist von Hand zu bauen (Plan 2.1 nennt die Gebaeude). Bis dahin ist
    # das Tor eine unsichtbare Tuer - das Protokoll sagt beim Start, welche Tore noch
    # ohne Bauwerk sind.
    tor:
      von: [58, 71, 0]
      bis: [60, 73, 0]
    # Wunschkante der Weltgrenze in Bloecken; Plan Abschnitt 4 nennt 3.000.
    #
    # Gerechnet wird daraus ABGERUNDET auf ganze Rasterzellen (64 Parzelle + 7 Weg = 71)
    # und auf eine gerade Zellenzahl: Aus 3.000 werden 42 Parzellen je Achse mit den
    # Nummern -21 bis 20, zusammen 1.764. Die Grenze wird dann 2.989 Bloecke breit
    # (42 x 71 + 7) und liegt um -3,5/-3,5 - genau auf der Aussenkante des umlaufenden
    # Mauer-Weg-Rings. So kann eine Grenze nie mitten durch eine Parzelle laufen.
    # Ohne Rest gehen Kanten der Form 142 x n + 7 auf: 2.989, 3.131, 4.267.
    #
    # GROESSER geht jederzeit, KLEINER NICHT: Beim Start gilt immer der groessere Wert aus
    # dieser Zeile und der Grenze, die schon in der Welt steht. Ein kleinerer Wert hier
    # landet nur im Protokoll. Eine bezahlte Parzelle darf nie vor die Tuer geraten.
    kante: 3000

    # Nur noetig, wenn die Kante auf mehr als das Doppelte steigen soll - weil Kleiner
    # nicht geht, ist auch ein zu grosser Wert nicht zurueckzunehmen. Hier gehoert dann
    # genau der Text hin, den das Protokoll beim letzten Start genannt hat, etwa
    # "2989 -> 8000". Steht etwas anderes, bleibt die Grenze, die in der Welt steht.
    sprung-bestaetigt: ""

  # Gebaut, nicht gewachsen: Hier stehen Bundesmarkt und die Gebaeude aus Plan 2.1.
  # Spielmodus Abenteuer setzt Schritt 3, Teil C - heute ist es eine gewoehnliche Welt.
  altfurt:
    art: gewoehnlich
    kante: 800
    # Abenteuer in ganz Altfurt [entschieden 02.11.2026]. Altfurt wird nie
    # zurueckgesetzt - solange hier Ueberleben gilt, kann jeder Besucher im Rohbau
    # graben, und jedes Loch bleibt. Der Modus ist diese Zeile, ein abgebautes Stadttor
    # nicht. Baumeister bekommen freimarken.spielmodus.frei.
    spielmodus: abenteuer
    # Kein tor: Hier stehen die Tore, ein Tor nach nebenan waere keines.

  # ~320 Freistaedte auf natuerlichem Gelaende.
  freistaedte:
    art: gewoehnlich
    kante: 6000
    tor:
      von: [62, 71, 0]
      bis: [64, 73, 0]

  # Archipel mit eigenem Angelgut (Plan 4.1).
  hafenwerder:
    art: gewoehnlich
    kante: 5000
    # Plan 2.1: "Hafen von Altfurt - Tor nach Hafenwerder".
    tor:
      von: [66, 71, 0]
      bis: [68, 73, 0]

  # Freibau; eine Sicherung kostet 5.000 Mark.
  hochwald:
    art: gewoehnlich
    kante: 5000
    # Plan 2.1: "Forsttor - Tor zum Hochwald".
    tor:
      von: [70, 71, 0]
      bis: [72, 73, 0]

  # Farmwelt. Wird bei jeder neuen Minecraft-Version zurueckgesetzt und neu
  # vorgeneriert - deshalb haengt an ihr kein Besitz (Plan 4.2).
  kornmark:
    art: gewoehnlich
    kante: 2000
    # Plan 2.1: "Kornpforte - Tor nach Kornmark".
    tor:
      von: [74, 71, 0]
      bis: [76, 73, 0]

  nether:
    art: gewoehnlich
    umgebung: nether
    kante: 2000
    tor:
      von: [78, 71, 0]
      bis: [80, 73, 0]

  # "end" und nicht "ende": Der Schluessel ist der Weltname, und den fuehrt Plan
  # Abschnitt 4 so. Weltnamen sind nach Plan 12a.6 nur lesbar - an ihnen haengen
  # Sicherungen und spaeter Datensaetze. Die Umgebung heisst dagegen deutsch.
  end:
    art: gewoehnlich
    umgebung: ende
    kante: 2000
    tor:
      von: [82, 71, 0]
      bis: [84, 73, 0]
