# Freimarken - Einstellungen
#
# Diese Datei liegt auf dem Server unter plugins/Freimarken/config.yml. Dort stehen
# Zugangsdaten - sie gehoert nicht ins Git-Verzeichnis und nicht in ein Backup, das
# weitergegeben wird.

datenbank:
  # Leer heisst: Es wird nichts gespeichert. Parzellen und Guthaben gelten dann nur bis zum
  # naechsten Neustart. Gut zum Ausprobieren, nichts fuer den Betrieb.
  #
  # Beispiel: jdbc:mariadb://192.168.178.88:3306/freimarken
  # Die Zugangsdaten legt skripte/mariadb_einrichten.bat an und schreibt sie nach
  # data/freimarken/datenbank.properties - von dort hierher uebertragen.
  #
  # NUR BEIM START GELESEN - /freimarken neuladen aendert daran nichts. An der Verbindung
  # haengen Lager, Kasse und Besitzbuch; sie im Betrieb zu tauschen hiesse, die halbe
  # Ablage auszuwechseln. Eine nachgetragene Datenbank greift erst nach einem Neustart.
  # Nach Plan 12a.6 gehoeren diese drei Zeilen auch nicht ins Dashboard: Zugangsdaten
  # haben in einem weitergegebenen Backup nichts zu suchen.
  url: ""
  benutzer: ""
  passwort: ""

# Was Grund und Boden kosten. Plan 12a.6: "Alles, was sich sinnvoll anpassen laesst, ist
# im Dashboard anpassbar." Diese Datei ist die Zwischenstufe dorthin - was dort spaeter
# als Feld mit Begruendung steht, steht hier als Kommentar.
#
# Drei Schranken liegen auf jeder Zahl hier, und alle drei haben denselben Grund: Ein zu
# billiger Preis macht Mark, und die liegen binnen Minuten auf vielen Konten -
# zurueckzuholen nur mit einer Ruecksicherung des ganzen Servers.
#
#   1. Gelesen wird ROH und am Typ geprueft. Ein Punkt trennt in YAML keine Tausender:
#      aus 25.000 wird 25. Anfuehrungszeichen machen aus einer Zahl Text, und daraus
#      liest Bukkit stillschweigend eine 0.
#   2. Der Bereich. Er ist gerechnet und nicht geschaetzt: Der Preis der letzten Stufe
#      ist grundpreis mal 2 hoch 40, und das muss in eine 64-Bit-Zahl passen. Darueber
#      waere der Preis NEGATIV, also eine Gutschrift beim Kauf.
#   3. Mehr als Faktor 2 gegenueber dem ausgelieferten Wert braucht eine zweite
#      Bestaetigung unter sprung-bestaetigt. Verglichen wird immer mit dem AUSGELIEFERTEN
#      Wert und nie mit dem laufenden - sonst verlangte dieselbe Datei nach einem
#      Neustart einen anderen Text, und ein eingetragener Wert gaelte ploetzlich nicht
#      mehr.
#
# Vor allen dreien steht die Datei selbst: Laesst sie sich nicht lesen - ein Tabulator als
# Einrueckung, ein offenes Anfuehrungszeichen -, dann liefert Bukkit stillschweigend die
# ausgelieferten Werte. Ein Neuladen uebernimmt dann NICHTS, und beim Start bleibt
# Freimarken aus; die Meldung nennt die Zeile. Lieber kein Parzellensystem als ein falsch
# bepreistes.
#
# Was keine dieser Schranken faengt, ist der Wert, der im Bereich liegt und trotzdem
# falsch ist - 2.500 statt 25.000. Deshalb steht bei jedem Start und jedem Neuladen die
# Staffel im Klartext im Protokoll: "2. Parzelle 25000 - 3. 50000 - 4. 100000". Wer dort
# "2. Parzelle 25" liest, sieht den Vertipper, den keine Zahlengrenze sieht.
wirtschaft:
  parzelle:
    # Was die ZWEITE Parzelle kostet; jede weitere verdoppelt. Die erste ist immer
    # gratis - wer nur bauen will, zahlt nie etwas.
    #
    # Ganze Zahl von 0 bis 8388607 Mark. 0 heisst: jede Parzelle gratis, und die Bremse
    # gegen Flaechenhorten ist aus. Das ist erlaubt, braucht aber die Bestaetigung
    # unten, weil es der grosse Sprung nach unten ist.
    #
    # Mit 25.000 kostet die sechste Parzelle genau 400.000 Mark - so viel wie eine
    # Freistadt. Ab der siebten ist Horten teurer als Gruenden, und genau das soll die
    # Staffel bewirken (Plan 8).
    grundpreis: 25000

    # Gebuehr je Feld der NEUEN Gruppe beim Zusammenlegen: Vier Felder kosten viermal
    # diesen Betrag. Eine der wenigen Senken, die ausschliesslich diejenigen zahlen, die
    # ohnehin viel besitzen.
    #
    # Ganze Zahl von 0 bis 4294967298 Mark je Feld.
    zusammenlegung-je-feld: 10000

  # Die zweite Bestaetigung fuer einen Sprung ueber den Faktor 2. Hier gehoert genau der
  # Text hin, den das Protokoll beim letzten Start genannt hat, etwa "25000 -> 100000".
  # Steht etwas anderes, gilt der ausgelieferte Wert - nicht der getippte.
  #
  # Die Bestaetigung gilt nur fuer genau diesen Sprung: Wer sie eintraegt und spaeter eine
  # andere Zahl setzt, wird erneut gefragt. Ein Dauerfreibrief waere keine Rueckfrage.
  # NEUN Zeilen, eine je Geldwert mit Sprungschutz. Vier davon standen bis zum
  # 10.11.2026 nicht hier, und das war keine Abschaltung - die Klage nennt den
  # Schluessel samt fertiger Zeile, und wer sie liest, traegt ihn ein. Aber diese Datei
  # IST die Dokumentation: Ein Abschnitt, der vier von neun verschweigt, laesst dich
  # glauben, es gebe fuer deinen Wert keine Bestaetigung. GrenzeTest.31am haelt das jetzt.
  sprung-bestaetigt:
    grundpreis: ""
    zusammenlegung-je-feld: ""
    startguthaben: ""
    wechselgebuehr: ""
    # Der Deckel des VERDIENENS (verdienst.tagesdeckel).
    tagesdeckel: ""
    # Und der des Bundesmarktes (bundesmarkt.tagesdeckel) - ein eigener Deckel, darum
    # ein eigener Schluessel.
    markt-tagesdeckel: ""
    # Die drei Zahlen der Markthalle (laeden.*).
    laden-miete: ""
    laden-kaution: ""
    laden-lizenz: ""
    # Und die drei des Tagesbonus (tagesbonus.*).
    bonus-grundbetrag: ""
    bonus-je-serientag: ""
    bonus-hoechstbetrag: ""

parzellen:
  # Wie viele Parzellen ein Spieler ohne besonderes Recht haben darf.
  # Mehr erlaubt das Recht freimarken.parzellen.<zahl>, etwa freimarken.parzellen.8.
  # Die hoechste Zahl gewinnt, dieser Wert ist die Untergrenze.
  #
  # Ganze Zahl ab 1. Eine 0 hiesse, niemand darf eine Parzelle - und das sieht in einer
  # Einstellungsdatei aus wie ein Tippfehler, weil es einer ist. Wer das Parzellensystem
  # abschalten will, nimmt das Recht weg. /freimarken neuladen uebernimmt diesen Wert.
  hoechstzahl: 4

  # Wie viele Felder eine zusammengelegte Gruppe haben darf. Mehr erlaubt das Recht
  # freimarken.gruppe.<zahl>, nach derselben Regel wie oben.
  #
  # Das ist eine eigene Grenze und nicht dieselbe wie hoechstzahl: Wie viele Parzellen
  # jemand besitzt, bremst das Flaechenhorten; wie viele davon er zu EINEM Grundstueck
  # verbinden darf, entscheidet, wie gross ein einzelnes Bauwerk werden kann. Vier Felder
  # im Quadrat sind 135 x 135 Bloecke.
  #
  # Ganze Zahl ab 1, wie oben. /freimarken neuladen uebernimmt diesen Wert.
  gruppe-hoechstzahl: 4

hinweise:
  # Eine Zeile, die der Spieler zusaetzlich sieht, wenn sein RANG die Grenze setzt: beim
  # Kauf einer weiteren Parzelle, beim Zusammenlegen und auf einer freien Parzelle, die er
  # nicht mehr nehmen darf. Was der Rang erlaubt, steht schon in der Zeile davor - hier
  # gehoert hin, wie es auf DIESEM Server weitergeht.
  #
  # Beispiele:
  #   "Mehr Parzellen gibt es mit dem Rang Buerger - rund 40 Spielstunden und eine
  #    bebaute Parzelle."
  #   "Mehr Parzellen gibt es mit dem Rang Buerger - oder als Zuschlag obendrauf mit
  #    einer Mitgliedschaft."
  #
  # Versprich hier nichts, was es nicht gibt - weder einen Befehl noch einen Weg. Der Satz
  # erscheint genau in dem Augenblick, in dem der Spieler abgewiesen wurde; ein Hinweis
  # auf einen Shop oder einen /rang-Befehl, den es nicht gibt, ist dann aergerlicher als
  # gar keiner.
  #
  # Und er darf den Raengen nicht widersprechen. Nach Plan 9 haengt die Parzellengrenze an
  # den drei erspielbaren Raengen (Reisender, Siedler, Buerger); die beiden kaufbaren
  # (Foerderer, Stifter) geben einen ZUSCHLAG darauf: +2 bzw. +4 Parzellen und +1 bzw. +2
  # Felder je Grundstueck, ueber die Rechte freimarken.extra.parzellen.<n> und
  # freimarken.extra.gruppe.<n>.
  #
  # Der Zuschlag ersetzt den erspielten Rang nicht, er kommt obendrauf - wer am ersten Tag
  # zahlt, hat 1+2 Parzellen und nicht 4. Wirb hier also mit dem Zuschlag und nicht mit
  # "kauf dir mehr Parzellen": Sonst erwartet ein Neuling, dass Geld die vierzig Stunden
  # bis Buerger ersetzt, und das tut es nicht.
  #
  # Den Zuschlag gibt es nur mit einer Mitgliedschaft, nicht fuer Goldmark (Plan 8.4).
  #
  # Leer lassen heisst: kein Hinweis. /freimarken neuladen uebernimmt diese Zeile.
  rang-werbung: "Mehr erlaubt ein hoeherer Rang."

kasse:
  # Was ein Spieler beim ersten Mal an Mark mitbringt. Die erste Parzelle ist ohnehin
  # gratis; dieser Betrag entscheidet, wie weit es ohne Verdienen reicht.
  #
  # Ganze Zahl ab 0 Mark; mehr als Faktor 2 gegenueber 50.000 braucht die Bestaetigung
  # unter wirtschaft.sprung-bestaetigt.startguthaben.
  #
  # NUR BEIM START GELESEN - /freimarken neuladen vergleicht und meldet, uebernimmt aber
  # nicht. Der Grund: Fuer ein noch nicht eroeffnetes Konto geben die Kassen diesen Wert
  # als Guthaben zurueck. Ein neuer Wert im Betrieb aenderte also rueckwirkend, was jeder
  # Spieler mitbringt, der noch nie gebucht hat - genau der Fehler, den die
  # Eroeffnungsbuchung am 02.11.2026 behoben hat. Der Betrag friert im Augenblick der
  # Eroeffnung ein (Beitritt oder erste Buchung, je was zuerst kommt).
  startguthaben: 50000

# DIE BERUFE - was ein Spieler waehlen darf, was ein Wechsel kostet und was ihn bremst.
#
# Ein Spieler haelt zwei Grundberufe und eine Spezialisierung. Das WAEHLEN ist gratis,
# solange ein Platz frei ist - ein Neuling soll seine ersten drei Berufe nicht bezahlen
# muessen. Bezahlt wird das AUFGEBEN, und danach laeuft eine Sperrfrist. Andersherum
# waere beides umgehbar: erst aufgeben, einen Tag warten, dann gratis etwas anderes
# waehlen.
#
# Was ein Beruf EINBRINGT, steht noch nirgends - das kommt mit seinem eigenen Bauschritt.
# Heute wirkt allein die Wahl.
#
# DIE WORTE zu den Berufen stehen NICHT hier, sondern in der sprache.yml unter
# beruf.name.<schluessel>. Worte gehoeren in die Sprachdatei; hier stehen die Schluessel,
# und die stehen in der Datenbank.
berufe:
  # Was das Aufgeben eines Berufs kostet.
  #
  # Ganze Zahl von 0 bis 4611686018427387903 Mark. 0 heisst: Aufgeben ist gratis, und von
  # den zwei Bremsen bleibt allein die Sperrfrist. Mehr als Faktor 2 gegenueber 5.000
  # braucht die Bestaetigung unter wirtschaft.sprung-bestaetigt.wechselgebuehr.
  #
  # Mit 5.000 kostet ein Wechsel etwa zwei Spielstunden Arbeit - zu teuer fuers Umschalten
  # zwischen zwei Aufgaben, zu billig, um jemanden auf einem Beruf festzuhalten, der ihm
  # nicht gefaellt.
  #
  # /freimarken neuladen uebernimmt diesen Wert.
  wechselgebuehr: 5000

  # Wie lange nach dem Aufgeben kein weiterer Zug geht - weder aufgeben noch waehlen.
  #
  # Ganze Zahl von 0 bis 720 Stunden, und zwar in GANZEN Stunden. 0 heisst ausdruecklich:
  # keine Sperrfrist, der ehrliche Ausschalter fuer die Regel; dann bremst allein die
  # Gebuehr. Gemessen wird ab dem Augenblick des Aufgebens, in UTC. Ein Neustart
  # verlaengert und verkuerzt sie nicht: In der Datenbank steht der Zeitpunkt und kein
  # laufender Zaehler.
  #
  # Die Frist ist die wirksamere der zwei Bremsen. Gegen eine Gebuehr hilft Geld, gegen
  # eine Frist hilft nichts. Mit 24 Stunden kann jeder einmal am Tag umdenken.
  #
  # /freimarken neuladen uebernimmt diesen Wert. Eine kuerzere Frist gilt sofort auch fuer
  # einen Spieler, der schon wartet - gerechnet wird bei jedem Versuch neu, und es steht
  # dafuer kein Zeitgeber.
  sperrfrist-stunden: 24

  # Wie viele Grundberufe und wie viele Spezialisierungen ein Spieler gleichzeitig halten
  # darf.
  #
  # hoechstens-grundberufe ist eine ganze Zahl ab 1. Keine 0: Sie hiesse, niemand darf
  # einen Beruf - und das sieht in einer Einstellungsdatei aus wie ein Tippfehler, weil es
  # einer ist. Wer die Berufe abschalten will, nimmt das Recht freimarken.beruf weg.
  #
  # hoechstens-spezialisierungen darf 0 sein und heisst dann: keine Spezialisierungen.
  # Das ist ein echter Betriebsfall - dann braucht niemand das Recht
  # freimarken.beruf.spezialisierung.
  #
  # Keine der beiden Zahlen darf groesser sein, als die Liste unten hergibt: Wer drei
  # Grundberufe erlaubt und nur zwei eintraegt, verspricht einen Platz, den niemand
  # fuellen kann. Das wird abgewiesen, und die Klage nennt beide Zahlen.
  #
  # SPEZIALISIERUNGEN BRAUCHEN EIN RECHT: freimarken.beruf.spezialisierung. Ein Recht und
  # keine Rangzahl hier - Raenge sind auf diesem Server Rechte, und eine zweite Quelle
  # dafuer antwortete eines Tages anders.
  #
  # /freimarken neuladen uebernimmt beide Werte. Ein kleinerer Wert nimmt niemandem einen
  # Beruf weg, den er schon hat - er verhindert nur den naechsten.
  hoechstens-grundberufe: 2
  hoechstens-spezialisierungen: 1

  liste:
    # NUR BEIM START GELESEN - /freimarken neuladen aendert hier nichts. An dieser Liste
    # haengen die Vervollstaendigung von /beruf, die im Befehlsbaum steckt und genau
    # einmal angemeldet wird, und die Zuordnung Grundberuf/Spezialisierung, mit der jede
    # Berufszeile in der Datenbank gelesen wird.
    #
    # EIN EINTRAG JE GRUNDBERUF - die Reihenfolge hier ist die Reihenfolge in /beruf liste
    # und bei der Vervollstaendigung. Alphabetisch sortiert waere eine Entscheidung, die
    # dir niemand gesagt hat.
    #
    # spezialisierungen: Die Berufe, die diesen Grundberuf voraussetzen, als Liste in
    #           eckigen Klammern. Leere Klammern sind erlaubt und heissen: Zu diesem
    #           Grundberuf gibt es keine Spezialisierung. Die Zeile MUSS dann trotzdem da
    #           sein - ein Eintrag ganz ohne Inhalt ("bergmann:" und nichts darunter) wird
    #           beim Laden der Datei weggeworfen, und der Beruf fehlt dann stumm. Welche
    #           Berufe wirklich gelten, nennt das Protokoll beim Start in einer Zeile.
    #           Eine ZWEITE Spezialisierung je Grundberuf ist ein Eintrag und kein Umbau -
    #           der Spieler waehlt dann eine von beiden.
    #           Die Liste steht am Grundberuf und nicht als eigener Abschnitt: So ist ein
    #           neuer Beruf ein Eintrag und nicht ein Eintrag plus eine vergessene
    #           Zuordnung. Dieselbe Entscheidung wie beim tor: der Welten unten.
    #           Steht derselbe Name unter zwei Grundberufen oder traegt er den Namen eines
    #           Grundberufs, fallen ALLE Nennungen weg - sonst entschiede die Reihenfolge
    #           der Eintraege, was er voraussetzt. Die Klage nennt jede Stelle.
    #           Eine Spezialisierung auf eine Spezialisierung gibt es nicht: Es sind genau
    #           zwei Rollen, und ein Beruf in der Mitte zaehlte in beiden Platztoepfen.
    #
    # DER SCHLUESSEL darf nur Kleinbuchstaben, Ziffern und Bindestrich tragen und muss mit
    # einem Buchstaben beginnen; hoechstens 32 Zeichen. KEIN Punkt und kein Unterstrich,
    # anders als bei einem Weltnamen: Der Punkt ist in der sprache.yml der Trenner, und
    # beruf.name.berg.mann waere dort eine Ebene tiefer statt ein Name. Hier geprueft und
    # nicht erst beim Gebrauch: Der Schluessel steht in einer Datenbankspalte, und ein zu
    # langer Name wuerde dort stumm abgeschnitten - zwei Berufe fielen zusammen, und ein
    # Spieler verloere einen.
    #
    # DAS WORT, das ein Spieler liest, steht in der sprache.yml unter
    # beruf.name.<schluessel>. Wer hier einen Schluessel hinzufuegt, braucht dort eine
    # Zeile dazu, sonst startet Freimarken nicht. Lieber ein verweigerter Start als ein
    # Zunfthaus, in dem "bergmann" steht.
    #
    # Neue Berufe kommen beim Update NICHT von selbst in diese Datei - eine vorhandene
    # config.yml wird nie ueberschrieben. Was hier fehlt, nennt das Protokoll beim Start.
    # Verdient wird an: Erze, Stein, Tiefe - der Steinmetz zusaetzlich an veredelten
    # Bausteinen und Statuen.
    bergmann:
      spezialisierungen: [steinmetz]
    # Holz und Aufforstung - der Zimmermann an Balken, Tueren, Fachwerk.
    holzfaeller:
      spezialisierungen: [zimmermann]
    # Acker, Tiere, Zucht - der Mueller an Nahrung und Vorratshaltung.
    bauer:
      spezialisierungen: [mueller]
    # Fang, mit einem Bonus auf Hafenwerder - der Reeder an Seehandel und Bootsrennen.
    fischer:
      spezialisierungen: [reeder]
    # Monster und Beute - der Gerber an Leder und Ruestung.
    jaeger:
      spezialisierungen: [gerber]
    # GESETZTE Bloecke, und nur die: Ein Block zahlt nur einmal, und die Markierung dafuer
    # kommt mit ihrem eigenen Bauschritt. Der Architekt verdient an grossen Bauten und am
    # Auftragsbau.
    baumeister:
      spezialisierungen: [architekt]

# WAS ARBEIT EINBRINGT - die wichtigste Geldquelle dieser Wirtschaft.
#
# Die Zielzahl steht im Plan und gilt JE SPIELER, nicht je Beruf: 2.000 bis 5.000 Mark
# in einer Spielstunde. Dann ist die zweite Parzelle nach 5 bis 10 Stunden erreichbar,
# eine Meerinsel nach 15 bis 35, eine Freistadt nach 80 bis 200. Wer an diesen Zahlen
# dreht, dreht an der ganzen Besitzleiter - die Spanne ist der Hebel, mit dem sich das
# einstellen laesst.
#
# GERECHNET WIRD IN PFENNIGEN, also in Hundertsteln einer Mark: 40 heisst 0,40 Mark.
#   Der Grund ist eine Rechnung: In einer Stunde Arbeit faellt ein bis zweieinhalb Mark
#   je Block an, und die Kasse kennt nur ganze Mark. Ohne Hundertstel muesste
#   gewoehnlicher Stein 0 zahlen. Gesammelt wird je Spieler, gebucht werden nur ganze
#   Mark - der Rest bleibt stehen und wartet.
#
# GEBUCHT WIRD GESAMMELT, nicht je Block. Im Kontobuch steht darum eine Zeile je Takt
#   mit dem Grund beruf_verdienst und nicht eine je Erzbrocken. Wer wissen will, WAS
#   jemand getan hat, fragt das Logbuch; dieses Buch ist das Geldbuch.
#
# EIN BLOCK ZAHLT NUR EINMAL. Ein von einem Spieler gesetzter Block traegt eine Marke
#   und bringt beim Abbauen nichts - und ein zweites Setzen an derselben Stelle auch
#   nicht. Sonst waere Setzen-Abbauen die Gelddruckmaschine, die jeder in der ersten
#   Stunde findet.
#
# /freimarken neuladen uebernimmt ALLES in diesem Abschnitt, auch die Lohnliste. Das ist
#   Absicht: Einstellen heisst ausprobieren.
verdienst:
  # Wie viele Mark ein Spieler an einem Tag hoechstens AUS ARBEIT bekommt.
  #
  # Je Spieler und nicht je Beruf - sonst kaeme der Deckel ueber zwei Grundberufe
  # doppelt. Gezaehlt wird ab Mitternacht Ortszeit (zeit.zone), und gezaehlt wird, was
  # gebucht ist: Die Summe steht im Kontobuch, es gibt keine zweite Liste daneben.
  #
  # 20.000 sind vier bis zehn Stunden Arbeit AN EINEM TAG. Wer das erreicht, farmt - der
  # Deckel soll grosszuegig genug sein, dass normales Spielen ihn nicht erreicht. Was
  # darueber anfaellt, VERFAELLT; es wandert nicht in den naechsten Tag, sonst waere der
  # Deckel nur eine Verzoegerung. Der Spieler erfaehrt es ueber dem Gegenstandsgurt.
  #
  # Ganze Zahl ab 1. Mehr als Faktor 2 gegenueber 20.000 braucht die Bestaetigung unter
  # wirtschaft.sprung-bestaetigt.tagesdeckel.
  tagesdeckel: 20000

  # DER ABNEHMENDE ERTRAG. Derselbe Block bringt innerhalb einer Stunde immer weniger -
  # ohne das ist jede Mobfarm eine Gelddruckmaschine.
  #
  # Gezaehlt wird je Spieler und je BLOCKART, nicht je Ort: Eine Farm liefert immer
  # dieselbe Art an wechselnden Stellen, und genau sie ist der Grund fuer die Regel.
  # Das Fenster ist eine Stunde und springt - nach einer Stunde zaehlt es neu.
  #
  # Mit den Werten unten ergibt sich:
  #     Bloecke 1-200    voll        (Stein: 0,40 Mark)
  #     Bloecke 201-400  die Haelfte (0,20)
  #     Bloecke 401-600  ein Viertel (0,10)
  #     Bloecke 601-800  ein Achtel  (0,05)
  #     ab 801           ein Zehntel (0,04 - der Boden)
  #
  # Ein Haus sind einige hundert Bloecke, aber selten zweihundert derselben ART in einer
  # Stunde; ein Stollen in den Stein geht darueber hinaus. Genau dort soll es greifen.
  minderung:
    # Wie viele Bloecke einer Art voll zahlen. Ganze Zahl ab 1 - eine 0 hiesse, dass
    # schon der erste Block gemindert ist. Hochsetzen schaltet die Regel faktisch aus.
    voll-bis: 200
    # Wie breit eine Stufe ist. Ganze Zahl ab 1.
    stufe: 200
    # Auf wie viel Prozent des vorherigen Satzes jede Stufe senkt. 1 bis 99.
    # Bei 100 mindert nichts - wer das will, setzt voll-bis hoch. Bei 0 faellt der Satz
    # in einem Schritt auf den Boden, und die Stufen waeren Zierde.
    faktor-prozent: 50
    # Unter welchen Anteil des vollen Satzes es NIE faellt. 1 bis 100.
    # Keine 0: Das waere eine unsichtbare Wand - ab einer Zahl, die niemand kennt,
    # passiert gar nichts mehr, und der Spieler sucht den Fehler bei sich.
    boden-prozent: 10
    # DIE HARTE OBERGRENZE je Taetigkeit und Stunde - ueber ALLE Namen zusammen.
    #
    # Sie ist die einzige der drei Bremsen, die eine Farm wirklich anhaelt. Die Stufen
    # darueber DAEMPFEN nur: Mit 200/200/50/10 ist die Summe der ersten 800 Ereignisse
    # eine feste Pauschale von 374 vollen Saetzen, und danach zahlt jedes weitere
    # unbegrenzt ein Zehntel. Eine Mobfarm nimmt beides mit.
    #
    # UEBER ALLE NAMEN, und das ist der Kern: Sonst vervielfacht eine Farm ihre Pauschale
    # durch Artenvielfalt - fuenf Monsterarten waeren fuenf Pauschalen, ein Dutzend
    # Angelfunde ein Dutzend.
    #
    # Jede Zahl ist gegen die MENSCHLICHE Rate gerechnet, nicht gegen die der Maschine:
    #   abbauen/setzen 4000 - ein Stollen oder eine Hauswand in einer Stunde. Hoch mit
    #           Absicht: Diese zwei sind kalibriert, und dort tun die Stufen ihre Arbeit.
    #   ernten 2000 - ein grosses Feld. Faengt die Kuerbisstiele, die ohne Spieler
    #           nachwachsen und an einer nie markierten Position stehen.
    #   fischen 300 - mit Koeder III liegt der Biss bei etwa fuenf Sekunden, also bei 650
    #           Faengen je Stunde als Obergrenze fuer Mensch UND Klickautomat. 300 laesst
    #           den Fischer verdienen und laesst den Automaten nach einer halben Stunde
    #           leerlaufen.
    #   toeten 300 - im Hoehlengang faellt ein Mob alle halbe Minute, also 60 bis 150 je
    #           Stunde. Eine natuerliche Mobfarm liegt um Zehnerpotenzen darueber.
    #   zuechten 150 - die Abklingzeit je Elterntier sind fuenf Minuten, also zwoelf
    #           Zuchten je Stunde und Paar. 150 sind rund ein Dutzend Paare.
    #
    # Wer eine Zeile weglaesst, bekommt die Zahl aus dem Programm und eine Zeile im
    # Bericht. Eine 0 ist KEINE Abschaltung, sondern eine Klage - wer eine Taetigkeit
    # nicht bezahlen will, laesst ihre Lohnzeilen weg.
    stundenmenge:
      abbauen: 4000
      setzen: 4000
      ernten: 2000
      fischen: 300
      toeten: 300
      zuechten: 150

  # AUS WELCHEN GRUENDEN ein getoetetes Wesen zahlt - die Marke fuer Wesen.
  #
  # Dasselbe, was die Blockmarke fuer Bloecke tut: Sie trennt, was gewachsen ist, von dem,
  # was ein Spieler selbst hergestellt hat. Zwei Maschen fallen damit auf einmal:
  #   - Ein GEZUECHTETES Kalb zahlt nicht zweimal (einmal die Zucht, einmal der Tod) - es
  #     traegt den Grund breeding, und der steht nicht in der Liste.
  #   - Eine SPAWNERFARM zahlt gar nichts (spawner, trial_spawner, spawner_egg).
  #
  # Es ist eine WEISSLISTE: Was hier nicht steht, zahlt nicht. Minecraft bringt mit jeder
  # Fassung neue Gruende mit, und ein neuer Grund soll kein neues Geld bedeuten. Die
  # vollstaendige Liste der Gruende nennt die Spielfassung; ein Name, den dieser Server
  # nicht kennt, ist eine Klage mit Zeilennummer.
  #
  # Eine LEERE Liste ist erlaubt und heisst: kein getoetetes Wesen zahlt etwas.
  spawngruende: [natural, chunk_gen, jockey, raid, patrol, village_invasion, trap]

  # WELCHE GESETZTEN BLOECKE KEINE MARKE BEKOMMEN - die eine Ausnahme von "ein Block zahlt
  # nur einmal".
  #
  # Sie ist noetig, weil Saatgut auf DERSELBEN Position liegt wie die reife Pflanze: Mit
  # Marke brachte ein von Hand gesaetes Feld nie etwas ein, und der Bauer verdiente an
  # seinem Acker gar nichts.
  #
  # Was hier steht, zahlt auch beim SETZEN nichts - sonst waere das Saeen selbst die kleine
  # Maschine: saeen, umschlagen, saeen. Bezahlt wird die ERNTE.
  #
  # Es sind die BLOCKNAMEN und nicht die Gegenstaende in der Hand: Gesaeter Weizen ist
  # wheat und nicht wheat_seeds, eine Karotte carrots, eine Melonensaat melon_stem.
  #
  # SETZLINGE stehen mit Absicht nicht darin: Ein Setzling wird kein geerntetes Feld,
  # sondern ein Baum, und dessen Stamm steht an neuen, unmarkierten Positionen. Darum zahlt
  # das Aufforsten weiter (holzfaeller/setzen).
  #
  # Wer hier etwas hinzufuegt, macht diesen Block beliebig oft bezahlbar, wenn er zugleich
  # unter ernten steht. Eine LEERE Liste ist erlaubt und heisst: jeder gesetzte Block
  # bekommt eine Marke.
  saatgut: [wheat, carrots, potatoes, beetroots, melon_stem, pumpkin_stem, sugar_cane,
            bamboo_sapling, bamboo, cactus, kelp, cocoa, nether_wart, sweet_berry_bush,
            torchflower_crop, pitcher_crop]

    # DIE LOHNLISTE: Beruf, dann Taetigkeit, dann Material, dann Pfennige.
    #
    # ES GIBT KEINEN RUECKFALL IM PROGRAMM. Fehlt dieser Abschnitt, verdient niemand
    #   etwas, und das Protokoll sagt es laut. Jede andere Vorgabe steht im Programm,
    #   damit sie nicht fehlen kann - eine Lohnliste dort waere aber eine zweite
    #   Abschrift dieser Datei, und zwei Abschriften derselben Tabelle laufen
    #   auseinander. Ausserdem ist das die sichere Richtung: Ein geratener Lohn macht
    #   Geld, das keine Ruecksicherung zurueckholt.
    #
    # TAETIGKEITEN: abbauen und setzen. Mehr gibt es noch nicht - fangen, toeten,
