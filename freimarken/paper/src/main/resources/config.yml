# DER BUNDESMARKT - was der Bund ankauft und zu welchem Preis.
#
# Die zweite gedeckelte Quelle (Plan 8.2: "Verkauf an den Bundesmarkt - kleines
# Sortiment, niedrige Preise"). Er ist mit Absicht KEINE zweite Arbeit, sondern die
# Verwertung des Erarbeiteten: Wer nur verkauft, soll nicht so viel bekommen wie wer
# arbeitet.
#
# DIE NIEDRIGEN PREISE SIND DIE SENKE. Der Bund zahlt weniger als ein Spieler im Laden,
# und genau diese Spanne ist der Anreiz, miteinander zu handeln statt mit dem Server.
# Darum gibt es hier KEINE Marktgebuehr - die fuenf Prozent aus dem Plan gehoeren zum
# Spielerhandel in der Markthalle, und zwei Senken auf denselben Verkauf waeren eine zu
# viel.
#
# GEZAHLT WIRD IN GANZEN MARK, gerechnet in PFENNIGEN. Der Bund nimmt nur so viele
# Stueck, wie eine ganze Mark ergeben: Von sieben Stein zu 20 Pfennigen nimmt er fuenf
# und zahlt eine Mark, zwei bleiben dir. Nichts geht verloren, und die Rechnung laesst
# sich nachvollziehen.
#
# EIN ORT: Verkauft wird nur in der Ankunftswelt (reisen.ankunftswelt), wo der
# Bundesmarkt steht. Die Liste darf man ueberall ansehen.
bundesmarkt:
  # Wie viele Mark ein Spieler an einem Tag hoechstens aus VERKAEUFEN bekommt.
  #
  # Ein EIGENER Deckel und nicht derselbe wie beim Verdienen: Mit einem gemeinsamen waere
  # jede der zwei Quellen durch die andere zu verschliessen - wer vormittags verkauft,
  # koennte nachmittags nicht mehr arbeiten.
  #
  # 5.000 ist ein Viertel des Verdienstdeckels. Bei 2.000 bis 5.000 Mark je Spielstunde
  # aus Arbeit ist das etwa eine Stunde: genug, damit Verkaufen sich lohnt, zu wenig,
  # damit es die Arbeit ersetzt. Die Ware ist beim Erarbeiten schon einmal bezahlt
  # worden; wer sie auch noch zum halben Tagessatz verwertet, verdient am selben Block
  # zweimal.
  #
  # Mehr als Faktor 2 gegen diesen Wert braucht eine Bestaetigung unter
  # wirtschaft.sprung-bestaetigt.markt-tagesdeckel - es ist ein Geldwert.
  tagesdeckel: 5000
  # DAS SORTIMENT - Material und Preis je STUECK in Pfennigen.
  #
  # Kleines Sortiment mit Absicht: Was hier nicht steht, kauft der Bund nicht. Das ist
  # die sichere Richtung - ein Grundpreis fuer alles machte jeden Gegenstand zu Geld,
  # auch den, der nur in einer Farm anfaellt.
  #
  # VERKAUFT WIRD AM SCHILD [10.11.2026]. Ein Ankaufstand des Bundes ist ein gewoehnliches
  # Shopschild mit dem Bundwort (handel.bundshop-wort) in der ersten Zeile und NUR einem
  # S-Preis. Der Preis, den er zahlt, kommt aus DIESER Tafel und nicht vom Schild: Eine
  # Aenderung hier wirkt also sofort an jedem Stand, ohne dass einer neu beschrieben
  # wird. Das Schild zeigt dann noch die alte Zahl, und der erste Klick danach schreibt
  # eine Zeile ins Serverprotokoll, die sagt, welches Schild neu zu beschreiben ist.
  #
  # DIE MENGE EINES STANDES MUSS MIT DEM PREIS EINE GANZE MARK ERGEBEN: menge mal
  # pfennige muss durch 100 teilbar sein. Bei 20 Pfennigen gehen 5, 10, 15, ... Stueck;
  # bei 16 waeren es 3,20 Mark, und die 20 Pfennige verschwaenden bei JEDEM Handel - der
  # Spieler saehe nur, dass seine Ware weg ist. Ein solcher Stand entsteht darum nicht,
  # und die Absage nennt die kleinste passende Menge. Wer einen Preis hier aendert, soll
  # danach die Startzeile lesen: Sie nennt die Zahl der Ankaufstaende.
  #
  # EIN Schild je Richtung. Was der Bund VERKAUFT, steht auf dem Schild (ein B-Preis) und
  # in keiner Tafel; ein Schild mit beiden Zahlen entsteht nicht und kauft auch nicht an.
  # Der Grund ist eine Gelddruckmaschine: Steigt der Ankaufpreis hier ueber den Kaufpreis
  # auf dem Schild, kauft man an demselben Stand billig und verkauft teurer zurueck.
  #
  # Die Preise liegen unter dem, was die Arbeit einbringt (verdienst.loehne): Stein
  # bringt beim Abbauen 40 Pfennige und am Markt 20. Der Markt ist die Verwertung, nicht
  # die Quelle.
  #
  # Die REIHENFOLGE hier ist die Reihenfolge in /markt. Alphabetisch sortiert waere eine
  # Entscheidung, die dir niemand gesagt hat.
  ankauf:
    # Steine und Erden - die Grundlast jedes Bergmanns.
