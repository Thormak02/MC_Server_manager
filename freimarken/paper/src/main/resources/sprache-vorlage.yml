# Freimarken - sprache-vorlage.yml
#
# WIRD BEI JEDEM START NEU GESCHRIEBEN. Was du hier aenderst, ist beim naechsten
# Start weg. Hier steht JEDER Satz, den ein Spieler liest - zum Nachsehen und zum
# Kopieren. Suche nach dem Wortlaut, dann hast du den Schluessel.
#
# EINEN SATZ AENDERN: die Zeile samt aller Ebenen darueber nach sprache.yml kopieren
#   und DORT aendern. /freimarken neuladen uebernimmt sie sofort.
# FARBE: <gray> <dark_gray> <white> <yellow> <gold> <green> <red> <aqua> <bold>
#   <italic> - und jede weitere Farbe, die Minecraft kennt, auch <dark_blue> oder
#   <#ffaa00>. Jedes geoeffnete Tag MUSS geschlossen werden: <gold>...</gold>. Ein
#   offenes oder unbekanntes Tag ist eine Klage mit Zeile und Spalte. <click> und
#   <hover> sind nicht erlaubt - sie koennten einen Befehl im Namen des Spielers
#   ausloesen.
# SPITZE KLAMMER ALS ZEICHEN: schreibe ZWEI Backslashes davor - sonst haelt das
#   Plugin sie fuer eine Farbe. Der Grund fuer die zwei: in doppelten
#   Anfuehrungszeichen ist ein Backslash fuer YAML selbst ein Sonderzeichen, und
#   einer allein macht die ganze Datei unlesbar.
#   BEISPIEL ESCAPE: zeile: "<gray>Preis fuer \\<anzahl> Parzellen</gray>"
#   BEISPIEL LIEST: Preis fuer <anzahl> Parzellen
# WERT: {name} in geschweiften Klammern. Welche ein Satz kennt, steht im Kommentar
#   darueber. Einen weglassen ist erlaubt (dann liest der Spieler den Wert nicht),
#   einen fremden Namen nicht - dann gilt fuer diesen EINEN Satz wieder der
#   ausgelieferte, und eine Zeile im Bericht sagt es. Ein Wert, der selbst eine
#   Klammer traegt, wird nie als Platzhalter gelesen.
# EINZUG UND SPALTEN: stehen IM Satz. Fuehrende Leerzeichen sind Absicht - darum
#   steht jeder Wert in doppelten Anfuehrungszeichen.
# NEUE CHATZEILE: \n im Satz - EIN Backslash, anders als bei der spitzen
#   Klammer. Der Unterschied: Die Folge \n kennt YAML als Umbruch, \< kennt es
#   nicht - darum braucht die Klammer zwei und der Umbruch einen. Jede Zeile wird
#   einzeln gesendet. Eine Farbe gilt ueber den Umbruch hinweg weiter - du kannst
#   aber auch je Zeile ein eigenes Tag setzen, und das tun mehrere Zeilen dieser
#   Datei schon: warp.ziele traegt gold, aqua und grau in EINER Zeile.
#   BEISPIEL UMBRUCH: zeile: "<gray>Erste Zeile\nZweite Zeile</gray>"
#   BEISPIEL ZWEI ZEILEN: Erste Zeile | Zweite Zeile
# ZAEHLT: ein Satz mit einer Zahl hat zwei Formen, eins und viele. BEIDE Pflicht.
# ZEICHEN: ASCII und · (U+00B7). Keine Umlaute, kein scharfes s, kein
#   Paragrafenzeichen, kein &-Code. Die Datei ist UTF-8.

mark:
  # {betrag} - dein Stand. Mehrfarbig in EINER Zeile: das goldene Stueck ist ein
  # WERT, also kannst du den Satz umstellen, ohne einen zweiten Schluessel zu
  # brauchen.
  stand: "<gray>Du hast <gold>{betrag}</gold>.</gray>"
  # Die zweite Zeile von /mark. Sie steht unter stand und nicht in verlauf: Gelesen
  # wird sie bei /mark, nicht bei /mark verlauf.
  verlauf-hinweis: "<dark_gray>/mark verlauf zeigt die letzten Buchungen.</dark_gray>"
  verlauf:
    # Noch keine Buchung - dann steht nur diese eine Zeile da.
    leer: "<gray>Noch keine Buchungen.</gray>"
    # Der Kopf ueber den Buchungen.
    kopf: "<gold>Deine letzten Buchungen</gold>"
    # {zeit} {betrag} {grund} {stand} - Zeitform aus zeit.verlauf-muster, Betrag und
    # Vorzeichen formt das Programm, {grund} kommt aus der Liste darunter.
    # Einzug und Farbe stehen HIER, nicht am Sendeort: wer den Betrag golden will,
    # schreibt <gold>{betrag}</gold> hinein, und es wirkt wirklich.
    zeile: "<gray>  {zeit}  {betrag}  {grund}  (Stand {stand})</gray>"
    # Was ein Spieler statt des Datenbankschluessels liest. KEINE Farbtags: diese
    # Woerter werden in den Satz darueber eingesetzt und sind dort ein Blatt - ein
    # Tag darin stuende dem Spieler woertlich im Chat.
    grund:
      eroeffnung: "Startguthaben"
      bestand: "Stand bei Einfuehrung des Kontobuchs"
      parzelle-gekauft: "Parzelle genommen"
      parzelle-erstattet: "Parzelle nicht eingetragen - erstattet"
      zusammenlegung: "Grundstueck zusammengelegt"
      zusammenlegung-erstattet: "Zusammenlegen gescheitert - erstattet"
      beruf-verlassen: "Beruf aufgegeben"
      beruf-erstattet: "Beruf aufgeben gescheitert - erstattet"
      # Eine Zeile je Takt und nicht je Block: Gebucht wird, was der Zeitgeber gesammelt
      # hat. Was ein Spieler dafuer getan hat, steht im Logbuch und nicht im Geldbuch.
      beruf-verdienst: "Verdienst aus Arbeit"
      # Eine Zeile je Verkauf. WAS verkauft wurde, steht nicht im Geldbuch -
      # dieselbe Trennung wie beim Verdienst.
      bundesmarkt-verkauf: "Verkauf an den Bundesmarkt"
      tagesbonus: "Tagesbonus"
      # Die Ladenlizenz steht nur EINMAL im Verlauf, und diese Zeile ist ihr Beleg -
      # eine eigene Spalte dafuer gibt es nicht.
      laden-lizenz: "Ladenlizenz"
      laden-kaution: "Kaution"
      laden-kaution-zurueck: "Kaution zurueck"
      laden-erstattet: "Ladenmiete erstattet"
      # Der einzige WIEDERKEHRENDE Grund dieses Bereichs - einmal je Tag und Laden.
      # Ein Mieter liest ihn oefter als jeden anderen, darum ist das Wort kurz.
      laden-miete: "Ladenmiete"
      # DER HANDEL AN KISTENSHOPS: drei Zeilen fuer EINEN Handel, weil drei verschiedene
      #   Fluesse laufen - aber zwischen ZWEI Konten und einer Senke. Was gezahlt wurde,
      #   steht in der Zeile des Zahlers; was ankam, in der des Empfaengers; was der
      #   Staat nimmt, in einer dritten auf DEMSELBEN Konto wie die zweite, weil der
      #   Staat kein Konto hat. Netto bleibt dem Empfaenger der Erloes, und die Summe
      #   aller Buchungen eines Kontos ist weiterhin sein Stand.
      # BEIDE RICHTUNGEN unter denselben zwei Worten: Beim Kauf zahlt der Kunde, beim
      #   Verkauf der Shopbesitzer. Es ist dieselbe Zahlung und darum dasselbe Wort.
      # WAS gehandelt wurde, steht in keinem dieser Worte - dieselbe Trennung wie bei
      #   beruf-verdienst und bundesmarkt-verkauf. Das Geldbuch fuehrt Geld.
      # DIE HAEUFIGSTEN WORTE DES GANZEN VERLAUFS, sobald die Mall steht: Ein Spieler,
      #   der zwanzigmal einkauft, liest sie zwanzigmal. Darum kurz.
      shop-gekauft: "Einkauf"
      shop-verkauft: "Verkauf"
      # Faellt nur, wenn die GERECHNETE Gebuehr ueber 0 liegt - nicht schon, wenn ein
      #   Satz ueber 0 steht: Bei 5 Prozent auf 19 Mark ist die Gebuehr abgerundet 0,
      #   und eine Zeile ueber 0 Mark waere eine Zeile ohne Geldbewegung. Weil in
      #   handel: ab Werk alle Saetze auf 0 stehen, faellt sie heute nie.
      shop-gebuehr: "Marktgebuehr"
      # Faellt noch seltener: nur, wenn ein Handel NACH dem Zahlen gescheitert ist.
      #   Nach einer genauen Platzrechnung ist der Fall nicht erreichbar - das Wort
      #   steht da, weil "nicht erreichbar" kein Zustand ist, auf den man Geld setzt.
      shop-erstattet: "Handel erstattet"

waehrung:
  # {zahl} setzt das Programm mit deutschen Tausenderpunkten ein. Nur das Wort ist
  # deines; die Zahlform bleibt im Programm, damit ein Tippfehler keine Preise
  # verbiegt. Kein Farbtag - der Betrag wird in andere Saetze eingesetzt.
  # VON HIER KOMMT JEDER BETRAG, DEN EIN SPIELER LIEST: Stand und Verlauf in
  #   /mark, Preise, Gebuehren und Rest in /parzelle, und die zwei Preiszeilen
  #   von /freimarken preis. Aenderst du das Wort, aendert es sich in allen.
  # EINE STELLE SAGT WEITER HART Mark, und sie geht an keinen Spieler: Die
  #   Antwort von /freimarken neuladen nennt bei einer unbrauchbaren Zahl die
  #   Einheit selbst - hoechstens 1000000000 Mark. Wer das Wort hier aendert,
  #   liest sie dort unveraendert, im Chat des Betreibers und nicht im Spiel.
  betrag: "{zahl} Mark"
  # Dasselbe Wort fuer einen Betrag UNTER einer Mark - zum Beispiel 0,40 Mark. Das
  # Komma und die zwei Stellen dahinter kommen aus dem Programm, wie der Tausenderpunkt
  # oben. Gebraucht wird es vom Handbalken des Verdienens: Dort sind es meistens
  # Pfennige, und "0 Mark" waere die falsche Antwort an einen, der gerade arbeitet.
  # AENDERST DU DEIN WAEHRUNGSWORT, aendere es an BEIDEN Stellen.
  pfennige: "{zahl} Mark"

zeit:
  # Muster fuer DateTimeFormatter, kein Satz. Wird beim LADEN uebersetzt - ein
  # unbrauchbares Muster ist eine Klage und kein Absturz mitten in /mark verlauf.
  # Das Jahr fehlt mit Absicht: Ein Verlauf zeigt die letzten Buchungen, und bei
  # zehn Zeilen ist die Jahresangabe zehnmal dieselbe.
  verlauf-muster: "dd.MM. HH:mm"

befehl:
  # Was in /help neben dem Befehl steht. NUR BEIM START GELESEN: die Beschreibungen
  # gehen bei der Anmeldung in den Befehlsbaum; /freimarken neuladen aendert sie
  # nicht, erst ein Neustart. Das sagt die Antwort auf /freimarken neuladen auch.
  # Keine Farbtags - der Befehlsbaum nimmt eine Zeichenkette und kein Component.
  beschreibung:
    freimarken: "Stand, Preise und Welt des Freimarkenbunds"
    parzelle: "Parzellen nehmen, ansehen und verwalten"
    mark: "Dein Guthaben in Mark"
    warp: "Reisen zwischen den Welten des Freimarkenbunds"
    zurueck: "Zurueck zum letzten Ort - nach Tod, Reise oder Teleport"
    tpa: "Frage einen Spieler, ob du zu ihm kommen darfst"
    tpahere: "Lade einen Spieler ein, zu dir zu kommen"
    tpaccept: "Eine Teleportanfrage annehmen"
    tpdeny: "Teleportanfragen ablehnen"
    markt: "Was der Bundesmarkt ankauft - verkauft wird an seinen Schildern"
    laden: "Die Markthalle und ihre Ladeneinheiten"
    shop: "Deine Kistenshops auflisten und fuer andere freigeben"
    beruf: "Deinen Beruf waehlen, ansehen und aufgeben"

parzelle:
  # Das Wort fuer den Preis 0 - es wird in info.frei, info.frei-am-limit und
  # liste.zeile EINGESETZT. Kein Farbtag: ein eingesetzter Wert ist ein Blatt, ein
  # Tag darin stuende dem Spieler woertlich im Chat.
  gratis: "gratis"
  # Dasselbe fuer die erste Parzelle, die ihren Preis gleich erklaert.
  gratis-die-erste: "gratis (die erste)"
  # {betrag} {rest} - die Rechnung nach einem Kauf. Sie steht unter nehmen.erteilt
  # UND unter zusammenlegen.erteilt: ein Schluessel fuer beide, damit derselbe Satz
  # nicht zweimal in dieser Datei steht.
  bezahlt: "<gray>  Bezahlt: {betrag} · Rest: {rest}</gray>"
  # {werbung} - NUR DIE FARBE ist hier deine. Der Satz selbst steht in der
  # config.yml unter hinweise.rang-werbung, denn er ist eine Einstellung DIESES
  # Servers und kein ausgelieferter Satz. Angehaengt wird er genau dort, wo ein Rang
  # wirklich der Grund der Absage ist: info.am-limit, nehmen.grenze,
  # bescheid.grenze-erreicht, bescheid.gruppe-zu-gross und
  # bescheid.noch-frei-am-limit. In Gelb und nicht in Rot - die Absage darueber ist
  # die Nachricht, das hier ist das Angebot.
  rang-werbung: "<yellow>{werbung}</yellow>"
  # Die eine Weltpruefung: Jeder Zweig von /parzelle beginnt damit.
  nicht-in-der-marktstadt: "<red>Parzellen gibt es nur in der Marktstadt.</red>"
  # {x} {z} {tat} - du stehst nicht da, wo der Befehl hinzeigt. {tat} ist eines der
  # vier Wortstuecke darunter: Vier Zweige geben vier verschiedene mit, und darum
  # steht dieser Satz nur EINMAL hier. Wer ihn umstellt, stellt alle vier um.
  steht-nicht-auf: "<red>Du stehst nicht auf Parzelle {x}/{z}. {tat}</red>"
  # Die vier Taten, die dadurch ausblieben - Wortstuecke fuer die Zeile darueber.
  # Kein Farbtag: ein eingesetzter Wert ist ein Blatt.
  tat:
    nichts-aufgegeben: "Nichts aufgegeben."
    nichts-zusammengelegt: "Nichts zusammengelegt."
    nichts-herausgeloest: "Nichts herausgeloest."
    nichts-aufgetrennt: "Nichts aufgetrennt."

  # /parzelle info - was auf dem Boden unter dir steht.
  info:
    # Hier liegt eine Gruppe, wo der Rasterplan noch "Weg" sagt: Nach einem
    # Zusammenlegen ist diese Stelle Bauland. Darunter steht info.eigentuemer.
    gruppenboden: "<gold>Gruppenboden - war einmal Weg</gold>"
    weg: "<gray>Du stehst auf einem Weg - der gehoert allen.</gray>"
    mauer: "<gray>Du stehst auf einer Mauer - die gehoert zur Strasse.</gray>"
    # {x} {z} - der Kopf. Er geht VOR dem Blick in die Ablage hinaus, damit das
    # Erste, was du liest, nicht von der Dauer einer Abfrage abhaengt.
    kopf: "<gold>Parzelle {x}/{z}</gold>"
    ausserhalb: "<gray>  ausserhalb der Marktstadt - wird nicht vergeben</gray>"
    # {preis} - frei und zu haben. {preis} ist das Wort gratis oben oder ein Betrag.
    frei: "<gray>  frei · <green>{preis}</green><dark_gray> · /parzelle nehmen</dark_gray></gray>"
    # {preis} - dieselbe Parzelle, wenn der Rang nichts mehr hergibt: der Preis bleibt
    # stehen, die Einladung nicht. Eine Aufforderung, die mit einer Absage endet,
    # waere Irrefuehrung und keine Werbung.
    frei-am-limit: "<gray>  frei · {preis}</gray>"
    # {anzahl} ZAEHLT - die Absage unter dem Preis, eingerueckt.
    # Derselbe Wortlaut steht ohne Einzug unter bescheid.grenze-erreicht. Zwei
    # Schluessel, weil der Einzug IM Satz steht: aenderst du nur einen, aendert sich
    # nur die eine Stelle.
    am-limit:
      eins: "<red>  Dein Rang erlaubt {anzahl} Parzelle, und so viele hast du schon.</red>"
      viele: "<red>  Dein Rang erlaubt {anzahl} Parzellen, und so viele hast du schon.</red>"
    # {name} - wem sie gehoert. Auch der Gruppenboden oben nimmt diese Zeile.
    eigentuemer: "<gray>  Eigentuemer: <white>{name}</white></gray>"
    # {preis} - gratis-die-erste oben oder ein Betrag.
    gekauft-fuer: "<gray>  Gekauft fuer: <white>{preis}</white></gray>"
    # {namen} - wer sonst hier bauen darf. Nur wenn jemand eingetragen ist.
    mitbauer: "<gray>  Mitbauer: <white>{namen}</white></gray>"
    # {anzahl} - wie viele Felder die Gruppe hat. KEIN ZAEHLT: dieser Satz sagt heute
    # auch bei einem Feld "Feldern". Eine Einzahlform waere eine Verbesserung und
    # keine Umstellung - sie kommt mit eigener Entscheidung, nicht nebenbei.
    gruppe: "<white>  Teil einer Gruppe aus {anzahl} Feldern</white>"
    # Nur fuer den Eigentuemer. Die acht Fuell-Leerzeichen sind die SPALTE - sie
    # stehen hier, damit du sie sehen und verschieben kannst.
    auftrennen-hinweis: "<dark_gray>  /parzelle auftrennen        dieses Feld herausloesen</dark_gray>"
    # Die spitze Klammer ist hier ein ZEICHEN und keine Farbe - darum \\< davor.
    zusammenlegen-hinweis: "<dark_gray>  /parzelle zusammenlegen \\<nord|ost|sued|west></dark_gray>"

  # /parzelle nehmen - der Kauf und seine Absagen.
  nehmen:
    # {x} {z} - darunter steht entweder erste-gratis oder parzelle.bezahlt.
    erteilt: "<green>Parzelle {x}/{z} gehoert jetzt dir</green>"
    erste-gratis: "<gray>  Die erste ist gratis.</gray>"
    kein-bauland: "<red>Hier ist kein Bauland - stell dich auf eine Parzelle.</red>"
    # {name} - der Eigentuemer, der schon eingetragen ist.
    schon-vergeben: "<red>Die gehoert schon <white>{name}</white></red>"
    # {anzahl} ZAEHLT - wie viele dein Rang erlaubt. Danach steht rang-werbung.
    grenze:
      eins: "<red>Du hast schon {anzahl} Parzelle - mehr erlaubt dein Rang nicht.</red>"
      viele: "<red>Du hast schon {anzahl} Parzellen - mehr erlaubt dein Rang nicht.</red>"
    # {betrag} {guthaben} - umstellbar: wer lieber erst das Guthaben nennt, schreibt
    # es um, und nichts bricht.
    zu-wenig: "<red>Die kostet <gold>{betrag}</gold>, du hast {guthaben}.</red>"
    # {von} {bis} - beide kommen ZWEIMAL vor, das ist erlaubt und Absicht.
    # DIE ERSTEN 25 ZEICHEN stehen auch in wache.schutz.ausserhalb - dort gelb und
    # ohne die Grenzen, weil der Spieler dort nichts getippt hat. Zwei Zeilen, zwei
    # Lagen; aenderst du den Anfang, sieh dir die andere an.
    ausserhalb: "<red>Hier endet die Marktstadt. Parzellen gibt es von {von}/{von} bis {bis}/{bis}.</red>"
    # {bescheid} - der Programmname des Falls, den dieser Zweig nicht eigens benennt.
    # Er steht als WERT im Satz, damit du ihn einem Operator weitergeben kannst.
    sonst: "<red>Das ging nicht: {bescheid}</red>"

  # /parzelle liste - deine eigenen Parzellen.
  liste:
    leer: "<yellow>Du hast noch keine Parzelle. Die erste ist gratis - /parzelle nehmen</yellow>"
    # {anzahl} {hoechstzahl}
    kopf: "<gold>Deine Parzellen ({anzahl} von {hoechstzahl})</gold>"
    # {x} {z} {preis} {mitbauer} {gruppe} - eine Zeile je Parzelle. {mitbauer} und
    # {gruppe} sind die beiden Wortstuecke darunter ODER NICHTS: ein leerer Wert
    # verschwindet rueckstandslos. Darum stehen die Trenner in den Wortstuecken.
    zeile: "<gray>  {x}/{z} · {preis}{mitbauer}{gruppe}</gray>"
    # {anzahl} - ein Wortstueck fuer die Zeile darueber, kein Satz. Kein Farbtag.
    mitbauer: " · {anzahl} Mitbauer"
    gruppe: " · Gruppe"
    # {betrag} - nur unter der Hoechstzahl: am Limit kostet keine naechste etwas.
    naechste: "<dark_gray>Die naechste kostet {betrag}</dark_gray>"

  # Die neunzehn Bescheide des Besitzbuchs - die Absage auf jeden Versuch, der nicht
  # durchgeht. Welcher Satz zu welchem Fall gehoert, entscheidet das Programm; du
  # entscheidest, was dort steht. Alle in Rot, weil es Absagen sind.
  bescheid:
    erteilt: "<red>Erledigt.</red>"
    keine-parzelle: "<red>Hier ist keine Parzelle.</red>"
    # TEILT DEN ANFANG "Diese Parzelle gehoert " mit wache.schutz.fremde-parzelle und
    # den Befehl /parzelle nehmen mit wache.schutz.parzelle-frei. Vier Zeilen mit
    # demselben Anfang (mit den zwei Formen von noch-frei-am-limit darunter) - wer
    # einen aendert, sieht sich die anderen an.
    noch-frei: "<red>Diese Parzelle gehoert noch niemandem - nimm sie mit /parzelle nehmen.</red>"
    # {anzahl} ZAEHLT - derselbe Fall, wenn dein Rang schon ausgeschoepft ist. Danach
    # steht rang-werbung.
    noch-frei-am-limit:
      eins: "<red>Diese Parzelle gehoert noch niemandem - aber dein Rang erlaubt {anzahl} Parzelle, und so viele hast du schon.</red>"
      viele: "<red>Diese Parzelle gehoert noch niemandem - aber dein Rang erlaubt {anzahl} Parzellen, und so viele hast du schon.</red>"
    schon-vergeben: "<red>Die gehoert schon jemandem.</red>"
    ausserhalb: "<red>Das liegt ausserhalb der Marktstadt.</red>"
    # {anzahl} ZAEHLT - mit der Zahl, weil "nicht mehr" offen laesst, wie viele es
    # denn sind. Derselbe Wortlaut steht eingerueckt unter info.am-limit.
    grenze-erreicht:
      eins: "<red>Dein Rang erlaubt {anzahl} Parzelle, und so viele hast du schon.</red>"
      viele: "<red>Dein Rang erlaubt {anzahl} Parzellen, und so viele hast du schon.</red>"
    # Derselbe Wortlaut steht MIT zwei Leerzeichen Einzug unter
    # zusammenlegen.zu-wenig. Zwei Schluessel, weil der Einzug IM Satz steht:
    # aenderst du nur einen, aendert sich nur die eine Stelle.
    zu-wenig-mark: "<red>Dein Guthaben reicht nicht.</red>"
    nicht-eigentuemer: "<red>Das darf nur der Eigentuemer.</red>"
    schon-eingetragen: "<red>Steht schon auf der Liste.</red>"
    nicht-eingetragen: "<red>Stand gar nicht auf der Liste.</red>"
    teil-einer-gruppe: "<red>Die Parzelle gehoert zu einer Gruppe - das geht nur ueber die ganze Gruppe.</red>"
    nachbar-frei: "<red>Dort drueben ist keine Parzelle vergeben.</red>"
    nachbar-fremd: "<red>Die Nachbarparzelle gehoert jemand anderem.</red>"
    schon-in-gruppe: "<red>Die beiden gehoeren zu zwei verschiedenen Grundstuecken. Trenne eines auf und haenge die Felder einzeln an.</red>"
    schon-zusammen: "<red>Die beiden sind schon dasselbe Grundstueck.</red>"
    # {anzahl} ZAEHLT - diese Zahl ist die GRUPPENGROESSE und nicht die Zahl deiner
    # Parzellen. Danach steht rang-werbung. Auch /parzelle zusammenlegen nimmt diese
    # Zeile, wenn die Gruppe zu gross wuerde.
    gruppe-zu-gross:
      eins: "<red>Dein Rang erlaubt hoechstens {anzahl} Feld je Gruppe.</red>"
      viele: "<red>Dein Rang erlaubt hoechstens {anzahl} Felder je Gruppe.</red>"
    keine-gruppe: "<red>Hier ist keine Gruppe.</red>"
    auf-dem-weg: "<red>Stell dich auf das Feld, das du meinst - nicht auf den Weg.</red>"
    haelt-zusammen: "<red>Dieses Feld haelt dein Grundstueck zusammen. Loese erst eines am Rand heraus.</red>"

  # /parzelle mitbauer - wer sonst auf deiner Parzelle bauen darf.
  mitbauer:
    keine-parzelle: "<red>Hier ist keine vergebene Parzelle.</red>"
    # {x} {z} {namen} - die Liste. {namen} ist entweder die Aufzaehlung oder das
    # Wort darunter.
    kopf: "<gold>Mitbauer auf {x}/{z}: <white>{namen}</white></gold>"
    # Das Wort fuer die leere Liste - es wird in kopf EINGESETZT. Kein Farbtag.
    niemand: "niemand"
    # Nur fuer den Eigentuemer. Die spitzen Klammern um name sind ZEICHEN und keine
    # Farbe - darum \\< davor.
    befehle: "<dark_gray>/parzelle mitbauer hinzu \\<name> · weg \\<name></dark_gray>"
    unbekannt: "<red>Den kenne ich nicht. Er muss einmal auf dem Server gewesen sein.</red>"
    # {name} - eingetragen.
    hinzu-erteilt: "<green>{name} darf hier jetzt bauen.</green>"
    # {name} - stand schon auf der Liste. In Gelb und nicht in Rot: Es ist nichts
    # schiefgegangen, es war nur schon so.
    schon-drin: "<yellow>{name} darf hier ohnehin bauen.</yellow>"
    niemand-mit-dem-namen: "<red>Steht hier niemand mit dem Namen - /parzelle mitbauer zeigt die Liste.</red>"
    # {name} - ausgetragen.
    weg-erteilt: "<green>{name} darf hier nicht mehr bauen.</green>"
    # {name} - stand gar nicht auf der Liste.
    nicht-drin: "<yellow>{name} stand gar nicht auf der Liste.</yellow>"

  # /parzelle aufgeben - und die Warnung davor.
  aufgeben:
    nicht-deine: "<red>Das ist nicht deine Parzelle.</red>"
    gruppe: "<red>Die Parzelle gehoert zu einer Gruppe - erst /parzelle auftrennen.</red>"
    # {x} {z} - DREI Chatzeilen in einer Zeile dieser Datei, getrennt von der
    # Umbruchmarke. Jede traegt ihre eigene Farbe: die Frage gelb, die Folgen grau,
    # die Bestaetigung rot. Ein Satz und nicht drei, damit du ihn umstellen kannst.
    warnung: "<yellow>Parzelle {x}/{z} aufgeben?</yellow>\n<gray>  Es gibt kein Geld zurueck, und gebaut bleibt stehen.</gray>\n<red>  /parzelle aufgeben bestaetigen {x} {z}</red>"
    # {x} {z}
    erteilt: "<green>Parzelle {x}/{z} ist wieder frei.</green>"

  # /parzelle zusammenlegen - zwei Parzellen werden ein Grundstueck.
  zusammenlegen:
    # {x} {z} {nachbar-x} {nachbar-z} {betrag} {guthaben} - FUENF Chatzeilen in
    # einer Zeile dieser Datei. Der Nachbar kommt schon gerechnet herein: Die
    # Richtung bestimmt ihn, und im Satz steht seine Nummer.
    warnung: "<yellow>Parzelle {x}/{z} mit {nachbar-x}/{nachbar-z} zusammenlegen?</yellow>\n<gray>  Gebuehr: <gold>{betrag}</gold> · du hast {guthaben}\n  Der Weg dazwischen wird dein Bauland.\n  Beim Auftrennen kommt er zurueck - und raeumt alles weg, was dann\n  darauf steht.</gray>"
    # Statt der Bestaetigung, wenn das Geld nicht reicht. Derselbe Wortlaut steht
    # OHNE Einzug unter bescheid.zu-wenig-mark - zwei Schluessel, weil der Einzug
    # im Satz steht.
    zu-wenig: "<red>  Dein Guthaben reicht nicht.</red>"
    # {richtung} {x} {z} - {richtung} ist das Befehlswort nord, ost, sued oder west.
    bestaetigen: "<yellow>  /parzelle zusammenlegen {richtung} bestaetigen {x} {z}</yellow>"
    # {anzahl} - wie viele Felder das Grundstueck jetzt hat. KEIN ZAEHLT: dieser
    # Satz sagt heute auch bei einem Feld "Feldern", und eine Einzahlform waere
    # eine Verbesserung und keine Umstellung. Darunter steht parzelle.bezahlt.
    erteilt: "<green>Ein Grundstueck aus {anzahl} Feldern.</green>"

  # /parzelle auftrennen - das Grundstueck wird wieder zu Parzellen.
  auftrennen:
    # {anzahl} - aufgetrennt. Dieselbe Zeile liest auch, wer ein Feld aus einer
    # Gruppe aus ZWEI Feldern loest: Was uebrig bliebe, waere ein einzelnes Feld,
    # also wird ganz aufgetrennt - und dann ist es genau dieser Satz.
    erteilt: "<green>Aufgetrennt - {anzahl} eigenstaendige Parzellen.</green>"
    # Die Zeile unter BEIDEN Warnungen des Herausloesens - beim Einzelfeld und bei
    # der Gruppe aus zwei Feldern. Darum steht sie hier und nicht unter feld.
    weg-kommt-zurueck: "<gray>  Der Weg dorthin kommt zurueck. Geld gibt es keines zurueck.</gray>"
    # /parzelle auftrennen alles - die ganze Gruppe auf einmal.
    alles:
      # {anzahl} - DREI Chatzeilen in einer Zeile dieser Datei. Die beiden
      # Anfuehrungszeichen um alles sind Zeichen IM Wert; weil jeder Wert dieser
      # Datei selbst in Anfuehrungszeichen steht, traegt jedes einen Backslash.
      warnung: "<yellow>Grundstueck aus {anzahl} Feldern ganz auftrennen?</yellow>\n<gray>  ALLE Wege zwischen den Feldern kommen zurueck. Geld gibt es keines zurueck.\n  Fuer ein einzelnes Feld: stell dich darauf und nimm /parzelle auftrennen ohne \"alles\".</gray>"
      # {x} {z}
      bestaetigen: "<red>  /parzelle auftrennen alles bestaetigen {x} {z}</red>"
    # /parzelle auftrennen - nur das Feld, auf dem du stehst.
    feld:
      # {anzahl} - ZWEI Felder lassen sich nicht teilen, also wird ganz
      # aufgetrennt. DREI Chatzeilen; danach steht weg-kommt-zurueck.
      warnung-zwei-felder: "<yellow>Grundstueck aus {anzahl} Feldern auftrennen?</yellow>\n<gray>  Es hat nur zwei Felder - eines allein geht nicht heraus, also wird\n  es ganz aufgetrennt.</gray>"
      # {x} {z} {anzahl} - das Feld geht heraus, der Rest bleibt Grundstueck. ZWEI
      # Chatzeilen; danach steht weg-kommt-zurueck.
      warnung: "<yellow>Das Feld {x}/{z} aus dem Grundstueck herausloesen?</yellow>\n<gray>  Die anderen {anzahl} Felder bleiben ein Grundstueck.</gray>"
      # {x} {z}
      bestaetigen: "<red>  /parzelle auftrennen bestaetigen {x} {z}</red>"
      # {x} {z} {anzahl} - herausgeloest, und wie viele noch Gruppe sind.
      erteilt: "<green>Feld {x}/{z} herausgeloest - das Grundstueck hat noch {anzahl} Felder.</green>"

  # Was die Weltarbeit kostet - vor jedem Auftrennen abgeschaetzt. Verlust in Rot,
  # Fuellung in Grau: Hier geht etwas weg, dort kommt etwas hinzu.
  aufwand:
    # {anzahl} ZAEHLT - was von der Flaeche verschwindet. Die Einzahl nennt die 1
    # ausgeschrieben; du darfst dort auch {anzahl} schreiben, dann steht die Zahl.
    # Bei NULL wird gar nichts gesendet - das entscheidet das Programm, nicht diese
    # Datei.
    verschwindet:
      eins: "<red>  Dabei verschwindet 1 Block von der Flaeche.</red>"
      viele: "<red>  Dabei verschwinden {anzahl} Bloecke von der Flaeche.</red>"
    # {anzahl} ZAEHLT - was wieder gefuellt wird. "Fehlstelle" und nicht "unter
    # der Flaeche", weil die Oberflaeche selbst dazugehoert.
    verfuellt:
      eins: "<gray>  1 Fehlstelle wird wieder gefuellt.</gray>"
      viele: "<gray>  {anzahl} Fehlstellen werden wieder gefuellt.</gray>"
    # Statt der beiden Zahlen, wenn es nichts zu raeumen gibt.
    nichts: "<gray>  Auf der Wegflaeche steht nichts - es geht nichts verloren.</gray>"

  # {anzahl} ZAEHLT - die Abschaetzung liest jeden Block ueber dem Weg und darf
  # darum nicht beliebig oft hintereinander laufen.
  abklingzeit:
    eins: "<gray>Einen Augenblick - die Abschaetzung liest jeden Block ueber dem Weg. Noch {anzahl} Sekunde.</gray>"
    viele: "<gray>Einen Augenblick - die Abschaetzung liest jeden Block ueber dem Weg. Noch {anzahl} Sekunden.</gray>"

  # Was aus der Bodenarbeit geworden ist - sie folgt jedem Zusammenlegen und jedem
  # Auftrennen.
  boden:
    # {gelungen} {anzahl} - {gelungen} ist eines der zwei Wortstuecke darunter.
    # {anzahl} ist eine NACKTE Zahl ohne Tausenderpunkt; nur Geldbetraege tragen
    # ihn. "geaendert" und nicht nur die Zahl: Darin stecken der Weg selbst und
    # das, was geraeumt wurde.
    gelungen: "<gray>  {gelungen} ({anzahl} Bloecke geaendert).</gray>"
    # Die zwei Wortstuecke fuer die Zeile darueber. Kein Farbtag.
    weg-ist-bauland: "Der Weg dazwischen ist Bauland"
    weg-ist-zurueck: "Der Weg ist zurueck"
    # Die Ablage stimmt, die Welt nicht - das ist die harmlose Haelfte des Fehlers,
    # und der Spieler darf trotzdem bauen.
    fehler: "<red>  Der Boden liess sich nicht aendern. Die Parzellen stimmen - sag einem Operator Bescheid.</red>"

# /tpa, /tpahere, /tpaccept und /tpdeny - eine Reise nur mit Zustimmung.
#
# DAS BESONDERE AN DIESEM ABSCHNITT: Hier lesen ZWEI Spieler. Wer fragt, bekommt
# eine Zeile; wer gefragt wird, bekommt zwei. Beim Annehmen bekommen beide eine.
# Darum traegt jeder Satz genau EINEN Namen, und zwar immer den des ANDEREN - wer
# {name} aus einem dieser Saetze nimmt, laesst den Leser raten, um wen es geht.
# Welcher Satz an wen geht, steht im Kommentar darueber.
anfrage:
  # Es steht keine Anfrage offen. DIESELBE Zeile bei /tpaccept und bei /tpdeny, und
  # darum steht sie eine Ebene hoeher als annehmen und ablehnen: Du aenderst sie
  # einmal, und beide Befehle sagen das Neue. Keine Zahl darin - "0 Anfragen
  # abgelehnt." gibt es nicht und soll es nicht geben.
  niemand: "<gray>Es fragt niemand.</gray>"

  # /tpa <spieler> und /tpahere <spieler> - die Frage stellen.
  frage:
    # {name} - den gibt es nicht, ODER er ist unsichtbar. EIN Satz fuer beide
    # Faelle, und das ist Absicht: Zwei Saetze verrieten, dass da jemand ist, den
    # du nicht sehen sollst. {name} ist darum das GETIPPTE Wort und nicht der echte
    # Name. Schreibe hier nichts hinein, was den Unterschied verraet.
    # NICHT ZU VERWECHSELN: /spielzeit hat eine eigene, laengere Absage, die mit
    # denselben vier Woertern beginnt ("... ist nicht da. Gezeigt werden kann nur
    # die Spielzeit eines anwesenden Spielers."). Die steht unter
    # spielzeit.nicht-da in derselben Datei. Dieser Satz hier gilt NUR fuer /tpa
    # und /tpahere - er ist also nicht halb in Kraft, sondern ganz, und der andere
    # ist ein anderer Satz.
    nicht-da: "<red>{name} ist nicht da.</red>"
    # Er hat sich selbst gefragt. Ohne {name} - seinen eigenen kennt er.
    bei-dir: "<gray>Du bist schon bei dir.</gray>"
    # {name} - dieselbe Frage steht schon offen, es ist nichts hinzugekommen.
    steht-noch: "<gray>Diese Anfrage an {name} steht noch.</gray>"
    # {name} - die Quittung an den FRAGENDEN. {name} ist der Angefragte.
    gestellt: "<gray>Angefragt bei {name} - er oder sie muss zustimmen.</gray>"
    # {name} - die Frage an den ANGEFRAGTEN, Zweig /tpahere. {name} ist der
    # Fragende. Ein eigener Satz und nicht ein Wortstueck in moechte-kommen: Es
    # sind zwei verschiedene Sachverhalte, nicht Einzahl gegen Mehrzahl - hier
    # kommt der Leser, dort der Fragende.
    eingeladen: "<gold>{name} laedt dich ein zu kommen.</gold>"
    # {name} - dieselbe Frage, Zweig /tpa: der Fragende will selbst kommen.
    moechte-kommen: "<gold>{name} moechte zu dir kommen.</gold>"
    # Die zweite Zeile an den Angefragten - sie steht unter BEIDEN Fragen oben.
    # Ein eigener Satz und keine Umbruchmarke an eingeladen/moechte-kommen: Eine
    # Umbruchmarke sendet beide Zeilen in DERSELBEN Farbe, und diese ist grau,
    # waehrend die Frage golden ist. Die Minute ist die Gueltigkeit aus dem
    # Programm - aenderst du das Wort, aendert sich die Frist nicht.
    hinweis: "<gray>/tpaccept zum Annehmen, /tpdeny zum Ablehnen. Die Anfrage laeuft nach einer Minute ab.</gray>"

  # /tpaccept - annehmen. Hier lesen beide Spieler, je eine eigene Zeile.
  annehmen:
    # Wer gefragt hatte, ist inzwischen abgemeldet.
    fragender-weg: "<red>Wer gefragt hatte, ist nicht mehr da.</red>"
    # {name} - an den ANNEHMER, wenn er selbst reist (/tpahere). {name} ist der
    # Fragende. Das Gegenstueck dazu ist quittung-er-kommt darunter: dasselbe
    # Ereignis, der andere Leser. Aendere die beiden gemeinsam, sonst erzaehlen
    # zwei Spieler einander verschiedene Dinge.
    du-kommst: "<green>Du kommst zu {name}.</green>"
    # {name} - an den ANNEHMER, wenn der Fragende reist (/tpa). Gegenstueck:
    # quittung-du-kommst.
    er-kommt: "<green>{name} kommt zu dir.</green>"
    # {name} - an den FRAGENDEN, wenn er selbst reist (/tpa). {name} ist der
    # Annehmer. Gegenstueck: er-kommt darueber.
    quittung-du-kommst: "<green>{name} hat angenommen - du kommst.</green>"
    # {name} - an den FRAGENDEN, wenn der Annehmer reist (/tpahere). Gegenstueck:
    # du-kommst darueber.
    quittung-er-kommt: "<green>{name} hat angenommen und kommt zu dir.</green>"
    # {anzahl} ZAEHLT - wie viele Anfragen nach dem Annehmen noch warten. Die
    # angenommene ist nicht mehr dabei. Die Zahl ist NACKT, ohne Tausenderpunkt -
    # den tragen nur Geldbetraege. Bei NULL wird gar nichts gesendet; das
    # entscheidet das Programm, nicht diese Datei.
    weitere:
      eins: "<gray>Es warten noch {anzahl} Anfrage.</gray>"
      viele: "<gray>Es warten noch {anzahl} Anfragen.</gray>"

  # /tpdeny - alle offenen Anfragen ablehnen.
  ablehnen:
    # {anzahl} ZAEHLT - wie viele weggenommen wurden. Der GANZE Satz steht in
    # beiden Formen und nicht nur das Zaehlwort: nur so kannst du ihn umstellen und
    # nicht bloss faerben. Die Zahl ist NACKT, ohne Tausenderpunkt. War nichts da,
    # steht oben anfrage.niemand - nicht eine dritte Form hier.
    abgelehnt:
      eins: "<gray>{anzahl} Anfrage abgelehnt.</gray>"
      viele: "<gray>{anzahl} Anfragen abgelehnt.</gray>"

spielzeit:
  # Die Ueberschrift ueber der Anzeige. Sie ist die EINZIGE goldene Zeile dieses
  # Befehls - daran erkennt der Spieler, wo seine Antwort anfaengt.
  kopf:
    # KEIN {name}, und das mit Absicht: Bei
    # /execute as <spieler> run freimarken spielzeit liest die KONSOLE diese Zeile
    # ueber den Zahlen eines fremden Spielers. "Deine Spielzeit, {name}" waere dort
    # eine Luege.
    selbst: "<gold>Deine Spielzeit</gold>"
    # {name} - die Ueberschrift ueber der Anzeige eines ANDEREN Spielers.
    fremd: "<gold>Spielzeit von {name}</gold>"
  # {dauer} {tag} {zone} - die erste der vier Zeilen unter der Ueberschrift.
  #
  # DIE SPALTE STEHT HIER UND NICHT IM PROGRAMM. "heute" plus DREI Leerzeichen und
  #   "gesamt" plus ZWEI Leerzeichen sind beide acht Zeichen breit; mit dem Einzug
  #   von zwei Zeichen beginnt die Dauer in BEIDEN Zeilen in Spalte 11. Nimm hier
  #   ein Leerzeichen heraus, und die Spalte rutscht - aendere die zwei Zeilen
  #   gemeinsam. Die DREI Leerzeichen vor der Klammer sind ein zweiter, eigener
  #   Abstand und haben mit der Spalte nichts zu tun.
  # {dauer} kommt aus dauer.* weiter unten, {tag} aus tag-muster, {zone} ist die
  #   eingestellte Tagesgrenze aus der config.yml - eine technische Kennung wie
  #   Europe/Berlin und kein Wort.
  heute: "<gray>  heute   {dauer}   ({tag}, Tagesgrenze {zone})</gray>"
  # {dauer} - die zweite Zeile. Die Spaltenbreite steht bei heute darueber erklaert.
  gesamt: "<gray>  gesamt  {dauer}</gray>"
  # {dauer} {heute} {prozent} - die dritte Zeile: wie viel von der gemessenen Zeit
  #   TAETIG war. "taetig" ist wie "gesamt" sechs Zeichen lang und braucht darum
  #   ZWEI Leerzeichen, damit die Dauer in derselben Spalte 11 beginnt wie darueber.
  # {dauer} ist die taetige Zeit ueber alle Tage, {heute} die von heute, {prozent}
  #   ihr Anteil an der gemessenen Zeit in Prozent - abgerundet, damit die Zahl eine
  #   Untergrenze ist. Das Zeichen % steht HIER und nicht im Programm.
  # Warum der Anteil dabeisteht: Eine nackte Dauer ohne ihren Bezug ist nicht zu
  #   lesen - "40 h taetig" heisst bei 45 h Anwesenheit etwas anderes als bei 400.
  # Der LAUFENDE Takt ist hier noch nicht mitgezaehlt: Ob er taetig war, entscheidet
  #   sich erst, wenn er abgerechnet wird. Darum steht hier kurz nach dem Beitritt
  #   eine 0, obwohl der Spieler spielt. Woran die Messstelle Taetigkeit erkennt,
  #   steht im Abschnitt messstelle der config.yml.
  taetig: "<gray>  taetig  {dauer}   ({heute} heute, {prozent} % der Zeit)</gray>"
  zustand:
    # {dauer} {grenze} - die dritte Zeile, solange gerade NICHT gezaehlt wird.
    # {grenze} ist die eingestellte Untaetigkeitsgrenze in Minuten; das Wort "min"
    # dahinter steht HIER und nicht in dauer.minuten, damit du diese Zeile umstellen
    # kannst, ohne die Dauerformen mitzuaendern. Dieser Satz und abwesenheit weiter
    # unten koennen sich NIE begegnen: Ist die Regel aus, gibt es keinen untaetigen
    # Zustand.
    untaetig: "<gray>  wird gerade NICHT gezaehlt - untaetig seit {dauer}, gezaehlt wird bis {grenze} min. Ein Schritt oder ein Tastendruck zaehlt wieder.</gray>"
    # {menge} {abstand} {abwesenheit} - dieselbe dritte Zeile, solange gezaehlt wird.
    # {abstand} ist eine der zwei Zeilen aus abstand darunter. {abwesenheit} ist der
    # Zusatz darunter und bleibt LEER, solange die Untaetigkeitsregel an ist - das
    # entscheidet das Programm und nicht diese Datei.
    gezaehlt: "<gray>  wird gezaehlt - die letzten {menge} sind noch nicht geschrieben, {abstand}{abwesenheit}</gray>"
    # Wie die Zeile darueber endet. KEINE Farbtags: Die zwei Formen werden in
    # gezaehlt EINGESETZT und sind dort ein Blatt - ein Tag darin stuende dem
    # Spieler woertlich im Chat.
    abstand:
      # {takt} - der eingestellte Schreibtakt in Sekunden. Der normale Fall.
      takt: "das geschieht alle {takt} s."
      # Nach einem Fehlschlag der Datenbank: Der Takt rechnet weiter und schreibt
      # mehrere Taktlaengen lang nicht. KEINE Zahl darin, und das ist Absicht - wie
      # viele Schlaege ausgesetzt werden, leitet das Programm aus seiner eigenen
      # Klemmenregel ab. Eine Zahl hier waere beim naechsten Aendern dort still
      # falsch, und keine Probe wuerde rot.
      wartet: "der naechste Schreibzug wartet auf die Datenbank - gezaehlt wird weiter, nachgeschrieben wird alles."
    # {pfad} - angehaengt an gezaehlt, solange die Untaetigkeitsregel AUS ist. Das
    # FUEHRENDE Leerzeichen gehoert dazu: Der Zusatz haengt an derselben Chatzeile.
    # {pfad} ist der Ort in der config.yml, an dem die Regel steht - er wird
    # eingesetzt und nicht hier getippt, damit er beim Umbenennen nicht still falsch
    # wird. Die 0 dahinter ist der Wert, bei dem die Regel aus ist, und steht darum
    # fest im Satz. Kein Farbtag: eingesetzter Wert.
    abwesenheit: " Abwesenheit zaehlt auf diesem Server mit ({pfad}: 0)."
  # Die vierte und letzte Zeile - ohne sie meldet ein Spieler mit 200 Stunden einen
  # Fehler, weil er eine kleine Zahl liest. Sie ist heute grau wie die Zeilen
  # darueber; du kannst ihr jetzt eine eigene Farbe geben, zum Beispiel
  # <dark_gray>, ohne dass eine Zeile Programm geaendert wird.
  hinweis: "<gray>  Gezaehlt wird erst seit dem Einbau dieser Messung - Spielstunden von davor stehen nirgends, jeder faengt bei 0 an.</gray>"
  # Statt der vier Zeilen, wenn die Ablage gerade nicht antwortet. Grau und MIT
  # Einzug, weil sie an ihrer Stelle steht - eine rote Zeile mitten in einer grauen
  # Liste sieht nach einem Absturz aus. Willst du sie rot, ist das deine
  # Entscheidung: tausche <gray> gegen <red>.
  nicht-lesbar: "<gray>  Die Spielzeit ist gerade nicht lesbar - gezaehlt wird trotzdem. Sag einem Operator Bescheid.</gray>"
  # Die Absage an die Konsole. OHNE Einzug - sie steht nicht unter einer
  # Ueberschrift, sondern allein. Die spitze Klammer um spieler ist ein ZEICHEN und
  # keine Farbe, darum ZWEI Backslashes davor. Das Wort darin ist der Name des
  # Befehlsarguments: Wird es im Programm umbenannt, gehoert es hier mitgeaendert.
  keine-konsole: "<gray>Die Konsole spielt nicht. /freimarken spielzeit \\<spieler> nennt die Zeit eines anwesenden Spielers.</gray>"
  # {name} - die Absage, wenn der gesuchte Spieler nicht da ist. Die EINZIGE rote
  # Zeile dieses Befehls, und ohne Einzug. Nicht zu verwechseln mit nicht-lesbar
  # darueber: Diese hier soll der Spieler wirklich als Fehler lesen.
  nicht-da: "<red>{name} ist nicht da. Gezeigt werden kann nur die Spielzeit eines anwesenden Spielers.</red>"
  dauer:
    # Die fuenf Formen einer Dauer. KEINE Farbtags: Sie werden in heute, gesamt,
    # zustand.untaetig und zustand.gezaehlt EINGESETZT und sind dort ein Blatt.
    #
    # WELCHE Form genommen wird, entscheidet das Programm an der Zahl - und die
    #   zweistellige Auffuellung der Minuten hinter einer Stunde ebenfalls: "3 h
    #   5 min" ist von "3 h 50 min" auf einen Blick nicht zu unterscheiden. Du
    #   bekommst {minuten} also schon aufgefuellt. Dieselbe Trennung wie bei
    #   waehrung.betrag: Das WORT ist deines, die Zahlform bleibt im Programm.
    # DIE EINHEITEN stehen in JEDER Form einzeln, und das ist Absicht: So kannst du
    #   eine Zeile umstellen, ohne die anderen mitzuaendern. Der Preis ist, dass
    #   "min" an vier Stellen dieses Abschnitts steht - dreimal hier und einmal in
    #   zustand.untaetig. Wer die Einheit aendern will, muss alle vier finden.
    # {stunden} {minuten} - ab einer Stunde.
    stunden-minuten: "{stunden} h {minuten} min"
    # {minuten} - unter einer Stunde.
    minuten: "{minuten} min"
    # Unter einer Minute, wo Sekunden nicht gezeigt werden. Die 1 steht fest im
    # Wort: Es ist eine feststehende Wendung und keine Zahlform.
    unter-einer-minute: "unter 1 min"
    # Gar nichts. Die 0 steht fest im Wort, aus demselben Grund.
    nichts: "0 min"
    # {sekunden} - unter einer Minute, wo Sekunden gezeigt werden: bei der laufenden
    # Sitzung und bei der Untaetigkeit. Dort sieht ein Spieler zu, ob die Zahl
    # waechst, und "unter 1 min" waere genau da unbrauchbar.
    sekunden: "{sekunden} s"
  # Muster fuer DateTimeFormatter, kein Satz - der Tag in der Zeile heute. Wird beim
  # LADEN uebersetzt, ein unbrauchbares Muster ist also eine Klage und kein Absturz
  # mitten im Befehl. Das Jahr steht hier mit drin, anders als bei
  # zeit.verlauf-muster: Eine Spielzeit ist die eines Tages und nicht einer Liste.
  tag-muster: "dd.MM.yyyy"

# DIE BERUFE - was ein Spieler waehlt, was es kostet und was ihn bremst.
#
# Dieser Abschnitt steht unter beruf, also unter dem BEFEHL, den du tippst - wie
# anfrage und spielzeit und anders als reise. Der Grund ist derselbe wie dort, nur
# umgekehrt: Diese Saetze loest genau EIN Befehl aus, naemlich /beruf. Es gibt keinen
# zweiten Weg zu einem Beruf.
#
# WELCHE Berufe es gibt, steht NICHT hier, sondern in der config.yml unter
# berufe.liste. Hier stehen nur die WORTE dazu - unter beruf.name, ein Wort je
# Schluessel. Traegst du dort einen Beruf ein, brauchst du hier eine Zeile dazu, sonst
# startet Freimarken nicht: Lieber ein verweigerter Start als ein Zunfthaus, in dem
# "bergmann" steht.
#
# DIE DAUER in beruf.stand.frist und beruf.absage.sperrfrist kommt aus demselben
# Rechenweg wie jede andere Dauer dieses Plugins - die Formen dafuer stehen oben unter
# spielzeit.dauer. Aenderst du sie dort, aendern sie sich auch hier. Das ist Absicht:
# Zwei Rechnungen fuer dieselbe Frist liefen eines Tages auseinander, und dann lies du
# an einer Stelle "2 h 05 min" und an der anderen "2 Stunden" fuer dieselbe Zahl.
#
# HALB IN KRAFT (Verdienst): Kein Satz hier sagt, was ein Beruf EINBRINGT, und zwar
#   weil es noch nichts einbringt. Das kommt mit seinem eigenen Bauschritt; dann
#   stehen die Zeilen dazu hier, und diese Warnung ist weg. Was heute wirkt, ist
#   allein das WAEHLEN: wer was halten darf, was ein Wechsel kostet und wie lange er
#   danach warten muss.
beruf:
  liste:
    # Die Ueberschrift von /beruf liste.
    kopf: "<gold>Berufe im Freimarkenbund</gold>"
    # {name} - ein Grundberuf, zu dem es keine Spezialisierung gibt.
    beruf: "<gray>  <white>{name}</white></gray>"
    # {name} {spezialisierungen} - ein Grundberuf MIT seinen Spezialisierungen. Zwei
    # Saetze und nicht einer mit leerem Wert: Sonst stuende hinter einem Grundberuf
    # ohne Spezialisierung ein Gedankenstrich und dahinter nichts.
    beruf-mit: "<gray>  <white>{name}</white> · dazu: {spezialisierungen}</gray>"
    # Was zwischen zwei Spezialisierungen steht. DARF LEER SEIN - dann stossen die
    # Namen aneinander. Ein Trenner sendet keine eigene Zeile.
    trenner: ", "
    # Es gibt gar keinen Beruf in der config.yml. Du liest das nur, wenn du die Liste
    # gerade leerst - ohne Berufe bleibt Freimarken aus.
    leer: "<gray>Es sind keine Berufe eingetragen.</gray>"
    # Die letzte Zeile der Liste.
    fuss: "<gray>  /beruf waehlen \\<beruf> · /beruf stand</gray>"
  stand:
    # Die Ueberschrift von /beruf stand.
    kopf: "<gold>Dein Beruf</gold>"
    # Er hat noch NIE einen gewaehlt. Nicht dasselbe wie "haelt gerade keinen": Wer
    # alles abgelegt hat, liest stattdessen die Zeile frist darunter.
    keiner: "<gray>Du hast noch keinen Beruf gewaehlt.</gray>"
    # {name} - ein gehaltener Grundberuf.
    grundberuf: "<gray>  <white>{name}</white></gray>"
    # {name} {grundberuf} - eine gehaltene Spezialisierung und der Beruf, auf dem sie
    # aufbaut.
    spezialisierung: "<gray>  <white>{name}</white> · baut auf {grundberuf} auf</gray>"
    plaetze:
      # {gehalten} {erlaubt} - je Rolle eine eigene Zeile, damit du sie umstellen und
      # eine davon weglassen kannst. Auf einem Server ohne Spezialisierungen ist die
      # zweite Zeile ohnehin eine Null von Null.
      grundberufe: "<gray>  Grundberufe:       {gehalten} von {erlaubt}</gray>"
      spezialisierungen: "<gray>  Spezialisierungen: {gehalten} von {erlaubt}</gray>"
    # {dauer} - die Sperrfrist laeuft noch. Dieselbe Zahl, die auch die Absage nennt.
    frist: "<yellow>  Du kannst in {dauer} wieder wechseln.</yellow>"
    # {betrag} - was ein Wechsel kostet. Steht hier, damit es nicht erst in der Absage
    # steht.
    gebuehr: "<gray>  Ein Beruf aufgeben kostet {betrag}.</gray>"
  # {name} - gewaehlt. Ohne Betrag: Waehlen ist immer gratis, bezahlt wird das
  # Aufgeben.
  gewaehlt: "<green>Du bist jetzt {name}.</green>"
  verlassen:
    # {name} {betrag} - abgelegt, und was dafuer gebucht wurde.
    getan: "<gray>Du hast {name} aufgegeben. Gebucht: <gold>{betrag}</gold>.</gray>"
    # {name} {schluessel} {betrag} {dauer} - die Rueckfrage VOR dem Aufgeben, wie bei
    # /parzelle aufgeben. ZWEI Werte fuer denselben Beruf: {name} ist das Wort von
    # unten, {schluessel} das, was in der Befehlszeile zum Abschreiben stehen muss.
    warnung: "<yellow>{name} aufgeben?</yellow>\n<gray>  Es kostet <gold>{betrag}</gold>, und danach kannst du {dauer} lang nicht wechseln.</gray>\n<red>  /beruf verlassen {schluessel} bestaetigen</red>"
  absage:
    # {eingabe} - diesen Beruf gibt es nicht. Hier steht, was DU getippt hast, und
    # kein Wort von unten: Es gibt ja keines dafuer.
    unbekannt: "<red>Den Beruf \"{eingabe}\" gibt es nicht. /beruf liste zeigt alle.</red>"
    # {name} - er haelt ihn schon.
    schon-gehalten: "<gray>Du bist schon {name}.</gray>"
    # {name} - er haelt ihn nicht, es gibt nichts aufzugeben.
    nicht-gehalten: "<gray>Du bist nicht {name}.</gray>"
    # {erlaubt} - alle Grundberufsplaetze sind besetzt.
    grundberufe-voll: "<red>Du hast keinen Platz mehr fuer einen Grundberuf (erlaubt: {erlaubt}). Gib einen auf, dann geht ein neuer.</red>"
    # {erlaubt} - alle Spezialisierungsplaetze sind besetzt.
    spezialisierung-voll: "<red>Du hast keinen Platz mehr fuer eine Spezialisierung (erlaubt: {erlaubt}).</red>"
    # Ihm fehlt das Recht fuer Spezialisierungen. OHNE den Namen des Rechts - damit
    # kann ein Spieler nichts anfangen. Willst du hier auf einen Rang hinweisen,
    # schreib es in diesen Satz.
    ohne-recht: "<red>Spezialisierungen sind noch nicht fuer dich freigegeben.</red>"
    # {name} - ihm fehlt der Grundberuf, den diese Spezialisierung voraussetzt. Im
    # Satz steht der GEBRAUCHTE Beruf, nicht der gewuenschte.
    grundberuf-fehlt: "<red>Dafuer musst du zuerst {name} sein.</red>"
    # {name} - der Grundberuf bleibt, solange seine Spezialisierung steht. Im Satz
    # steht die SPEZIALISIERUNG: Sie ist das, was zuerst weg muss.
    traegt-spezialisierung: "<red>Dafuer musst du zuerst {name} aufgeben.</red>"
    # {dauer} - die Sperrfrist laeuft noch.
    sperrfrist: "<red>Du kannst erst in {dauer} wieder wechseln.</red>"
    # {betrag} {guthaben} - das Geld reicht nicht.
    geld-fehlt: "<red>Aufgeben kostet {betrag}, du hast {guthaben}.</red>"
    # Die Konsole hat keinen Beruf. Grau und nicht rot: Es ist nichts kaputt.
    keine-konsole: "<gray>Ein Beruf gehoert zu einem Spieler - die Konsole hat keinen.</gray>"
    # Zwei Befehle in derselben Sekunde. Es ist NICHTS passiert, und ein zweiter Versuch
    # geht durch.
    gleichzeitig: "<yellow>Dein Berufsstand hat sich eben geaendert - versuch es noch einmal.</yellow>"
    # Die Ablage antwortet nicht. Daneben steht die Ausnahme im Serverprotokoll.
    nicht-lesbar: "<gray>Deine Berufe sind gerade nicht lesbar - im Serverprotokoll steht, warum.</gray>"
  verdienst:
    # ZWEI HANDBALKEN - sie stehen ueber dem Gegenstandsgurt und nicht im Chat. GENAU
    # EINE Zeile je Satz: sendActionBar nimmt ein Component und keine Liste, eine
    # Umbruchmarke darin ist eine Klage mit Zeilennummer.
    #
    # {betrag} - was die letzten Sekunden eingebracht haben, als Pfennigbetrag aus
    # waehrung.pfennige. Gesendet wird hoechstens einmal je Sekunde: Eine Chatzeile je
    # Auszahlung waere ein Regen, und gar nichts zu zeigen liesse einen neuen Spieler
    # den Fehler bei sich suchen.
    handbalken: "<green>+{betrag}</green>"
    # Der Tagesdeckel ist erreicht - ab hier bringt Arbeit nichts mehr, und was
    # gesammelt war, verfaellt. Diese Zeile MUSS es geben: Ohne sie arbeitete ein
    # Spieler weiter fuer nichts. Sie loest die andere ab, solange der Deckel haelt.
    deckel: "<yellow>Heute ist genug verdient - morgen zahlt die Arbeit wieder.</yellow>"
    # Nicht derselbe Satz wie deckel: Diese Grenze gilt nur fuer EINE Arbeit und nur
    # fuer diese Stunde. Wer sie erreicht hat, darf etwas anderes tun - und soll das
    # auch lesen, sonst legt er das Werkzeug ganz weg.
    #
    # {taetigkeit} - das Wort aus beruf.taetigkeit darunter.
    stundenmenge: "<yellow>Mit {taetigkeit} ist fuer diese Stunde genug - etwas anderes zahlt weiter.</yellow>"
  # DAS WORT ZU JEDER TAETIGKEIT. Eingesetzt in beruf.verdienst.stundenmenge, und sonst
  # nirgends - darum keine Farbe: Ein Tag hier ueberschriebe die Farbe jener Zeile.
  #
  # Anders als bei den Berufen ist diese Liste GESCHLOSSEN: Welche Taetigkeiten es gibt,
  # entscheidet das Programm, denn jede braucht einen eigenen Ereigniszweig. Du kannst
  # die Worte aendern, aber keines hinzufuegen - ein siebter Eintrag hier waere eine
  # Zeile, die nicht wirkt, und das Protokoll sagt es beim Start.
  #
  # Die Worte stehen im WERKZEUGFALL ("mit Graben ist genug"), nicht im Infinitiv: Sie
  # werden in einen Satz mit "Mit ..." eingesetzt.
  taetigkeit:
    abbauen: "Graben"
    setzen: "Bauen"
    ernten: "Ernten"
    fischen: "Angeln"
    toeten: "Jagen"
    zuechten: "Zuechten"
  # DAS WORT ZU JEDEM BERUF. Ein Eintrag je Schluessel aus berufe.liste in der
  # config.yml - und zwar in BEIDE Richtungen: Ein Beruf ohne Wort laesst Freimarken
  # nicht starten, ein Wort ohne Beruf ist eine Zeile, die nicht wirkt (sie steht dann
  # im Bericht von /freimarken neuladen).
  #
  # Kein Farbtag: Diese Worte werden in andere Saetze eingesetzt, und ein Tag darin
  # ueberschriebe die Farbe der Zeile, in der er landet - je Zeile anders.
  #
  # Hier stehen die Berufsnamen und nicht in der config.yml, weil Worte in die
  # Sprachdatei gehoeren: Dieselbe Trennung wie ueberall sonst in diesem Plugin. Der
  # Schluessel links ist technisch und steht in der Datenbank; das Wort rechts ist
  # deines.
  name:
    bergmann: "Bergmann"
    steinmetz: "Steinmetz"
    holzfaeller: "Holzfaeller"
    zimmermann: "Zimmermann"
    bauer: "Bauer"
    mueller: "Mueller"
    fischer: "Fischer"
    reeder: "Reeder"
    jaeger: "Jaeger"
    gerber: "Gerber"
    baumeister: "Baumeister"
    architekt: "Architekt"

# DAS REISEN SELBST - jeder Teleport laeuft hier durch.
#
# Dieser Abschnitt steht unter reise und NICHT unter einem Befehl, anders als anfrage
# und spielzeit. Der Grund: Dieselbe Reise loesen FUENF Befehle aus - /warp, das Tor
# am Bundesmarkt, /zurueck, /tpaccept und /freimarken parzelle -, und alle fuenf
# laufen durch dieselben zwei Pruefungen und dieselbe Wartezeit. Ein Abschnitt je
# Befehl waere derselbe Satz an fuenf Orten: Du aendertest einen und wundertest dich,
# warum die anderen vier weiter das Alte sagen. Die eigenen Absagen von /warp und
# /zurueck gehoeren dagegen unter ihren Befehl und stehen weiter unten unter warp und
# zurueck.
#
# {ziel} IST DERSELBE WERT IN ALLEN SECHS SAETZEN, die ihn einsetzen. Er heisst nicht
# {welt}, weil er fuenferlei sein kann: ein kleingeschriebener Weltname (/warp, Tor),
# ein SPIELERNAME (/tpaccept - dann liest der Reisende den Namen des anderen), die
# Wendung aus zurueck.letzter-ort (/zurueck) oder die Aufschrift "Parzelle 3/-4"
# (/freimarken parzelle). NUR schon-da und kein-platz-am-erscheinungspunkt tragen
# garantiert einen Weltnamen; die uebrigen vier nicht. Schreibe darum nichts in sie
# hinein, was nur zu einem Weltnamen passt.
#
# HALB IN KRAFT (Reiseziel): EINE dieser fuenf Fuellungen ist selbst noch Spielertext
#   AUS DEM PROGRAMM und nicht aus dieser Datei - die Aufschrift "Parzelle 3/-4" bei
#   /freimarken parzelle. Du kannst die Saetze hier also umstellen und faerben, diese
#   eine Aufschrift aber nicht aendern. Sie zieht mit ihrem eigenen Bauschritt um, und
#   VorlageTest 10f laesst diese Warnung dann nicht stehen. Die Wendung von /zurueck
#   stand bis zum zweiten Zug von Schritt 5 ebenfalls hier - sie steht jetzt unter
#   zurueck.letzter-ort, samt der Erklaerung ihrer schiefen Grammatik.
reise:
  # {ziel} - du bist schon in der Zielwelt, es geht nirgends hin. Grau und nicht rot:
  # Es ist nichts kaputt.
  schon-da: "<gray>Du bist schon in {ziel}.</gray>"
  # {ziel} - am Erscheinungspunkt der Zielwelt steht kein tragfaehiger Boden mit Platz
  # darueber. Der EINZIGE Satz dieses Abschnitts, der sagt "du kannst nichts tun" -
  # darum nimm ihm diesen Teil nicht weg. Daneben schreibt das Plugin eine Zeile ins
  # Serverprotokoll, mit dem Weltschluessel und dem Rat zu /setworldspawn; die bleibt
  # im Programm, denn eine Diagnose darf nicht von dieser Datei abhaengen.
  kein-platz-am-erscheinungspunkt: "<red>In {ziel} ist am Erscheinungspunkt kein Platz zum Stehen. Das ist nichts, was du beheben kannst - melde es.</red>"

  # WAS GEGEN DIESEN EINEN TELEPORT SPRICHT. Jede dieser fuenf Zeilen wird ZWEIMAL
  # geprueft - einmal, bevor gewartet wird, und einmal, wenn es losgeht: In drei
  # Sekunden kann der Boden abgebaut, Lava geflossen oder die Welt entladen worden
  # sein. Darum steht jeder Satz EINMAL hier und gilt fuer beide Pruefungen.
  hindernis:
    # Die Welt ist entladen. Das Wort "mehr" ist Absicht: Sie WAR da, als der Ort
    # gemerkt wurde - anders als bei den zwei Zeilen darunter.
    welt-nicht-geladen: "<red>Dorthin geht es nicht mehr - die Welt ist nicht geladen.</red>"
    # Er sitzt auf einem Reittier. Gesagt wird es vorher und nicht nachher, weil ein
    # Teleport mit Reittier ueber Weltgrenzen hinweg ohnehin fehlschlaegt.
    zu-pferd: "<red>Nicht zu Pferd - absteigen, dann reisen. Das Reittier bleibt zurueck.</red>"
    # Ueber ODER unter der Welthoehe - EIN Satz fuer beide Richtungen, weil "zu tief"
    # und "zu hoch" heute zeichengleich dasselbe lesen. Zwei Zeilen daraus zu machen
    # waere ein Satz, den das Spiel nicht hat.
    ausserhalb-der-welthoehe: "<red>Dorthin geht es nicht - der Ort liegt ausserhalb der Welthoehe.</red>"
    # Jenseits der Weltgrenze. Unterscheidet sich von der Zeile darueber in GENAU EINEM
    # Wort, und das ist Absicht: zwei Wachen, zwei Sachverhalte. Beide tragen den
    # GANZEN Satz und nicht bloss das unterscheidende Wort - nur so kannst du sie
    # umstellen und nicht bloss faerben.
    ausserhalb-der-weltgrenze: "<red>Dorthin geht es nicht - der Ort liegt ausserhalb der Weltgrenze.</red>"
    # Am Zielort hat sich etwas geaendert - Boden abgebaut, Wasser gelaufen, Lava
    # geflossen. Abgesagt und NICHT woanders hin verschoben: Der Ort war gemeint.
    # Teilt die Woerter "kein Platz zum Stehen" mit kein-platz-am-erscheinungspunkt
    # oben, ist aber ein anderer Fall: dort eine ganze Welt, hier ein einzelner Ort.
    kein-platz-mehr: "<red>Dort ist kein Platz zum Stehen mehr.</red>"

  # Die einzige gelbe Zeile des Reisens, und die einzige, nach der es WEITERGEHT: Die
  # Reise laeuft danach durch. Nur bei einem Weltwechsel mit einem angeleinten Tier -
  # ohne Weltwechsel und ohne Tier sagt niemand etwas.
  leine-reisst: "<yellow>Angeleinte Tiere bleiben zurueck - eine Leine reisst beim Weltwechsel.</yellow>"
  # {ziel} - der Server hat den Teleport abgelehnt, nachdem der Spieler brav
  # stillgestanden hat. Daneben geht eine Zeile ins Serverprotokoll. Teilt die Wendung
  # "Reise nach {ziel}" mit den zwei Zeilen unter abbruch, ist aber ein anderer Fall:
  # hier hat der SERVER abgelehnt, dort hat der SPIELER die Wartezeit verloren.
  nicht-geklappt: "<red>Die Reise nach {ziel} hat nicht geklappt.</red>"
  # {anzahl} ZAEHLT - zwei Reisen zu schnell hintereinander. Nicht gegen Missbrauch,
  # sondern gegen die Platte: Jede Reise liest den Zielchunk. Die Zahl liegt zwischen
  # 1 und 3 und ist aufgerundet; eine Nullform gibt es nicht und braucht es nicht,
  # denn bei 0 reist man einfach.
  # NICHT ZU VERWECHSELN mit parzelle.abklingzeit, das mit denselben drei Woertern
  # beginnt: Das ist die Abklingzeit der Wegabschaetzung und eine andere Sache. Zwei
  # Zeilen und nicht eine - sonst laese ein Reisender den Satz ueber die Abschaetzung.
  abklingzeit:
    eins: "<gray>Einen Augenblick - noch {anzahl} Sekunde.</gray>"
    viele: "<gray>Einen Augenblick - noch {anzahl} Sekunden.</gray>"

  # {sekunden} {ziel} - die Wartezeit hat begonnen. Drei Sekunden, in denen der
  # Spieler bleiben muss, wo er ist; sonst ist jeder Teleport ein Fluchtweg aus einem
  # Kampf. Ein Tor verhaelt sich damit wie ein Netherportal.
  # {sekunden} ist ein WERT und keine Zahl zum Hineinschreiben: Dieselbe Einstellung
  #   im Programm bestimmt, wie lange wirklich gewartet wird. Schreib die 3 als Wort
  #   hinein, und der Satz luegt an dem Tag, an dem die Wartezeit sich aendert.
  # KEINE Zaehlform, und das ist das heutige Bild: "Nach 1 Sekunden" waere falsch,
  #   kommt aber nicht vor, weil es immer drei Sekunden sind. Eine Einzahlform waere
  #   hier erfunden.
  wartezeit: "<gray>Nach {sekunden} Sekunden geht es nach {ziel} - bis dahin stehen bleiben.</gray>"

  # {ziel} - die Wartezeit ist abgebrochen. ZWEI Gruende, zwei Zeilen, und beide
  # tragen den ganzen Satz: nur so kannst du sie umstellen. Beim ABMELDEN wird
  # ebenfalls abgebrochen, aber ohne Meldung - es liest sie dann niemand mehr, und
  # darum gibt es dafuer hier keine dritte Zeile.
  abbruch:
    # Er hat den Bereich verlassen, in dem er angefangen hat. Bei einem Befehl ist das
    # sein eigener Block, bei einem Tor der ganze Torquader - wer sich darin dreht,
    # bricht nicht ab.
    bewegt: "<red>Bewegt - die Reise nach {ziel} ist abgebrochen.</red>"
    # Er hat Schaden genommen. Ein eigener Grund, weil Bewegung allein eine Luecke
    # liesse: Wer eingekeilt in einer Ecke steht, bewegt sich durch Rueckstoss nicht
    # immer einen ganzen Block weit - und genau dann waere der Teleport doch ein
    # Fluchtweg.
    schaden: "<red>Schaden genommen - die Reise nach {ziel} ist abgebrochen.</red>"

# /WARP - was NUR dieser Befehl sagt.
#
# Unter warp und nicht unter reise, anders als der Abschnitt darueber: Den liest jeder,
# der irgendwie reist, diesen Abschnitt nur, wer /warp tippt. Wer ihn umformuliert, trifft
# damit nicht die Absage des Tores am Bundesmarkt.
#
# DER TRENNER DER WELTENLISTE STEHT HIER, die REIHENFOLGE nicht. Wie die Namen getrennt
#   werden, ist Aufbau und gehoert in diese Datei; in welcher Reihenfolge sie kommen, ist
#   die Reihenfolge der config.yml - oben steht die Marktstadt, und wer /warp m tippt,
#   meint fast immer sie.
# DIE ZWEI TRENNER SIND VERSCHIEDEN, und das ist eine Entscheidung und kein Versehen:
#   ziele steht fuer sich und darf breit sein, kein-ziel haengt an einer roten Absage und
#   soll eine Zeile bleiben. Willst du sie gleich, mach sie gleich - niemand haelt dich
#   ab.
# DIE ZWEI TRENNER DUERFEN LEER BLEIBEN. Sie sind die EINZIGEN Zeilen dieser ganzen Datei,
#   die das duerfen, denn ein Trenner sendet keine Chatzeile - leer stossen die Namen
#   aneinander, und das ist haesslich und nicht kaputt. Jede andere Zeile dieser Datei
#   wird, wenn du sie leer laesst, eine Klage - auch zurueck.letzter-ort gleich darunter.
warp:
  # {liste} - DREI Chatzeilen in einer Zeile dieser Datei, getrennt von der Umbruchmarke.
  # Jede traegt ihre eigene Farbe: die Ueberschrift gold, die Liste aqua, der Hinweis
  # grau. EIN Schluessel und nicht drei, weil sie immer zusammen hinausgehen - so kannst
  # du sie umstellen und nicht bloss umfaerben.
  # Die spitze Klammer um ziel ist ein ZEICHEN und keine Farbe, darum ZWEI Backslashes
  # davor. Das Wort darin ist der Name des Befehlsarguments: Wird es im Programm
  # umbenannt, gehoert es hier mitgeaendert.
  # QUERVERWEIS: DER SCHWANZ " - oder durch ein Tor am Bundesmarkt." steht WORTGLEICH
  # noch in einem zweiten Satz, naemlich in wache.portal.kein-ausgang - der Absage am
  # Nether- und Endportal. Bis zu dessen Bauschritt kam dieser zweite aus dem Programm,
  # und hier stand darum eine Warnung; jetzt stehen beide in dieser Datei. Das sind zwei
  # Saetze mit zwei verschiedenen Anfaengen und bleiben zwei: Aenderst du den Schwanz
  # hier, aendert er sich dort NICHT mit. Das ist ab jetzt deine Entscheidung und kein
  # Fehler mehr - willst du sie gleich halten, aendere beide.
  ziele: "<gold>Reiseziele</gold>\n<aqua>{liste}</aqua>\n<gray>/warp \\<ziel> - oder durch ein Tor am Bundesmarkt.</gray>"
  # Was zwischen zwei Weltnamen der Zeile darueber steht: ZWEI Leerzeichen. Kein Farbtag -
  # der Trenner geht als WERT in den Satz und ist dort ein Blatt. Darf leer sein.
  ziele-trenner: "  "
  # {eingabe} {liste} - ZWEI Chatzeilen, rot und grau, und ebenfalls EIN Schluessel: Die
  # Absage und die Liste darunter gehen immer zusammen hinaus.
  # {eingabe} ist der GETIPPTE Name und KEIN Weltname - in diesem Fall gibt es keinen. Er
  # kommt roh herein und bleibt Text: Ein Farbtag darin steht dem Spieler woertlich im
  # Chat und wirkt nicht, denn zuerst wird dieser Satz gelesen und der Wert erst danach
  # eingesetzt.
  # DIESER SATZ BEGINNT MIT "Dorthin geht" wie drei Zeilen unter reise.hindernis. Vier
  # Ursachen, vier Zeilen - aber derselbe Anfang, damit ein Spieler sie als dieselbe Art
  # von Absage liest. Wenn du den Anfang aenderst, aendere alle vier.
  kein-ziel: "<red>Dorthin geht keine Reise: {eingabe}</red>\n<gray>Moeglich sind: {liste}</gray>"
  # Was zwischen zwei Weltnamen der Zeile darueber steht: KOMMA und Leerzeichen, anders als
  # bei ziele-trenner. Darf leer sein.
  kein-ziel-trenner: ", "
  # {welt} - der Name steht in der Weltenliste der config.yml, die Welt ist aber nicht
  # entstanden; das hat beim Start geklagt, hier steht nur die Absage.
  # {welt} heisst nicht {eingabe}, und das ist ein Riegel und keine Laune: Hier steht der
  # AUFGELOESTE Name - immer klein, immer aus der config.yml. Wer /warp KORNMARK tippt,
  # liest "Die Welt kornmark gibt es gerade nicht."
  # NICHT ZU VERWECHSELN mit reise.hindernis.welt-nicht-geladen: Fuer den Spieler ist
  # beides "das Ziel ist nicht zu haben", fuer dich sind es zwei Ursachen - hier ein
  # Eintrag ohne Welt, dort eine Welt, die zur Laufzeit entladen ist. An diesem Unterschied
  # entscheidest du, ob du in die config.yml oder in den laufenden Server schaust.
  welt-fehlt: "<red>Die Welt {welt} gibt es gerade nicht.</red>"

# /ZURUECK - und /back, weil viele Spieler das tippen. Eine Absage und ein Wortstueck.
zurueck:
  # Es ist nichts gemerkt. Grau und nicht rot: Es ist nichts kaputt, der Spieler war nur
  # noch nirgends. Eine Zeile gegen KEINE Zeile - hat er einen gemerkten Ort, sagt dieser
  # Befehl gar nichts und reist.
  kein-ort-gemerkt: "<gray>Es ist kein Ort gemerkt - du bist noch nirgends gewesen, wohin es zurueckgeht.</gray>"
  # KEIN gesendeter Satz, sondern das Wortstueck, das dieser Befehl als Reiseziel
  # durchgibt: Es wird in die vier Zeilen unter reise EINGESETZT, die {ziel} nennen - die
  # Wartezeit, die zwei Abbrueche und "hat nicht geklappt". Kein Farbtag, ein eingesetzter
  # Wert ist dort ein Blatt. Darf NICHT leer sein, sonst liest der Spieler "geht es nach
  # - bis dahin stehen bleiben".
  # HIER STEHT DIE SCHIEFHEIT, und ab jetzt kannst DU sie beheben: Mit dieser Wendung
  # liest ein Spieler "Nach 3 Sekunden geht es nach deinen letzten Ort" - grammatisch
  # schief, und genau so ausgeliefert. Der Umzug hat daran nichts geaendert, weil ein
  # Umzug nichts aendern darf. Wer es gerade haben will, aendert entweder dieses
  # Wortstueck oder die vier Zeilen unter reise - und dann beides zusammen.
  letzter-ort: "deinen letzten Ort"

# DIE WACHEN - was ein Spieler liest, ohne etwas getippt zu haben.
#
# Unter wache und nicht unter einem Befehl: Diese Saetze kommen von selbst, weil eine
# Hand etwas angefasst hat, nicht weil jemand etwas gefragt hat.
#
# DER HANDBALKEN IST KEINE CHATZEILE. Die vier Zeilen unter schutz stehen ueber dem
#   Gegenstandsgurt und nicht im Chat. Dort ist nur EINE Zeile moeglich, darum ist ein
#   \n in diesen vier Zeilen eine KLAGE mit Zeilennummer und kein Umbruch - der Rest
#   dahinter wuerde sonst stumm verschwinden. Worte und Farbe darfst du frei waehlen,
#   auch mehrere Farben in einer Zeile (siehe fremde-parzelle). Die drei Zeilen unter
#   ankunft und portal sind dagegen gewoehnliche Chatzeilen, und eine von ihnen traegt
#   eine Umbruchmarke.
# GEDROSSELT KOMMEN ZWEI VON DREI. Der Handbalken hoechstens einer je Spieler und zwei
#   Sekunden, sonst wird aus einer festgehaltenen Maustaste ein Flackern; die Absage am
#   Portal hoechstens eine je Spieler und acht Sekunden, denn sie feuert, solange der
#   Spieler im Portalblock steht. Die zwei Zeilen unter ankunft brauchen keine Drossel -
#   ihre Anlaesse kommen von selbst nur einmal.
# BEIM DARAUFTRETEN - fremdes Ackerland zum Beispiel - kommt gar kein Handbalken: Das
#   hatte der Spieler nicht vor.
wache:
  # DER BAUSCHUTZ. Vier Lagen, vier Zeilen, eine Sendestelle - welche Zeile ein Spieler
  # liest, entscheidet das Programm am Ort seiner Hand.
  schutz:
    # Er steht auf Weg oder Mauer. Gelb und nicht rot, und das ist Absicht: Es ist
    # nichts kaputt und niemand abgewiesen, der Ort gehoert einfach allen.
    weg-und-mauer: "<yellow>Weg und Mauer gehoeren allen</yellow>"
    # Die Parzelle ist zu haben. Die EINZIGE der vier Zeilen, die einen Befehl nennt -
    # dieselben Worte stehen in parzelle.bescheid.noch-frei. Benennt das Programm den
    # Befehl eines Tages um, gehoeren beide Zeilen geaendert.
    parzelle-frei: "<yellow>Diese Parzelle ist frei - /parzelle nehmen</yellow>"
    # Hier ist Bauland im Raster, aber jenseits der Stadtgrenze - es wird nie vergeben.
    # BEGINNT MIT DENSELBEN 25 ZEICHEN wie parzelle.nehmen.ausserhalb, hat aber eine
    # andere Farbe und einen anderen Fall: Dort hat jemand /parzelle nehmen getippt und
    # bekommt die Grenzen genannt, hier hat er bloss eine Hand gehoben. Aenderst du den
    # Anfang, sieh dir die andere Zeile an.
    ausserhalb: "<yellow>Hier endet die Marktstadt</yellow>"
    # {eigentuemer} - die Parzelle gehoert einem anderen Menschen, und er wird genannt.
    # ZWEI FARBEN IN EINER ZEILE, und der Farbwechsel steht MITTEN im Satz: rot der
    #   Kopf, weiss der Name. Das Leerzeichen vor dem Namen steht VOR dem <white> und
    #   gehoert damit zum roten Stueck. Schiebst du es dahinter, sieht der Spieler
    #   dasselbe - die Bildprobe des Projekts aber nicht. Lass es, wo es ist.
    # {eigentuemer} IST EIN FREMDER NAME. Der Leser ist der Besucher, genannt wird der
    #   Eigentuemer - schreib also nichts hinein, was den Leser selbst anspricht.
    # KENNT DER SERVER DEN NAMEN NICHT, stehen dort acht Zeichen einer UUID. Einen
    #   eigenen Satz dafuer gibt es nicht, weil es ihn vor dem Umzug auch nicht gab.
    # DERSELBE ANFANG steht in parzelle.bescheid.noch-frei und in den zwei Formen von
    #   parzelle.bescheid.noch-frei-am-limit: "Diese Parzelle gehoert ". Vier Zeilen mit
    #   demselben Anfang, damit ein Spieler sie als dieselbe Art von Auskunft liest -
    #   aenderst du den Anfang, sieh dir alle vier an.
    fremde-parzelle: "<red>Diese Parzelle gehoert <white>{eigentuemer}</white></red>"
    # {laden} {mieter} - der Ladenschutz [Teil C]. BEIDE Werte: In einer Markthalle
    #   stehen die Staende nebeneinander, und ein Besucher soll lesen, an welchem er
    #   steht. Derselbe Aufbau wie fremde-parzelle darueber - Absage rot, der fremde
    #   Name weiss.
    #
    # HANDELN darf er hier trotzdem: Am Schild eines Kistenshops kauft jeder, auch im
    #   Laden eines anderen. Diese Zeile kommt nur, wenn er BAUT, ABBAUT oder die KISTE
    #   oeffnen will.
    fremder-laden: "<red>{laden} ist der Laden von <white>{mieter}</white></red>"
    # Ein Stand, den niemand gemietet hat - hier darf AUCH niemand bauen. Eine freie
    #   Einheit gehoert niemandem und damit nicht jedem: Was ein Spieler dort
    #   hinterlaesst, hinterlaesst er dem naechsten Mieter. Der Satz nennt darum den Weg,
    #   wie wache.schutz.parzelle-frei es tut.
    # /laden mieten STEHT HART IM SATZ. Benennt das Programm den Befehl um, gehoert
    #   diese Zeile geaendert.
    laden-frei: "<yellow>Dieser Stand ist frei - /laden mieten</yellow>"
    # Die Mietvertraege sind gerade nicht nachsehbar. Ein EIGENER Satz: Bei einer stummen
    #   Datenbank weiss niemand, wem der Stand gehoert, und die zwei Zeilen darueber
    #   waeren beide eine Behauptung.
    laden-gestoert: "<red>Die Markthalle ist gerade nicht nachsehbar - versuch es noch einmal.</red>"
    # Ein Behaelter in der Ladenwelt, der niemandem gehoert. Der Abenteuermodus
    #   verhindert das Bauen, nicht das OEFFNEN - ohne diese Absage stuende jede Kiste
    #   der Stadt offen.
    # KEIN Ausweg im Satz, anders als bei laden-frei: Diese Kiste ist nicht zu mieten
    #   und nicht freizugeben. Die Freie Truhe und die Kistenshops sind ausgenommen,
    #   dort entscheiden ihre eigenen Wachen.
    einrichtung: "<red>Diese Kiste gehoert zur Stadt</red>"
  # DIE ANKUNFT. Zwei Saetze an zwei verschiedenen Anlaessen: Der eine kommt, weil jemand
  # einen Spawnpunkt setzen wollte, der andere, weil jemand eine Abenteuerwelt betritt.
  # Sie gehen nie zusammen hinaus, darum sind es zwei Zeilen und nicht eine mit beidem
  # darin. Beide sind grau - eine Auskunft, keine Absage.
  ankunft:
    # Ein Bett oder ein Anker hat KEINEN Spawnpunkt gesetzt. Geschlafen werden darf
    # weiter; gesperrt ist allein das Setzen des Punktes, und gestorben wird immer nach
    # Altfurt.
    # DIESER SATZ IST DER EINZIGE HINWEIS. Die Meldung des Spiels ("Respawn point set")
    #   wird vorher ausdruecklich abgeschaltet, weil sie hier eine Luege waere. Laesst du
    #   die Zeile leer, ist das eine Klage beim Laden - und das ist Absicht: Ohne Hinweis
    #   tut ein Bett scheinbar nichts, und der Spieler merkt es erst beim naechsten Tod.
    # "Altfurt" STEHT HART IM SATZ und kommt nicht aus der config.yml - genauso wie
    #   "Marktstadt" in sechs Zeilen dieser Datei. Diese Zeile hier ist die einzige der
    #   ganzen Datei, die Altfurt nennt; benennst du die Welt in der config.yml um,
    #   gehoert dieser Satz mitgeaendert, und sonst keiner.
    kein-spawnpunkt: "<gray>Hier wird kein Spawnpunkt gesetzt - gestorben wird immer nach Altfurt. Schlafen geht weiter.</gray>"
    # Die betretene Welt ist Abenteuer: ansehen und benutzen, aber nicht abbauen.
    # NUR IN DIESE RICHTUNG. Der Weg zurueck nach Ueberleben sagt nichts, weil dort
    #   nichts verboten wird - einen Satz dafuer gibt es nicht, und es gab ihn nie.
    # WELCHE Welten Abenteuer sind, steht in der config.yml und nicht hier; heute ist es
    #   allein Altfurt. Dieser Satz gilt fuer jede davon - schreib also nichts hinein,
    #   was nur fuer eine stimmt.
    abenteuer: "<gray>Hier ist Abenteuer: ansehen und benutzen, aber nicht abbauen. Gebaut wird in der Marktstadt.</gray>"
  # DAS PORTAL. Ein selbstgebautes Nether- oder Endportal fuehrt nirgends hin: Es laesst
  # sich nicht anzuenden, und ein bestehendes laesst niemanden durch. Ohne diese Absage
  # waere das Fehlerbild ein Rahmen, der nicht brennt - und das sieht wie ein
  # Serverfehler aus.
  portal:
    # ZWEI Chatzeilen in einer Zeile dieser Datei, getrennt von der Umbruchmarke: die
    # Absage rot, der Weg darunter grau. EIN Schluessel und nicht zwei, weil sie immer
    # zusammen hinausgehen: Es gibt keinen Fall, in dem der Spieler nur eine von beiden
    # liest. Dieselbe Lage wie warp.kein-ziel, und derselbe Gewinn: So kannst du sie
    # umstellen und nicht bloss umfaerben. Und derselbe Preis - einzeln abschalten kannst
    # du sie nicht; wer nur die Absage will, loescht Umbruchmarke und zweite Zeile mit.
    # QUERVERWEIS: Der Schwanz " - oder durch ein Tor am Bundesmarkt." steht wortgleich
    #   auch am Ende von warp.ziele. Zwei Saetze mit zwei verschiedenen Anfaengen bleiben
    #   zwei - aenderst du ihn hier, aendert er sich DORT NICHT mit. Das ist ab jetzt
    #   deine Entscheidung und kein Fehler mehr, denn beide stehen in dieser Datei.
    # /warp nether UND /warp end STEHEN HART IM SATZ, wie der Befehl in
    #   wache.schutz.parzelle-frei. Benennt das Programm sie um, gehoert diese Zeile
    #   geaendert.
    kein-ausgang: "<red>Hier fuehrt kein Portal hinaus.</red>\n<gray>Nether und Ende erreichst du mit /warp nether und /warp end - oder durch ein Tor am Bundesmarkt.</gray>"

# /FREIMARKEN - was der Befehl ueber sich selbst sagt.
#
# Der letzte Umzug der SPIELERSAETZE. Die vier Verwaltungszweige - neuladen,
# welt, parzelle und vorgenerieren - bleiben im Programm: Ihre Antworten gehen
# in den Chat eines Betreibers mit dem Recht freimarken.verwalten und an keinen
# Spieler. Sie stehen darum nicht in dieser Datei und sind nicht aenderbar.
# ZWEI EBENEN UND NICHT EINE: stand gehoert dem nackten /freimarken, preis dem
#   Zweig /freimarken preis. Es sind zwei Sendestellen, und wer die eine
#   umschreibt, soll die andere nicht treffen.
# DIE SPITZEN KLAMMERN SIND ZEICHEN und keine Farben - darum zwei Backslashes
#   davor, so wie bei parzelle.mitbauer.befehle. Sie zeigen dem Spieler, wo eine
#   Zahl oder eine Koordinate hingehoert.
stand:
  # Die Ueberschrift der Antwort auf das nackte /freimarken.
  kopf: "<gold>Der Freimarkenbund</gold>"
  # {version} {java} {minecraft} - alle drei nennt der laufende Server und nicht
  # diese Datei. Deines ist nur, was dazwischen steht.
  version: "<gray>Stand {version} · Java {java} · {minecraft}</gray>"
  # Ohne Datenbank ueberlebt keine Buchung den Neustart. Rot, und das ist Absicht:
  # Wer das liest, soll es nicht ueberlesen.
  # WELCHE DER ZWEI ZEILEN ein Spieler sieht, entscheidet das Programm am Zustand
  #   der Ablage - abschalten kannst du keine von beiden.
  ablage-fluechtig: "<red>Ablage fluechtig - nichts ueberlebt den Neustart</red>"
  # Der gute Fall, und darum dunkelgrau: Er muss nicht auffallen.
  ablage-mariadb: "<dark_gray>Ablage MariaDB</dark_gray>"
  # Die Befehle, die JEDER Spieler hat. Mit /freimarken spielzeit darin, weil ein
  # Zweig, den niemand nennt, ein Befehl ist, auf den niemand kommt.
  # <anzahl> IST EIN HILFETEXT und nicht der Name des Arguments - beim Tippen
  #   nennt der Befehlsbaum es besessen. Aenderst du das Wort hier, aendert sich
  #   nur diese Zeile.
  befehle: "<gray>/parzelle · /mark · /freimarken preis \\<anzahl> · /freimarken spielzeit</gray>"
  # Nur fuer freimarken.verwalten - wer das Recht nicht hat, liest diese Zeile
  # nie.
  # DREI DER VIER ZWEIGE unter diesem Recht: vorgenerieren steht mit Absicht in
  #   keiner Spielerzeile. Und nimmst du einen hier heraus, bleibt er trotzdem
  #   tippbar - der Befehlsbaum steht im Programm, nicht in dieser Datei.
  befehle-verwaltung: "<dark_gray>/freimarken welt · parzelle \\<x> \\<z> · neuladen</dark_gray>"

# /FREIMARKEN PREIS - was die naechste Parzelle kostet.
#
# Drei Zeilen fuer zwei Lagen: Hat der Spieler noch keine Parzelle, ist sie
# gratis, sonst kostet sie. Die Summe darunter kommt in beiden Lagen.
# DER BETRAG KOMMT AUS waehrung.betrag und traegt dort sein Wort - aenderst du es
#   dort, aendert es sich auch in diesen zwei Zeilen.
preis:
  # Die erste Parzelle ist umsonst.
  gratis: "<green>Die erste Parzelle ist gratis.</green>"
  # {nummer} {betrag} - der Preis der NAECHSTEN Parzelle. Die Nummer ist eine
  # nackte Zahl ohne Tausenderpunkt, hoeher als 65 kann sie nicht werden.
  # ZWEI FARBEN IN EINER ZEILE, und der Farbwechsel steht MITTEN im Satz: grau
  #   der Kopf, gold der Betrag, grau wieder der Punkt dahinter. Das Leerzeichen
  #   vor dem Betrag steht VOR dem Goldtag, der Punkt NACH dem Schlusstag - wer
  #   sie verschiebt, verschiebt sie im Spiel.
  kostet: "<gray>Parzelle Nr. {nummer} kostet <gold>{betrag}</gold>.</gray>"
  # {betrag} - was der Spieler fuer seine bisherigen Parzellen zusammen bezahlt
  # hat. Steht immer, auch wenn er noch keine hat: dann 0.
  ausgegeben: "<dark_gray>Bisher ausgegeben: {betrag}</dark_gray>"

# VOLLSTAENDIG FUER ALLES, WAS EIN SPIELER LIEST: /mark, /parzelle, die vier
# Teleportbefehle, die Spielzeit, das Reisen selbst, /warp, /zurueck, alle drei
# Wachen und /freimarken. Jeder dieser Saetze steht an genau einem Ort - nie an
# keinem und nie an zwei.
# NICHT HIER STEHT BETREIBERTEXT: Die Antworten der vier Verwaltungszweige von
#   /freimarken - neuladen, welt, parzelle, vorgenerieren - gehen in den Chat
#   eines Betreibers mit dem Recht freimarken.verwalten und bleiben im Programm.
#   Eine dieser Zeilen sagt ihr Geldwort selbst; der Kopf von waehrung nennt sie.
# DIE EINE AUSNAHME unter den Spielersaetzen sagt es selbst: Der Kopf von reise
#   traegt die Marke HALB IN KRAFT (Reiseziel), weil eine der fuenf Aufschriften
#   eines Reiseziels noch im Programm steht.
# Eine fruehere Ausnahme ist keine mehr: Der Torhinweis am Ende von warp.ziele
#   hat seinen zweiten Ort in wache.portal.kein-ausgang, also in einer Zeile
#   dieser Datei; dort steht ein Querverweis und keine Warnung.

# DER BUNDESMARKT - was der Bund ankauft und was er dafuer zahlt.
#
# Der Markt ist ein ORT: Er steht in Altfurt, und nur dort kann verkauft werden. Die
# LISTE darf man ueberall ansehen - wer wissen will, ob sich der Weg lohnt, soll nicht
# erst hingehen muessen.
#
# DIE MATERIALNAMEN stehen NICHT hier, sondern kommen aus der config.yml: Ein Sortiment
# aus vierzig Materialien braeuchte hier vierzig Worte, und das waere eine zweite
# Abschrift jener Liste. Zwei Abschriften derselben Tabelle laufen auseinander. Gezeigt
# wird der technische Name (cobblestone) - derselbe, den du eintraegst.
# Der Bundesmarkt - seine STAENDE, nicht mehr eine Tafel.
#
# Zweimal umgebaut am 10.11.2026: Erst fiel /markt verkaufen weg (verkauft wird am
#   Schild), dann die Tafel bundesmarkt.ankauf - "es kann ja nur ge- und verkauft werden,
#   wofuer es ein Schild gibt". Was /markt zeigt, ist seither die Liste der Staende aus
#   der Datenbank: wo sie stehen, was sie handeln, zu welchem Preis.
#
# Die MATERIALNAMEN stehen nicht hier, sondern kommen von der Ware selbst (STONE) -
#   dieselbe Entscheidung wie bei der Lohnliste und beim alten Sortiment.
markt:
  # {anzahl} {seite} {seiten} - die Seite steht auch bei einer einzigen da: Wer
  #   "Seite 1 von 1" liest, weiss sofort, dass nichts fehlt.
  kopf: "<gold>Die Staende des Bundes ({anzahl}) - Seite {seite} von {seiten}</gold>"
  # {welt} {x} {y} {z} {menge} {ware} {kauf} {verkauf} - eine Zeile je Stand. Die STELLE
  #   steht vorn, denn der Bundesmarkt ist ein Ort: Wer wissen will, wo der Stand fuer
  #   seinen Stein steht, soll hingehen koennen. {kauf} und {verkauf} sind die beiden
  #   Wortstuecke darunter ODER NICHTS - ein leerer Wert verschwindet rueckstandslos,
  #   darum stehen die Trenner in den Stuecken.
  zeile: "<gray>  {welt} {x}/{y}/{z} · {menge}x {ware}{kauf}{verkauf}</gray>"
  # {preis} - ein Wortstueck fuer die Zeile darueber, kein Satz. Kein Farbtag.
  #   KUNDEN KAUFEN zu diesem Preis, der Bund verkauft also.
  kauf: " · Kauf {preis}"
  # {preis} - das Gegenstueck: Kunden verkaufen an den Bund.
  verkauf: " · Ankauf {preis}"
  # {naechste} - nur, wenn es eine naechste Seite gibt.
  weiter: "<dark_gray>/markt liste {naechste} zeigt die naechste Seite</dark_gray>"
  # {seite} {seiten} - und nennt, wie viele es gibt.
  keine-seite: "<gray>Seite {seite} gibt es nicht - die Staende stehen auf {seiten} Seiten.</gray>"
  # Es steht kein Schild. Das ist der Weg, auf dem der Ankauf abgeschaltet wird - und
  #   fuer einen Spieler die Auskunft, dass er nicht sucht, sondern wartet.
  leer: "<yellow>Der Bund hat noch keinen Stand. Gehandelt wird nur, wofuer ein Schild steht.</yellow>"
  # {betrag} - was heute noch aus Verkaeufen zu holen ist. In ganzen Mark: Der Deckel
  #   haengt am Gebuchten, und gebucht werden nur ganze Mark.
  frei: "<gray>Heute kannst du noch <gold>{betrag}</gold> aus Verkaeufen bekommen.</gray>"
  # Ein EIGENER Satz und keine Zahl: bundesmarkt.tagesdeckel: 0 heisst kein Deckel, und
  #   "noch 0 Mark" waere das Gegenteil der Wahrheit.
  ohne-deckel: "<gray>Es gibt keinen Tagesdeckel - du kannst beliebig viel an den Bund verkaufen.</gray>"
  gestoert: "<red>Die Staende des Bundes liessen sich nicht lesen</red><gray> - sie sind deswegen NICHT weg. Der Grund steht im Serverprotokoll.</gray>"

# Die Markthalle (Plan 7.1, Schritt 8 Teil A): /laden zeigt die Ladeneinheiten.
#
# Die NAMEN der Einheiten stehen NICHT hier - sie kommen aus dem Abschnitt laeden der
#   config.yml. Zwanzig Staende braeuchten hier zwanzig Worte, also eine zweite
#   Abschrift derselben Liste, und zwei Abschriften laufen auseinander. Dieselbe
#   Entscheidung wie bei den Materialnamen des Bundesmarktes und bei der Lohnliste.
laden:
  # Die Ueberschrift ueber der Liste - die EINZIGE goldene Zeile dieses Befehls.
  kopf: "<gold>Die Markthalle</gold>"
  # {name} {ort} - eine Zeile je Ladeneinheit. {ort} ist die Stelle der Ladentruhe als
  #   x/y/z, damit ein Spieler hingehen kann, bevor er mietet.
  zeile: "<gray>  {name}</gray><dark_gray> - Truhe bei {ort}</dark_gray>"
  # Es gibt noch keine Einheiten. Diese Zeile MUSS es geben: Wer nur die Ueberschrift
  #   sieht, haelt es fuer einen Fehler. Ab Werk ist das der Normalfall - die
  #   Markthalle ist von Hand zu bauen (Plan 2.1).
  leer: "<gray>  Es gibt noch keine Ladeneinheiten - die Markthalle wird noch gebaut.</gray>"

  # Die LETZTE Zeile von /laden: der eigene Laden. Zwei Faelle, zwei Saetze -
  #   welcher zutrifft, weiss das Programm.
  stand:
    # {laden} {bis} {resttage} {miete} - der eigene Laden. Die Miete ist die VEREINBARTE
    #   und nicht die aus der config.yml: Wer fuer 500 gemietet hat, liest 500.
    # NOCH: {resttage} zaehlt die RESTLAUFZEIT und nicht die Vertragslaenge - am
    #   Abschlusstag steht hier eine andere Zahl als in laden.gemietet.kopf, und das
    #   ist richtig. Ohne das Wort "noch" sah es am 09.11.2026 wie ein Fehler aus.
    eigener: "<gray>Dein Laden: {laden}, bis {bis} (noch {resttage} Tage), {miete} je Tag.</gray>"
    # Diese Zeile MUSS es geben: Wer die Liste sieht und keinen Laden hat, soll
    #   erfahren, wie man mietet. Ohne sie waere /laden mieten nur in der Hilfe
    #   zu finden.
    keiner: "<gray>Du hast noch keinen Laden - mit /laden mieten und dem Namen eines Standes nimmst du einen.</gray>"

  # Drei Zeilen fuer einen Abschluss, und jede bindet etwas anderes: den Ort, das Geld
  #   jetzt, das Geld taeglich. Die dritte nennt den Befehl zum Verlaengern.
  gemietet:
    # {laden} {bis} {miettage} - was gemietet wurde und bis wann der Vertrag laeuft.
    # MIETTAGE ist die LAENGE des Vertrags, beide Tage eingeschlossen - nicht die
    #   Restlaufzeit. Die steht in laden.stand.eigener und ist am Abschlusstag um
    #   eins kleiner.
    kopf: "<green>Du hast {laden} gemietet.</green><gray> Der Vertrag laeuft {miettage} Tage, bis zum {bis}.</gray>"
    # {betrag} - abgebucht, ohne Lizenz: Der Spieler hatte sie schon.
    # KEIN {lizenz}: Sie ist nicht geflossen, und eine 0 in der Zeile liesse ihn
    #   glauben, er haette sie geschenkt bekommen.
    kosten: "<gray>Abgebucht: {betrag} Kaution.</gray>"
    # {betrag} {lizenz} - abgebucht, MIT der einmaligen Lizenz darin. Beide Zahlen:
    #   Wer 55.000 abgebucht sieht und 5.000 Kaution erwartet hat, soll in derselben
    #   Zeile lesen, warum.
    erstmals: "<gray>Abgebucht: {betrag} - darin die einmalige Ladenlizenz ueber {lizenz}.</gray>"
    # {miete} - was taeglich faellig wird, und wie man verlaengert.
    taeglich: "<gray>Taeglich faellig: {miete}. Verlaengern mit /laden verlaengern.</gray>"

  # {laden} {bis} {resttage} - verlaengert. Kostet nichts: Gezahlt wird taeglich.
  # NOCH: Hier stand die RESTLAUFZEIT und das Wort "das sind" - wer frueh
  #   verlaengert, las "das sind 13 Tage" nach einer Verlaengerung um 7. Die Zahl
  #   war richtig, das Wort falsch.
  verlaengert: "<green>{laden} ist verlaengert - bis {bis}, noch {resttage} Tage.</green>"

  gekuendigt:
    # {laden} - gekuendigt.
    kopf: "<yellow>Du hast {laden} gekuendigt.</yellow>"
    # {betrag} - die Kaution zurueck. Eine eigene Zeile, weil es sein kann, dass
    #   keine hinterlegt war (laeden.kaution auf 0) - dann waere "0 Mark zurueck"
    #   eine Zeile, die nach einem Fehler aussieht.
    kaution: "<green>Kaution zurueck: +{betrag}</green>"

  # Der taegliche Lauf (Plan 7.1, Teil C): Die Miete wird jeden Tag abgebucht, auch
  #   wenn der Mieter nicht da ist - sonst waere Wegbleiben der Weg, einen Stand
  #   kostenlos zu halten. Diese Zeilen liest er, wenn er gerade online ist; sonst beim
  #   naechsten Beitritt die Zeile verzug.
  #
  # Es gibt KEINE Zeile fuer die gelungene Abbuchung, und das ist Absicht: Eine
  #   taegliche Meldung "500 Mark Ladenmiete abgebucht" liest beim dritten Mal niemand
  #   mehr - und dann liest er auch die Warnung nicht. Was gebucht wurde, steht in
  #   /mark verlauf.
  #
  # Alle fuenf Saetze sind EINZEILIG: Sie gehen ueber eineZeile hinaus, und die wirft
  #   bei einem Umbruch. Zwei Gedanken trennt der Farbwechsel, wie bei gemietet.kopf.
  miete:
    # {laden} {betrag} {ausfall} {schranke} - das Geld fehlte. BEIDE Zahlen: "Ausfall 2
    #   von 3" sagt, wie viel Luft noch ist; "zweiter Ausfall" allein kann der zweite
    #   von zwanzig sein. Als Ordnungszahl und nicht als "noch 1 Tage" - eine Mehrzahl
    #   laesst sich hier nicht beugen.
    gewarnt: "<yellow>Die Miete fuer {laden} ({betrag}) konnte nicht abgebucht werden.</yellow><gray> Das war Ausfall {ausfall} von {schranke} - beim letzten wird geraeumt, und die Kaution verfaellt.</gray>"
    # {laden} {ausfall} {schranke} {kaution} - der Laden ist weg. Die Kaution STEHT in
    #   der Zeile: Sie soll das Weglaufen teurer machen als das Kuendigen, und das
    #   wirkt nur, wenn der Spieler die Zahl sieht.
    geraeumt: "<red>{laden} ist geraeumt - Ausfall {ausfall} von {schranke}.</red><gray> Die Kaution ueber {kaution} ist verfallen.</gray>"
    # {laden} {bis} - die Mietdauer war um, ohne dass verlaengert wurde. Kein Vorwurf:
    #   Er hat jeden Tag gezahlt, und darum kommt die Kaution zurueck - die Zeile
    #   darunter ist gekuendigt.kaution, dieselbe Gutschrift mit demselben Satz.
    abgelaufen: "<yellow>Dein Vertrag ueber {laden} ist abgelaufen - er lief bis {bis}.</yellow><gray> Mit /laden mieten nimmst du wieder einen Stand.</gray>"
    # {stapel} - was aus der Ladentruhe wurde. Steht unter jeder Raeumung und jedem
    #   Ablauf, bei dem etwas in der Truhe lag. Nach dem Doppelpunkt und ohne Verb,
    #   damit die Zeile auch bei einem einzigen Stapel richtig steht.
    ins-fach: "<gray>Die Ladentruhe ist ins Abholfach gewandert: {stapel} Stapel. Hol sie mit /laden abholfach.</gray>"
    # {laden} {betrag} {ausfall} {schranke} - beim Beitritt, wenn Ausfaelle offen sind.
    #   Die einzige Stelle, an der ein Spieler von einem Ausfall erfaehrt, den er
    #   verschlafen hat: Der Lauf laeuft, waehrend er offline ist.
    verzug: "<yellow>Dein Laden {laden} ist in Verzug - Ausfall {ausfall} von {schranke}.</yellow><gray> Sorge fuer {betrag} auf dem Konto, sonst wird geraeumt.</gray>"

  # Das Abholfach (Plan 7.1, Teil C): Was in der Truhe eines geraeumten Ladens lag,
  #   wird NIE geloescht. Es wartet hier, beliebig lange, ohne Verfall und ohne
  #   Obergrenze.
  #
  # Geholt wird mit einem BEFEHL und nicht in einem Fenster, und das ist kein
  #   Schoenheitsfehler: Ein offenes Fenster ist ein Zustand zwischen Spieler und
  #   Datenbank, und wer es im falschen Augenblick schliesst, haette die Ware zweimal.
  abholfach:
    # {stapel} - was wartet. Beim Beitritt und unter /laden. Ein LEERES Fach sagt hier
    #   nichts: Der haeufigste Fall ist, dass noch nie etwas drin lag.
    stand: "<gray>Abholfach: {stapel} Stapel. /laden abholfach holt sie.</gray>"
    # Nur wer ausdruecklich fragt, bekommt diese Antwort.
    leer: "<gray>Dein Abholfach ist leer.</gray>"
    # {stapel} - geholt.
    geholt: "<green>{stapel} Stapel aus dem Abholfach geholt.</green>"
    # {stapel} - es ist etwas uebrig, weil das Inventar vollgelaufen ist. Eine eigene
    #   Zeile: Der haeufigste Fall ist, dass alles passt, und dann waere "noch 0
    #   Stapel" eine Zeile, die nach einem Fehler aussieht.
    bleibt: "<gray>Noch im Fach: {stapel} Stapel - dein Inventar hat keinen Platz mehr.</gray>"
    # {stapel} - gar kein Platz, es ist nichts herausgegangen.
    kein-platz: "<red>Dein Inventar ist voll. Im Abholfach: {stapel} Stapel.</red>"
    # {stapel} - ein Stapel liess sich nicht in einen Gegenstand zurueckverwandeln,
    #   etwa nach einem Minecraft-Update. Er LIEGT NOCH DA und ist nicht verloren; was
    #   es war, steht mit Beschriftung im Serverprotokoll.
    unlesbar: "<red>Nicht herausgegeben: {stapel} Stapel. Das bleibt liegen - bitte sag es dem Team.</red>"

  absage:
    # {laden} - diesen Namen gibt es in laeden.einheiten nicht.
    keine-einheit: "<red>Einen Stand namens {laden} gibt es nicht.</red>\n<gray>/laden zeigt, welche es gibt.</gray>"
    # {laden} - der Stand gehoert jemand anderem.
    schon-vermietet: "<red>{laden} ist schon vermietet.</red>"
    # {laden} ist SEIN Laden und nicht der gewuenschte - sonst sucht er, welchen er hat.
    #   Plan 7.1: ein Laden je Spieler, damit nicht drei Leute die Halle besitzen.
    schon-ein-laden: "<red>Du hast schon einen Laden: {laden}.</red>\n<gray>Mit /laden kuendigen gibst du ihn zurueck.</gray>"
    # {kosten} {guthaben} {fehlt} - das Guthaben reicht nicht. Die dritte Zahl rechnet
    #   das Programm: Ein Spieler soll nicht subtrahieren muessen, um zu wissen, wie
    #   viel er noch verdienen muss.
    zu-wenig-geld: "<red>Der Abschluss kostet {kosten}, du hast {guthaben} - es fehlen {fehlt}.</red>"
    # {laden} {resttage} {dauer} - noch zu frueh. BEIDE Zahlen: "noch 40 Tage" allein sagt
    #   nicht, dass bei 7 Tagen Mietdauer erst ab dem zweiten Tag verlaengert werden
    #   kann.
    noch-zu-frueh: "<yellow>{laden} laeuft noch {resttage} Tage - verlaengern geht, sobald weniger als {dauer} Tage uebrig sind.</yellow>"
    kein-laden: "<red>Du hast keinen Laden.</red>\n<gray>/laden zeigt, welche Staende frei sind.</gray>"
    # Die Markthalle ist ein ORT. Nur das Mieten haengt daran; verlaengern und
    #   kuendigen gehen von ueberall, sie beruehren nur den eigenen Vertrag.
    falsche-welt: "<red>Die Markthalle steht in Altfurt - dort wird gemietet.</red>"
    # Die Datenbank hat geschwiegen. Was geschah, steht im Serverprotokoll.
    gestoert: "<red>Das hat gerade nicht geklappt - versuch es noch einmal.</red>"

  # Muster fuer DateTimeFormatter, kein Satz - der Tag in den Mietzeilen. Wird beim
  # LADEN uebersetzt, ein unbrauchbares Muster ist also eine Klage und kein Absturz
  # mitten in einem Abschluss, der gerade Geld gekostet hat. Ein EIGENES Muster neben
  # spielzeit.tag-muster: Jenes ist der Tag einer Zeile ueber die heutige Spielzeit,
  # dies ein Vertragsende - eine Aenderung am einen soll das andere nicht mitdrehen.
  tag-muster: "dd.MM.yyyy"

# Der Tagesbonus (Plan 8.2, Teil G/H): Das taegliche Einloggen bringt den
# Grundbetrag, das regelmaessige Spielen die SERIE - jeder Tag in Folge gibt mehr.
# Die Zahlen stehen im Abschnitt tagesbonus der config.yml.
#
# Drei Nachrichten fuer eine Zahlung, und sie unterscheiden sich NICHT im Betrag,
#   sondern in dem, was sie ueber die Serie sagen. Welche zutrifft, entscheidet das
#   Programm; die Worte gehoeren dir.
tagesbonus:
  gezahlt:
    # {betrag} {morgen} - der erste Tag einer Serie: entweder der allererste Bonus
    #   oder ein Neuanfang nach einer gerissenen Serie.
    # KEIN {serie}, denn sie ist 1 - "Tag 1 deiner Serie" liest sich wie eine
    #   Zaehlung, die nichts bedeutet. {morgen} ist der Betrag des ZWEITEN Tages und
    #   damit der Grund, morgen wiederzukommen.
    erster: "<green>Tagesbonus: +{betrag}</green><gray> - komm morgen wieder, dann sind es {morgen}.</gray>"
    # {betrag} {serie} - ein fortgesetzter Serientag. {serie} ist immer mindestens 2;
    #   den ersten Tag traegt erster darueber.
    serie: "<green>Tagesbonus: +{betrag}</green><gray> - {serie} Tage in Folge.</gray>"
    # {betrag} {serie} - derselbe Tag, aber es ist seine LAENGSTE Serie. Ein eigener
    #   Satz, damit der Spieler seinen Rekord liest und ihn nicht aus zwei gleichen
    #   Zahlen schliessen muss.
    bestmarke: "<green>Tagesbonus: +{betrag}</green><gold> - {serie} Tage in Folge, so lange wie noch nie!</gold>"
  # Die Zeile unter /mark. Drei Faelle, drei Saetze - welcher zutrifft, weiss das
  #   Programm.
  stand:
    # {serie} {laengste} {morgen} - heute schon bekommen. Die laufende Serie sagt, was
    #   morgen auf dem Spiel steht; die laengste, was zu schlagen waere.
    serie: "<gray>Tagesbonus: {serie} Tage in Folge (am laengsten {laengste}), morgen {morgen}.</gray>"
    # {betrag} {serie} - heute noch offen. Ohne eingestellte Mindestzeit faellt der
    #   Bonus beim Einloggen, also sieht ein Spieler diese Zeile kaum; wenn die Kasse
    #   ihn nicht annehmen konnte, ist sie seine einzige Auskunft.
    offen: "<gray>Tagesbonus: heute noch offen - Tag {serie} bringt {betrag}.</gray>"
    # {minuten} {betrag} {serie} - nur erreichbar, wenn tagesbonus.mindest-minuten
    #   gesetzt ist. Gezaehlt werden TAETIGE Minuten (siehe messstelle), nicht
    #   Anwesenheit. Ohne diese Zeile liest ein Spieler nichts von einem Bonus und
    #   haelt ihn fuer abgeschafft.
    wartet: "<gray>Tagesbonus: noch {minuten} taetige Minuten, dann bringt Tag {serie} {betrag}.</gray>"
# DIE KISTENSHOPS (Plan 7.4). Ein Shop ist eine Kiste mit einem Schild daran: erste
# Zeile der Besitzer, zweite die Menge je Handel, dritte die Preise in der Form
# "B 100 : S 80", vierte die Ware oder ein Fragezeichen. B ist, was ein Kunde ZAHLT,
# S, was er BEKOMMT - diese zwei Buchstaben stehen im Programm und sind hier nicht zu
# aendern, weil jedes Wiki seit zehn Jahren sie nennt.
#
# ACHT ABSAGEN FUER DAS SCHILD, nicht eine. Das ist die teuerste Entscheidung dieses
#   Abschnitts und die wichtigste: Jede nennt, WAS falsch ist, und die naechste Haelfte
#   des Satzes sagt, wie es richtig geht. Ein Spieler, der am Schild steht und bloss
#   "das geht nicht" liest, bricht nach dem zweiten Versuch ab. Die Vorbilder haben hier
#   genau einen Satz und dafuer ein Forum voller Fragen.
# {zeile} IST EINE ZAHL AUS DEM PROGRAMM, nicht aus diesem Wort. Welche Schildzeile
#   falsch ist, weiss nur der Leser des Schildes. Schreib also nicht "Zeile 2" in den
#   Satz - setz {zeile} ein, dann stimmt die Zahl auch, wenn das Schildformat sich
#   einmal aendert.
# {hoechstmenge} und {hoechstpreis} KOMMEN EBENFALLS AUS DEM PROGRAMM. Dieselbe Regel:
#   Tipp die Zahl nicht ab.
# DIE VIER ZEILEN UNTER schutz: SIND HANDBALKEN ueber dem Gegenstandsgurt, wie bei
#   wache.schutz. Genau EINE Zeile, keine Umbruchmarke - eine zweite verschwaende sich
#   stumm, und darum ist sie beim Laden eine Klage mit Zeilennummer.
shop:
  # {menge} {ware} - der Shop steht. {ware} ist derselbe Kurzname, der auf der vierten
  #   Schildzeile landet: Der Spieler soll die Meldung mit dem Schild vor sich
  #   vergleichen koennen.
  # EIN PLUS VOR DEM NAMEN heisst: die Ware ist mehr als ihr Material - verzaubert,
  #   benannt, beschaedigt oder mit Inhalt. Fuenfzehn Zeichen tragen nicht mehr, und
  #   ganz zu schliessen ist diese Luecke auf einer Schildzeile nicht; ein Kunde soll
  #   aber SEHEN, dass hier nicht die gewoehnliche Ware liegt.
  angelegt: "<green>Shop angelegt: {menge}x {ware}</green>"
  # Die ZUSATZZEILE fuer einen Bundshop - sie kommt HINTER die anderen und ersetzt
  #   keine. Ein Bundshop ist ein gewoehnlicher Shop mit einer Eigenschaft mehr.
  angelegt-bund: "<gold>Bundshop: unbegrenzter Vorrat, unbegrenzter Platz, unbegrenztes Geld.</gold>"
  # {preis} - was ein Kunde zahlt. Kommt nur, wenn es einen Kaufpreis gibt.
  preis-kauf: "<gray>Kunden kaufen fuer <white>{preis}</white>.</gray>"
  # {preis} - was ein Kunde bekommt. Kommt nur, wenn es einen Verkaufspreis gibt.
  # ZWEI ZEILEN UND NICHT EINE MIT BEIDEN ZAHLEN: Ein Shop kann nur kaufen, nur
  #   verkaufen oder beides. Eine gemeinsame Zeile muesste im Nurverkaufsfall eine Null
  #   nennen, und eine Null als Preis weist das Programm ausdruecklich ab.
  preis-verkauf: "<gray>Kunden verkaufen fuer <white>{preis}</white>.</gray>"
  # {ware} - das Schild ist weg, der Shop damit auch. SAGT AUSDRUECKLICH, DASS DIE WARE
  #   IN DER KISTE BLEIBT: Ein abgebauter Shop ist kein Verlust, aber das weiss nur, wer
  #   es gesagt bekommt. Wer es nicht liest, baut sein Schild nie wieder ab.
  abgebaut: "<yellow>Shop abgebaut: {ware}</yellow><gray> - die Ware bleibt in der Kiste.</gray>"
  # DIE ABSAGEN. Jede zweite Haelfte ist die Hilfe - lass sie stehen, auch wenn du die
  #   erste umschreibst.
  absage:
    # {zeile} - in der Mengenzeile steht keine Zahl.
    menge-keine-zahl: "<red>Zeile {zeile} ist keine Zahl.</red><gray>\nDort gehoert die Menge hin, die ein Kunde je Klick bekommt - zum Beispiel 16.</gray>"
    # {zeile} {hoechstmenge} - eine Zahl, aber keine moegliche. Die Obergrenze ist ein
    #   voller Kisteninhalt: mehr liesse sich nicht ausgeben.
    menge-ausserhalb: "<red>Zeile {zeile}: die Menge geht von 1 bis {hoechstmenge}.</red><gray>\nMehr als eine volle Kiste kann ein Handel nicht hergeben.</gray>"
    # {zeile} - die Preiszeile hat nicht die eine Form. DER SATZ, DER AM MEISTEN
    #   ERKLAEREN MUSS: Die Form ist nicht zu erraten. Lass das Beispiel darin stehen.
    preis-form: "<red>Zeile {zeile} ist keine Preiszeile.</red><gray>\nSo geht es: <white>B 100</white> (Kunden kaufen), <white>S 80</white> (Kunden verkaufen) oder <white>B 100 : S 80</white> (beides).</gray>"
    # {zeile} - die Form stimmt, aber hinter dem Buchstaben steht keine ganze Zahl.
    # NENNT, WAS NICHT GEHT: Punkt, Komma und ein angehaengtes Wort sind die drei
    #   Versuche, die jeder macht. Das Programm nimmt NUR Ziffern - genau darum, weil
    #   die Vorbilder mehr angenommen haben und daran zwei Geldfehler hatten.
    preis-keine-zahl: "<red>Zeile {zeile}: der Preis ist keine ganze Zahl.</red><gray>\nNur Ziffern - kein Punkt, kein Komma, kein k und kein Mio.</gray>"
    # {zeile} {hoechstpreis} - der Preis liegt ausserhalb.
    preis-ausserhalb: "<red>Zeile {zeile}: der Preis geht von 0 bis {hoechstpreis}.</red><gray>\nEine 0 bedeutet: diese Richtung gibt es nicht.</gray>"
    # {zeile} - beide Preise sind null. EINE EIGENE ABSAGE und nicht die darueber: Null
    #   ist fuer EINE der beiden Richtungen erlaubt, nur beide zusammen sind der Fehler.
    preis-beide-null: "<red>Zeile {zeile}: beide Preise sind 0.</red><gray>\nEiner von beiden genuegt - aber einer muss es sein, sonst ist es ein Geschenk und kein Shop.</gray>"
    # {zeile} - der Ankaufspreis liegt ueber dem Verkaufspreis. DIE ABSAGE, DIE AM
    #   MEISTEN GELD RETTET, und sie muss WARUM sagen: Ein Spieler, der nur "nicht
    #   erlaubt" liest, haelt es fuer Willkuer. Wer fuer 100 verkauft und fuer 120
    #   ankauft, schenkt jedem Kunden bei jedem Durchlauf 20 Mark - aus seinem eigenen
    #   Guthaben, bis es leer ist.
    preis-verdreht: "<red>Zeile {zeile}: du kaufst teurer an, als du verkaufst.</red><gray>\nDas ist eine Maschine, die dein Guthaben an jeden Kunden ausschuettet. S darf nicht ueber B liegen.</gray>"
    # {zeile} - die vierte Zeile ist leer.
    ware-fehlt: "<red>Zeile {zeile} ist leer.</red><gray>\nDort gehoert die Ware hin - ihr Name, oder ein <white>?</white> fuer das, was in der Kiste liegt.</gray>"
    # Neben dem Schild steht keine Kiste, in der ein Shop sein darf. NENNT DIE DREI:
    #   Ein Ofen, ein Spender und eine Shulkerkiste sehen aus wie Behaelter und sind
    #   ausgeschlossen, jedes aus einem eigenen Grund. Ohne diese Zeile sucht der
    #   Spieler den Fehler bei seinem Schild.
    keine-kiste: "<red>Neben dem Schild steht keine Kiste.</red><gray>\nEs geht eine Kiste, eine Redstonetruhe oder ein Fass - direkt daneben, darueber oder darunter, nicht diagonal.</gray>"
    # An der Kiste darf dieser Spieler nicht. DER FALL, DEN KEIN VORBILD SELBST
    #   SCHLIESST: Das Schild haengt auf eigenem Grund, die Kiste steht einen Block
    #   weiter auf fremdem. Ohne diese Pruefung verkaufte der Shop die Ware eines
    #   anderen.
    fremde-kiste: "<red>An dieser Kiste darfst du nicht.</red><gray>\nSie steht auf fremdem Grund - ein Shop braucht eine Kiste, an die du selbst herankommst.</gray>"
    # An der Kiste haengt schon der Shop eines ANDEREN. DIE ANDERE HAELFTE DES
    #   KISTENSCHUTZES: Wer die Kiste nicht oeffnen kann, haengt sonst ein eigenes
    #   Schild daneben und verkauft die fremde Ware auf sein Konto. Die Zeile
    #   darueber passt hier NICHT - draussen vor der Stadt gehoert kein Ort jemandem,
    #   und wer "fremder Grund" liest, sucht eine Parzelle, die es nicht gibt.
    # NENNT KEINEN NAMEN: Wer das liest, steht vor dem anderen Schild und liest ihn
    #   dort.
    fremder-shop: "<red>An dieser Kiste haengt schon ein fremder Shop.</red><gray>\nZwei Schilder an einer Kiste handeln mit derselben Ware - nimm eine eigene Kiste.</gray>"
    # An diesem Schild haengt schon ein Shop. KOMMT AUCH DEM BESITZER: Preise aendert
    #   man durch Abbauen und neu Setzen, denn nur so geht die Aenderung durch die
    #   Datenbank. Ein umgeschriebenes Schild zeigte etwas anderes an, als der Shop
    #   handelt.
    schon-ein-shop: "<red>Hier haengt schon ein Shop.</red><gray>\nZum Aendern bau das Schild ab und setz ein neues - so bleibt das Schild bei dem, was der Shop wirklich tut.</gray>"
    # Das Fragezeichen, aber die Kiste sagt nicht, was gemeint ist. NENNT BEIDE FAELLE:
    #   Der Spieler sieht von aussen nicht, welcher vorliegt. UND SAGT, DASS VERZAUBERT
    #   ZWEI ARTEN SIND - das ist von aussen nicht zu erraten.
    ware-unklar: "<red>Die Kiste sagt nicht, was du handeln willst.</red><gray>\nFuer ein <white>?</white> muss genau EINE Art darin liegen. Eine verzauberte und eine gewoehnliche Spitzhacke sind zwei Arten.</gray>"
    # {getippt} - den getippten Gegenstand gibt es nicht. GIBT IHM SEINE EIGENE EINGABE
    #   ZURUECK: Oft ist es ein Leerzeichen zu viel, und das sieht nur, wer liest, was
    #   das Programm gelesen hat.
    ware-unbekannt: "<red>Den Gegenstand <white>{getippt}</white> gibt es nicht.</red><gray>\nLeg die Ware in die Kiste und schreib ein <white>?</white> - das geht immer, auch bei verzauberten Sachen.</gray>"
    # Ein Bundshop, aber das Recht dafuer fehlt.
    kein-bundrecht: "<red>Bundshops darfst du nicht anlegen.</red><gray>\nLass die erste Zeile leer, dann wird es dein eigener Shop.</gray>"
    # Die Datenbank hat geschwiegen. SAGT AUSDRUECKLICH "NOCH EINMAL VERSUCHEN": Eine
    #   Absage ohne Ausweg liest ein Spieler als Verbot, baut sein Schild ab und kommt
    #   nicht wieder.
    gestoert: "<red>Der Shop liess sich nicht anlegen.</red><gray>\nDas Schild bleibt stehen - versuch es noch einmal. Bleibt es dabei, sieh im Serverprotokoll nach.</gray>"
  # DER SCHUTZ. Fuenf Handbalken - genau EINE Zeile, keine Umbruchmarke. Welchen ein
  #   Spieler liest, entscheidet das Programm daran, WAS er angefasst hat und WEM der
  #   Shop gehoert.
  # GILT UEBERALL, auch in der Wildnis: Hier entscheidet nicht der Ort, sondern der
  #   Shop. Ein Shop am Wegesrand waere sonst von jedem abbaubar.
  schutz:
    # {besitzer} - das Schild eines anderen. Derselbe Aufbau wie
    #   wache.schutz.fremde-parzelle: Absage rot, der fremde Name weiss. Das Leerzeichen
    #   vor dem Namen gehoert zum roten Stueck - lass es, wo es ist.
    fremdes-schild: "<red>Dieser Shop gehoert <white>{besitzer}</white></red>"
    # {besitzer} - die Kiste eines fremden Shops. EIN EIGENER SATZ und nicht derselbe:
    #   Der Spieler soll lesen, WARUM eine gewoehnlich aussehende Kiste geschuetzt ist -
    #   naemlich weil ein Schild daran haengt. Sonst sucht er den Fehler bei sich.
    fremde-kiste: "<red>Diese Kiste ist der Shop von <white>{besitzer}</white></red>"
    # Ein Bundshop - der hat keinen Besitzer, den man nennen koennte. DER DRITTE SATZ
    #   OHNE PLATZHALTER: Ein Wert, in dem manchmal ein Mensch und manchmal eine
    #   Einrichtung steht, zwingt zu einem Satz, der fuer beide passt - und solche
    #   Saetze lesen sich wie eine Fehlermeldung.
    bundshop: "<red>Das ist ein Shop des Bundes</red>"
    # Der Block, der ein fremdes Shopschild TRAEGT. DIE UEBERRASCHENDSTE DER VIER
    #   ABSAGEN, denn der Block sieht nach nichts aus - ein Stein unter einem
    #   Stehschild. Der Satz muss den Grund nennen, sonst haelt der Spieler ihn fuer
    #   kaputt.
    traeger: "<red>Daran haengt ein fremdes Shopschild</red>"
    # Geschuetzt, aber niemand nennbar - die Datenbank hat geschwiegen. DER FUENFTE
    #   SATZ FUER EINEN SELTENEN FALL: Das Programm fragt zwei Dinge, "ist hier eine
    #   Shopkiste" (bei Stoerung JA, also schuetzen) und "wem gehoert sie" (bei
    #   Stoerung niemandem, also keinen Namen erfinden). Gehen die zwei auseinander,
    #   bleibt die Kiste zu - und dieser Satz sagt es. Ohne ihn stuende dort "Diese
    #   Kiste ist der Shop von -", und das liest sich wie ein kaputtes Programm.
    # NENNT DEN AUSWEG wie absage.gestoert: eine Absage ohne Ausweg liest ein
    #   Spieler als Verbot.
    nicht-lesbar: "<red>Diese Kiste ist geschuetzt - versuch es noch einmal</red>"
  # DER HANDEL. Rechtsklick kauft, Linksklick verkauft, mit Schleichtaste ein
  #   ganzer Stapel - so hat Lumia es gemacht.
  # ALLES HANDBALKEN, genau EINE Zeile, keine Umbruchmarke. Der Grund ist derselbe wie
  #   beim Schutz, nur von der anderen Seite: Ein Spieler, der zwanzig Stapel kauft,
  #   klickt zwanzigmal, und zwanzig Chatzeilen waeren ein Regen. Nachzulesen ist jeder
  #   Handel ohnehin unter /mark verlauf.
  # {preis}, {gebuehr} und {erloes} kommen fertig mit ihrer Waehrung - schreib kein
  #   zweites "Mark" dahinter.
  handel:
    # {menge} {ware} {preis} - gekauft.
    # KEINE GEBUEHR IN DIESER ZEILE: Beim Kauf zahlt sie der SHOPBESITZER. Der Kunde
    #   zahlt den Preis, der am Schild steht, und nichts darueber - eine Zeile, die ihm
    #   den Abzug eines anderen nennt, liest sich wie ein Abzug bei ihm.
    gekauft: "<green>Gekauft: {menge}x {ware}</green><gray> fuer </gray><white>{preis}</white>"
    # {menge} {ware} {preis} - verkauft, ohne Gebuehr.
    verkauft: "<green>Verkauft: {menge}x {ware}</green><gray> fuer </gray><white>{preis}</white>"
    # {menge} {ware} {preis} {gebuehr} {erloes} - verkauft, und der Staat hat etwas
    #   genommen. EIN EIGENER SATZ und nicht der darueber mit einer 0 darin: "fuer 100
    #   Mark (100 minus 0)" liest sich wie ein Fehler.
    # UND KEIN STILLER ABZUG: Wer 100 am Schild liest und 95 bekommt, sucht den Fehler
    #   beim Shop. Alle drei Zahlen stehen darin, damit die Zeile nachzurechnen ist -
    #   eine Zusage, die eine ihrer Zahlen nicht nennt, traegt keine.
    verkauft-gebuehr: "<green>Verkauft: {menge}x {ware}</green><gray> fuer </gray><white>{erloes}</white><gray> von {preis}, {gebuehr} Marktgebuehr</gray>"
    # DIE ABSAGEN. Jede nennt, WAS fehlt - "das geht nicht" laesst einen Kunden dreimal
    #   klicken und dann aufhoeren. Genau daran haben die Vorbilder ihre Forenfragen.
    # Rechtsklick an einem Shop, der nur ankauft. SAGT, WAS STATTDESSEN GEHT: Ein Shop
    #   mit nur einem Preis sieht aus wie jeder andere, und ohne diesen Hinweis probiert
    #   niemand die andere Maustaste.
    verkauft-nicht: "<red>Dieser Shop verkauft nichts</red><gray> - mit Linksklick kannst du ihm etwas verkaufen.</gray>"
    # Linksklick an einem Shop, der nur verkauft - mit demselben Hinweis.
    kauft-nicht-an: "<red>Dieser Shop kauft nichts an</red><gray> - mit Rechtsklick kaufst du bei ihm.</gray>"
    # Der eigene Shop - hier wird nicht gehandelt. Kommt NUR beim Rechtsklick: Beim
    #   Linksklick baut der Besitzer sein Schild ab, und zwei Antworten auf eine Tat
    #   liest niemand als zwei.
    # NICHT ROT: Das ist kein Fehler des Spielers, sondern eine Auskunft.
    eigener-shop: "<gray>Das ist dein eigener Shop - nimm die Ware aus der Kiste.</gray>"
    # Die Warenprobe des Shops ist nicht mehr zu deuten. DER EINZIGE FALL, DEN NUR DER
    #   BESITZER BEHEBEN KANN - darum sagt der Satz, dass man es ihm sagen soll.
    #   Entsteht, wenn ein Spielupdate die Form der Gegenstaende aendert; die Ware liegt
    #   dann noch in der Kiste, der Shop handelt sie aber nicht mehr.
    ware-unlesbar: "<red>Dieser Shop handelt nicht mehr</red><gray> - sag es seinem Besitzer.</gray>"
    # {ware} - die Shopkiste hat nicht genug. MIT DER WARE DARIN, damit der Kunde weiss,
    #   was er wiederholen soll.
    ausverkauft: "<red>Ausverkauft: {ware}</red>"
    # {menge} {ware} - der Kunde hat nicht genug. MIT DER MENGE DES SHOPS: Ein Shop, der
    #   16 Stueck je Handel nimmt, lehnt auch 15 ab - ohne die Zahl sieht der Kunde
    #   seine Ware im Rucksack und die Absage auf dem Schirm.
    keine-ware: "<red>Du brauchst {menge}x {ware}</red>"
    # Im Rucksack des Kunden ist kein Platz.
    kein-platz: "<red>In deinem Rucksack ist kein Platz</red>"
    # Die Shopkiste ist voll. EIN EIGENER SATZ und nicht derselbe wie beim Rucksack: Der
    #   Kunde kann daran nichts aendern, und ein Satz, der ihn zum Aufraeumen auffordert,
    #   schickt ihn ins Leere.
    kiste-voll: "<red>Die Kiste dieses Shops ist voll</red>"
    # {preis} - der Kunde kann nicht zahlen. Der Preis ist der fuer EINEN Handel, nicht
    #   fuer den Stapel, den er nicht bekommt.
    kein-geld: "<red>Dafuer brauchst du {preis}</red>"
    # Der Shopbesitzer kann nicht zahlen - der haeufigste Fall, in dem ein Ankaufstand
    #   dasteht und nicht handelt. NENNT DEN BESITZER NICHT: Wer wie viel Geld hat, ist
    #   nicht die Sache eines Kunden, und der Name steht am Schild.
    shop-pleite: "<red>Dieser Shop kann das nicht zahlen</red>"
    # Etwas ist MITTEN im Handel schiefgegangen. EIN EIGENER SATZ und nicht
    #   absage.gestoert: Jener sagt "der Shop liess sich nicht anlegen, das Schild bleibt
    #   stehen", und das hat mit einem Handelsklick nichts zu tun.
    # SAGT AUSDRUECKLICH, DASS KEIN GELD WEG IST. Das ist die Zusage, die der Handel
    #   wirklich haelt: Was nach dem Zahlen scheitert, wird erstattet.
    gestoert: "<red>Der Handel ist nicht zustande gekommen</red><gray> - dein Geld ist nicht weg.</gray>"
  # Der SCHLUESSEL: /shop freigeben <spieler>. Seit dem 08.11.2026 ist das Oeffnen einer
  #   fremden Shopkiste ganz verwehrt - der Preis dafuer ist, dass ein Fremder einem Shop
  #   auch nichts schenken kann. Diese Saetze heben ihn auf.
  freigabe:
    # Die Freigabe ist eingetragen. NENNT AUSDRUECKLICH, was sie erlaubt und was nicht:
    #   Sonst muesste der Besitzer raten, wie weit er gerade Vertrauen verschenkt hat.
    #   Das zweite Schild bleibt verwehrt, und das ist keine Feinheit - es ist der Weg,
    #   auf dem jemand fremde Ware auf SEIN Konto verkaufen koennte.
    erteilt: "<green>{spieler} darf jetzt an diesen Shop</green><gray> - Kiste oeffnen und abbauen. Ein eigenes Schild daran haengen kann er nicht.</gray>"
    gesperrt: "<yellow>{spieler} darf nicht mehr an diesen Shop.</yellow>"
    # Eine eigene Zeile und keine stille Wiederholung: Wer zweimal freigibt, soll wissen,
    #   dass beim ersten Mal schon alles stimmte - sonst sucht er den Fehler.
    schon-frei: "<gray>{spieler} darf schon an diesen Shop.</gray>"
    nicht-frei: "<gray>{spieler} durfte ohnehin nicht an diesen Shop.</gray>"
    kopf: "<gold>An diesem Shop duerfen {anzahl} ausser dir:</gold>"
    zeile: "<gray>  {spieler}</gray>"
    # Eine eigene Zeile und nicht eine leere Liste: "niemand" ist hier genau die
    #   Auskunft, auf die es ankommt.
    leer: "<gray>Ausser dir darf niemand an diesen Shop.</gray>"
    # NENNT DIE REICHWEITE, wie blockbuch.kein-block: Wer auf ein Schild drei Meter
    #   weiter schaut, soll nicht raten, ob dort kein Shop ist oder der Blick zu weit
    #   ging.
    kein-schild: "<gray>Du siehst kein Shopschild an</gray><dark_gray> (Reichweite {reichweite} Bloecke). Stell dich vor dein Schild und tippe /shop freigeben \\<name>.</dark_gray>"
    # Freigeben darf NUR der Besitzer - nicht das Team und nicht ein schon Freigegebener.
    #   Sonst waere der Schluessel selbst weitergebbar, und nach zwei Schritten wuesste
    #   niemand mehr, wer eigentlich Zutritt hat.
    nicht-deiner: "<red>Dieser Shop gehoert dir nicht.</red><gray> Freigeben darf nur, wem der Laden gehoert.</gray>"
    bundshop: "<gray>Ein Bundshop gehoert niemandem - freigeben kann ihn darum auch niemand. Wer an ihn darf, entscheidet das Recht freimarken.shop.bund.</gray>"
    selbst: "<gray>An deinen eigenen Shop darfst du ohnehin.</gray>"
    unbekannt: "<red>Den Spieler {name} kennt dieser Server nicht.</red>"
    gestoert: "<red>Die Freigabe liess sich nicht speichern</red><gray> - es hat sich NICHTS geaendert. Der Grund steht im Serverprotokoll.</gray>"
  # Die eigene Shopliste, /shop liste [seite]. Sie steht fuer sich und braucht keinen
  #   Blick auf ein Schild - wer dreissig Laeden hat, sucht genau darum nach ihnen.
  liste:
    leer: "<gray>Du hast noch keinen Kistenshop. Einer entsteht aus einem Schild an einer Kiste - die erste Zeile bleibt leer, dann Menge, Preis und Ware.</gray>"
    # {anzahl} {seite} {seiten} - die Seite steht auch bei einer einzigen da: Wer
    #   "Seite 1 von 1" liest, weiss sofort, dass nichts fehlt.
    kopf: "<gold>Deine Kistenshops ({anzahl}) - Seite {seite} von {seiten}</gold>"
    # {welt} {x} {y} {z} {menge} {ware} {kauf} {verkauf} - eine Zeile je Laden. {kauf}
    #   und {verkauf} sind die beiden Wortstuecke darunter ODER NICHTS: ein leerer Wert
    #   verschwindet rueckstandslos. Darum stehen die Trenner in den Wortstuecken.
    zeile: "<gray>  {welt} {x}/{y}/{z} · {menge}x {ware}{kauf}{verkauf}</gray>"
    # {preis} - ein Wortstueck fuer die Zeile darueber, kein Satz. Kein Farbtag.
    #   KUNDEN KAUFEN zu diesem Preis, der Shop verkauft also.
    kauf: " · Kauf {preis}"
    # {preis} - das Gegenstueck: Kunden verkaufen an diesen Laden.
    verkauf: " · Ankauf {preis}"
    # {naechste} - nur, wenn es eine naechste Seite gibt. Nennt die ZAHL, damit der
    #   Spieler nicht raten muss, wie man blaettert.
    weiter: "<dark_gray>/shop liste {naechste} zeigt die naechste Seite</dark_gray>"
    # {seite} {seiten} - und nennt, wie viele es gibt: Eine Absage ohne diese Zahl
    #   schickt den Spieler ins Probieren.
    keine-seite: "<gray>Seite {seite} gibt es nicht - deine Shops stehen auf {seiten} Seiten.</gray>"
    gestoert: "<red>Deine Shopliste liess sich nicht lesen</red><gray> - deine Laeden sind deswegen NICHT weg. Der Grund steht im Serverprotokoll.</gray>"
  # DER ANKAUF DES BUNDES AM SCHILD (Plan 7.1, gebaut 10.11.2026). Ein Bundschild mit
  #   S-Preis IST der Bundesmarkt: Der Preis kommt aus bundesmarkt.ankauf und nicht vom
  #   Schild, der Tagesdeckel bundesmarkt.tagesdeckel gilt, und gebucht wird
  #   bundesmarkt_verkauf. /markt verkaufen ist dafuer weggefallen.
  #
  # Die ersten drei Zeilen liest ein BETREIBER beim Beschreiben eines Schildes (nur er
  #   hat freimarken.shop.bund), die letzten drei ein KUNDE am fertigen Stand.
  bund:
    # SECHS ZEILEN STANDEN HIER am Mittag des 10.11.2026 und sind am Nachmittag wieder
    #   gegangen - mit der Tafel bundesmarkt.ankauf. Sie sagten, was an einer Tafel
    #   schiefgehen kann; ohne Tafel gibt es keinen dieser Faelle: Der Preis steht auf
    #   dem Schild, ein Schildpreis ist eine ganze Mark, und beide Preise auf einem
    #   Schild halten die Regeln des Kistenshops selbst.
    #
    # Geblieben ist der Deckel - der Grund des ganzen Schrittes (Plan 7.4). Er kommt nur,
    #   wenn bundesmarkt.tagesdeckel ueber 0 steht.
    deckel: "<yellow>Heute ist genug verkauft - morgen kauft der Bund wieder.</yellow>"

# Die Freie Truhe (Plan 7.2, Schritt 8 Teil D): eine offene Kiste in der Markthalle, aus
#   der jeder nehmen und in die jeder legen darf.
#
# ZWEI PAARE MIT ZWEI BLICKWINKELN stehen hier, und beide sind eine Entscheidung vom
#   10.11.2026: offen/offen-frei - mit Deckel eine Zahl, ohne Deckel ein eigener Satz,
#   denn "noch 0 Stueck" waere das Gegenteil der Wahrheit. Und zurueck/behalten: Das eine
#   sagt, was dableibt, das andere, was mitkommt. Die Rueckgabezeile steht VOR der
#   Bilanz - erst der Grund, dann die Zahl.
#
# WER NICHTS GENOMMEN HAT, LIEST NICHTS. Hineinlegen ist der halbe Zweck dieser Truhe und
#   kein Vorgang, der eine Meldung braucht.
truhe:
  # {frei} - beim Oeffnen, VOR dem Nehmen. Wer erst beim Schliessen erfaehrt, dass er am
  #   Deckel ist, hat die Ware schon in der Hand und bekommt sie weggenommen.
  offen: "<gray>Freie Truhe - heute kannst du noch <gold>{frei}</gold> Gegenstaende behalten. Hineinlegen darfst du immer.</gray>"
  # Ohne Deckel (freie-truhe.entnahme-je-tag: 0) - ein eigener Satz und keine Zahl.
  offen-frei: "<gray>Freie Truhe - nimm, was du brauchst, und lege hinein, was du nicht brauchst.</gray>"
  # {deckel} - die Truhe bleibt zu. Nennt den DECKEL und nicht den Rest: Der Rest ist 0,
  #   und eine 0 beantwortet die Frage nicht, die der Spieler jetzt hat.
  deckel: "<yellow>Heute hast du deine {deckel} Gegenstaende aus der Freien Truhe</yellow><gray> - morgen ist sie wieder voll.</gray>"
  # Einer zur Zeit: Gezaehlt wird die Differenz zwischen Oeffnen und Schliessen, und bei
  #   zwei Zuschauern waere sie nicht die Entnahme eines Spielers.
  # NUR WENN GEZAEHLT WIRD geht dieser Satz heraus - also bei einem Deckel
  #   (freie-truhe.entnahme-je-tag) oder einer Verbotsliste. Ab Werk steht beides auf
  #   "aus", und dann sehen alle gemeinsam hinein und niemand liest diese Zeile.
  besetzt: "<yellow>Jemand sieht gerade in die Freie Truhe</yellow><gray> - einen Augenblick.</gray>"
  # Der Tagesstand liess sich nicht lesen. Beim Oeffnen heisst das: bleibt zu. Beim
  #   Schliessen: alles geht zurueck. Beides ist die sichere Seite.
  gestoert: "<red>Die Freie Truhe antwortet gerade nicht</red><gray> - dein Tagesstand liess sich nicht lesen. Der Grund steht im Serverprotokoll.</gray>"
  # {stueck} {frei} - beim Schliessen, nur mit Deckel und nur, wenn er etwas genommen hat.
  behalten: "<gray>{stueck} Gegenstaende behalten - heute noch <gold>{frei}</gold> frei.</gray>"
  # {stueck} {deckel} - was ueber dem Deckel lag. MIT der Zahl des Deckels: Wer liest
  #   "7 gehen zurueck", sucht den Fehler; wer die Regel liest, kennt sie.
  zurueck: "<yellow>{stueck} Gegenstaende gehen zurueck in die Truhe</yellow><gray> - mehr als {deckel} am Tag nimmt niemand mit.</gray>"
  # {ware} - der Materialname, wie der Spieler ihn im Tooltip liest. Erkannt wird beim
  #   SCHLIESSEN: In eine offene Kiste legt man auf sieben verschiedene Weisen.
  verboten: "<yellow>{ware} gehoert nicht in die Freie Truhe</yellow><gray> - du bekommst es zurueck.</gray>"

blockbuch:
  # Die Saetze der Moderationsauskunft /freimarken blockbuch. Sie reden NICHT mit einem
  #   Spieler ueber sein eigenes Tun, sondern mit einem Moderator ueber das Tun eines
  #   anderen - darum nennen sie Namen, Zeiten und Orte, und darum unterscheiden sie
  #   gelungene von ABGEWIESENEN Versuchen.
  # Muster fuer DateTimeFormatter, kein Satz. Wird beim LADEN uebersetzt.
  # Das Jahr steht HIER mit Absicht drin, anders als bei zeit.verlauf-muster: Die Frist
  #   ist einstellbar bis zu zehn Jahren, und dann ist das Jahr genau die Angabe, die
  #   fehlt.
  zeit-muster: "dd.MM.yyyy HH:mm"
  # Die Ueberschrift der Abfrage an einem Block. {ort} ist kurz - Weltname ohne
  #   freimarken: davor, dann x/y/z. {anzahl} ist die Zahl der gezeigten Zeilen, nicht
  #   die Zahl aller: Mehr als blockbuch.zeilen-je-abfrage kommen nie.
  kopf-ort: "<gold>Blockbuch</gold><gray> an {ort} - {anzahl} Eintraege:</gray>"
  # Die Ueberschrift der Abfrage nach einem Spieler.
  kopf-spieler: "<gold>Blockbuch</gold><gray> von {spieler} - {anzahl} Eintraege:</gray>"
  # Eine GELUNGENE Tat. {zeit} {spieler} {tat} {block} - der Ort fehlt, er steht in der
  #   Ueberschrift; zwanzig Zeilen mit derselben Koordinate waeren zwanzigmal dasselbe.
  # Einzug und Farbe stehen HIER, nicht am Sendeort.
  zeile: "<gray>  {zeit}  {spieler} {tat} {block}</gray>"
  # Eine ABGEWIESENE Tat - ein eigener Satz und nicht ein eingesetztes Wort.
  # DAS ZEICHEN UND DIE FARBE SIND DER ZWECK: Ein Dutzend dieser Zeilen an einer fremden
  #   Parzelle ist der Fund, nach dem die Moderation sucht - und es ist einer, bei dem
  #   gar nichts passiert ist. Eine Zeile, die sich nur in einem Wort unterscheidet,
  #   faellt beim Durchlesen nicht auf.
  zeile-abgewiesen: "<dark_gray>  {zeit}</dark_gray><red>  x {spieler} {tat} {block}</red>"
  # Dieselben zwei Zeilen fuer die Abfrage nach einem SPIELER: Dort ist der Ort die
  #   wichtigste Angabe - "wo war der" ist die ganze Frage -, und der Name steht in der
  #   Ueberschrift.
  zeile-mit-ort: "<gray>  {zeit}  {ort} {tat} {block}</gray>"
  zeile-mit-ort-abgewiesen: "<dark_gray>  {zeit}</dark_gray><red>  x {ort} {tat} {block}</red>"
  # An diesem Block steht nichts. SAGT, WARUM das sein kann - ohne diesen Hinweis sucht
  #   der Moderator den Fehler im Plugin, obwohl die Welt abgewaehlt oder die Frist um
  #   sein kann.
  leer-ort: "<gray>Zu {ort} steht nichts im Blockbuch - die Welt kann abgewaehlt sein, oder die Frist hat es geholt.</gray>"
  leer-spieler: "<gray>Zu {spieler} steht nichts im Blockbuch.</gray>"
  # Der Blick ging ins Leere. NENNT DIE REICHWEITE: Wer einen Block weit weg anschaut,
  #   soll nicht raten, ob das Buch leer ist oder der Blick zu weit ging.
  kein-block: "<gray>Du siehst keinen Block an</gray><dark_gray> (Reichweite {reichweite} Bloecke). Nach einem Spieler fragt /freimarken blockbuch spieler \\<name>.</dark_gray>"
  # Das Buch schreibt in dieser Welt nichts. EIN EIGENER SATZ und nicht leer-ort: Hier
  #   steht nichts, weil nichts aufgeschrieben WIRD - nicht weil nichts geschehen ist.
  #   Genau den Unterschied muss ein Moderator kennen, bevor er jemanden freispricht.
  aus: "<yellow>In dieser Welt schreibt das Blockbuch nichts</yellow><gray> - was hier geschah, steht nirgends. Einstellbar unter blockbuch.welten in der config.yml.</gray>"
  # Die Ablage hat geschwiegen. AUCH DAS ist nicht "hier steht nichts": Ein Netzfehler
  #   darf nicht aussehen wie ein Freispruch.
  gestoert: "<red>Das Blockbuch antwortet nicht</red><gray> - der Grund steht im Serverprotokoll. Das ist KEIN Freispruch.</gray>"
  # Den Namen kennt der Server nicht. Wichtig, damit ein Tippfehler nicht als leeres
  #   Buch durchgeht - sonst waere die Antwort ein Freispruch fuer einen Namen, den
  #   niemand traegt.
  unbekannt: "<red>Den Spieler {name} kennt dieser Server nicht.</red>"
  # Die Woerter fuer die drei Taten. KEINE Farbtags: Sie werden in die Zeilen darueber
  #   eingesetzt und sind dort ein Blatt - ein Tag darin stuende woertlich im Chat.
  tat:
    setzen: "setzte"
    abbauen: "baute ab"
    benutzen: "benutzte"
