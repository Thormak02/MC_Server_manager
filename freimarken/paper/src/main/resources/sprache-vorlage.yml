# Freimarken - sprache-vorlage.yml
#
# WIRD BEI JEDEM START NEU GESCHRIEBEN. Was du hier aenderst, ist beim naechsten
# Start weg. Hier steht JEDER Satz, den ein Spieler liest - zum Nachsehen und zum
# Kopieren. Suche nach dem Wortlaut, dann hast du den Schluessel.
#
# EINEN SATZ AENDERN: die Zeile samt aller Ebenen darueber nach sprache.yml kopieren
#   und DORT aendern. /freimarken neuladen uebernimmt sie sofort.
# FARBE: <fliesstext> <betont> <kopf> <geld> <warnung> <bestaetigung> <hinweis>
#   <gedaempft> - die acht ROLLEN der Farbwelt; ihre Werte stehen im Block farben:
#   weiter unten. Ein Satz nennt die Rolle und nie einen Farbwert: So aendert eine
#   Zeile dort die Farbe in allen Saetzen, die sie benutzen.
#   Dazu <bold> und <italic> und jede Farbe, die Minecraft kennt (<gray>, <gold>,
#   <dark_blue>, auch <#ffaa00>). Die wirken weiter, haengen aber an keiner Rolle -
#   wer sie benutzt, zieht sie bei einer Umfaerbung einzeln nach.
#   Jedes geoeffnete Tag MUSS geschlossen werden: <kopf>...</kopf>. Ein offenes oder
#   unbekanntes Tag ist eine Klage mit Zeile und Spalte. <click> und <hover> sind
#   nicht erlaubt - sie koennten einen Befehl im Namen des Spielers ausloesen.
# SPITZE KLAMMER ALS ZEICHEN: schreibe ZWEI Backslashes davor - sonst haelt das
#   Plugin sie fuer eine Farbe. Der Grund fuer die zwei: in doppelten
#   Anfuehrungszeichen ist ein Backslash fuer YAML selbst ein Sonderzeichen, und
#   einer allein macht die ganze Datei unlesbar.
#   BEISPIEL ESCAPE: zeile: "<fliesstext>Preis fuer \\<anzahl> Parzellen</fliesstext>"
#   BEISPIEL LIEST: Preis fuer <anzahl> Parzellen
# WERT: {name} in geschweiften Klammern. Welche ein Satz kennt, steht im Kommentar
#   darueber. Einen weglassen ist erlaubt (dann liest der Spieler den Wert nicht),
#   einen fremden Namen nicht - dann gilt fuer diesen EINEN Satz wieder der
#   ausgelieferte, und eine Zeile im Bericht sagt es. Ein Wert, der selbst eine
#   Klammer traegt, wird nie als Platzhalter gelesen.
# EINZUG UND SPALTEN: stehen IM Satz. Fuehrende Leerzeichen sind Absicht - darum
#   steht jeder Wert in doppelten Anfuehrungszeichen.
# NEUE CHATZEILE: \n im Satz - EIN Backslash, anders als bei der spitzen
#   Klammer. Der Unterschied: Die Folge \n kennt YAML als Umbruch, \< kennt es
#   nicht - darum braucht die Klammer zwei und der Umbruch einen. Jede Zeile wird
#   einzeln gesendet. Eine Farbe gilt ueber den Umbruch hinweg weiter - du kannst
#   aber auch je Zeile ein eigenes Tag setzen, und das tun mehrere Zeilen dieser
#   Datei schon: warp.ziele traegt kopf, betont und fliesstext in EINER Zeile.
#   BEISPIEL UMBRUCH: zeile: "<fliesstext>Erste Zeile\nZweite Zeile</fliesstext>"
#   BEISPIEL ZWEI ZEILEN: Erste Zeile | Zweite Zeile
# ZAEHLT: ein Satz mit einer Zahl hat zwei Formen, eins und viele. BEIDE Pflicht.
# ZEICHEN: ASCII und · (U+00B7). Keine Umlaute, kein scharfes s, kein
#   Paragrafenzeichen, kein &-Code. Die Datei ist UTF-8.

# DIE FARBWELT - acht benannte Rollen (Plan 2.2 und 9a.3).
#
# Jeder Satz dieser Datei nennt eine ROLLE und keinen Farbwert: <warnung> und nicht
#   <bundesrot>. Wer sein Rot dunkler will, aendert HIER eine Zeile und nicht
#   zweihundert Saetze - und ein Satz uebersteht eine Umfaerbung unveraendert.
#
# DIE WERTE STEHEN IN ANFUEHRUNGSZEICHEN, als Raute mit sechs Stellen. Ohne
#   Anfuehrungszeichen beginnt die Raute in YAML einen KOMMENTAR, und die Zeile hat
#   gar keinen Wert mehr - das Plugin klagt darueber mit Zeilennummer.
#
# WOHER DIE WERTE KOMMEN: Plan 2.2 nennt vier Markenfarben - Bundesrot #8C3431,
#   Markgold #C6A15B, Forstgruen #395948, Schiefer #333B40. Drei davon sind fuer
#   FLAECHEN gemacht (Schilder, Menuehintergruende, Bauwerke) und als Chattext auf
#   dunklem Grund zu dunkel: Schiefer waere fast unsichtbar. Die Textrollen tragen
#   darum aufgehellte Werte DERSELBEN Farbtoene - gleicher Farbton, hoeherer
#   Hellwert -, die reinen Markenwerte bleiben den Flaechen. Markgold ist hell genug
#   und steht unveraendert.
#
# EINE ROLLE WEGLASSEN ist erlaubt: Dann gilt fuer sie der ausgelieferte Wert. Eine
#   unbekannte Rolle wirkt nicht und steht als Zeile im Bericht.
farben:
  # Gewoehnlicher Text - der Grundton jeder Zeile. Schiefer, aufgehellt.
  fliesstext: "#a5b4bf"
  # Ein Name, eine Zahl, ein Schluesselwort INNERHALB einer Zeile. Schiefer, fast weiss.
  #   Heisst betont und nicht name: <name> ist in den Befehlshinweisen dieser Datei der
  #   ANGABEPLATZ ("/laden mieten \<name>") - ein Rollenname darf nicht aussehen wie
  #   ein Platzhalter.
  betont: "#edf1f3"
  # Die Ueberschrift oder Ansage, die obenan steht. Markgold.
  kopf: "#c6a15b"
  # Ein Geldbetrag - Mark, Goldmark, Preise. Markgold, also ab Werk derselbe Wert wie
  #   kopf. Trotzdem eine EIGENE Rolle: Wer seine Ueberschriften schiefern will,
  #   aendert nur kopf, und die Betraege bleiben golden.
  geld: "#c6a15b"
  # Absage, Verbot, Stoerung, Gefahr. Bundesrot, aufgehellt.
  warnung: "#d9564d"
  # Es ist geglueckt. Forstgruen, aufgehellt.
  bestaetigung: "#73bf96"
  # Ein Hinweis, eine Werbung, eine Rueckfrage. Markgold, aufgehellt - heller als geld,
  #   damit ein Hinweis nicht wie ein Betrag aussieht.
  hinweis: "#e3c57e"
  # Fusszeile, Nebensatz, der Weg zum naechsten Befehl. Schiefer, mittel. Leiser als
  #   der Fliesstext und noch lesbar; das alte <dark_gray> war an der Grenze.
  gedaempft: "#6e7a82"

mark:
  # {betrag} - dein Stand. Mehrfarbig in EINER Zeile: das Stueck in geld ist ein
  # WERT, also kannst du den Satz umstellen, ohne einen zweiten Schluessel zu
  # brauchen.
  stand: "<fliesstext>Du hast <geld>{betrag}</geld>.</fliesstext>"
  # Die zweite Zeile von /mark. Sie steht unter stand und nicht in verlauf: Gelesen
  # wird sie bei /mark, nicht bei /mark verlauf.
  verlauf-hinweis: "<gedaempft>/mark verlauf zeigt die letzten Buchungen.</gedaempft>"
  verlauf:
    # Noch keine Buchung - dann steht nur diese eine Zeile da.
    leer: "<fliesstext>Noch keine Buchungen.</fliesstext>"
    # Der Kopf ueber den Buchungen.
    kopf: "<kopf>Deine letzten Buchungen</kopf>"
    # {zeit} {betrag} {grund} {stand} - Zeitform aus zeit.verlauf-muster, Betrag und
    # Vorzeichen formt das Programm, {grund} kommt aus der Liste darunter.
    # Einzug und Farbe stehen HIER, nicht am Sendeort: wer den Betrag in geld will,
    # schreibt <geld>{betrag}</geld> hinein, und es wirkt wirklich.
    zeile: "<fliesstext>  {zeit}  {betrag}  {grund}  (Stand {stand})</fliesstext>"
    # Was ein Spieler statt des Datenbankschluessels liest. KEINE Farbtags: diese
    # Woerter werden in den Satz darueber eingesetzt und sind dort ein Blatt - ein
    # Tag darin stuende dem Spieler woertlich im Chat.
    grund:
      eroeffnung: "Startguthaben"
      bestand: "Stand bei Einfuehrung des Kontobuchs"
      parzelle-gekauft: "Parzelle genommen"
      parzelle-erstattet: "Parzelle nicht eingetragen - erstattet"
      freistadt-gegruendet: "Freistadt gegruendet"
      freistadt-erstattet: "Freistadt nicht eingetragen - erstattet"
      # Schritt 10: die Meerinsel. Zwei Worte wie bei Parzelle und Freistadt - eines
      # fuer den Kauf, eines fuer den Fall, in dem NICHTS geschehen ist.
      werder-gekauft: "Meerinsel genommen"
      werder-erstattet: "Meerinsel nicht eingetragen - erstattet"
      # Schritt 11: die Wolkeninsel. Dieselben zwei Worte, und sie stehen auch
      # dann hier, wenn die Insel gratis ist - eine Buchung ueber 0 Mark wird
      # geschrieben und ist die Spur, wann sie genommen wurde.
      wolke-genommen: "Wolkeninsel genommen"
      wolke-erstattet: "Wolkeninsel nicht eingetragen - erstattet"
      wolke-aufgabe: "Herausforderung erfuellt"
      wolke-biom: "Biom der Wolkeninsel gewechselt"
      wolke-biom-erstattet: "Biomwechsel nicht zustande gekommen - erstattet"
      # Teil C3: der Grundstueckshandel. VIER Worte, weil derselbe Betrag beim
      # Kaeufer eine Ausgabe und beim Verkaeufer eine Einnahme ist - wer seinen
      # Verlauf liest, muss beides auseinanderhalten koennen.
      grundstueck-gekauft: "Grundstueck gekauft"
      grundstueck-verkauft: "Grundstueck verkauft"
      grundstueck-gebuehr: "Marktgebuehr auf den Verkauf"
      grundstueck-erstattet: "Grundstueck nicht uebertragen - erstattet"
      zusammenlegung: "Grundstueck zusammengelegt"
      zusammenlegung-erstattet: "Zusammenlegen gescheitert - erstattet"
      beruf-verlassen: "Beruf aufgegeben"
      beruf-erstattet: "Beruf aufgeben gescheitert - erstattet"
      # Eine Zeile je Takt und nicht je Block: Gebucht wird, was der Zeitgeber gesammelt
      # hat. Was ein Spieler dafuer getan hat, steht im Logbuch und nicht im Geldbuch.
      beruf-verdienst: "Verdienst aus Arbeit"
      # Eine Zeile je Verkauf. WAS verkauft wurde, steht nicht im Geldbuch -
      # dieselbe Trennung wie beim Verdienst.
      bundesmarkt-verkauf: "Verkauf an den Bundesmarkt"
      tagesbonus: "Tagesbonus"
      # Die Ladenlizenz steht nur EINMAL im Verlauf, und diese Zeile ist ihr Beleg -
      # eine eigene Spalte dafuer gibt es nicht.
      laden-lizenz: "Ladenlizenz"
      laden-kaution: "Kaution"
      laden-kaution-zurueck: "Kaution zurueck"
      laden-erstattet: "Ladenmiete erstattet"
      # DIE STADTKASSE: drei Woerter, und zwei davon sind dieselbe Bewegung auf zwei
      #   Konten. Im Verlauf der STADT heisst das Abheben "abgehoben", im Verlauf des
      #   Besitzers "aus der Stadtkasse" - wer nur eine der beiden Zeilen sieht, soll
      #   trotzdem wissen, woher das Geld kam oder wohin es ging.
      # Die Marktgebuehr steht hier ein zweites Mal: oben als grundstueck-gebuehr beim
      #   Verkaeufer, der sie zahlt, hier als Einnahme der Stadt, die sie bekommt.
      #   Dieselben Mark, zwei Zeilen, zwei Konten.
      # Was der Besitzer beim AUFGEBEN seiner Stadt zurueckbekommt [Teil E6]. Ein
      #   eigenes Wort und nicht freistadt-erstattet: Jenes erzaehlt von einer
      #   Gruendung, die schiefging.
      freistadt-aufgegeben: "Stadt aufgegeben"
      # Die Ladengebuehr - beim Shopbesitzer eine Ausgabe, in der Stadtkasse eine
      #   Einnahme. Zwei Worte fuer eine Bewegung, weil ein Konto nur seine eigenen
      #   Zeilen traegt.
      freistadt-ladengebuehr: "Ladengebuehr"
      stadtkasse-ladengebuehr: "Ladengebuehr einer Stadt"
      stadtkasse-gebuehr: "Marktgebuehr einer Stadt"
      stadtkasse-abgehoben: "vom Besitzer abgehoben"
      stadtkasse-ausgezahlt: "aus der Stadtkasse"
      # Selten, aber nicht nie: Das Abbuchen bei der Stadt gelang, die Gutschrift
      #   beim Besitzer nicht. Eigenes Wort, weil diese Zeile von einem Fehler
      #   erzaehlt und nicht von einem Verkauf.
      stadtkasse-zurueck: "Auszahlung zurueckgenommen"
      # Der einzige WIEDERKEHRENDE Grund dieses Bereichs - einmal je Tag und Laden.
      # Ein Mieter liest ihn oefter als jeden anderen, darum ist das Wort kurz.
      laden-miete: "Ladenmiete"
      # DER HANDEL AN KISTENSHOPS: drei Zeilen fuer EINEN Handel, weil drei verschiedene
      #   Fluesse laufen - aber zwischen ZWEI Konten und einer Senke. Was gezahlt wurde,
      #   steht in der Zeile des Zahlers; was ankam, in der des Empfaengers; was der
      #   Staat nimmt, in einer dritten auf DEMSELBEN Konto wie die zweite, weil der
      #   Staat kein Konto hat. Netto bleibt dem Empfaenger der Erloes, und die Summe
      #   aller Buchungen eines Kontos ist weiterhin sein Stand.
      # BEIDE RICHTUNGEN unter denselben zwei Worten: Beim Kauf zahlt der Kunde, beim
      #   Verkauf der Shopbesitzer. Es ist dieselbe Zahlung und darum dasselbe Wort.
      # WAS gehandelt wurde, steht in keinem dieser Worte - dieselbe Trennung wie bei
      #   beruf-verdienst und bundesmarkt-verkauf. Das Geldbuch fuehrt Geld.
      # DIE HAEUFIGSTEN WORTE DES GANZEN VERLAUFS, sobald die Mall steht: Ein Spieler,
      #   der zwanzigmal einkauft, liest sie zwanzigmal. Darum kurz.
      shop-gekauft: "Einkauf"
      shop-verkauft: "Verkauf"
      # Faellt nur, wenn die GERECHNETE Gebuehr ueber 0 liegt - nicht schon, wenn ein
      #   Satz ueber 0 steht: Bei 5 Prozent auf 19 Mark ist die Gebuehr abgerundet 0,
      #   und eine Zeile ueber 0 Mark waere eine Zeile ohne Geldbewegung. Weil in
      #   handel: ab Werk alle Saetze auf 0 stehen, faellt sie heute nie.
      shop-gebuehr: "Marktgebuehr"
      # Faellt noch seltener: nur, wenn ein Handel NACH dem Zahlen gescheitert ist.
      #   Nach einer genauen Platzrechnung ist der Fall nicht erreichbar - das Wort
      #   steht da, weil "nicht erreichbar" kein Zustand ist, auf den man Geld setzt.
      shop-erstattet: "Handel erstattet"
      # Die Wechselstube (Plan 8.1). DIE WORTE SAGEN, WOHER DAS GELD KAM ODER WOHIN
      #   ES GING - nie, welche Waehrung es war: Dieselben sechs Schluessel tragen die
      #   Zeilen in BEIDEN Buechern, im Markbuch und im Goldbuch, und welche Einheit
      #   gemeint ist, sagt der Betrag daneben. Stuende die Waehrung im Wort, laese ein
      #   Spieler im Goldbuch "5 Goldmark - Mark gekauft".
      # Die zwei ERSTATTUNGEN unterscheiden sich darin, welche RICHTUNG gescheitert
      #   ist, und nicht in der Waehrung. Sie fallen selten: nur, wenn zwischen den
      #   zwei Buchungen eines Tausches die Verbindung abbricht.
      wechsel-mark-weg: "In Goldmark gewechselt"
      wechsel-goldmark-her: "Aus Mark gewechselt"
      wechsel-goldmark-weg: "In Mark gewechselt"
      wechsel-mark-her: "Aus Goldmark gewechselt"
      wechsel-mark-zurueck: "Kauf gescheitert - erstattet"
      wechsel-goldmark-zurueck: "Rueckwechsel gescheitert - erstattet"
      # Teil G: das Muenzhaus. Zwei Worte, und das zweite faellt nur, wenn die
      # Lieferung nach der Zahlung nicht zustandekam - dann steht die Erstattung als
      # eigene Zeile daneben, und der Spieler sieht, dass sein Geld zurueck ist.
      muenzhaus-kauf: "Im Muenzhaus gekauft"
      muenzhaus-erstattet: "Kauf gescheitert - erstattet"
      # Die einzige Geldquelle, die nicht aus dem Spiel kommt: /freimarken geld. Der
      #   Spieler soll sie in seinem Verlauf erkennen - sonst sucht er einen Verkauf,
      #   den es nicht gab.
      betreiber-gutschrift: "Vom Betreiber gutgeschrieben"
      betreiber-abzug: "Vom Betreiber abgezogen"
      # Dieselben zwei Worte fuer die Goldmark - /freimarken goldgeld. Welche Einheit
      #   die Zahl daneben hat, sagt die Zeile und nicht das Wort, genau wie bei
      #   lotterie-gewinn und lotterie-goldgewinn darunter.
      betreiber-goldgutschrift: "Vom Betreiber gutgeschrieben"
      betreiber-goldabzug: "Vom Betreiber abgezogen"
      # Plan 14: die Lotterie in Altfurt. Das LOS steht auch mit 0 Mark im Buch, weil
      #   das erste am Tag gratis ist - dann ist dieses Wort die ganze Auskunft der
      #   Zeile, und ohne es saehe der Spieler eine 0 und wuesste nicht, wofuer.
      # Der GOLDgewinn landet im Goldbuch; welche Einheit die Zahl daneben hat, sagt
      #   die Zeile und nicht das Wort - wie bei muenzhaus-kauf.
      los-gezogen: "Los der Lotterie"
      los-erstattet: "Gewinn nicht angekommen - erstattet"
      lotterie-gewinn: "In der Lotterie gewonnen"
      lotterie-goldgewinn: "In der Lotterie gewonnen"
      # Plan 14: der Angelwettbewerb. Startgeld und Preis stehen im Verlauf
      #   nebeneinander; die Differenz ihrer Summen ist der Zuschuss des Betreibers.
      wettbewerb-start: "Startgeld fuer den Angelwettbewerb"
      wettbewerb-preis: "Preis aus dem Angelwettbewerb"
      wettbewerb-erstattet: "Anmeldung gescheitert - erstattet"

  # /MARK TAUSCHEN - die Wechselstube. Plan 2.1 nennt fuer das Muenzhaus "Kontostand,
  # Verlauf, Wechsel Mark - Goldmark, Wechseldeckel sichtbar"; das Haus selbst kommt
  # spaeter, diese Zeilen sind seine Auskunft im Chat.
  #
  # GEWECHSELT WIRD IN GOLDMARK, in beiden Richtungen - darum heissen beide Zahlen in
  # den Saetzen unten {goldmark} und {anzahl} und nie "Betrag": Wer drei kauft, zahlt
  # dreimal den Kurs, und ein Rest bleibt nie liegen.
  tausch:
    # Die erste von vier Zeilen der Tafel.
    kopf: "<kopf>Wechselstube</kopf>"
    # {betrag} - dein Stand in GOLDMARK. Die Mark zeigt /mark ohne weiteres Wort.
    stand: "<fliesstext>Du hast <geld>{betrag}</geld>.</fliesstext>"
    # {kauf} was eine Goldmark kostet, {verkauf} was sie zurueckbringt. Beide in EINER
    # Zeile: Der Unterschied zwischen den zwei Zahlen IST der Preis des Rundlaufs.
    kurse: "<fliesstext>Eine Goldmark kostet <geld>{kauf}</geld> und bringt <geld>{verkauf}</geld> zurueck.</fliesstext>"
    # {anzahl} Goldmark, {betrag} Mark - der sichtbare Wechseldeckel. Beide Zahlen,
    # weil der Deckel in MARK bemessen ist und gewechselt wird in GOLDMARK.
    frei: "<fliesstext>Heute kannst du noch <geld>{anzahl}</geld> zurueckwechseln ({betrag}).</fliesstext>"
    # Statt der Zeile darueber, wenn wechsel.tagesdeckel auf 0 steht.
    zu: "<fliesstext>Der Rueckweg in Mark ist geschlossen.</fliesstext>"
    # Die letzte Zeile der Tafel: wie man tauscht.
    hilfe: "<gedaempft>/mark tauschen kaufen 5 oder /mark tauschen verkaufen 5</gedaempft>"
    # {goldmark} was du bekommen hast, {mark} was es gekostet hat, {stand} dein
    # Goldmarkstand danach.
    gekauft: "<bestaetigung>{goldmark} fuer {mark} gekauft. Du hast jetzt {stand}.</bestaetigung>"
    # Die Gegenseite: {mark} ist hier, was du bekommen hast.
    verkauft: "<bestaetigung>{goldmark} fuer {mark} zurueckgewechselt. Du hast jetzt {stand}.</bestaetigung>"
    # {preis} was es kostet, {fehlt} was dir an Mark fehlt.
    zu-wenig-mark: "<warnung>Das kostet {preis} - dir fehlen {fehlt}.</warnung>"
    # {anzahl} was du tauschen wolltest, {stand} was du hast.
    zu-wenig-goldmark: "<warnung>{anzahl} hast du nicht - du hast {stand}.</warnung>"
    # {anzahl} wie viele Goldmark heute noch gehen, {betrag} wie viele Mark das sind.
    # DIE ZAHL IST DIE GANZE NACHRICHT: Der Wechsel kuerzt nicht, er sagt ab - ohne
    # diese Zahl probiert ein Spieler zwanzigmal.
    deckel-erreicht: "<warnung>Heute gehen nur noch {anzahl} ({betrag}) - der Wechseldeckel.</warnung>"
    # {betrag} der Deckel in Mark. Diese Zeile statt der darueber, wenn heute gar
    # nichts mehr geht.
    deckel-voll: "<warnung>Heute ist der Wechseldeckel von {betrag} erreicht. Morgen wieder.</warnung>"
    # Eine Kasse hat geschwiegen. Was abgebucht war, ist zurueck.
    gestoert: "<warnung>Die Kasse hat nicht geantwortet. Es ist nichts passiert.</warnung>"

  # /MARK MUENZHAUS - das Haus selbst (Plan 2.1: Bank und Waehrung). Es zeigt den
  # Kontostand, die Kurse, den sichtbaren Wechseldeckel und den Katalog, und es
  # verkauft GEGENSTAENDE fuer Goldmark.
  #
  # DREI ZEILEN DER TAFEL STEHEN NICHT HIER, sondern oben unter tausch: stand, kurse
  # und frei bzw. zu. Das ist Absicht - es ist dieselbe Auskunft, und zwei Wortlaute
  # fuer eine Zahl laufen auseinander, sobald jemand nur einen davon aendert.
  #
  # DIE NAMEN DER POSTEN stehen ganz unten unter muenzhaus.posten - was es gibt, steht
  # in der config.yml, wie es heisst, hier.
  muenzhaus:
    # Die erste Zeile der Tafel.
    kopf: "<kopf>Muenzhaus</kopf>"
    # Wenn muenzhaus.an auf false steht. Kontostand und Verlauf bleiben zu sehen.
    aus: "<fliesstext>Im Muenzhaus wird gerade nichts verkauft.</fliesstext>"
    # Wenn der Katalog leer ist - eine andere Aussage als "aus".
    leer: "<fliesstext>Der Katalog ist leer.</fliesstext>"
    # EINE Zeile je Posten. {name} der Name aus muenzhaus.posten, {preis} in GOLDMARK,
    # {inhalt} die Gegenstaende mit ihren technischen Namen, so wie sie in der
    # config.yml stehen - wer danach fragt, soll die Antwort dort wiederfinden.
    zeile: "<fliesstext>- <betont>{name}</betont> fuer <geld>{preis}</geld>: {inhalt}</fliesstext>"
    # Dieselbe Zeile, wenn dein Goldmarkstand nicht reicht.
    zeile-zu-teuer: "<gedaempft>- {name} fuer {preis}: {inhalt}</gedaempft>"
    # Dieselbe Zeile, wenn eine BEDINGUNG fehlt. Ohne die Zahlen - was genau fehlt,
    # sagt der Versuch zu kaufen; in einer Liste von Posten waere es eine Wand.
    zeile-gesperrt: "<gedaempft>- {name} fuer {preis}: {inhalt} (noch nicht frei)</gedaempft>"
    # Die letzte Zeile der Tafel.
    hilfe: "<gedaempft>/mark muenzhaus kaufen [posten] - Verlauf: /mark muenzhaus verlauf</gedaempft>"
    # DIE RUECKFRAGE. {name} der Name, {posten} sein Schluessel fuer den Befehl,
    # {preis} der Preis, {inhalt} was du bekommst, {danach} dein Stand danach.
    # Zwei Stufen wie bei /beruf verlassen und /freistadt gruenden: Der Posten wird
    # getippt, er kostet Goldmark, und verkauft wird hier nichts.
    frage: "<hinweis>{name} kostet {preis} und bringt {inhalt}. Danach haettest du {danach}.</hinweis>\n<fliesstext>Zum Kaufen: /mark muenzhaus kaufen {posten} bestaetigen</fliesstext>"
    # {name} was du gekauft hast, {inhalt} was in deinem Rucksack liegt, {preis} was
    # es gekostet hat, {stand} dein Goldmarkstand danach.
    gekauft: "<bestaetigung>{name} gekauft fuer {preis}: {inhalt}. Du hast jetzt {stand}.</bestaetigung>"
    # {posten} was du getippt hast. Mit dem Wort darin, damit du deinen Tippfehler
    # siehst - ohne es sucht man an der falschen Stelle.
    unbekannt: "<warnung>Den Posten \"{posten}\" gibt es im Katalog nicht.</warnung>"
    # {name} der Posten. Darunter kommt je fehlender Bedingung eine eigene Zeile.
    bedingung-fehlt: "<warnung>{name} ist noch nicht frei fuer dich. Dafuer brauchst du:</warnung>"
    # {preis} was es kostet, {stand} was du hast, {fehlt} der Unterschied.
    zu-wenig: "<warnung>Das kostet {preis} - du hast {stand}, dir fehlen {fehlt}.</warnung>"
    # {stueck} wie viele Stueck NICHT hineinpassen. Gefragt wird VOR der Zahlung: Hier
    # ist nichts abgebucht und nichts geliefert.
    kein-platz:
      eins: "<warnung>In deinem Rucksack fehlt Platz fuer 1 Stueck - es ist nichts passiert.</warnung>"
      viele: "<warnung>In deinem Rucksack fehlt Platz fuer {stueck} Stueck - es ist nichts passiert.</warnung>"
    # Kasse, Messung oder Rucksack haben geschwiegen - und es ist NICHTS passiert.
    # Diesen Satz liest, wer nur die Tafel oder den Verlauf aufgeschlagen hat, und wer
    # beim Kaufen vor der Zahlung gescheitert ist. Vom Geld redet nur die Zeile darunter.
    gestoert: "<warnung>Das Muenzhaus hat nicht geantwortet - es ist nichts passiert.</warnung>"
    # Hier war abgebucht, und das Geld ist zurueck. Der einzige Satz, der das sagen
    # darf: Ein Spieler, der eine Erstattung liest, sucht sie danach im Verlauf.
    erstattet: "<warnung>Das Muenzhaus hat nicht geantwortet. Dein Geld ist zurueck.</warnung>"
    # Der Kopf des GOLDverlaufs. {betrag} dein Goldmarkstand. Die Buchungszeilen
    # darunter kommen aus mark.verlauf.zeile - dieselbe Form wie im Markbuch, nur mit
    # der anderen Waehrung an den Zahlen.
    verlauf-kopf: "<kopf>Goldmark: {betrag}</kopf>"
    # Noch keine Goldmark bewegt.
    verlauf-leer: "<fliesstext>Noch keine Goldmark bewegt. Mit /mark tauschen kaufen 5 geht es los.</fliesstext>"
    # DIE BEDINGUNGEN, je eine Zeile unter bedingung-fehlt. {zahl} ist die Zahl aus
    # deiner config.yml - zwei Formen, weil "1 eigene Parzellen" falsch waere.
    bedingung:
      taetige-stunden:
        eins: "<fliesstext>- 1 Stunde taetige Zeit</fliesstext>"
        viele: "<fliesstext>- {zahl} Stunden taetige Zeit</fliesstext>"
      anwesenheit-stunden:
        eins: "<fliesstext>- 1 Stunde auf dem Server</fliesstext>"
        viele: "<fliesstext>- {zahl} Stunden auf dem Server</fliesstext>"
      parzellen:
        eins: "<fliesstext>- 1 eigene Parzelle</fliesstext>"
        viele: "<fliesstext>- {zahl} eigene Parzellen</fliesstext>"
      beruf:
        eins: "<fliesstext>- 1 gewaehlter Beruf</fliesstext>"
        viele: "<fliesstext>- {zahl} gewaehlte Berufe</fliesstext>"
      # OHNE Waehrungswort: {zahl} ist hier ein GELDbetrag und kommt aus
      # waehrung.betrag - mit Tausenderpunkt und mit deinem Wort fuer die Waehrung.
      # Darum stehen beide Formen gleich da: "1 Mark" und "50.000 Mark" bildet jene
      # Zeile selbst. Die Stundenzeilen darueber sind kein Geld und bleiben nackt.
      guthaben:
        eins: "<fliesstext>- {zahl} auf dem Konto</fliesstext>"
        viele: "<fliesstext>- {zahl} auf dem Konto</fliesstext>"
      # Der Rundgang [21.11.2026] - eine Frage mit ja oder nein, darum ist die Zahl
      # immer 1. Beide Formen muessen trotzdem dastehen; die Mehrzahl liest niemand.
      rundgang:
        eins: "<fliesstext>- 1 abgeschlossener Rundgang durch Altfurt</fliesstext>"
        viele: "<fliesstext>- {zahl} abgeschlossene Rundgaenge</fliesstext>"

waehrung:
  # {zahl} setzt das Programm mit deutschen Tausenderpunkten ein. Nur das Wort ist
  # deines; die Zahlform bleibt im Programm, damit ein Tippfehler keine Preise
  # verbiegt. Kein Farbtag - der Betrag wird in andere Saetze eingesetzt.
  # VON HIER KOMMT JEDER BETRAG, DEN EIN SPIELER LIEST: Stand und Verlauf in
  #   /mark, Preise, Gebuehren und Rest in /parzelle, die zwei Preiszeilen
  #   von /freimarken preis, und seit Teil C3 jeder Betrag in /freistadt -
  #   Gruendungspreis, Angebotspreis, Erloes und Marktgebuehr. Aenderst du
  #   das Wort, aendert es sich in allen.
  # EINE STELLE SAGT WEITER HART Mark, und sie geht an keinen Spieler: Die
  #   Antwort von /freimarken neuladen nennt bei einer unbrauchbaren Zahl die
  #   Einheit selbst - hoechstens 1000000000 Mark. Wer das Wort hier aendert,
  #   liest sie dort unveraendert, im Chat des Betreibers und nicht im Spiel.
  betrag: "{zahl} Mark"
  # Dasselbe Wort fuer einen Betrag UNTER einer Mark - zum Beispiel 0,40 Mark. Das
  # Komma und die zwei Stellen dahinter kommen aus dem Programm, wie der Tausenderpunkt
  # oben. Gebraucht wird es vom Handbalken des Verdienens: Dort sind es meistens
  # Pfennige, und "0 Mark" waere die falsche Antwort an einen, der gerade arbeitet.
  # AENDERST DU DEIN WAEHRUNGSWORT, aendere es an BEIDEN Stellen.
  pfennige: "{zahl} Mark"
  # Die ZWEITE Waehrung (Plan 8.1): die Goldmark. Ein eigener Schluessel und nicht
  # derselbe wie oben, und das ist der sichtbarste Teil der Trennung: Beide Zahlen sind
  # im Programm dasselbe, und eine verwechselte Zeile zeigte "12 Mark", wo einer 12
  # Goldmark hat - beim Kurs des Plans das Tausendfache daneben.
  # Gebraucht wird es von /mark tauschen und vom Muenzhaus - Stand, Preise und jede
  # Zeile des Goldverlaufs.
  goldmark: "{zahl} Goldmark"

zeit:
  # Muster fuer DateTimeFormatter, kein Satz. Wird beim LADEN uebersetzt - ein
  # unbrauchbares Muster ist eine Klage und kein Absturz mitten in /mark verlauf.
  # Das Jahr fehlt mit Absicht: Ein Verlauf zeigt die letzten Buchungen, und bei
  # zehn Zeilen ist die Jahresangabe zehnmal dieselbe.
  verlauf-muster: "dd.MM. HH:mm"

befehl:
  # Was in /help neben dem Befehl steht. NUR BEIM START GELESEN: die Beschreibungen
  # gehen bei der Anmeldung in den Befehlsbaum; /freimarken neuladen aendert sie
  # nicht, erst ein Neustart. Das sagt die Antwort auf /freimarken neuladen auch.
  # Keine Farbtags - der Befehlsbaum nimmt eine Zeichenkette und kein Component.
  beschreibung:
    freimarken: "Stand, Preise und Welt des Freimarkenbunds"
    parzelle: "Parzellen nehmen, ansehen und verwalten"
    mark: "Dein Guthaben in Mark"
    warp: "Reisen zwischen den Welten des Freimarkenbunds"
    zurueck: "Zurueck zum letzten Ort - nach Tod, Reise oder Teleport"
    tpa: "Frage einen Spieler, ob du zu ihm kommen darfst"
    tpahere: "Lade einen Spieler ein, zu dir zu kommen"
    tpaccept: "Eine Teleportanfrage annehmen"
    tpdeny: "Teleportanfragen ablehnen"
    markt: "Was der Bundesmarkt ankauft - verkauft wird an seinen Schildern"
    laden: "Die Markthalle und ihre Ladeneinheiten"
    freistadt: "Die Freistaedte - Liste, gruenden, Grundstuecke, Stadtbuerger, Regeln, Kasse"
    # Schritt 10: die Meerinseln.
    werder: "Meerinseln auf Hafenwerder ansehen und eine nehmen"
    wolke: "die eigenen Wolkeninseln, eine nehmen, heimreisen"
    # 20.11.2026: der eigene Rang und die Leiter.
    rang: "Dein Rang, die naechste Stufe und die ganze Leiter"
    # 21.11.2026: das Hauptmenue.
    menu: "Das Hauptmenue - jeder Befehl mit einem Klick"
    # 21.11.2026: die Regeln und die Befehlsliste.
    regeln: "Was auf diesem Server gilt - mit /regeln chat im Chat"
    hilfe: "Alle Befehle, nach Bereichen geordnet"
    shop: "Deine Kistenshops auflisten und fuer andere freigeben"
    beruf: "Deinen Beruf waehlen, ansehen und aufgeben"
    # 22.11.2026: die Lotterie. Die Zeile nennt das gratis Los - es ist der Grund,
    #   den Befehl ueberhaupt zu tippen, und diese Beschreibung steht auf jedem Client
    #   in der Befehlsliste.
    lotterie: "Ein Los ziehen - das erste am Tag ist gratis"
    wettbewerb: "Der Angelwettbewerb - Stand, Rangliste, anmelden"
    # Schritt 16a: die Teamrollen. Ein BETREIBERWERKZEUG - der Befehl haengt an
    #   freimarken.team und ist fuer einen gewoehnlichen Spieler weder sichtbar noch
    #   ausfuehrbar. Die Beschreibung steht trotzdem hier: Wer das Recht hat, liest sie
    #   in seiner Befehlsliste.
    team: "Teamrollen ansehen, vergeben und entziehen"
    # Schritt 16a Teil C: das Meldewesen. /melden ist fuer JEDEN - darum steht
    #   die Beschreibung in jeder Befehlsliste. /meldung haengt an
    #   freimarken.meldungen und ist ab Werk nur fuer Operatoren sichtbar.
    melden: "Einen Spieler melden - mit Grund, ein Moderator sieht es sich an"
    meldung: "Offene Meldungen ansehen, annehmen und erledigen"
    strafe: "Stummschalten, hinauswerfen, sperren - mit Dauer und Grund"
    bannliste: "Wer gesperrt ist, warum und bis wann"
    einsehen: "In fremde Behaelter sehen, ohne etwas zu nehmen"

parzelle:
  # Das Wort fuer den Preis 0 - es wird in info.frei, info.frei-am-limit und
  # liste.zeile EINGESETZT. Kein Farbtag: ein eingesetzter Wert ist ein Blatt, ein
  # Tag darin stuende dem Spieler woertlich im Chat.
  gratis: "gratis"
  # Dasselbe fuer die erste Parzelle, die ihren Preis gleich erklaert.
  gratis-die-erste: "gratis (die erste)"
  # {betrag} {rest} - die Rechnung nach einem Kauf. Sie steht unter nehmen.erteilt
  # UND unter zusammenlegen.erteilt: ein Schluessel fuer beide, damit derselbe Satz
  # nicht zweimal in dieser Datei steht.
  bezahlt: "<fliesstext>  Bezahlt: {betrag} · Rest: {rest}</fliesstext>"
  # {werbung} - NUR DIE FARBE ist hier deine. Der Satz selbst steht in der
  # config.yml unter hinweise.rang-werbung, denn er ist eine Einstellung DIESES
  # Servers und kein ausgelieferter Satz. Angehaengt wird er genau dort, wo ein Rang
  # wirklich der Grund der Absage ist: info.am-limit, nehmen.grenze,
  # bescheid.grenze-erreicht, bescheid.gruppe-zu-gross und
  # bescheid.noch-frei-am-limit. In hinweis und nicht in warnung - die Absage ist
  # die Nachricht, das hier ist das Angebot.
  #
  # DIE ANDEREN VIER GRENZEN haben ihren eigenen Schluessel mit demselben Wortlaut:
  # werder.rang-werbung, wolke.rang-werbung und freistadt.rang-werbung. Der SATZ ist
  # ueberall derselbe (er steht einmal in der config.yml), die FARBE kannst du je Ort
  # anders setzen.
  rang-werbung: "<hinweis>{werbung}</hinweis>"
  # Die eine Weltpruefung: Jeder Zweig von /parzelle beginnt damit.
  nicht-in-der-marktstadt: "<warnung>Parzellen gibt es nur in der Marktstadt.</warnung>"
  # {x} {z} {tat} - du stehst nicht da, wo der Befehl hinzeigt. {tat} ist eines der
  # vier Wortstuecke darunter: Vier Zweige geben vier verschiedene mit, und darum
  # steht dieser Satz nur EINMAL hier. Wer ihn umstellt, stellt alle vier um.
  steht-nicht-auf: "<warnung>Du stehst nicht auf Parzelle {x}/{z}. {tat}</warnung>"
  # Die vier Taten, die dadurch ausblieben - Wortstuecke fuer die Zeile darueber.
  # Kein Farbtag: ein eingesetzter Wert ist ein Blatt.
  tat:
    nichts-aufgegeben: "Nichts aufgegeben."
    nichts-zusammengelegt: "Nichts zusammengelegt."
    nichts-herausgeloest: "Nichts herausgeloest."
    nichts-aufgetrennt: "Nichts aufgetrennt."

  # /parzelle info - was auf dem Boden unter dir steht.
  info:
    # Hier liegt eine Gruppe, wo der Rasterplan noch "Weg" sagt: Nach einem
    # Zusammenlegen ist diese Stelle Bauland. Darunter steht info.eigentuemer.
    gruppenboden: "<kopf>Gruppenboden - war einmal Weg</kopf>"
    weg: "<fliesstext>Du stehst auf einem Weg - der gehoert allen.</fliesstext>"
    mauer: "<fliesstext>Du stehst auf einer Mauer - die gehoert zur Strasse.</fliesstext>"
    # {x} {z} - der Kopf. Er geht VOR dem Blick in die Ablage hinaus, damit das
    # Erste, was du liest, nicht von der Dauer einer Abfrage abhaengt.
    kopf: "<kopf>Parzelle {x}/{z}</kopf>"
    ausserhalb: "<fliesstext>  ausserhalb der Marktstadt - wird nicht vergeben</fliesstext>"
    # {preis} - frei und zu haben. {preis} ist das Wort gratis oben oder ein Betrag.
    frei: "<fliesstext>  frei · <bestaetigung>{preis}</bestaetigung><gedaempft> · /parzelle nehmen</gedaempft></fliesstext>"
    # {preis} - dieselbe Parzelle, wenn der Rang nichts mehr hergibt: der Preis bleibt
    # stehen, die Einladung nicht. Eine Aufforderung, die mit einer Absage endet,
    # waere Irrefuehrung und keine Werbung.
    frei-am-limit: "<fliesstext>  frei · {preis}</fliesstext>"
    # {anzahl} ZAEHLT - die Absage unter dem Preis, eingerueckt.
    # Derselbe Wortlaut steht ohne Einzug unter bescheid.grenze-erreicht. Zwei
    # Schluessel, weil der Einzug IM Satz steht: aenderst du nur einen, aendert sich
    # nur die eine Stelle.
    am-limit:
      eins: "<warnung>  Dein Rang erlaubt {anzahl} Parzelle, und so viele hast du schon.</warnung>"
      viele: "<warnung>  Dein Rang erlaubt {anzahl} Parzellen, und so viele hast du schon.</warnung>"
    # {name} - wem sie gehoert. Auch der Gruppenboden oben nimmt diese Zeile.
    eigentuemer: "<fliesstext>  Eigentuemer: <betont>{name}</betont></fliesstext>"
    # {preis} - gratis-die-erste oben oder ein Betrag.
    gekauft-fuer: "<fliesstext>  Gekauft fuer: <betont>{preis}</betont></fliesstext>"
    # {namen} - wer sonst hier bauen darf. Nur wenn jemand eingetragen ist.
    mitbauer: "<fliesstext>  Mitbauer: <betont>{namen}</betont></fliesstext>"
    # {anzahl} - wie viele Felder die Gruppe hat. KEIN ZAEHLT: dieser Satz sagt heute
    # auch bei einem Feld "Feldern". Eine Einzahlform waere eine Verbesserung und
    # keine Umstellung - sie kommt mit eigener Entscheidung, nicht nebenbei.
    gruppe: "<betont>  Teil einer Gruppe aus {anzahl} Feldern</betont>"
    # Nur fuer den Eigentuemer. Die acht Fuell-Leerzeichen sind die SPALTE - sie
    # stehen hier, damit du sie sehen und verschieben kannst.
    auftrennen-hinweis: "<gedaempft>  /parzelle auftrennen        dieses Feld herausloesen</gedaempft>"
    # Die spitze Klammer ist hier ein ZEICHEN und keine Farbe - darum \\< davor.
    zusammenlegen-hinweis: "<gedaempft>  /parzelle zusammenlegen \\<nord|ost|sued|west></gedaempft>"

  # /parzelle nehmen - der Kauf und seine Absagen.
  nehmen:
    # {x} {z} - darunter steht entweder erste-gratis oder parzelle.bezahlt.
    erteilt: "<bestaetigung>Parzelle {x}/{z} gehoert jetzt dir</bestaetigung>"
    erste-gratis: "<fliesstext>  Die erste ist gratis.</fliesstext>"
    kein-bauland: "<warnung>Hier ist kein Bauland - stell dich auf eine Parzelle.</warnung>"
    # {name} - der Eigentuemer, der schon eingetragen ist.
    schon-vergeben: "<warnung>Die gehoert schon <betont>{name}</betont></warnung>"
    # {anzahl} ZAEHLT - wie viele dein Rang erlaubt. Danach steht rang-werbung.
    grenze:
      eins: "<warnung>Du hast schon {anzahl} Parzelle - mehr erlaubt dein Rang nicht.</warnung>"
      viele: "<warnung>Du hast schon {anzahl} Parzellen - mehr erlaubt dein Rang nicht.</warnung>"
    # {betrag} {guthaben} - umstellbar: wer lieber erst das Guthaben nennt, schreibt
    # es um, und nichts bricht.
    zu-wenig: "<warnung>Die kostet <geld>{betrag}</geld>, du hast {guthaben}.</warnung>"
    # {von} {bis} - beide kommen ZWEIMAL vor, das ist erlaubt und Absicht.
    # DIE ERSTEN 25 ZEICHEN stehen auch in wache.schutz.ausserhalb - dort hinweis und
    # ohne die Grenzen, weil der Spieler dort nichts getippt hat. Zwei Zeilen, zwei
    # Lagen; aenderst du den Anfang, sieh dir die andere an.
    ausserhalb: "<warnung>Hier endet die Marktstadt. Parzellen gibt es von {von}/{von} bis {bis}/{bis}.</warnung>"
    # {bescheid} - der Programmname des Falls, den dieser Zweig nicht eigens benennt.
    # Er steht als WERT im Satz, damit du ihn einem Operator weitergeben kannst.
    sonst: "<warnung>Das ging nicht: {bescheid}</warnung>"

  # /parzelle liste - deine eigenen Parzellen.
  liste:
    leer: "<hinweis>Du hast noch keine Parzelle. Die erste ist gratis - /parzelle nehmen</hinweis>"
    # {anzahl} {hoechstzahl}
    kopf: "<kopf>Deine Parzellen ({anzahl} von {hoechstzahl})</kopf>"
    # {x} {z} {preis} {mitbauer} {gruppe} - eine Zeile je Parzelle. {mitbauer} und
    # {gruppe} sind die beiden Wortstuecke darunter ODER NICHTS: ein leerer Wert
    # verschwindet rueckstandslos. Darum stehen die Trenner in den Wortstuecken.
    zeile: "<fliesstext>  {x}/{z} · {preis}{mitbauer}{gruppe}</fliesstext>"
    # {anzahl} - ein Wortstueck fuer die Zeile darueber, kein Satz. Kein Farbtag.
    mitbauer: " · {anzahl} Mitbauer"
    gruppe: " · Gruppe"
    # {betrag} - nur unter der Hoechstzahl: am Limit kostet keine naechste etwas.
    naechste: "<gedaempft>Die naechste kostet {betrag}</gedaempft>"

  # Die neunzehn Bescheide des Besitzbuchs - die Absage auf jeden Versuch, der nicht
  # durchgeht. Welcher Satz zu welchem Fall gehoert, entscheidet das Programm; du
  # entscheidest, was dort steht. Alle in warnung, weil es Absagen sind.
  bescheid:
    erteilt: "<warnung>Erledigt.</warnung>"
    keine-parzelle: "<warnung>Hier ist keine Parzelle.</warnung>"
    # TEILT DEN ANFANG "Diese Parzelle gehoert " mit wache.schutz.fremde-parzelle und
    # den Befehl /parzelle nehmen mit wache.schutz.parzelle-frei. Vier Zeilen mit
    # demselben Anfang (mit den zwei Formen von noch-frei-am-limit darunter) - wer
    # einen aendert, sieht sich die anderen an.
    noch-frei: "<warnung>Diese Parzelle gehoert noch niemandem - nimm sie mit /parzelle nehmen.</warnung>"
    # {anzahl} ZAEHLT - derselbe Fall, wenn dein Rang schon ausgeschoepft ist. Danach
    # steht rang-werbung.
    noch-frei-am-limit:
      eins: "<warnung>Diese Parzelle gehoert noch niemandem - aber dein Rang erlaubt {anzahl} Parzelle, und so viele hast du schon.</warnung>"
      viele: "<warnung>Diese Parzelle gehoert noch niemandem - aber dein Rang erlaubt {anzahl} Parzellen, und so viele hast du schon.</warnung>"
    schon-vergeben: "<warnung>Die gehoert schon jemandem.</warnung>"
    ausserhalb: "<warnung>Das liegt ausserhalb der Marktstadt.</warnung>"
    # {anzahl} ZAEHLT - mit der Zahl, weil "nicht mehr" offen laesst, wie viele es
    # denn sind. Derselbe Wortlaut steht eingerueckt unter info.am-limit.
    grenze-erreicht:
      eins: "<warnung>Dein Rang erlaubt {anzahl} Parzelle, und so viele hast du schon.</warnung>"
      viele: "<warnung>Dein Rang erlaubt {anzahl} Parzellen, und so viele hast du schon.</warnung>"
    # Derselbe Wortlaut steht MIT zwei Leerzeichen Einzug unter
    # zusammenlegen.zu-wenig. Zwei Schluessel, weil der Einzug IM Satz steht:
    # aenderst du nur einen, aendert sich nur die eine Stelle.
    zu-wenig-mark: "<warnung>Dein Guthaben reicht nicht.</warnung>"
    nicht-eigentuemer: "<warnung>Das darf nur der Eigentuemer.</warnung>"
    schon-eingetragen: "<warnung>Steht schon auf der Liste.</warnung>"
    nicht-eingetragen: "<warnung>Stand gar nicht auf der Liste.</warnung>"
    teil-einer-gruppe: "<warnung>Die Parzelle gehoert zu einer Gruppe - das geht nur ueber die ganze Gruppe.</warnung>"
    nachbar-frei: "<warnung>Dort drueben ist keine Parzelle vergeben.</warnung>"
    nachbar-fremd: "<warnung>Die Nachbarparzelle gehoert jemand anderem.</warnung>"
    schon-in-gruppe: "<warnung>Die beiden gehoeren zu zwei verschiedenen Grundstuecken. Trenne eines auf und haenge die Felder einzeln an.</warnung>"
    schon-zusammen: "<warnung>Die beiden sind schon dasselbe Grundstueck.</warnung>"
    # {anzahl} ZAEHLT - diese Zahl ist die GRUPPENGROESSE und nicht die Zahl deiner
    # Parzellen. Danach steht rang-werbung. Auch /parzelle zusammenlegen nimmt diese
    # Zeile, wenn die Gruppe zu gross wuerde.
    gruppe-zu-gross:
      eins: "<warnung>Dein Rang erlaubt hoechstens {anzahl} Feld je Gruppe.</warnung>"
      viele: "<warnung>Dein Rang erlaubt hoechstens {anzahl} Felder je Gruppe.</warnung>"
    keine-gruppe: "<warnung>Hier ist keine Gruppe.</warnung>"
    auf-dem-weg: "<warnung>Stell dich auf das Feld, das du meinst - nicht auf den Weg.</warnung>"
    haelt-zusammen: "<warnung>Dieses Feld haelt dein Grundstueck zusammen. Loese erst eines am Rand heraus.</warnung>"

  # /parzelle mitbauer - wer sonst auf deiner Parzelle bauen darf.
  mitbauer:
    keine-parzelle: "<warnung>Hier ist keine vergebene Parzelle.</warnung>"
    # {x} {z} {namen} - die Liste. {namen} ist entweder die Aufzaehlung oder das
    # Wort darunter.
    kopf: "<kopf>Mitbauer auf {x}/{z}: <betont>{namen}</betont></kopf>"
    # Das Wort fuer die leere Liste - es wird in kopf EINGESETZT. Kein Farbtag.
    niemand: "niemand"
    # Nur fuer den Eigentuemer. Die spitzen Klammern um name sind ZEICHEN und keine
    # Farbe - darum \\< davor.
    befehle: "<gedaempft>/parzelle mitbauer hinzu \\<name> · weg \\<name></gedaempft>"
    unbekannt: "<warnung>Den kenne ich nicht. Er muss einmal auf dem Server gewesen sein.</warnung>"
    # {name} - eingetragen.
    hinzu-erteilt: "<bestaetigung>{name} darf hier jetzt bauen.</bestaetigung>"
    # {name} - stand schon auf der Liste. In hinweis und nicht warnung: Es ist nichts
    # schiefgegangen, es war nur schon so.
    schon-drin: "<hinweis>{name} darf hier ohnehin bauen.</hinweis>"
    niemand-mit-dem-namen: "<warnung>Steht hier niemand mit dem Namen - /parzelle mitbauer zeigt die Liste.</warnung>"
    # {name} - ausgetragen.
    weg-erteilt: "<bestaetigung>{name} darf hier nicht mehr bauen.</bestaetigung>"
    # {name} - stand gar nicht auf der Liste.
    nicht-drin: "<hinweis>{name} stand gar nicht auf der Liste.</hinweis>"

  # /parzelle aufgeben - und die Warnung davor.
  aufgeben:
    nicht-deine: "<warnung>Das ist nicht deine Parzelle.</warnung>"
    gruppe: "<warnung>Die Parzelle gehoert zu einer Gruppe - erst /parzelle auftrennen.</warnung>"
    # {x} {z} - DREI Chatzeilen in einer Zeile dieser Datei, getrennt von der
    # Umbruchmarke. Jede traegt ihre eigene Rolle: die Frage hinweis, die Folgen
    # fliesstext, die Bestaetigung warnung. Ein Satz und nicht drei, damit du ihn
    # umstellen kannst.
    warnung: "<hinweis>Parzelle {x}/{z} aufgeben?</hinweis>\n<fliesstext>  Es gibt kein Geld zurueck, und gebaut bleibt stehen.</fliesstext>\n<warnung>  /parzelle aufgeben bestaetigen {x} {z}</warnung>"
    # {x} {z}
    erteilt: "<bestaetigung>Parzelle {x}/{z} ist wieder frei.</bestaetigung>"

  # /parzelle zusammenlegen - zwei Parzellen werden ein Grundstueck.
  zusammenlegen:
    # {x} {z} {nachbar-x} {nachbar-z} {betrag} {guthaben} - FUENF Chatzeilen in
    # einer Zeile dieser Datei. Der Nachbar kommt schon gerechnet herein: Die
    # Richtung bestimmt ihn, und im Satz steht seine Nummer.
    warnung: "<hinweis>Parzelle {x}/{z} mit {nachbar-x}/{nachbar-z} zusammenlegen?</hinweis>\n<fliesstext>  Gebuehr: <geld>{betrag}</geld> · du hast {guthaben}\n  Der Weg dazwischen wird dein Bauland.\n  Beim Auftrennen kommt er zurueck - und raeumt alles weg, was dann\n  darauf steht.</fliesstext>"
    # Statt der Bestaetigung, wenn das Geld nicht reicht. Derselbe Wortlaut steht
    # OHNE Einzug unter bescheid.zu-wenig-mark - zwei Schluessel, weil der Einzug
    # im Satz steht.
    zu-wenig: "<warnung>  Dein Guthaben reicht nicht.</warnung>"
    # {richtung} {x} {z} - {richtung} ist das Befehlswort nord, ost, sued oder west.
    bestaetigen: "<hinweis>  /parzelle zusammenlegen {richtung} bestaetigen {x} {z}</hinweis>"
    # {anzahl} - wie viele Felder das Grundstueck jetzt hat. KEIN ZAEHLT: dieser
    # Satz sagt heute auch bei einem Feld "Feldern", und eine Einzahlform waere
    # eine Verbesserung und keine Umstellung. Darunter steht parzelle.bezahlt.
    erteilt: "<bestaetigung>Ein Grundstueck aus {anzahl} Feldern.</bestaetigung>"

  # /parzelle auftrennen - das Grundstueck wird wieder zu Parzellen.
  auftrennen:
    # {anzahl} - aufgetrennt. Dieselbe Zeile liest auch, wer ein Feld aus einer
    # Gruppe aus ZWEI Feldern loest: Was uebrig bliebe, waere ein einzelnes Feld,
    # also wird ganz aufgetrennt - und dann ist es genau dieser Satz.
    erteilt: "<bestaetigung>Aufgetrennt - {anzahl} eigenstaendige Parzellen.</bestaetigung>"
    # Die Zeile unter BEIDEN Warnungen des Herausloesens - beim Einzelfeld und bei
    # der Gruppe aus zwei Feldern. Darum steht sie hier und nicht unter feld.
    weg-kommt-zurueck: "<fliesstext>  Der Weg dorthin kommt zurueck. Geld gibt es keines zurueck.</fliesstext>"
    # /parzelle auftrennen alles - die ganze Gruppe auf einmal.
    alles:
      # {anzahl} - DREI Chatzeilen in einer Zeile dieser Datei. Die beiden
      # Anfuehrungszeichen um alles sind Zeichen IM Wert; weil jeder Wert dieser
      # Datei selbst in Anfuehrungszeichen steht, traegt jedes einen Backslash.
      warnung: "<hinweis>Grundstueck aus {anzahl} Feldern ganz auftrennen?</hinweis>\n<fliesstext>  ALLE Wege zwischen den Feldern kommen zurueck. Geld gibt es keines zurueck.\n  Fuer ein einzelnes Feld: stell dich darauf und nimm /parzelle auftrennen ohne \"alles\".</fliesstext>"
      # {x} {z}
      bestaetigen: "<warnung>  /parzelle auftrennen alles bestaetigen {x} {z}</warnung>"
    # /parzelle auftrennen - nur das Feld, auf dem du stehst.
    feld:
      # {anzahl} - ZWEI Felder lassen sich nicht teilen, also wird ganz
      # aufgetrennt. DREI Chatzeilen; danach steht weg-kommt-zurueck.
      warnung-zwei-felder: "<hinweis>Grundstueck aus {anzahl} Feldern auftrennen?</hinweis>\n<fliesstext>  Es hat nur zwei Felder - eines allein geht nicht heraus, also wird\n  es ganz aufgetrennt.</fliesstext>"
      # {x} {z} {anzahl} - das Feld geht heraus, der Rest bleibt Grundstueck. ZWEI
      # Chatzeilen; danach steht weg-kommt-zurueck.
      warnung: "<hinweis>Das Feld {x}/{z} aus dem Grundstueck herausloesen?</hinweis>\n<fliesstext>  Die anderen {anzahl} Felder bleiben ein Grundstueck.</fliesstext>"
      # {x} {z}
      bestaetigen: "<warnung>  /parzelle auftrennen bestaetigen {x} {z}</warnung>"
      # {x} {z} {anzahl} - herausgeloest, und wie viele noch Gruppe sind.
      erteilt: "<bestaetigung>Feld {x}/{z} herausgeloest - das Grundstueck hat noch {anzahl} Felder.</bestaetigung>"

  # Was die Weltarbeit kostet - vor jedem Auftrennen abgeschaetzt. Verlust in
  # warnung, Fuellung in fliesstext: Hier geht etwas weg, dort kommt etwas hinzu.
  aufwand:
    # {anzahl} ZAEHLT - was von der Flaeche verschwindet. Die Einzahl nennt die 1
    # ausgeschrieben; du darfst dort auch {anzahl} schreiben, dann steht die Zahl.
    # Bei NULL wird gar nichts gesendet - das entscheidet das Programm, nicht diese
    # Datei.
    verschwindet:
      eins: "<warnung>  Dabei verschwindet 1 Block von der Flaeche.</warnung>"
      viele: "<warnung>  Dabei verschwinden {anzahl} Bloecke von der Flaeche.</warnung>"
    # {anzahl} ZAEHLT - was wieder gefuellt wird. "Fehlstelle" und nicht "unter
    # der Flaeche", weil die Oberflaeche selbst dazugehoert.
    verfuellt:
      eins: "<fliesstext>  1 Fehlstelle wird wieder gefuellt.</fliesstext>"
      viele: "<fliesstext>  {anzahl} Fehlstellen werden wieder gefuellt.</fliesstext>"
    # Statt der beiden Zahlen, wenn es nichts zu raeumen gibt.
    nichts: "<fliesstext>  Auf der Wegflaeche steht nichts - es geht nichts verloren.</fliesstext>"

  # {anzahl} ZAEHLT - die Abschaetzung liest jeden Block ueber dem Weg und darf
  # darum nicht beliebig oft hintereinander laufen.
  abklingzeit:
    eins: "<fliesstext>Einen Augenblick - die Abschaetzung liest jeden Block ueber dem Weg. Noch {anzahl} Sekunde.</fliesstext>"
    viele: "<fliesstext>Einen Augenblick - die Abschaetzung liest jeden Block ueber dem Weg. Noch {anzahl} Sekunden.</fliesstext>"

  # Was aus der Bodenarbeit geworden ist - sie folgt jedem Zusammenlegen und jedem
  # Auftrennen.
  boden:
    # {gelungen} {anzahl} - {gelungen} ist eines der zwei Wortstuecke darunter.
    # {anzahl} ist eine NACKTE Zahl ohne Tausenderpunkt; nur Geldbetraege tragen
    # ihn. "geaendert" und nicht nur die Zahl: Darin stecken der Weg selbst und
    # das, was geraeumt wurde.
    gelungen: "<fliesstext>  {gelungen} ({anzahl} Bloecke geaendert).</fliesstext>"
    # Die zwei Wortstuecke fuer die Zeile darueber. Kein Farbtag.
    weg-ist-bauland: "Der Weg dazwischen ist Bauland"
    weg-ist-zurueck: "Der Weg ist zurueck"
    # Die Ablage stimmt, die Welt nicht - das ist die harmlose Haelfte des Fehlers,
    # und der Spieler darf trotzdem bauen.
    fehler: "<warnung>  Der Boden liess sich nicht aendern. Die Parzellen stimmen - sag einem Operator Bescheid.</warnung>"

# /tpa, /tpahere, /tpaccept und /tpdeny - eine Reise nur mit Zustimmung.
#
# DAS BESONDERE AN DIESEM ABSCHNITT: Hier lesen ZWEI Spieler. Wer fragt, bekommt
# eine Zeile; wer gefragt wird, bekommt zwei. Beim Annehmen bekommen beide eine.
# Darum traegt jeder Satz genau EINEN Namen, und zwar immer den des ANDEREN - wer
# {name} aus einem dieser Saetze nimmt, laesst den Leser raten, um wen es geht.
# Welcher Satz an wen geht, steht im Kommentar darueber.
anfrage:
  # Es steht keine Anfrage offen. DIESELBE Zeile bei /tpaccept und bei /tpdeny, und
  # darum steht sie eine Ebene hoeher als annehmen und ablehnen: Du aenderst sie
  # einmal, und beide Befehle sagen das Neue. Keine Zahl darin - "0 Anfragen
  # abgelehnt." gibt es nicht und soll es nicht geben.
  niemand: "<fliesstext>Es fragt niemand.</fliesstext>"

  # /tpa <spieler> und /tpahere <spieler> - die Frage stellen.
  frage:
    # {name} - den gibt es nicht, ODER er ist unsichtbar. EIN Satz fuer beide
    # Faelle, und das ist Absicht: Zwei Saetze verrieten, dass da jemand ist, den
    # du nicht sehen sollst. {name} ist darum das GETIPPTE Wort und nicht der echte
    # Name. Schreibe hier nichts hinein, was den Unterschied verraet.
    # NICHT ZU VERWECHSELN: /spielzeit hat eine eigene, laengere Absage, die mit
    # denselben vier Woertern beginnt ("... ist nicht da. Gezeigt werden kann nur
    # die Spielzeit eines anwesenden Spielers."). Die steht unter
    # spielzeit.nicht-da in derselben Datei. Dieser Satz hier gilt NUR fuer /tpa
    # und /tpahere - er ist also nicht halb in Kraft, sondern ganz, und der andere
    # ist ein anderer Satz.
    nicht-da: "<warnung>{name} ist nicht da.</warnung>"
    # Er hat sich selbst gefragt. Ohne {name} - seinen eigenen kennt er.
    bei-dir: "<fliesstext>Du bist schon bei dir.</fliesstext>"
    # Die Antwort auf /tpa bzw. /tpahere OHNE Namen. Zwei Saetze, weil die Richtung
    # verschieden ist: Beim einen gehst du, beim anderen kommt er. Der Befehl steht
    # ausgeschrieben da und nicht als Angabeplatz in spitzen Klammern - so kannst du
    # die Zeile lesen, ohne eine Schreibweise zu kennen.
    gebrauch-zu-dir: "<fliesstext>Mit /tpa und dem Namen eines Spielers fragst du, ob du zu ihm kommen darfst.</fliesstext>"
    gebrauch-hierher: "<fliesstext>Mit /tpahere und dem Namen eines Spielers laedst du ihn zu dir ein.</fliesstext>"
    # {name} - dieselbe Frage steht schon offen, es ist nichts hinzugekommen.
    steht-noch: "<fliesstext>Diese Anfrage an {name} steht noch.</fliesstext>"
    # {name} - die Quittung an den FRAGENDEN. {name} ist der Angefragte.
    gestellt: "<fliesstext>Angefragt bei {name} - er oder sie muss zustimmen.</fliesstext>"
    # {name} - die Frage an den ANGEFRAGTEN, Zweig /tpahere. {name} ist der
    # Fragende. Ein eigener Satz und nicht ein Wortstueck in moechte-kommen: Es
    # sind zwei verschiedene Sachverhalte, nicht Einzahl gegen Mehrzahl - hier
    # kommt der Leser, dort der Fragende.
    eingeladen: "<kopf>{name} laedt dich ein zu kommen.</kopf>"
    # {name} - dieselbe Frage, Zweig /tpa: der Fragende will selbst kommen.
    moechte-kommen: "<kopf>{name} moechte zu dir kommen.</kopf>"
    # Die zweite Zeile an den Angefragten - sie steht unter BEIDEN Fragen oben.
    # Ein eigener Satz und keine Umbruchmarke an eingeladen/moechte-kommen: Eine
    # Umbruchmarke sendet beide Zeilen in DERSELBEN Rolle, und diese ist fliesstext,
    # waehrend die Frage kopf traegt. Die Minute ist die Gueltigkeit aus dem
    # Programm - aenderst du das Wort, aendert sich die Frist nicht.
    hinweis: "<fliesstext>/tpaccept zum Annehmen, /tpdeny zum Ablehnen. Die Anfrage laeuft nach einer Minute ab.</fliesstext>"

  # /tpaccept - annehmen. Hier lesen beide Spieler, je eine eigene Zeile.
  annehmen:
    # Wer gefragt hatte, ist inzwischen abgemeldet.
    fragender-weg: "<warnung>Wer gefragt hatte, ist nicht mehr da.</warnung>"
    # {name} - an den ANNEHMER, wenn er selbst reist (/tpahere). {name} ist der
    # Fragende. Das Gegenstueck dazu ist quittung-er-kommt darunter: dasselbe
    # Ereignis, der andere Leser. Aendere die beiden gemeinsam, sonst erzaehlen
    # zwei Spieler einander verschiedene Dinge.
    du-kommst: "<bestaetigung>Du kommst zu {name}.</bestaetigung>"
    # {name} - an den ANNEHMER, wenn der Fragende reist (/tpa). Gegenstueck:
    # quittung-du-kommst.
    er-kommt: "<bestaetigung>{name} kommt zu dir.</bestaetigung>"
    # {name} - an den FRAGENDEN, wenn er selbst reist (/tpa). {name} ist der
    # Annehmer. Gegenstueck: er-kommt darueber.
    quittung-du-kommst: "<bestaetigung>{name} hat angenommen - du kommst.</bestaetigung>"
    # {name} - an den FRAGENDEN, wenn der Annehmer reist (/tpahere). Gegenstueck:
    # du-kommst darueber.
    quittung-er-kommt: "<bestaetigung>{name} hat angenommen und kommt zu dir.</bestaetigung>"
    # {anzahl} ZAEHLT - wie viele Anfragen nach dem Annehmen noch warten. Die
    # angenommene ist nicht mehr dabei. Die Zahl ist NACKT, ohne Tausenderpunkt -
    # den tragen nur Geldbetraege. Bei NULL wird gar nichts gesendet; das
    # entscheidet das Programm, nicht diese Datei.
    weitere:
      eins: "<fliesstext>Es warten noch {anzahl} Anfrage.</fliesstext>"
      viele: "<fliesstext>Es warten noch {anzahl} Anfragen.</fliesstext>"

  # /tpdeny - alle offenen Anfragen ablehnen.
  ablehnen:
    # {anzahl} ZAEHLT - wie viele weggenommen wurden. Der GANZE Satz steht in
    # beiden Formen und nicht nur das Zaehlwort: nur so kannst du ihn umstellen und
    # nicht bloss faerben. Die Zahl ist NACKT, ohne Tausenderpunkt. War nichts da,
    # steht oben anfrage.niemand - nicht eine dritte Form hier.
    abgelehnt:
      eins: "<fliesstext>{anzahl} Anfrage abgelehnt.</fliesstext>"
      viele: "<fliesstext>{anzahl} Anfragen abgelehnt.</fliesstext>"

spielzeit:
  # Die Ueberschrift ueber der Anzeige. Sie ist die EINZIGE Zeile dieses Befehls in
  # kopf - daran erkennt der Spieler, wo seine Antwort anfaengt.
  kopf:
    # KEIN {name}, und das mit Absicht: Bei
    # /execute as <spieler> run freimarken spielzeit liest die KONSOLE diese Zeile
    # ueber den Zahlen eines fremden Spielers. "Deine Spielzeit, {name}" waere dort
    # eine Luege.
    selbst: "<kopf>Deine Spielzeit</kopf>"
    # {name} - die Ueberschrift ueber der Anzeige eines ANDEREN Spielers.
    fremd: "<kopf>Spielzeit von {name}</kopf>"
  # {dauer} {tag} {zone} - die erste der vier Zeilen unter der Ueberschrift.
  #
  # DIE SPALTE STEHT HIER UND NICHT IM PROGRAMM. "heute" plus DREI Leerzeichen und
  #   "gesamt" plus ZWEI Leerzeichen sind beide acht Zeichen breit; mit dem Einzug
  #   von zwei Zeichen beginnt die Dauer in BEIDEN Zeilen in Spalte 11. Nimm hier
  #   ein Leerzeichen heraus, und die Spalte rutscht - aendere die zwei Zeilen
  #   gemeinsam. Die DREI Leerzeichen vor der Klammer sind ein zweiter, eigener
  #   Abstand und haben mit der Spalte nichts zu tun.
  # {dauer} kommt aus dauer.* weiter unten, {tag} aus tag-muster, {zone} ist die
  #   eingestellte Tagesgrenze aus der config.yml - eine technische Kennung wie
  #   Europe/Berlin und kein Wort.
  heute: "<fliesstext>  heute   {dauer}   ({tag}, Tagesgrenze {zone})</fliesstext>"
  # {dauer} - die zweite Zeile. Die Spaltenbreite steht bei heute darueber erklaert.
  gesamt: "<fliesstext>  gesamt  {dauer}</fliesstext>"
  # {dauer} {heute} {prozent} - die dritte Zeile: wie viel von der gemessenen Zeit
  #   TAETIG war. "taetig" ist wie "gesamt" sechs Zeichen lang und braucht darum
  #   ZWEI Leerzeichen, damit die Dauer in derselben Spalte 11 beginnt wie darueber.
  # {dauer} ist die taetige Zeit ueber alle Tage, {heute} die von heute, {prozent}
  #   ihr Anteil an der gemessenen Zeit in Prozent - abgerundet, damit die Zahl eine
  #   Untergrenze ist. Das Zeichen % steht HIER und nicht im Programm.
  # Warum der Anteil dabeisteht: Eine nackte Dauer ohne ihren Bezug ist nicht zu
  #   lesen - "40 h taetig" heisst bei 45 h Anwesenheit etwas anderes als bei 400.
  # Der LAUFENDE Takt ist hier noch nicht mitgezaehlt: Ob er taetig war, entscheidet
  #   sich erst, wenn er abgerechnet wird. Darum steht hier kurz nach dem Beitritt
  #   eine 0, obwohl der Spieler spielt. Woran die Messstelle Taetigkeit erkennt,
  #   steht im Abschnitt messstelle der config.yml.
  taetig: "<fliesstext>  taetig  {dauer}   ({heute} heute, {prozent} % der Zeit)</fliesstext>"
  zustand:
    # {dauer} {grenze} - die dritte Zeile, solange gerade NICHT gezaehlt wird.
    # {grenze} ist die eingestellte Untaetigkeitsgrenze in Minuten; das Wort "min"
    # dahinter steht HIER und nicht in dauer.minuten, damit du diese Zeile umstellen
    # kannst, ohne die Dauerformen mitzuaendern. Dieser Satz und abwesenheit weiter
    # unten koennen sich NIE begegnen: Ist die Regel aus, gibt es keinen untaetigen
    # Zustand.
    untaetig: "<fliesstext>  wird gerade NICHT gezaehlt - untaetig seit {dauer}, gezaehlt wird bis {grenze} min. Ein Schritt oder ein Tastendruck zaehlt wieder.</fliesstext>"
    # {menge} {abstand} {abwesenheit} - dieselbe dritte Zeile, solange gezaehlt wird.
    # {abstand} ist eine der zwei Zeilen aus abstand darunter. {abwesenheit} ist der
    # Zusatz darunter und bleibt LEER, solange die Untaetigkeitsregel an ist - das
    # entscheidet das Programm und nicht diese Datei.
    gezaehlt: "<fliesstext>  wird gezaehlt - die letzten {menge} sind noch nicht geschrieben, {abstand}{abwesenheit}</fliesstext>"
    # Wie die Zeile darueber endet. KEINE Farbtags: Die zwei Formen werden in
    # gezaehlt EINGESETZT und sind dort ein Blatt - ein Tag darin stuende dem
    # Spieler woertlich im Chat.
    abstand:
      # {takt} - der eingestellte Schreibtakt in Sekunden. Der normale Fall.
      takt: "das geschieht alle {takt} s."
      # Nach einem Fehlschlag der Datenbank: Der Takt rechnet weiter und schreibt
      # mehrere Taktlaengen lang nicht. KEINE Zahl darin, und das ist Absicht - wie
      # viele Schlaege ausgesetzt werden, leitet das Programm aus seiner eigenen
      # Klemmenregel ab. Eine Zahl hier waere beim naechsten Aendern dort still
      # falsch, und keine Probe wuerde rot.
      wartet: "der naechste Schreibzug wartet auf die Datenbank - gezaehlt wird weiter, nachgeschrieben wird alles."
    # {pfad} - angehaengt an gezaehlt, solange die Untaetigkeitsregel AUS ist. Das
    # FUEHRENDE Leerzeichen gehoert dazu: Der Zusatz haengt an derselben Chatzeile.
    # {pfad} ist der Ort in der config.yml, an dem die Regel steht - er wird
    # eingesetzt und nicht hier getippt, damit er beim Umbenennen nicht still falsch
    # wird. Die 0 dahinter ist der Wert, bei dem die Regel aus ist, und steht darum
    # fest im Satz. Kein Farbtag: eingesetzter Wert.
    abwesenheit: " Abwesenheit zaehlt auf diesem Server mit ({pfad}: 0)."
  # Die vierte und letzte Zeile - ohne sie meldet ein Spieler mit 200 Stunden einen
  # Fehler, weil er eine kleine Zahl liest. Sie ist heute fliesstext wie die Zeilen
  # darueber; du kannst ihr jetzt eine eigene Farbe geben, zum Beispiel
  # <gedaempft>, ohne dass eine Zeile Programm geaendert wird.
  hinweis: "<fliesstext>  Gezaehlt wird erst seit dem Einbau dieser Messung - Spielstunden von davor stehen nirgends, jeder faengt bei 0 an.</fliesstext>"
  # Statt der vier Zeilen, wenn die Ablage gerade nicht antwortet. In fliesstext und
  # MIT Einzug, weil sie an ihrer Stelle steht - eine Zeile in warnung mitten in einer
  # Liste in fliesstext sieht nach einem Absturz aus. Willst du sie in warnung, ist
  # das deine
  # Entscheidung: tausche <fliesstext> gegen <warnung>.
  nicht-lesbar: "<fliesstext>  Die Spielzeit ist gerade nicht lesbar - gezaehlt wird trotzdem. Sag einem Operator Bescheid.</fliesstext>"
  # Die Absage an die Konsole. OHNE Einzug - sie steht nicht unter einer
  # Ueberschrift, sondern allein. Die spitze Klammer um spieler ist ein ZEICHEN und
  # keine Farbe, darum ZWEI Backslashes davor. Das Wort darin ist der Name des
  # Befehlsarguments: Wird es im Programm umbenannt, gehoert es hier mitgeaendert.
  keine-konsole: "<fliesstext>Die Konsole spielt nicht. /freimarken spielzeit \\<spieler> nennt die Zeit eines anwesenden Spielers.</fliesstext>"
  # {name} - die Absage, wenn der gesuchte Spieler nicht da ist. Die EINZIGE Zeile
  # dieses Befehls in warnung, und ohne Einzug. Nicht zu verwechseln mit nicht-lesbar
  # darueber: Diese hier soll der Spieler wirklich als Fehler lesen.
  nicht-da: "<warnung>{name} ist nicht da. Gezeigt werden kann nur die Spielzeit eines anwesenden Spielers.</warnung>"
  dauer:
    # Die fuenf Formen einer Dauer. KEINE Farbtags: Sie werden in heute, gesamt,
    # zustand.untaetig und zustand.gezaehlt EINGESETZT und sind dort ein Blatt.
    #
    # WELCHE Form genommen wird, entscheidet das Programm an der Zahl - und die
    #   zweistellige Auffuellung der Minuten hinter einer Stunde ebenfalls: "3 h
    #   5 min" ist von "3 h 50 min" auf einen Blick nicht zu unterscheiden. Du
    #   bekommst {minuten} also schon aufgefuellt. Dieselbe Trennung wie bei
    #   waehrung.betrag: Das WORT ist deines, die Zahlform bleibt im Programm.
    # DIE EINHEITEN stehen in JEDER Form einzeln, und das ist Absicht: So kannst du
    #   eine Zeile umstellen, ohne die anderen mitzuaendern. Der Preis ist, dass
    #   "min" an vier Stellen dieses Abschnitts steht - dreimal hier und einmal in
    #   zustand.untaetig. Wer die Einheit aendern will, muss alle vier finden.
    # {stunden} {minuten} - ab einer Stunde.
    stunden-minuten: "{stunden} h {minuten} min"
    # {minuten} - unter einer Stunde.
    minuten: "{minuten} min"
    # Unter einer Minute, wo Sekunden nicht gezeigt werden. Die 1 steht fest im
    # Wort: Es ist eine feststehende Wendung und keine Zahlform.
    unter-einer-minute: "unter 1 min"
    # Gar nichts. Die 0 steht fest im Wort, aus demselben Grund.
    nichts: "0 min"
    # {sekunden} - unter einer Minute, wo Sekunden gezeigt werden: bei der laufenden
    # Sitzung und bei der Untaetigkeit. Dort sieht ein Spieler zu, ob die Zahl
    # waechst, und "unter 1 min" waere genau da unbrauchbar.
    sekunden: "{sekunden} s"
  # Muster fuer DateTimeFormatter, kein Satz - der Tag in der Zeile heute. Wird beim
  # LADEN uebersetzt, ein unbrauchbares Muster ist also eine Klage und kein Absturz
  # mitten im Befehl. Das Jahr steht hier mit drin, anders als bei
  # zeit.verlauf-muster: Eine Spielzeit ist die eines Tages und nicht einer Liste.
  tag-muster: "dd.MM.yyyy"

# DIE BERUFE - was ein Spieler waehlt, was es kostet und was ihn bremst.
#
# Dieser Abschnitt steht unter beruf, also unter dem BEFEHL, den du tippst - wie
# anfrage und spielzeit und anders als reise. Der Grund ist derselbe wie dort, nur
# umgekehrt: Diese Saetze loest genau EIN Befehl aus, naemlich /beruf. Es gibt keinen
# zweiten Weg zu einem Beruf.
#
# WELCHE Berufe es gibt, steht NICHT hier, sondern in der config.yml unter
# berufe.liste. Hier stehen nur die WORTE dazu - unter beruf.name, ein Wort je
# Schluessel. Traegst du dort einen Beruf ein, brauchst du hier eine Zeile dazu, sonst
# startet Freimarken nicht: Lieber ein verweigerter Start als ein Zunfthaus, in dem
# "bergmann" steht.
#
# DIE DAUER in beruf.stand.frist und beruf.absage.sperrfrist kommt aus demselben
# Rechenweg wie jede andere Dauer dieses Plugins - die Formen dafuer stehen oben unter
# spielzeit.dauer. Aenderst du sie dort, aendern sie sich auch hier. Das ist Absicht:
# Zwei Rechnungen fuer dieselbe Frist liefen eines Tages auseinander, und dann lies du
# an einer Stelle "2 h 05 min" und an der anderen "2 Stunden" fuer dieselbe Zahl.
#
# HALB IN KRAFT (Verdienst): Kein Satz hier sagt, was ein Beruf EINBRINGT, und zwar
#   weil es noch nichts einbringt. Das kommt mit seinem eigenen Bauschritt; dann
#   stehen die Zeilen dazu hier, und diese Warnung ist weg. Was heute wirkt, ist
#   allein das WAEHLEN: wer was halten darf, was ein Wechsel kostet und wie lange er
#   danach warten muss.
beruf:
  liste:
    # Die Ueberschrift von /beruf liste.
    kopf: "<kopf>Berufe im Freimarkenbund</kopf>"
    # {name} - ein Grundberuf, zu dem es keine Spezialisierung gibt.
    beruf: "<fliesstext>  <betont>{name}</betont></fliesstext>"
    # {name} {spezialisierungen} - ein Grundberuf MIT seinen Spezialisierungen. Zwei
    # Saetze und nicht einer mit leerem Wert: Sonst stuende hinter einem Grundberuf
    # ohne Spezialisierung ein Gedankenstrich und dahinter nichts.
    beruf-mit: "<fliesstext>  <betont>{name}</betont> · dazu: {spezialisierungen}</fliesstext>"
    # Was zwischen zwei Spezialisierungen steht. DARF LEER SEIN - dann stossen die
    # Namen aneinander. Ein Trenner sendet keine eigene Zeile.
    trenner: ", "
    # Es gibt gar keinen Beruf in der config.yml. Du liest das nur, wenn du die Liste
    # gerade leerst - ohne Berufe bleibt Freimarken aus.
    leer: "<fliesstext>Es sind keine Berufe eingetragen.</fliesstext>"
    # Die letzte Zeile der Liste.
    fuss: "<fliesstext>  /beruf waehlen \\<beruf> · /beruf stand</fliesstext>"
  stand:
    # Die Ueberschrift von /beruf stand.
    kopf: "<kopf>Dein Beruf</kopf>"
    # Er hat noch NIE einen gewaehlt. Nicht dasselbe wie "haelt gerade keinen": Wer
    # alles abgelegt hat, liest stattdessen die Zeile frist darunter.
    keiner: "<fliesstext>Du hast noch keinen Beruf gewaehlt.</fliesstext>"
    # {name} - ein gehaltener Grundberuf.
    grundberuf: "<fliesstext>  <betont>{name}</betont></fliesstext>"
    # {name} {grundberuf} - eine gehaltene Spezialisierung und der Beruf, auf dem sie
    # aufbaut.
    spezialisierung: "<fliesstext>  <betont>{name}</betont> · baut auf {grundberuf} auf</fliesstext>"
    plaetze:
      # {gehalten} {erlaubt} - je Rolle eine eigene Zeile, damit du sie umstellen und
      # eine davon weglassen kannst. Auf einem Server ohne Spezialisierungen ist die
      # zweite Zeile ohnehin eine Null von Null.
      grundberufe: "<fliesstext>  Grundberufe:       {gehalten} von {erlaubt}</fliesstext>"
      spezialisierungen: "<fliesstext>  Spezialisierungen: {gehalten} von {erlaubt}</fliesstext>"
    # {dauer} - die Sperrfrist laeuft noch. Dieselbe Zahl, die auch die Absage nennt.
    frist: "<hinweis>  Du kannst in {dauer} wieder wechseln.</hinweis>"
    # {betrag} - was ein Wechsel kostet. Steht hier, damit es nicht erst in der Absage
    # steht.
    gebuehr: "<fliesstext>  Ein Beruf aufgeben kostet {betrag}.</fliesstext>"
  # {name} - gewaehlt. Ohne Betrag: Waehlen ist immer gratis, bezahlt wird das
  # Aufgeben.
  gewaehlt: "<bestaetigung>Du bist jetzt {name}.</bestaetigung>"
  verlassen:
    # {name} {betrag} - abgelegt, und was dafuer gebucht wurde.
    getan: "<fliesstext>Du hast {name} aufgegeben. Gebucht: <geld>{betrag}</geld>.</fliesstext>"
    # {name} {schluessel} {betrag} {dauer} - die Rueckfrage VOR dem Aufgeben, wie bei
    # /parzelle aufgeben. ZWEI Werte fuer denselben Beruf: {name} ist das Wort von
    # unten, {schluessel} das, was in der Befehlszeile zum Abschreiben stehen muss.
    warnung: "<hinweis>{name} aufgeben?</hinweis>\n<fliesstext>  Es kostet <geld>{betrag}</geld>, und danach kannst du {dauer} lang nicht wechseln.</fliesstext>\n<warnung>  /beruf verlassen {schluessel} bestaetigen</warnung>"
  absage:
    # {eingabe} - diesen Beruf gibt es nicht. Hier steht, was DU getippt hast, und
    # kein Wort von unten: Es gibt ja keines dafuer.
    unbekannt: "<warnung>Den Beruf \"{eingabe}\" gibt es nicht. /beruf liste zeigt alle.</warnung>"
    # {name} - er haelt ihn schon.
    schon-gehalten: "<fliesstext>Du bist schon {name}.</fliesstext>"
    # {name} - er haelt ihn nicht, es gibt nichts aufzugeben.
    nicht-gehalten: "<fliesstext>Du bist nicht {name}.</fliesstext>"
    # {erlaubt} - alle Grundberufsplaetze sind besetzt.
    grundberufe-voll: "<warnung>Du hast keinen Platz mehr fuer einen Grundberuf (erlaubt: {erlaubt}). Gib einen auf, dann geht ein neuer.</warnung>"
    # {erlaubt} - alle Spezialisierungsplaetze sind besetzt.
    spezialisierung-voll: "<warnung>Du hast keinen Platz mehr fuer eine Spezialisierung (erlaubt: {erlaubt}).</warnung>"
    # Ihm fehlt das Recht fuer Spezialisierungen. OHNE den Namen des Rechts - damit
    # kann ein Spieler nichts anfangen. Willst du hier auf einen Rang hinweisen,
    # schreib es in diesen Satz.
    ohne-recht: "<warnung>Spezialisierungen sind noch nicht fuer dich freigegeben.</warnung>"
    # {name} - ihm fehlt der Grundberuf, den diese Spezialisierung voraussetzt. Im
    # Satz steht der GEBRAUCHTE Beruf, nicht der gewuenschte.
    grundberuf-fehlt: "<warnung>Dafuer musst du zuerst {name} sein.</warnung>"
    # {name} - der Grundberuf bleibt, solange seine Spezialisierung steht. Im Satz
    # steht die SPEZIALISIERUNG: Sie ist das, was zuerst weg muss.
    traegt-spezialisierung: "<warnung>Dafuer musst du zuerst {name} aufgeben.</warnung>"
    # {dauer} - die Sperrfrist laeuft noch.
    sperrfrist: "<warnung>Du kannst erst in {dauer} wieder wechseln.</warnung>"
    # {betrag} {guthaben} - das Geld reicht nicht.
    geld-fehlt: "<warnung>Aufgeben kostet {betrag}, du hast {guthaben}.</warnung>"
    # Die Konsole hat keinen Beruf. In fliesstext und nicht warnung: nichts ist kaputt.
    keine-konsole: "<fliesstext>Ein Beruf gehoert zu einem Spieler - die Konsole hat keinen.</fliesstext>"
    # Zwei Befehle in derselben Sekunde. Es ist NICHTS passiert, und ein zweiter Versuch
    # geht durch.
    gleichzeitig: "<hinweis>Dein Berufsstand hat sich eben geaendert - versuch es noch einmal.</hinweis>"
    # Die Ablage antwortet nicht. Daneben steht die Ausnahme im Serverprotokoll.
    nicht-lesbar: "<fliesstext>Deine Berufe sind gerade nicht lesbar - im Serverprotokoll steht, warum.</fliesstext>"
  verdienst:
    # ZWEI HANDBALKEN - sie stehen ueber dem Gegenstandsgurt und nicht im Chat. GENAU
    # EINE Zeile je Satz: sendActionBar nimmt ein Component und keine Liste, eine
    # Umbruchmarke darin ist eine Klage mit Zeilennummer.
    #
    # {betrag} - was die letzten Sekunden eingebracht haben, als Pfennigbetrag aus
    # waehrung.pfennige. Gesendet wird hoechstens einmal je Sekunde: Eine Chatzeile je
    # Auszahlung waere ein Regen, und gar nichts zu zeigen liesse einen neuen Spieler
    # den Fehler bei sich suchen.
    handbalken: "<bestaetigung>+{betrag}</bestaetigung>"
    # Der Tagesdeckel ist erreicht - ab hier bringt Arbeit nichts mehr, und was
    # gesammelt war, verfaellt. Diese Zeile MUSS es geben: Ohne sie arbeitete ein
    # Spieler weiter fuer nichts. Sie loest die andere ab, solange der Deckel haelt.
    deckel: "<hinweis>Heute ist genug verdient - morgen zahlt die Arbeit wieder.</hinweis>"
    # Nicht derselbe Satz wie deckel: Diese Grenze gilt nur fuer EINE Arbeit und nur
    # fuer diese Stunde. Wer sie erreicht hat, darf etwas anderes tun - und soll das
    # auch lesen, sonst legt er das Werkzeug ganz weg.
    #
    # {taetigkeit} - das Wort aus beruf.taetigkeit darunter.
    stundenmenge: "<hinweis>Mit {taetigkeit} ist fuer diese Stunde genug - etwas anderes zahlt weiter.</hinweis>"
  # DAS WORT ZU JEDER TAETIGKEIT. Eingesetzt in beruf.verdienst.stundenmenge, und sonst
  # nirgends - darum keine Farbe: Ein Tag hier ueberschriebe die Farbe jener Zeile.
  #
  # Anders als bei den Berufen ist diese Liste GESCHLOSSEN: Welche Taetigkeiten es gibt,
  # entscheidet das Programm, denn jede braucht einen eigenen Ereigniszweig. Du kannst
  # die Worte aendern, aber keines hinzufuegen - ein siebter Eintrag hier waere eine
  # Zeile, die nicht wirkt, und das Protokoll sagt es beim Start.
  #
  # Die Worte stehen im WERKZEUGFALL ("mit Graben ist genug"), nicht im Infinitiv: Sie
  # werden in einen Satz mit "Mit ..." eingesetzt.
  taetigkeit:
    abbauen: "Graben"
    setzen: "Bauen"
    ernten: "Ernten"
    fischen: "Angeln"
    toeten: "Jagen"
    zuechten: "Zuechten"
  # DAS WORT ZU JEDEM BERUF. Ein Eintrag je Schluessel aus berufe.liste in der
  # config.yml - und zwar in BEIDE Richtungen: Ein Beruf ohne Wort laesst Freimarken
  # nicht starten, ein Wort ohne Beruf ist eine Zeile, die nicht wirkt (sie steht dann
  # im Bericht von /freimarken neuladen).
  #
  # Kein Farbtag: Diese Worte werden in andere Saetze eingesetzt, und ein Tag darin
  # ueberschriebe die Farbe der Zeile, in der er landet - je Zeile anders.
  #
  # Hier stehen die Berufsnamen und nicht in der config.yml, weil Worte in die
  # Sprachdatei gehoeren: Dieselbe Trennung wie ueberall sonst in diesem Plugin. Der
  # Schluessel links ist technisch und steht in der Datenbank; das Wort rechts ist
  # deines.
  name:
    bergmann: "Bergmann"
    steinmetz: "Steinmetz"
    holzfaeller: "Holzfaeller"
    zimmermann: "Zimmermann"
    bauer: "Bauer"
    mueller: "Mueller"
    fischer: "Fischer"
    reeder: "Reeder"
    jaeger: "Jaeger"
    gerber: "Gerber"
    baumeister: "Baumeister"
    architekt: "Architekt"

# DAS REISEN SELBST - jeder Teleport laeuft hier durch.
#
# Dieser Abschnitt steht unter reise und NICHT unter einem Befehl, anders als anfrage
# und spielzeit. Der Grund: Dieselbe Reise loesen FUENF Befehle aus - /warp, das Tor
# am Bundesmarkt, /zurueck, /tpaccept und /freimarken parzelle -, und alle fuenf
# laufen durch dieselben zwei Pruefungen und dieselbe Wartezeit. Ein Abschnitt je
# Befehl waere derselbe Satz an fuenf Orten: Du aendertest einen und wundertest dich,
# warum die anderen vier weiter das Alte sagen. Die eigenen Absagen von /warp und
# /zurueck gehoeren dagegen unter ihren Befehl und stehen weiter unten unter warp und
# zurueck.
#
# {ziel} IST DERSELBE WERT IN ALLEN SECHS SAETZEN, die ihn einsetzen. Er heisst nicht
# {welt}, weil er fuenferlei sein kann: ein kleingeschriebener Weltname (/warp, Tor),
# ein SPIELERNAME (/tpaccept - dann liest der Reisende den Namen des anderen), die
# Wendung aus zurueck.letzter-ort (/zurueck) oder die Aufschrift "Parzelle 3/-4"
# (/freimarken parzelle). NUR schon-da und kein-platz-am-erscheinungspunkt tragen
# garantiert einen Weltnamen; die uebrigen vier nicht. Schreibe darum nichts in sie
# hinein, was nur zu einem Weltnamen passt.
#
# HALB IN KRAFT (Reiseziel): EINE dieser fuenf Fuellungen ist selbst noch Spielertext
#   AUS DEM PROGRAMM und nicht aus dieser Datei - die Aufschrift "Parzelle 3/-4" bei
#   /freimarken parzelle. Du kannst die Saetze hier also umstellen und faerben, diese
#   eine Aufschrift aber nicht aendern. Sie zieht mit ihrem eigenen Bauschritt um, und
#   VorlageTest 10f laesst diese Warnung dann nicht stehen. Die Wendung von /zurueck
#   stand bis zum zweiten Zug von Schritt 5 ebenfalls hier - sie steht jetzt unter
#   zurueck.letzter-ort, samt der Erklaerung ihrer schiefen Grammatik.
reise:
  # {ziel} - du bist schon in der Zielwelt, es geht nirgends hin. In fliesstext und
  # nicht in warnung:
  # Es ist nichts kaputt.
  schon-da: "<fliesstext>Du bist schon in {ziel}.</fliesstext>"
  # {ziel} - am Erscheinungspunkt der Zielwelt steht kein tragfaehiger Boden mit Platz
  # darueber. Der EINZIGE Satz dieses Abschnitts, der sagt "du kannst nichts tun" -
  # darum nimm ihm diesen Teil nicht weg. Daneben schreibt das Plugin eine Zeile ins
  # Serverprotokoll, mit dem Weltschluessel und dem Rat zu /setworldspawn; die bleibt
  # im Programm, denn eine Diagnose darf nicht von dieser Datei abhaengen.
  kein-platz-am-erscheinungspunkt: "<warnung>In {ziel} ist am Erscheinungspunkt kein Platz zum Stehen. Das ist nichts, was du beheben kannst - melde es.</warnung>"

  # WAS GEGEN DIESEN EINEN TELEPORT SPRICHT. Jede dieser fuenf Zeilen wird ZWEIMAL
  # geprueft - einmal, bevor gewartet wird, und einmal, wenn es losgeht: In drei
  # Sekunden kann der Boden abgebaut, Lava geflossen oder die Welt entladen worden
  # sein. Darum steht jeder Satz EINMAL hier und gilt fuer beide Pruefungen.
  hindernis:
    # Die Welt ist entladen. Das Wort "mehr" ist Absicht: Sie WAR da, als der Ort
    # gemerkt wurde - anders als bei den zwei Zeilen darunter.
    welt-nicht-geladen: "<warnung>Dorthin geht es nicht mehr - die Welt ist nicht geladen.</warnung>"
    # Er sitzt auf einem Reittier. Gesagt wird es vorher und nicht nachher, weil ein
    # Teleport mit Reittier ueber Weltgrenzen hinweg ohnehin fehlschlaegt.
    zu-pferd: "<warnung>Nicht zu Pferd - absteigen, dann reisen. Das Reittier bleibt zurueck.</warnung>"
    # Ueber ODER unter der Welthoehe - EIN Satz fuer beide Richtungen, weil "zu tief"
    # und "zu hoch" heute zeichengleich dasselbe lesen. Zwei Zeilen daraus zu machen
    # waere ein Satz, den das Spiel nicht hat.
    ausserhalb-der-welthoehe: "<warnung>Dorthin geht es nicht - der Ort liegt ausserhalb der Welthoehe.</warnung>"
    # Jenseits der Weltgrenze. Unterscheidet sich von der Zeile darueber in GENAU EINEM
    # Wort, und das ist Absicht: zwei Wachen, zwei Sachverhalte. Beide tragen den
    # GANZEN Satz und nicht bloss das unterscheidende Wort - nur so kannst du sie
    # umstellen und nicht bloss faerben.
    ausserhalb-der-weltgrenze: "<warnung>Dorthin geht es nicht - der Ort liegt ausserhalb der Weltgrenze.</warnung>"
    # Am Zielort hat sich etwas geaendert - Boden abgebaut, Wasser gelaufen, Lava
    # geflossen. Abgesagt und NICHT woanders hin verschoben: Der Ort war gemeint.
    # Teilt die Woerter "kein Platz zum Stehen" mit kein-platz-am-erscheinungspunkt
    # oben, ist aber ein anderer Fall: dort eine ganze Welt, hier ein einzelner Ort.
    kein-platz-mehr: "<warnung>Dort ist kein Platz zum Stehen mehr.</warnung>"

  # Die einzige Zeile des Reisens in hinweis, und die einzige, nach der es WEITERGEHT: Die
  # Reise laeuft danach durch. Nur bei einem Weltwechsel mit einem angeleinten Tier -
  # ohne Weltwechsel und ohne Tier sagt niemand etwas.
  leine-reisst: "<hinweis>Angeleinte Tiere bleiben zurueck - eine Leine reisst beim Weltwechsel.</hinweis>"
  # {ziel} - der Server hat den Teleport abgelehnt, nachdem der Spieler brav
  # stillgestanden hat. Daneben geht eine Zeile ins Serverprotokoll. Teilt die Wendung
  # "Reise nach {ziel}" mit den zwei Zeilen unter abbruch, ist aber ein anderer Fall:
  # hier hat der SERVER abgelehnt, dort hat der SPIELER die Wartezeit verloren.
  nicht-geklappt: "<warnung>Die Reise nach {ziel} hat nicht geklappt.</warnung>"
  # {anzahl} ZAEHLT - zwei Reisen zu schnell hintereinander. Nicht gegen Missbrauch,
  # sondern gegen die Platte: Jede Reise liest den Zielchunk. Die Zahl liegt zwischen
  # 1 und 3 und ist aufgerundet; eine Nullform gibt es nicht und braucht es nicht,
  # denn bei 0 reist man einfach.
  # NICHT ZU VERWECHSELN mit parzelle.abklingzeit, das mit denselben drei Woertern
  # beginnt: Das ist die Abklingzeit der Wegabschaetzung und eine andere Sache. Zwei
  # Zeilen und nicht eine - sonst laese ein Reisender den Satz ueber die Abschaetzung.
  abklingzeit:
    eins: "<fliesstext>Einen Augenblick - noch {anzahl} Sekunde.</fliesstext>"
    viele: "<fliesstext>Einen Augenblick - noch {anzahl} Sekunden.</fliesstext>"

  # {sekunden} {ziel} - die Wartezeit hat begonnen. Drei Sekunden, in denen der
  # Spieler bleiben muss, wo er ist; sonst ist jeder Teleport ein Fluchtweg aus einem
  # Kampf. Ein Tor verhaelt sich damit wie ein Netherportal.
  # {sekunden} ist ein WERT und keine Zahl zum Hineinschreiben: Dieselbe Einstellung
  #   im Programm bestimmt, wie lange wirklich gewartet wird. Schreib die 3 als Wort
  #   hinein, und der Satz luegt an dem Tag, an dem die Wartezeit sich aendert.
  # KEINE Zaehlform, und das ist das heutige Bild: "Nach 1 Sekunden" waere falsch,
  #   kommt aber nicht vor, weil es immer drei Sekunden sind. Eine Einzahlform waere
  #   hier erfunden.
  wartezeit: "<fliesstext>Nach {sekunden} Sekunden geht es nach {ziel} - bis dahin stehen bleiben.</fliesstext>"

  # {ziel} - die Wartezeit ist abgebrochen. ZWEI Gruende, zwei Zeilen, und beide
  # tragen den ganzen Satz: nur so kannst du sie umstellen. Beim ABMELDEN wird
  # ebenfalls abgebrochen, aber ohne Meldung - es liest sie dann niemand mehr, und
  # darum gibt es dafuer hier keine dritte Zeile.
  abbruch:
    # Er hat den Bereich verlassen, in dem er angefangen hat. Bei einem Befehl ist das
    # sein eigener Block, bei einem Tor der ganze Torquader - wer sich darin dreht,
    # bricht nicht ab.
    bewegt: "<warnung>Bewegt - die Reise nach {ziel} ist abgebrochen.</warnung>"
    # Er hat Schaden genommen. Ein eigener Grund, weil Bewegung allein eine Luecke
    # liesse: Wer eingekeilt in einer Ecke steht, bewegt sich durch Rueckstoss nicht
    # immer einen ganzen Block weit - und genau dann waere der Teleport doch ein
    # Fluchtweg.
    schaden: "<warnung>Schaden genommen - die Reise nach {ziel} ist abgebrochen.</warnung>"

# /WARP - was NUR dieser Befehl sagt.
#
# Unter warp und nicht unter reise, anders als der Abschnitt darueber: Den liest jeder,
# der irgendwie reist, diesen Abschnitt nur, wer /warp tippt. Wer ihn umformuliert, trifft
# damit nicht die Absage des Tores am Bundesmarkt.
#
# DER TRENNER DER WELTENLISTE STEHT HIER, die REIHENFOLGE nicht. Wie die Namen getrennt
#   werden, ist Aufbau und gehoert in diese Datei; in welcher Reihenfolge sie kommen, ist
#   die Reihenfolge der config.yml - oben steht die Marktstadt, und wer /warp m tippt,
#   meint fast immer sie.
# DIE ZWEI TRENNER SIND VERSCHIEDEN, und das ist eine Entscheidung und kein Versehen:
#   ziele steht fuer sich und darf breit sein, kein-ziel haengt an einer Absage in warnung und
#   soll eine Zeile bleiben. Willst du sie gleich, mach sie gleich - niemand haelt dich
#   ab.
# DIE ZWEI TRENNER DUERFEN LEER BLEIBEN. Sie sind die EINZIGEN Zeilen dieser ganzen Datei,
#   die das duerfen, denn ein Trenner sendet keine Chatzeile - leer stossen die Namen
#   aneinander, und das ist haesslich und nicht kaputt. Jede andere Zeile dieser Datei
#   wird, wenn du sie leer laesst, eine Klage - auch zurueck.letzter-ort gleich darunter.
warp:
  # {liste} - DREI Chatzeilen in einer Zeile dieser Datei, getrennt von der Umbruchmarke.
  # Jede traegt ihre eigene Rolle: die Ueberschrift kopf, die Liste betont, der
  # Weghinweis fliesstext. EIN Schluessel und nicht drei, weil sie immer zusammen
  # hinausgehen - so kannst
  # du sie umstellen und nicht bloss umfaerben.
  # Die spitze Klammer um ziel ist ein ZEICHEN und keine Farbe, darum ZWEI Backslashes
  # davor. Das Wort darin ist der Name des Befehlsarguments: Wird es im Programm
  # umbenannt, gehoert es hier mitgeaendert.
  # QUERVERWEIS: DER SCHWANZ " - oder durch ein Tor am Bundesmarkt." steht WORTGLEICH
  # noch in einem zweiten Satz, naemlich in wache.portal.kein-ausgang - der Absage am
  # Nether- und Endportal. Bis zu dessen Bauschritt kam dieser zweite aus dem Programm,
  # und hier stand darum eine Warnung; jetzt stehen beide in dieser Datei. Das sind zwei
  # Saetze mit zwei verschiedenen Anfaengen und bleiben zwei: Aenderst du den Schwanz
  # hier, aendert er sich dort NICHT mit. Das ist ab jetzt deine Entscheidung und kein
  # Fehler mehr - willst du sie gleich halten, aendere beide.
  # {name} - die gesuchte Freistadt gibt es nicht. Ein eigener Satz und nicht
  #   warp.kein-ziel: Jener zaehlt die WELTEN auf, und das hilft niemandem, der eine
  #   Stadt sucht.
  stadt-unbekannt: "<warnung>Die Freistadt {name} gibt es nicht.</warnung>\n<fliesstext>Welche es gibt, zeigt /freistadt.</fliesstext>"
  # /warp freistadt ohne Namen.
  stadt-ohne-namen: "<fliesstext>Welche Freistadt? Die Namen zeigt /freistadt.</fliesstext>"
  # {name} - die Aufschrift, unter der die Reise gemeldet wird. KEIN Farbtag: Sie geht
  #   als Wert in andere Saetze.
  stadt-aufschrift: "Freistadt {name}"
  # Die Welt der Freistaedte fehlt (freistaedte.welt).
  stadt-keine-welt: "<warnung>Die Welt der Freistaedte fehlt - sag es dem Betreiber.</warnung>"
  # {name} {was} - diese Stadt hat noch keinen Teleporter [Plan 16]. OHNE diesen Satz
  #   erschiene sie als stadt-unbekannt, also als Tippfehler - eine Luege ueber einen
  #   Namen, den es gibt. {was} nennt, WAS fehlt; ohne die Angabe weiss der
  #   Stadtbesitzer nur, dass etwas fehlt, und nicht, was er tun soll.
  # Der Stadtbesitzer, seine Mitbauer und die Stadtbuerger lesen diesen Satz NIE - sie
  #   duerfen immer hinein.
  stadt-ohne-auflage: "<warnung>{name} hat noch keinen Teleporter</warnung>\n<fliesstext>Es fehlt: {was}. Das stellt der Stadtbesitzer ein.</fliesstext>"
  # DIE DREI WORTE FUER {was} STANDEN HIER und stehen seit dem 17.11.2026 unter
  #   freistadt.auflage - seit E3b liest sie ein zweiter Satz, shop.absage.kein-
  #   ladenrecht. Worte, die zwei Saetze teilen, gehoeren keinem der beiden.
  ziele: "<kopf>Reiseziele</kopf>\n<betont>{liste}</betont>\n<fliesstext>/warp \\<ziel> - oder durch ein Tor am Bundesmarkt.</fliesstext>"
  # Was zwischen zwei Weltnamen der Zeile darueber steht: ZWEI Leerzeichen. Kein Farbtag -
  # der Trenner geht als WERT in den Satz und ist dort ein Blatt. Darf leer sein.
  ziele-trenner: "  "
  # {eingabe} {liste} - ZWEI Chatzeilen, warnung und fliesstext, und ebenfalls EIN Schluessel: Die
  # Absage und die Liste darunter gehen immer zusammen hinaus.
  # {eingabe} ist der GETIPPTE Name und KEIN Weltname - in diesem Fall gibt es keinen. Er
  # kommt roh herein und bleibt Text: Ein Farbtag darin steht dem Spieler woertlich im
  # Chat und wirkt nicht, denn zuerst wird dieser Satz gelesen und der Wert erst danach
  # eingesetzt.
  # DIESER SATZ BEGINNT MIT "Dorthin geht" wie drei Zeilen unter reise.hindernis. Vier
  # Ursachen, vier Zeilen - aber derselbe Anfang, damit ein Spieler sie als dieselbe Art
  # von Absage liest. Wenn du den Anfang aenderst, aendere alle vier.
  kein-ziel: "<warnung>Dorthin geht keine Reise: {eingabe}</warnung>\n<fliesstext>Moeglich sind: {liste}</fliesstext>"
  # Was zwischen zwei Weltnamen der Zeile darueber steht: KOMMA und Leerzeichen, anders als
  # bei ziele-trenner. Darf leer sein.
  kein-ziel-trenner: ", "
  # {welt} - der Name steht in der Weltenliste der config.yml, die Welt ist aber nicht
  # entstanden; das hat beim Start geklagt, hier steht nur die Absage.
  # {welt} heisst nicht {eingabe}, und das ist ein Riegel und keine Laune: Hier steht der
  # AUFGELOESTE Name - immer klein, immer aus der config.yml. Wer /warp KORNMARK tippt,
  # liest "Die Welt kornmark gibt es gerade nicht."
  # NICHT ZU VERWECHSELN mit reise.hindernis.welt-nicht-geladen: Fuer den Spieler ist
  # beides "das Ziel ist nicht zu haben", fuer dich sind es zwei Ursachen - hier ein
  # Eintrag ohne Welt, dort eine Welt, die zur Laufzeit entladen ist. An diesem Unterschied
  # entscheidest du, ob du in die config.yml oder in den laufenden Server schaust.
  welt-fehlt: "<warnung>Die Welt {welt} gibt es gerade nicht.</warnung>"

# /ZURUECK - und /back, weil viele Spieler das tippen. Eine Absage und ein Wortstueck.
zurueck:
  # Es ist nichts gemerkt. In fliesstext und nicht in warnung: Es ist nichts kaputt, der Spieler war nur
  # noch nirgends. Eine Zeile gegen KEINE Zeile - hat er einen gemerkten Ort, sagt dieser
  # Befehl gar nichts und reist.
  kein-ort-gemerkt: "<fliesstext>Es ist kein Ort gemerkt - du bist noch nirgends gewesen, wohin es zurueckgeht.</fliesstext>"
  # KEIN gesendeter Satz, sondern das Wortstueck, das dieser Befehl als Reiseziel
  # durchgibt: Es wird in die vier Zeilen unter reise EINGESETZT, die {ziel} nennen - die
  # Wartezeit, die zwei Abbrueche und "hat nicht geklappt". Kein Farbtag, ein eingesetzter
  # Wert ist dort ein Blatt. Darf NICHT leer sein, sonst liest der Spieler "geht es nach
  # - bis dahin stehen bleiben".
  # HIER STEHT DIE SCHIEFHEIT, und ab jetzt kannst DU sie beheben: Mit dieser Wendung
  # liest ein Spieler "Nach 3 Sekunden geht es nach deinen letzten Ort" - grammatisch
  # schief, und genau so ausgeliefert. Der Umzug hat daran nichts geaendert, weil ein
  # Umzug nichts aendern darf. Wer es gerade haben will, aendert entweder dieses
  # Wortstueck oder die vier Zeilen unter reise - und dann beides zusammen.
  letzter-ort: "deinen letzten Ort"

# DIE WACHEN - was ein Spieler liest, ohne etwas getippt zu haben.
#
# Unter wache und nicht unter einem Befehl: Diese Saetze kommen von selbst, weil eine
# Hand etwas angefasst hat, nicht weil jemand etwas gefragt hat.
#
# DER HANDBALKEN IST KEINE CHATZEILE. Die vier Zeilen unter schutz stehen ueber dem
#   Gegenstandsgurt und nicht im Chat. Dort ist nur EINE Zeile moeglich, darum ist ein
#   \n in diesen vier Zeilen eine KLAGE mit Zeilennummer und kein Umbruch - der Rest
#   dahinter wuerde sonst stumm verschwinden. Worte und Farbe darfst du frei waehlen,
#   auch mehrere Farben in einer Zeile (siehe fremde-parzelle). Die drei Zeilen unter
#   ankunft und portal sind dagegen gewoehnliche Chatzeilen, und eine von ihnen traegt
#   eine Umbruchmarke.
# GEDROSSELT KOMMEN ZWEI VON DREI. Der Handbalken hoechstens einer je Spieler und zwei
#   Sekunden, sonst wird aus einer festgehaltenen Maustaste ein Flackern; die Absage am
#   Portal hoechstens eine je Spieler und acht Sekunden, denn sie feuert, solange der
#   Spieler im Portalblock steht. Die zwei Zeilen unter ankunft brauchen keine Drossel -
#   ihre Anlaesse kommen von selbst nur einmal.
# BEIM DARAUFTRETEN - fremdes Ackerland zum Beispiel - kommt gar kein Handbalken: Das
#   hatte der Spieler nicht vor.
wache:
  # DER BAUSCHUTZ. Vier Lagen, vier Zeilen, eine Sendestelle - welche Zeile ein Spieler
  # liest, entscheidet das Programm am Ort seiner Hand.
  schutz:
    # Er steht auf Weg oder Mauer. In hinweis und nicht warnung, und das ist Absicht: Es ist
    # nichts kaputt und niemand abgewiesen, der Ort gehoert einfach allen.
    weg-und-mauer: "<hinweis>Weg und Mauer gehoeren allen</hinweis>"
    # Die Parzelle ist zu haben. Die EINZIGE der vier Zeilen, die einen Befehl nennt -
    # dieselben Worte stehen in parzelle.bescheid.noch-frei. Benennt das Programm den
    # Befehl eines Tages um, gehoeren beide Zeilen geaendert.
    parzelle-frei: "<hinweis>Diese Parzelle ist frei - /parzelle nehmen</hinweis>"
    # Hier ist Bauland im Raster, aber jenseits der Stadtgrenze - es wird nie vergeben.
    # BEGINNT MIT DENSELBEN 25 ZEICHEN wie parzelle.nehmen.ausserhalb, hat aber eine
    # andere Farbe und einen anderen Fall: Dort hat jemand /parzelle nehmen getippt und
    # bekommt die Grenzen genannt, hier hat er bloss eine Hand gehoben. Aenderst du den
    # Anfang, sieh dir die andere Zeile an.
    ausserhalb: "<hinweis>Hier endet die Marktstadt</hinweis>"
    # {eigentuemer} - die Parzelle gehoert einem anderen Menschen, und er wird genannt.
    # ZWEI ROLLEN IN EINER ZEILE, und der Wechsel steht MITTEN im Satz: warnung der
    #   Kopf, betont der Name. Das Leerzeichen vor dem Namen steht VOR dem <betont> und
    #   gehoert damit zum Stueck in warnung. Schiebst du es dahinter, sieht der Spieler
    #   dasselbe - die Bildprobe des Projekts aber nicht. Lass es, wo es ist.
    # {eigentuemer} IST EIN FREMDER NAME. Der Leser ist der Besucher, genannt wird der
    #   Eigentuemer - schreib also nichts hinein, was den Leser selbst anspricht.
    # KENNT DER SERVER DEN NAMEN NICHT, stehen dort acht Zeichen einer UUID. Einen
    #   eigenen Satz dafuer gibt es nicht, weil es ihn vor dem Umzug auch nicht gab.
    # DERSELBE ANFANG steht in parzelle.bescheid.noch-frei und in den zwei Formen von
    #   parzelle.bescheid.noch-frei-am-limit: "Diese Parzelle gehoert ". Vier Zeilen mit
    #   demselben Anfang, damit ein Spieler sie als dieselbe Art von Auskunft liest -
    #   aenderst du den Anfang, sieh dir alle vier an.
    fremde-parzelle: "<warnung>Diese Parzelle gehoert <betont>{eigentuemer}</betont></warnung>"
    # {laden} {mieter} - der Ladenschutz [Teil C]. BEIDE Werte: In einer Markthalle
    #   stehen die Staende nebeneinander, und ein Besucher soll lesen, an welchem er
    #   steht. Derselbe Aufbau wie fremde-parzelle darueber - Absage warnung, der
    #   fremde Name betont.
    #
    # HANDELN darf er hier trotzdem: Am Schild eines Kistenshops kauft jeder, auch im
    #   Laden eines anderen. Diese Zeile kommt nur, wenn er BAUT, ABBAUT oder die KISTE
    #   oeffnen will.
    fremder-laden: "<warnung>{laden} ist der Laden von <betont>{mieter}</betont></warnung>"
    # Ein Stand, den niemand gemietet hat - hier darf AUCH niemand bauen. Eine freie
    #   Einheit gehoert niemandem und damit nicht jedem: Was ein Spieler dort
    #   hinterlaesst, hinterlaesst er dem naechsten Mieter. Der Satz nennt darum den Weg,
    #   wie wache.schutz.parzelle-frei es tut.
    # /laden mieten STEHT HART IM SATZ. Benennt das Programm den Befehl um, gehoert
    #   diese Zeile geaendert.
    laden-frei: "<hinweis>Dieser Stand ist frei - /laden mieten</hinweis>"
    # Die Mietvertraege sind gerade nicht nachsehbar. Ein EIGENER Satz: Bei einer stummen
    #   Datenbank weiss niemand, wem der Stand gehoert, und die zwei Zeilen darueber
    #   waeren beide eine Behauptung.
    laden-gestoert: "<warnung>Die Markthalle ist gerade nicht nachsehbar - versuch es noch einmal.</warnung>"
    # Ein Behaelter in der Ladenwelt, der niemandem gehoert. Der Abenteuermodus
    #   verhindert das Bauen, nicht das OEFFNEN - ohne diese Absage stuende jede Kiste
    #   der Stadt offen.
    # KEIN Ausweg im Satz, anders als bei laden-frei: Diese Kiste ist nicht zu mieten
    #   und nicht freizugeben. Die Freie Truhe und die Kistenshops sind ausgenommen,
    #   dort entscheiden ihre eigenen Wachen.
    einrichtung: "<warnung>Diese Kiste gehoert zur Stadt</warnung>"
    # --- Die Freistaedte [11.11.2026] -------------------------------------------
    # Sechs Lagen, und sie stehen hier bei den anderen Wachsaetzen und nicht unter
    # freistadt: Was ein Spieler im Handbalken liest, waehrend er irgendwo baut,
    # gehoert zusammen - wer die Farbe der Absagen angleichen will, soll sie
    # nebeneinander sehen.
    #
    # Zwischen den Staedten. KEIN Ausweg im Satz, anders als bei stadt-frei: Hier
    # wird nie jemand bauen duerfen, auch nicht gegen Geld. In hinweis und nicht in warnung, wie
    # weg-und-mauer: Es ist kein Vergehen, nur der falsche Ort.
    stadt-leere: "<hinweis>Zwischen den Staedten gehoert nichts niemandem - und gebaut wird hier nicht</hinweis>"
    # Jenseits der Weltgrenze der Freistaedte. Ein EIGENER Satz neben ausserhalb:
    # Jener nennt die Marktstadt, und wer am Rand der Freistaedte steht, suchte den
    # Fehler sonst in einer Welt, in der er gar nicht ist.
    stadt-ausserhalb: "<hinweis>Hier enden die Freistaedte</hinweis>"
    # Feld 0/0 - das Ziel des Tores aus Altfurt. Es wird NIE vergeben, darum sagt der
    # Satz, wem es gehoert, statt einen Ausweg zu nennen.
    ankunftsfeld: "<hinweis>Das Ankunftsfeld gehoert allen - deine eigene Stadt gruendest du mit /freistadt gruenden</hinweis>"
    # Ein freies Stadtfeld. MIT Ausweg, wie parzelle-frei und laden-frei.
    # Die Stadt ist VERFALLEN [Plan 16, Teil E5]. EIN EIGENER SATZ und nicht
    #   stadt-frei: Jener sagt "hier ist noch nichts, gruende" - eine Luege ueber ein
    #   Feld, das vergeben ist. Der Spieler tippte /freistadt gruenden und laese "Name
    #   vergeben".
    # SAGT DEM BESITZER, WAS ZU TUN IST, denn genau sein Fall ist heilbar: Er muss nur
    #   bleiben, dann weckt der Besuchsstempel die Stadt im naechsten Minutentakt. Ohne
    #   den Hinweis stuende er vor seiner eigenen Stadt und hielte sie fuer verloren.
    stadt-verfallen: "<warnung>Diese Stadt ist verfallen - hier baut niemand.</warnung><fliesstext> Gehoert sie dir, bleib einen Augenblick: Sie wacht von selbst wieder auf.</fliesstext>"
    stadt-frei: "<hinweis>Dieses Stadtfeld ist frei - /freistadt gruenden</hinweis>"
    # {stadt} {eigentuemer} - die Stadt eines anderen. ZWEI Farben in einer Zeile wie
    # bei fremde-parzelle, und BEIDE Werte: Mit dem Namen findet ein Besucher den Weg
    # zurueck ueber /warp freistadt <name>. Der Stadtname ist Spielereingabe und geht
    # darum als Blatt in den Satz - Stadtname laesst nur Kleinbuchstaben, Ziffern und
    # Bindestriche durch.
    fremde-stadt: "<warnung>Freistadt <betont>{stadt}</betont> gehoert <betont>{eigentuemer}</betont></warnung>"
    # {eigentuemer} - ein vergebenes Grundstueck mitten in einer Stadt
    # [12.11.2026]. Dieser Satz trifft AUCH den Stadtbesitzer: Wer ein Grundstueck
    # vergeben hat, baut dort nicht mehr - und genau dafuer zahlt ein Kaeufer.
    #
    # OHNE Stadtnamen, anders als fremde-stadt: Wer hier steht, ist schon in der
    # Stadt. Ihm fehlt nicht der Weg hinein, sondern der Name dessen, den er fragen
    # muss.
    fremdes-grundstueck: "<warnung>Dieses Grundstueck gehoert <betont>{eigentuemer}</betont></warnung>"
    # {recht} - ein STADTBUERGER, dem seine Stadt diese Tat nicht hergibt [Teil D4].
    #
    # EIN EIGENER SATZ, und das ist der Grund, aus dem der Handbalken ueberhaupt einen
    # Spieler kennt: Wem die Stadt mitgehoert, weil er ein Grundstueck darin hat, dem
    # sagt "Das ist die Stadt von Anna" nichts. Er weiss, wessen Stadt es ist - er will
    # wissen, was er dort darf.
    #
    # Das {recht} ist das WORT aus freistadt.rechte.wort - dieselbe Zeile, die auch
    # /freistadt rechte liest. Zwei Worte fuer dasselbe Recht waeren zwei Antworten auf
    # dieselbe Frage.
    buerger-darf-nicht: "<warnung>Stadtbuerger duerfen hier nicht <betont>{recht}</betont></warnung>"
    # Die Freistaedte sind gerade nicht nachsehbar - wie laden-gestoert. Dann wird
    # abgelehnt, und das ist die sichere Richtung: Ein stilles Ja liesse jeden in
    # jeder fremden Stadt bauen.
    stadt-gestoert: "<warnung>Die Freistaedte sind gerade nicht nachsehbar - versuch es noch einmal.</warnung>"
    # --- Die Meerinseln von Hafenwerder [18.11.2026] ----------------------------
    # Fuenf Lagen, und sie stehen hier bei den anderen Wachsaetzen und nicht unter
    # werder: - aus demselben Grund wie die der Freistaedte darueber.
    #
    # Offenes Meer. KEIN Ausweg im Satz: Hier wird nie jemand bauen duerfen, auch
    # nicht gegen Geld - es ist das oeffentliche Wasser des Archipels. In hinweis und
    # nicht in warnung, wie stadt-leere: Es ist kein Vergehen, nur der falsche Ort.
    insel-meer: "<hinweis>Offenes Meer - hier gehoert nichts niemandem, und gebaut wird hier nicht</hinweis>"
    # Feld 0/0 - das Ziel des Tores aus Altfurt. Es wird NIE vergeben, darum sagt der
    # Satz, wem es gehoert, statt einen Ausweg zu nennen.
    insel-ankunft: "<hinweis>Die Ankunftsinsel gehoert allen - deine eigene nimmst du mit /werder hafen nehmen</hinweis>"
    # Eine freie Insel. MIT Ausweg, wie stadt-frei.
    insel-frei: "<hinweis>Diese Insel ist frei - /werder hafen nehmen</hinweis>"
    # {eigentuemer} - die Insel eines anderen. OHNE Namen, anders als fremde-stadt:
    # Eine Insel hat keinen. Was dem Fragenden fehlt, ist der Mensch, den er fragen
    # muss.
    fremde-insel: "<warnung>Diese Insel gehoert <betont>{eigentuemer}</betont></warnung>"
    # Wie stadt-gestoert: Dann wird abgelehnt, und das ist die sichere Richtung.
    insel-gestoert: "<warnung>Die Inseln sind gerade nicht nachsehbar - versuch es noch einmal.</warnung>"
    # Schritt 11, Wolkenwerder. Drei Lagen, und zwei Saetze fehlen hier mit Absicht:
    # fremde-insel und insel-gestoert gelten fuer BEIDE Inselwelten - sie sagen dort
    # Wort fuer Wort dasselbe, und ein Wort fuer eine Sache ist die Regel dieser
    # Datei.
    #
    # Die Leere ist fuer JEDEN verboten, auch fuer den Nachbarn: Ein Block darin ist
    # der erste Block einer Bruecke. In hinweis und nicht warnung - kein Vergehen, nur der
    # falsche Ort.
    wolke-leere: "<hinweis>Hier ist nichts - zwischen den Inseln baut niemand</hinweis>"
    # Das Ankunftsfeld. MIT Ausweg, denn genau hier steht ein Spieler, wenn er
    # zum ersten Mal ankommt.
    wolke-ankunft: "<hinweis>Die Ankunftsplattform gehoert allen - deine eigene Insel nimmst du mit /wolke nehmen</hinweis>"
    # Ein freies Feld. Der Ausweg nennt KEINE Stelle, denn genommen wird nicht
    # dieses Feld, sondern das naechste freie - und das kann ein anderes sein.
    wolke-frei: "<hinweis>Dieses Feld ist frei - mit /wolke nehmen bekommst du eine Insel</hinweis>"
  # DIE ANKUNFT. Zwei Saetze an zwei verschiedenen Anlaessen: Der eine kommt, weil jemand
  # einen Spawnpunkt setzen wollte, der andere, weil jemand eine Abenteuerwelt betritt.
  # Sie gehen nie zusammen hinaus, darum sind es zwei Zeilen und nicht eine mit beidem
  # darin. Beide sind fliesstext - eine Auskunft, keine Absage.
  ankunft:
    # Ein Bett oder ein Anker hat KEINEN Spawnpunkt gesetzt. Geschlafen werden darf
    # weiter; gesperrt ist allein das Setzen des Punktes, und gestorben wird immer nach
    # Altfurt.
    # DIESER SATZ IST DER EINZIGE HINWEIS. Die Meldung des Spiels ("Respawn point set")
    #   wird vorher ausdruecklich abgeschaltet, weil sie hier eine Luege waere. Laesst du
    #   die Zeile leer, ist das eine Klage beim Laden - und das ist Absicht: Ohne Hinweis
    #   tut ein Bett scheinbar nichts, und der Spieler merkt es erst beim naechsten Tod.
    # "Altfurt" STEHT HART IM SATZ und kommt nicht aus der config.yml - genauso wie
    #   "Marktstadt" in sechs Zeilen dieser Datei. Diese Zeile hier ist die einzige der
    #   ganzen Datei, die Altfurt nennt; benennst du die Welt in der config.yml um,
    #   gehoert dieser Satz mitgeaendert, und sonst keiner.
    kein-spawnpunkt: "<fliesstext>Hier wird kein Spawnpunkt gesetzt - gestorben wird immer nach Altfurt. Schlafen geht weiter.</fliesstext>"
    # Die betretene Welt ist Abenteuer: ansehen und benutzen, aber nicht abbauen.
    # NUR IN DIESE RICHTUNG. Der Weg zurueck nach Ueberleben sagt nichts, weil dort
    #   nichts verboten wird - einen Satz dafuer gibt es nicht, und es gab ihn nie.
    # WELCHE Welten Abenteuer sind, steht in der config.yml und nicht hier; heute ist es
    #   allein Altfurt. Dieser Satz gilt fuer jede davon - schreib also nichts hinein,
    #   was nur fuer eine stimmt.
    abenteuer: "<fliesstext>Hier ist Abenteuer: ansehen und benutzen, aber nicht abbauen. Gebaut wird in der Marktstadt.</fliesstext>"
  # DAS PORTAL. Ein selbstgebautes Nether- oder Endportal fuehrt nirgends hin: Es laesst
  # sich nicht anzuenden, und ein bestehendes laesst niemanden durch. Ohne diese Absage
  # waere das Fehlerbild ein Rahmen, der nicht brennt - und das sieht wie ein
  # Serverfehler aus.
  portal:
    # ZWEI Chatzeilen in einer Zeile dieser Datei, getrennt von der Umbruchmarke: die
    # Absage warnung, der Weg darunter fliesstext. EIN Schluessel und nicht zwei, weil sie immer
    # zusammen hinausgehen: Es gibt keinen Fall, in dem der Spieler nur eine von beiden
    # liest. Dieselbe Lage wie warp.kein-ziel, und derselbe Gewinn: So kannst du sie
    # umstellen und nicht bloss umfaerben. Und derselbe Preis - einzeln abschalten kannst
    # du sie nicht; wer nur die Absage will, loescht Umbruchmarke und zweite Zeile mit.
    # QUERVERWEIS: Der Schwanz " - oder durch ein Tor am Bundesmarkt." steht wortgleich
    #   auch am Ende von warp.ziele. Zwei Saetze mit zwei verschiedenen Anfaengen bleiben
    #   zwei - aenderst du ihn hier, aendert er sich DORT NICHT mit. Das ist ab jetzt
    #   deine Entscheidung und kein Fehler mehr, denn beide stehen in dieser Datei.
    # /warp nether UND /warp end STEHEN HART IM SATZ, wie der Befehl in
    #   wache.schutz.parzelle-frei. Benennt das Programm sie um, gehoert diese Zeile
    #   geaendert.
    kein-ausgang: "<warnung>Hier fuehrt kein Portal hinaus.</warnung>\n<fliesstext>Nether und Ende erreichst du mit /warp nether und /warp end - oder durch ein Tor am Bundesmarkt.</fliesstext>"

# /FREIMARKEN - was der Befehl ueber sich selbst sagt.
#
# Der letzte Umzug der SPIELERSAETZE. Die vier Verwaltungszweige - neuladen,
# welt, parzelle und vorgenerieren - bleiben im Programm: Ihre Antworten gehen
# in den Chat eines Betreibers mit dem Recht freimarken.verwalten und an keinen
# Spieler. Sie stehen darum nicht in dieser Datei und sind nicht aenderbar.
# ZWEI EBENEN UND NICHT EINE: stand gehoert dem nackten /freimarken, preis dem
#   Zweig /freimarken preis. Es sind zwei Sendestellen, und wer die eine
#   umschreibt, soll die andere nicht treffen.
# DIE SPITZEN KLAMMERN SIND ZEICHEN und keine Farben - darum zwei Backslashes
#   davor, so wie bei parzelle.mitbauer.befehle. Sie zeigen dem Spieler, wo eine
#   Zahl oder eine Koordinate hingehoert.
stand:
  # Die Ueberschrift der Antwort auf das nackte /freimarken.
  kopf: "<kopf>Der Freimarkenbund</kopf>"
  # {version} {java} {minecraft} - alle drei nennt der laufende Server und nicht
  # diese Datei. Deines ist nur, was dazwischen steht.
  version: "<fliesstext>Stand {version} · Java {java} · {minecraft}</fliesstext>"
  # Ohne Datenbank ueberlebt keine Buchung den Neustart. In warnung, und das ist Absicht:
  # Wer das liest, soll es nicht ueberlesen.
  # WELCHE DER ZWEI ZEILEN ein Spieler sieht, entscheidet das Programm am Zustand
  #   der Ablage - abschalten kannst du keine von beiden.
  ablage-fluechtig: "<warnung>Ablage fluechtig - nichts ueberlebt den Neustart</warnung>"
  # Der gute Fall, und darum dunkelgrau: Er muss nicht auffallen.
  ablage-mariadb: "<gedaempft>Ablage MariaDB</gedaempft>"
  # Die Befehle, die JEDER Spieler hat. Mit /freimarken spielzeit darin, weil ein
  # Zweig, den niemand nennt, ein Befehl ist, auf den niemand kommt.
  # <anzahl> IST EIN HILFETEXT und nicht der Name des Arguments - beim Tippen
  #   nennt der Befehlsbaum es besessen. Aenderst du das Wort hier, aendert sich
  #   nur diese Zeile.
  befehle: "<fliesstext>/parzelle · /mark · /freimarken preis \\<anzahl> · /freimarken spielzeit</fliesstext>"
  # Nur fuer freimarken.verwalten - wer das Recht nicht hat, liest diese Zeile
  # nie.
  # DREI DER VIER ZWEIGE unter diesem Recht: vorgenerieren steht mit Absicht in
  #   keiner Spielerzeile. Und nimmst du einen hier heraus, bleibt er trotzdem
  #   tippbar - der Befehlsbaum steht im Programm, nicht in dieser Datei.
  befehle-verwaltung: "<gedaempft>/freimarken welt · parzelle \\<x> \\<z> · neuladen</gedaempft>"

# /FREIMARKEN PREIS - was die naechste Parzelle kostet.
#
# Drei Zeilen fuer zwei Lagen: Hat der Spieler noch keine Parzelle, ist sie
# gratis, sonst kostet sie. Die Summe darunter kommt in beiden Lagen.
# DER BETRAG KOMMT AUS waehrung.betrag und traegt dort sein Wort - aenderst du es
#   dort, aendert es sich auch in diesen zwei Zeilen.
preis:
  # Die erste Parzelle ist umsonst.
  gratis: "<bestaetigung>Die erste Parzelle ist gratis.</bestaetigung>"
  # {nummer} {betrag} - der Preis der NAECHSTEN Parzelle. Die Nummer ist eine
  # nackte Zahl ohne Tausenderpunkt, hoeher als 65 kann sie nicht werden.
  # ZWEI ROLLEN IN EINER ZEILE, und der Wechsel steht MITTEN im Satz: fliesstext
  #   der Kopf, geld der Betrag, fliesstext wieder der Punkt dahinter. Das Leerzeichen
  #   vor dem Betrag steht VOR dem Goldtag, der Punkt NACH dem Schlusstag - wer
  #   sie verschiebt, verschiebt sie im Spiel.
  kostet: "<fliesstext>Parzelle Nr. {nummer} kostet <geld>{betrag}</geld>.</fliesstext>"
  # {betrag} - was der Spieler fuer seine bisherigen Parzellen zusammen bezahlt
  # hat. Steht immer, auch wenn er noch keine hat: dann 0.
  ausgegeben: "<gedaempft>Bisher ausgegeben: {betrag}</gedaempft>"

# VOLLSTAENDIG FUER ALLES, WAS EIN SPIELER LIEST: /mark, /parzelle, die vier
# Teleportbefehle, die Spielzeit, das Reisen selbst, /warp, /zurueck, alle drei
# Wachen und /freimarken. Jeder dieser Saetze steht an genau einem Ort - nie an
# keinem und nie an zwei.
# NICHT HIER STEHT BETREIBERTEXT: Die Antworten der vier Verwaltungszweige von
#   /freimarken - neuladen, welt, parzelle, vorgenerieren - gehen in den Chat
#   eines Betreibers mit dem Recht freimarken.verwalten und bleiben im Programm.
#   Eine dieser Zeilen sagt ihr Geldwort selbst; der Kopf von waehrung nennt sie.
# DIE EINE AUSNAHME unter den Spielersaetzen sagt es selbst: Der Kopf von reise
#   traegt die Marke HALB IN KRAFT (Reiseziel), weil eine der fuenf Aufschriften
#   eines Reiseziels noch im Programm steht.
# Eine fruehere Ausnahme ist keine mehr: Der Torhinweis am Ende von warp.ziele
#   hat seinen zweiten Ort in wache.portal.kein-ausgang, also in einer Zeile
#   dieser Datei; dort steht ein Querverweis und keine Warnung.

# DER BUNDESMARKT - was der Bund ankauft und was er dafuer zahlt.
#
# Der Markt ist ein ORT: Er steht in Altfurt, und nur dort kann verkauft werden. Die
# LISTE darf man ueberall ansehen - wer wissen will, ob sich der Weg lohnt, soll nicht
# erst hingehen muessen.
#
# DIE MATERIALNAMEN stehen NICHT hier, sondern kommen aus der config.yml: Ein Sortiment
# aus vierzig Materialien braeuchte hier vierzig Worte, und das waere eine zweite
# Abschrift jener Liste. Zwei Abschriften derselben Tabelle laufen auseinander. Gezeigt
# wird der technische Name (cobblestone) - derselbe, den du eintraegst.
# Der Bundesmarkt - seine STAENDE, nicht mehr eine Tafel.
#
# Zweimal umgebaut am 10.11.2026: Erst fiel /markt verkaufen weg (verkauft wird am
#   Schild), dann die Tafel bundesmarkt.ankauf - "es kann ja nur ge- und verkauft werden,
#   wofuer es ein Schild gibt". Was /markt zeigt, ist seither die Liste der Staende aus
#   der Datenbank: wo sie stehen, was sie handeln, zu welchem Preis.
#
# Die MATERIALNAMEN stehen nicht hier, sondern kommen von der Ware selbst (STONE) -
#   dieselbe Entscheidung wie bei der Lohnliste und beim alten Sortiment.
markt:
  # {anzahl} {seite} {seiten} - die Seite steht auch bei einer einzigen da: Wer
  #   "Seite 1 von 1" liest, weiss sofort, dass nichts fehlt.
  kopf: "<kopf>Die Staende des Bundes ({anzahl}) - Seite {seite} von {seiten}</kopf>"
  # {welt} {x} {y} {z} {menge} {ware} {kauf} {verkauf} - eine Zeile je Stand. Die STELLE
  #   steht vorn, denn der Bundesmarkt ist ein Ort: Wer wissen will, wo der Stand fuer
  #   seinen Stein steht, soll hingehen koennen. {kauf} und {verkauf} sind die beiden
  #   Wortstuecke darunter ODER NICHTS - ein leerer Wert verschwindet rueckstandslos,
  #   darum stehen die Trenner in den Stuecken.
  zeile: "<fliesstext>  {welt} {x}/{y}/{z} · {menge}x {ware}{kauf}{verkauf}</fliesstext>"
  # {preis} - ein Wortstueck fuer die Zeile darueber, kein Satz. Kein Farbtag.
  #   KUNDEN KAUFEN zu diesem Preis, der Bund verkauft also.
  kauf: " · Kauf {preis}"
  # {preis} - das Gegenstueck: Kunden verkaufen an den Bund.
  verkauf: " · Ankauf {preis}"
  # {naechste} - nur, wenn es eine naechste Seite gibt.
  weiter: "<gedaempft>/markt liste {naechste} zeigt die naechste Seite</gedaempft>"
  # {seite} {seiten} - und nennt, wie viele es gibt.
  keine-seite: "<fliesstext>Seite {seite} gibt es nicht - die Staende stehen auf {seiten} Seiten.</fliesstext>"
  # Es steht kein Schild. Das ist der Weg, auf dem der Ankauf abgeschaltet wird - und
  #   fuer einen Spieler die Auskunft, dass er nicht sucht, sondern wartet.
  leer: "<hinweis>Der Bund hat noch keinen Stand. Gehandelt wird nur, wofuer ein Schild steht.</hinweis>"
  # {betrag} - was heute noch aus Verkaeufen zu holen ist. In ganzen Mark: Der Deckel
  #   haengt am Gebuchten, und gebucht werden nur ganze Mark.
  frei: "<fliesstext>Heute kannst du noch <geld>{betrag}</geld> aus Verkaeufen bekommen.</fliesstext>"
  # Ein EIGENER Satz und keine Zahl: bundesmarkt.tagesdeckel: 0 heisst kein Deckel, und
  #   "noch 0 Mark" waere das Gegenteil der Wahrheit.
  ohne-deckel: "<fliesstext>Es gibt keinen Tagesdeckel - du kannst beliebig viel an den Bund verkaufen.</fliesstext>"
  # Nimmt den PLATZ der Zeile frei, wenn die Kasse die Tagessumme nicht hergibt. Die
  #   Liste selbst steht vollstaendig darueber - unlesbar ist nur die eine Zahl.
  deckel-unlesbar: "<fliesstext>Wie viel du heute noch bekommen kannst, liess sich nicht lesen</fliesstext><warnung> - verkaufe lieber erst, wenn es wieder dasteht.</warnung>"
  # Die Staende selbst sind nicht lesbar. Dann kommt keine Liste.
  gestoert: "<warnung>Die Staende des Bundes liessen sich nicht lesen</warnung><fliesstext> - sie sind deswegen NICHT weg. Der Grund steht im Serverprotokoll.</fliesstext>"

# Die Markthalle (Plan 7.1, Schritt 8 Teil A): /laden zeigt die Ladeneinheiten.
#
# Die NAMEN der Einheiten stehen NICHT hier - sie kommen aus dem Abschnitt laeden der
#   config.yml. Zwanzig Staende braeuchten hier zwanzig Worte, also eine zweite
#   Abschrift derselben Liste, und zwei Abschriften laufen auseinander. Dieselbe
#   Entscheidung wie bei den Materialnamen des Bundesmarktes und bei der Lohnliste.
freistadt:
  # Die Ueberschrift ueber der Liste - die EINZIGE Zeile dieses Befehls in kopf.
  kopf: "<kopf>Die Freistaedte</kopf>"
  # {name} {besitzer} {feld} - eine Zeile je Stadt. {feld} ist die Feldnummer als x/z,
  #   also die Adresse der Stadt. Hin kommt man mit /warp freistadt <name>.
  zeile: "<fliesstext>  {name}</fliesstext><gedaempft> - von {besitzer}, Feld {feld}</gedaempft>"
  # Es gibt noch keine Freistadt. Diese Zeile MUSS es geben: Wer nur die Ueberschrift
  #   sieht, haelt es fuer einen Fehler. Am ersten Tag ist das der Normalfall.
  leer: "<fliesstext>  Es gibt noch keine Freistadt - macht die erste: /freistadt gruenden deinname</fliesstext>"
  # {name} {preis} {danach} - die Rueckfrage VOR dem Gruenden. {danach} ist das
  #   Guthaben, das uebrig bliebe: 400.000 liest man, ohne es zu fuehlen - was danach
  #   bleibt, fuehlt man.
  frage: "<hinweis>{name} gruenden kostet {preis}. Danach haettest du {danach}.</hinweis>\n<fliesstext>Zum Gruenden: /freistadt gruenden {name} bestaetigen</fliesstext>"
  # {name} {feld} - gegruendet. Der Warp steht dabei, sonst steht der frischgebackene
  #   Besitzer vor seiner Stadt und weiss nicht, wie er hineinkommt.
  # DIE ZUSAGE BLEIBT WAHR [Teil E3]: Der Besitzer darf immer hinein, auch ohne
  #   erfuellte Auflage - sonst waere die Gruendung eine Falle. Die dritte Zeile nennt
  #   die zwei Dinge, die bis dahin NICHT gehen. Ohne sie wartet er auf Besucher, die
  #   abgewiesen werden, und sucht den Fehler im Programm.
  # ACHTUNG, DIE ZWEI HAELFTEN SIND NICHT GLEICH: "kommen keine Fremden" trifft nur
  #   andere - er selbst darf immer. "Es entstehen keine Laeden" trifft IHN AUCH: Das
  #   Ladenrecht kennt keine Ausnahme fuer den Besitzer, weil ihn nichts einsperrt.
  # WENN DU EINEN DER ZWEI SCHALTER UMLEGST (freistaedte.auflage.teleporter oder
  #   .ladenrecht in der config.yml), KUERZE DIESE ZEILE und freistadt.regeln.geloescht
  #   entsprechend. Beide Saetze beschreiben die ausgelieferte Einstellung, in der
  #   BEIDE Haelften gelten; abgeschaltet sagt es dem Betreiber der Startbericht, dem
  #   Spieler aber niemand.
  gegruendet: "<bestaetigung>{name} ist gegruendet - Feld {feld}.</bestaetigung>\n<fliesstext>Hin kommst du mit /warp freistadt {name}.</fliesstext>\n<fliesstext>Bis die Stadt Regeln hat und ein Grundstueck vergeben ist, kommen keine Fremden - und es entstehen keine Laeden.</fliesstext>"

  # {werbung} - NUR DIE FARBE ist hier deine; der Satz steht in der config.yml unter
  # hinweise.rang-werbung. Angehaengt wird er allein unter absage.grenze-erreicht: Bei
  # "kein Feld mehr frei" hilft kein Rang.
  rang-werbung: "<hinweis>{werbung}</hinweis>"
  absage:
    # {kleinstens} {groesstens} - die Laenge. Ein eigener Satz neben name-falsch, damit
    #   die Absage sagt, WAS nicht stimmt.
    name-zu-lang: "<warnung>Ein Stadtname hat {kleinstens} bis {groesstens} Zeichen.</warnung>"
    # Die Zeichen. Kein Unterstrich und kein Punkt - der Punkt ist in der Sprachdatei
    #   der Trenner.
    name-falsch: "<warnung>Ein Stadtname traegt nur kleine Buchstaben, Ziffern und Bindestriche und faengt mit einem Buchstaben an.</warnung>"
    # {name} - der Name gehoert einer Welt, /warp waere danach mehrdeutig.
    name-reserviert: "<warnung>{name} ist der Name einer Welt - so darf keine Stadt heissen.</warnung>"
    # {name} - den Namen gibt es schon.
    name-vergeben: "<warnung>Die Freistadt {name} gibt es schon.</warnung>"
    # {hoechstzahl} - so viele Staedte darf dieser Spieler halten.
    grenze-erreicht: "<warnung>Du hast schon so viele Freistaedte, wie dein Rang erlaubt ({hoechstzahl}).</warnung>"
    # Alle Felder der Welt sind vergeben. Ein eigener Satz neben grenze-erreicht: Jener
    #   sagt "du hast genug", dieser sagt "es gibt keine mehr".
    kein-freies-feld: "<warnung>In dieser Welt ist kein Stadtfeld mehr frei.</warnung>"
    # {preis} {fehlt} - das Guthaben reicht nicht.
    zu-wenig-mark: "<warnung>Eine Freistadt kostet {preis} - dir fehlen {fehlt}.</warnung>"
    # Die Ablage hat gestoert. Das Geld ist zurueck, gegruendet ist nichts.
    gestoert: "<warnung>Das Gruenden hat nicht geklappt - dein Geld ist zurueck. Versuch es noch einmal.</warnung>"
    # Die Welt fehlt oder ist falsch eingetragen (freistaedte.welt).
    keine-welt: "<warnung>Die Welt der Freistaedte fehlt - sag es dem Betreiber.</warnung>"
  # --- DIE GRUNDSTUECKE [Teil C2, 12.11.2026] ---------------------------------
  #
  # Zugeschnitten wird in ZELLEN von 16x16 Bloecken - genau ein Chunk. Ein Stadtfeld
  # traegt 16x16 = 256 davon. Der Spieler steckt zwei Ecken ab, und die Zellen, in
  # denen seine Ecken stehen, bilden das Rechteck: Wer drei Bloecke neben seiner
  # ersten Marke steht, trifft dieselbe Zelle und bekommt deshalb kein breiteres
  # Grundstueck. Darum nennen die Eckensaetze BEIDES, die Blockstelle und die Zelle.
  grundstueck:
    # {nummer} {x} {z} {zelle} - eine Ecke steht. EIN Satz fuer beide Ecken: Zwei
    # waeren derselbe Satz mit einer anderen Zahl, und der Betreiber muesste sie
    # gleich halten.
    ecke: "<bestaetigung>Ecke {nummer} steht</bestaetigung><fliesstext> bei {x}/{z}, Zelle {zelle}.</fliesstext>"
    # {x} {z} {zelle} - die DRITTE Ecke beginnt neu. Das muss er lesen, sonst sucht
    # er beim Anlegen seine alte Absteckung.
    ecke-neu: "<hinweis>Neue Absteckung</hinweis><fliesstext> - Ecke 1 steht bei {x}/{z}, Zelle {zelle}. Die vorige ist weg.</fliesstext>"
    # {zellen} - beide Ecken stehen. Die Groesse SCHON JETZT, nicht erst beim
    # Anlegen: Wer sieht, dass sein Zuschnitt zu gross ist, legt ihn nicht erst an.
    ecken-fertig:
      eins: "<fliesstext>  Das waere 1 Zelle. Anlegen mit /freistadt grundstueck anlegen</fliesstext>"
      viele: "<fliesstext>  Das waeren {zellen} Zellen. Anlegen mit /freistadt grundstueck anlegen</fliesstext>"
    # Anlegen ohne Absteckung - MIT dem Weg dorthin.
    keine-ecken: "<warnung>Du hast nichts abgesteckt.</warnung>\n<fliesstext>Stell dich in eine Ecke und tippe /freistadt grundstueck ecke, dann in die andere.</fliesstext>"
    # Anlegen mit nur einer Ecke.
    eine-ecke: "<warnung>Es fehlt die zweite Ecke.</warnung>\n<fliesstext>Geh zur anderen Ecke und tippe /freistadt grundstueck ecke.</fliesstext>"
    # {zuschnitt} {zellen} {bloecke} - zugeschnitten.
    zugeschnitten:
      eins: "<bestaetigung>Grundstueck zugeschnitten</bestaetigung><fliesstext> - Zellen {zuschnitt}, 1 Zelle, {bloecke} Bloecke.</fliesstext>"
      viele: "<bestaetigung>Grundstueck zugeschnitten</bestaetigung><fliesstext> - Zellen {zuschnitt}, {zellen} Zellen, {bloecke} Bloecke.</fliesstext>"
    # {zuschnitt} - aufgeloest. Die Flaeche faellt an die Stadt zurueck, und das
    # sagt der Satz: Sonst koennte der Besitzer meinen, sie sei jetzt niemandes.
    aufgeloest: "<bestaetigung>Grundstueck aufgeloest</bestaetigung><fliesstext> - die Zellen {zuschnitt} gehoeren wieder der Stadt.</fliesstext>"
    # {stadt} - die Ueberschrift der Liste.
    kopf: "<kopf>Grundstuecke in {stadt}</kopf>"
    # {zuschnitt} {besitzer} {zellen} - eine Zeile der Liste.
    zeile:
      eins: "<fliesstext>  {zuschnitt} · <betont>{besitzer}</betont> · 1 Zelle</fliesstext>"
      viele: "<fliesstext>  {zuschnitt} · <betont>{besitzer}</betont> · {zellen} Zellen</fliesstext>"
    # Die Stadt hat noch kein Grundstueck. MIT dem Weg dorthin.
    leer: "<fliesstext>  noch keines - stell dich in eine Ecke und tippe /freistadt grundstueck ecke</fliesstext>"
    # Die beiden Ecken liegen nicht im selben Stadtfeld. Der Satz nennt BEIDE
    # Gruende, denn der Spieler kann sie nicht auseinanderhalten: Zwischen zwei
    # Feldern liegt Leere, und in der Leere nennt die Rechnung das Feld davor.
    nicht-ein-feld: "<warnung>Beide Ecken muessen im SELBEN Stadtfeld stehen.</warnung>\n<fliesstext>Zwischen den Feldern liegt Leere, und auf dem Ankunftsfeld wird nicht zugeschnitten.</fliesstext>"
    keine-stadt: "<warnung>Auf diesem Feld steht keine Stadt.</warnung>\n<fliesstext>Erst gruenden - der Befehl dazu heisst /freistadt gruenden, dahinter der Name.</fliesstext>"
    nicht-deine-stadt: "<warnung>Das ist nicht deine Stadt.</warnung>\n<fliesstext>Zuschneiden darf nur, wem die Stadt gehoert - auch ein Mitbauer nicht.</fliesstext>"
    ueberschneidung: "<warnung>Hier liegt schon ein Grundstueck.</warnung>\n<fliesstext>Welche es gibt, zeigt /freistadt grundstueck.</fliesstext>"
    # {zellen} {hoechstens} - zu gross. Die Absage nennt BEIDE Zahlen: Ohne die
    # eigene weiss der Spieler nicht, wie weit er darueber ist.
    zu-gross:
      eins: "<warnung>Ein Grundstueck darf hoechstens {hoechstens} Zellen haben - dein Zuschnitt hat 1.</warnung>"
      viele: "<warnung>Ein Grundstueck darf hoechstens {hoechstens} Zellen haben - dein Zuschnitt hat {zellen}.</warnung>"
    kein-grundstueck: "<warnung>Hier liegt kein Grundstueck.</warnung>\n<fliesstext>Stell dich darauf und tippe den Befehl noch einmal.</fliesstext>"
    # NICHT der Stadtbesitzer loest auf, sondern der des Grundstuecks. Sonst koennte
    # er ein verkauftes Grundstueck einziehen, und der Kaeufer haette fuer nichts
    # gezahlt.
    nicht-dein-grundstueck: "<warnung>Dieses Grundstueck gehoert jemand anderem.</warnung>\n<fliesstext>Aufloesen darf nur sein Besitzer - auch der Stadtbesitzer nicht.</fliesstext>"
    gestoert: "<warnung>Das hat gerade nicht geklappt - versuch es noch einmal.</warnung>"
    # --- ANGEBOT UND VERKAUF [Teil C3, 12.11.2026] ------------------------------
    #
    # Das Abnahmekriterium des ganzen Projekts aus Plan 15: "ein Spieler verkauft
    # einem anderen ein Grundstueck". Der erste Handel, bei dem das Geld nicht beim
    # Bund landet.
    #
    # DREI PAARE VON SAETZEN, und jedes zweite ist das fuer ein GESCHENK. Das ist eine
    # Entscheidung ueber die Sprache und keine Doppelung: "zu 0 Mark angeboten" liest
    # sich wie ein Fehler, und ein Geschenk ist etwas anderes als ein Kauf zum Preis
    # null. Ein Stadtbesitzer, der Buerger anwirbt, verschenkt die ersten
    # Grundstuecke - dieser Fall soll sich auch so lesen.
    #
    # {zuschnitt} {preis} - zum Verkauf gestellt. MIT dem Weg, wie ein anderer kauft:
    # Sonst muesste der Besitzer seinen Kunden erklaeren, wie es geht.
    angeboten: "<bestaetigung>Zum Verkauf gestellt</bestaetigung><fliesstext> - Zellen {zuschnitt} fuer {preis}.\nWer darauf steht, kauft mit /freistadt grundstueck kaufen.</fliesstext>"
    # {zuschnitt} - zu verschenken.
    angeboten-gratis: "<bestaetigung>Zu verschenken</bestaetigung><fliesstext> - Zellen {zuschnitt}, kostenlos.\nWer darauf steht, nimmt es mit /freistadt grundstueck kaufen.</fliesstext>"
    # {zuschnitt} - das Angebot ist zurueckgezogen.
    zurueckgezogen: "<hinweis>Angebot zurueckgezogen</hinweis><fliesstext> - die Zellen {zuschnitt} stehen nicht mehr zum Verkauf.</fliesstext>"
    # {zuschnitt} {preis} {verkaeufer} - was der KAEUFER liest.
    gekauft: "<bestaetigung>Gekauft!</bestaetigung><fliesstext> Die Zellen {zuschnitt} gehoeren jetzt dir - fuer {preis} von <betont>{verkaeufer}</betont>.</fliesstext>"
    # {zuschnitt} {verkaeufer} - geschenkt bekommen.
    gekauft-gratis: "<bestaetigung>Bekommen!</bestaetigung><fliesstext> Die Zellen {zuschnitt} gehoeren jetzt dir - geschenkt von <betont>{verkaeufer}</betont>.</fliesstext>"
    # {zuschnitt} {preis} {kaeufer} - was der VERKAEUFER liest, wenn er online ist.
    # Wer offline verkauft, sieht es in /mark verlauf: Darum tragen die drei
    # Buchungsgruende eigene Worte.
    verkauft: "<bestaetigung>Verkauft!</bestaetigung><fliesstext> <betont>{kaeufer}</betont> hat die Zellen {zuschnitt} fuer {preis} gekauft.</fliesstext>"
    # {zuschnitt} {kaeufer} - verschenkt.
    verkauft-gratis: "<bestaetigung>Uebergeben!</bestaetigung><fliesstext> <betont>{kaeufer}</betont> hat die Zellen {zuschnitt} von dir bekommen.</fliesstext>"
    # {gebuehr} {prozent} - die Marktgebuehr, NUR wenn sie ueber 0 liegt. Bei 5 Prozent
    # auf 19 Mark ist sie abgerundet 0, und dann faellt diese Zeile ganz weg.
    verkauft-gebuehr: "<fliesstext>  Abzueglich {gebuehr} Marktgebuehr ({prozent} Prozent).</fliesstext>"
    # Es steht nicht zum Verkauf. MIT dem Weg zur Liste.
    kein-angebot: "<warnung>Dieses Grundstueck steht nicht zum Verkauf.</warnung>\n<fliesstext>Welche zu haben sind, zeigt /freistadt angebote.</fliesstext>"
    # Am eigenen wird nicht gekauft - dieselbe Sperre wie am eigenen Kistenshop.
    eigenes: "<warnung>Das ist dein eigenes Grundstueck.</warnung>\n<fliesstext>Zurueckziehen kannst du das Angebot mit /freistadt grundstueck zurueckziehen.</fliesstext>"
    # {preis} {fehlt} - das Guthaben reicht nicht. BEIDE Zahlen: Ohne den Fehlbetrag
    # muesste der Spieler rechnen.
    zu-wenig-mark: "<warnung>Das Grundstueck kostet {preis} - dir fehlen {fehlt}.</warnung>"
    # Ein negativer Preis. Brigadier faengt das schon am Argument ab; dieser Satz ist
    # der zweite Riegel fuer jeden anderen Weg ins Buch.
    preis-ungueltig: "<warnung>Ein Preis unter null ist keiner.</warnung>\n<fliesstext>Eine 0 ist erlaubt und heisst: zu verschenken.</fliesstext>"
  # DIE ANGEBOTSLISTE - ueber ALLE Staedte der Welt. Ein eigener Zweig neben
  # grundstueck:, weil sie eine Auskunft fuer jeden ist, der etwas sucht: Dafuer soll
  # niemand das Recht brauchen, das dem Stadtbesitzer gehoert.
  angebot:
    kopf: "<kopf>Grundstuecke zu haben</kopf>"
    # {zuschnitt} {preis} {besitzer}
    zeile: "<fliesstext>  {zuschnitt} · <bestaetigung>{preis}</bestaetigung> · <betont>{besitzer}</betont></fliesstext>"
    # {zuschnitt} {besitzer} - ein Geschenk.
    zeile-gratis: "<fliesstext>  {zuschnitt} · <bestaetigung>kostenlos</bestaetigung> · <betont>{besitzer}</betont></fliesstext>"
    leer: "<fliesstext>  keines - frag in den Staedten nach, wer etwas abgibt</fliesstext>"
  # DIE BUERGERRECHTE [Teil D]. Was die STADTBUERGER im Gemeinschaftsgebiet duerfen -
  # also auf dem Teil des Feldes, den der Stadtbesitzer noch nicht vergeben hat. Auf
  # seinem EIGENEN Grundstueck darf ein Buerger immer alles; das regelt Teil C2.
  #
  # Stadtbuerger ist, wem in der Stadt ein Grundstueck gehoert - nicht der
  # Stadtbesitzer selbst und kein Mitbauer. Der Rang Buerger aus Schritt 12 ist etwas
  # ANDERES: Der kommt aus Spielzeit, dieser aus Grundbesitz. Darum heisst das hier
  # ueberall Stadtbuerger.
  rechte:
    # {stadt} - die Ueberschrift. Lesen darf das JEDER, der in der Stadt steht: Ein
    # Buerger muss wissen, was er darf, ohne den Besitzer zu fragen.
    kopf: "<kopf>Was die Stadtbuerger von {stadt} duerfen</kopf>"
    # {recht} - eine Zeile je Recht, und JEDES steht da, auch das gesperrte. Eine
    # Liste, die nur die erlaubten nennt, laesst den Besitzer raten, was es noch gibt.
    erlaubt: "<fliesstext>  {recht} · <bestaetigung>erlaubt</bestaetigung></fliesstext>"
    gesperrt: "<fliesstext>  {recht} · <warnung>gesperrt</warnung></fliesstext>"
    # Die Fusszeile, und sie steht fuer jeden da - auch fuer den Buerger. Wer das Recht
    # nicht hat, bekommt bei einer Aenderung die Absage, und das ist die ehrlichere
    # Auskunft als ein Hinweis, der je nach Leser verschwindet.
    hinweis: "<fliesstext>Aendern: /freistadt rechte an [recht] oder /freistadt rechte aus [recht]</fliesstext>"
    # {recht} - zwei Saetze, weil an und aus verschiedene Nachrichten sind: Der eine
    # gibt etwas her, der andere nimmt es zurueck.
    geaendert: "<bestaetigung>Stadtbuerger duerfen jetzt {recht}.</bestaetigung>"
    genommen: "<hinweis>Stadtbuerger duerfen nicht mehr {recht}.</hinweis>"
    # {recht} - es war schon so. Kein Fehler, nur eine Auskunft: Ein stilles Nichts
    # liesse den Besitzer glauben, der Befehl sei nicht angekommen.
    schon-so: "<fliesstext>Das war schon eingestellt: {recht}.</fliesstext>"
    # {stadt} {besitzer} - er steht in einer FREMDEN Stadt.
    nicht-deine: "<warnung>{stadt} gehoert {besitzer}.</warnung>\n<fliesstext>Die Buergerrechte stellt ein, wem die Stadt gehoert.</fliesstext>"
    # {wort} - ein Wort, das kein Recht ist. Die Vorschlagsliste nennt die moeglichen;
    # eine zweite Aufzaehlung HIER waere die Stelle, die beim vierten Recht vergessen
    # wird.
    unbekannt: "<warnung>{wort} ist kein Buergerrecht.</warnung>\n<fliesstext>Die Vorschlagsliste nennt, was moeglich ist.</fliesstext>"
    wort:
      # Die drei Rechte als WORT - sie gehen als Wert in die Saetze darueber. Ohne
      # Farbtag, weil der umgebende Satz die Farbe setzt.
      #
      # Was ein Recht WIRKLICH umfasst, steht in Tat im Quelltext und nicht hier: Diese
      # Zeilen sind die Worte, mit denen der Spieler es liest. Wer sie aendert, aendert
      # die Anzeige und nicht die Regel.
      bauen: "bauen"
      benutzen: "Tueren und Knoepfe benutzen"
      behaelter: "Truhen und Oefen oeffnen"
  # DIE STADTBUERGERLISTE [Teil D5]. Wer in dieser Stadt ein Grundstueck hat, ist
  # Stadtbuerger - und das ist eine ABLEITUNG und keine Mitgliedschaft: Es gibt keinen
  # Beitritt, keinen Austritt und keine Liste zu pflegen. Wer kauft, steht drin; wer
  # verkauft, nicht mehr.
  #
  # Der STADTBESITZER steht NICHT in dieser Liste, sondern in einer eigenen Zeile
  # darueber: Jedes frisch zugeschnittene Grundstueck gehoert zunaechst ihm, und zaehlte
  # er mit, haette jede Stadt nach dem ersten Schnitt fuer immer einen Buerger. Die
  # Verfallsregel aus Plan 16 koennte dann nie greifen.
  stadtbuerger:
    # {stadt} - die Ueberschrift. Lesen darf das jeder, der in der Stadt steht.
    kopf: "<kopf>Die Stadtbuerger von {stadt}</kopf>"
    # {besitzer} - wem die Stadt gehoert. Eine eigene Zeile und keine Buergerzeile:
    # Sein Recht kommt aus dem Besitz des Feldes und nicht aus einem Grundstueck.
    besitzer: "<fliesstext>  Stadtbesitzer: <betont>{besitzer}</betont></fliesstext>"
    # {name} {anzahl} - ein Buerger und die Zahl seiner Grundstuecke. GEZAEHLT, weil
    # sich das Wort aendert: ein Grundstueck, zwei Grundstuecke.
    zeile:
      eins: "<fliesstext>  <betont>{name}</betont> · {anzahl} Grundstueck</fliesstext>"
      viele: "<fliesstext>  <betont>{name}</betont> · {anzahl} Grundstuecke</fliesstext>"
    # Noch niemand hat hier gekauft. Diese Zeile MUSS es geben: Wer nur die
    # Ueberschrift und den Besitzer sieht, haelt es fuer einen Fehler - und ab Werk ist
    # das der Normalfall, denn eine frische Stadt hat keine Buerger.
    leer: "<fliesstext>  noch keine - verkauf oder verschenk ein Grundstueck mit /freistadt grundstueck anbieten</fliesstext>"
  # DIE STADTKASSE [Teil E]. Das Geld gehoert der STADT und nicht ihrem Besitzer - er
  #   kann es abheben, aber es liegt bis dahin auf einem eigenen Konto, mit eigenem
  #   Buchungsverlauf. Lesen darf den jeder, der in der Stadt steht: Was eine Stadt
  #   einnimmt, ist in einer Freistadt keine Privatsache.
  kasse:
    # {stadt} {stand} - die Ueberschrift mit dem Guthaben.
    kopf: "<kopf>Die Kasse von {stadt}</kopf><fliesstext> - <betont>{stand}</betont></fliesstext>"
    # Die VERLAUFSZEILEN darunter kommen aus mark.verlauf.zeile - dieselbe Zeile wie
    #   bei /mark verlauf. Wer sie aendert, aendert beide: Eine Buchung soll ueberall
    #   gleich aussehen.
    # Noch nie etwas eingenommen. Diese Zeile MUSS es geben: Ab Werk steht
    #   freistaedte.verkaufsgebuehr-prozent auf 0, eine Stadt nimmt also nichts ein -
    #   das ist der Normalfall und kein Fehler.
    leer: "<fliesstext>  noch nichts eingenommen - die Marktgebuehr steht ab Werk auf 0 Prozent</fliesstext>"
    # {betrag} {rest} - abgehoben. Was bleibt, steht dabei: Der Besitzer soll nicht
    #   nachfragen muessen, ob er die Kasse geleert hat.
    abgehoben: "<bestaetigung>{betrag} aus der Stadtkasse genommen.</bestaetigung><fliesstext> Es bleiben <betont>{rest}</betont>.</fliesstext>"
    # {stand} - zu wenig darin. Die Zahl kommt MIT, damit man ausrechnen kann, was fehlt.
    zu-wenig: "<warnung>So viel liegt nicht in der Kasse - darin sind <betont>{stand}</betont></warnung>"
    # {stadt} {besitzer} - eine fremde Kasse. Lesen darf jeder, nehmen nur der Besitzer.
    nicht-deine: "<warnung>Die Kasse von {stadt} gehoert <betont>{besitzer}</betont></warnung>"
  # DIE REGELN EINER STADT [Teil E]. Was Besucher dort beachten sollen, vom Besitzer
  #   gesetzt. Zusammen mit einem vergebenen Grundstueck ist das die Auflage fuer den
  #   Teleporter und das Ladenrecht - eine Stadt ohne Regeln und ohne Buerger ist eine
  #   Flaeche, die niemandem nuetzt.
  regeln:
    # {stadt} - die Ueberschrift.
    kopf: "<kopf>Die Regeln von {stadt}</kopf>"
    # {text} - der Text selbst, SPIELEREINGABE. Er steht in seiner eigenen Zeile und
    #   wird eingesetzt, nicht eingespleisst: Darum kommt ein <warnung> darin zeichengleich
    #   beim Leser an und WIRKT nicht. Wer das aendert, baut einem
    #   Stadtbesitzer eine Serverdurchsage.
    zeile: "<fliesstext>  {text}</fliesstext>"
    # {stadt} - noch keine Regeln. Diese Zeile MUSS es geben: Ab Werk hat jede Stadt
    #   keine, und sie nennt den Befehl, weil genau hier danach gesucht wird.
    leer: "<fliesstext>  {stadt} hat noch keine Regeln - der Besitzer setzt sie mit /freistadt regeln \\<text></fliesstext>"
    # VERSPRICHT KEINE BESUCHER [berichtigt 17.11.2026]. Hier stand "Besucher lesen
    #   sie mit /freistadt regeln" - zweifach zu viel versprochen: Der Befehl liest die
    #   Stadt, in der einer STEHT, und hereinkommen duerfen Fremde erst mit erfuellter
    #   Auflage. Ein Regeltext allein reicht dafuer nicht, es fehlt noch der Buerger.
    gesetzt: "<bestaetigung>Die Regeln stehen.</bestaetigung><fliesstext> Wer in deiner Stadt steht, liest sie mit /freistadt regeln.</fliesstext>"
    # Beide Haelften gelten nur mit beiden Schaltern - siehe den Hinweis bei
    #   freistadt.gegruendet.
    geloescht: "<bestaetigung>Die Regeln sind weg.</bestaetigung><fliesstext> Ohne Regeln hat diese Stadt weder Teleporter noch Ladenrecht.</fliesstext>"
    schon-so: "<fliesstext>Genau das stand schon da.</fliesstext>"
    war-leer: "<fliesstext>Diese Stadt hatte gar keine Regeln.</fliesstext>"
    # {groesstens} {hat} - zu lang. BEIDE Zahlen, damit man weiss, wie viel zu kuerzen ist.
    zu-lang: "<warnung>Die Regeln duerfen hoechstens {groesstens} Zeichen haben - dein Text hat <betont>{hat}</betont></warnung>"
    # {stadt} {besitzer} - eine fremde Stadt. Lesen darf jeder, setzen nur der Besitzer.
    nicht-deine: "<warnung>Die Regeln von {stadt} setzt <betont>{besitzer}</betont></warnung>"

  # DAS ENDE EINER STADT [Plan 16, Teil E6]. Zwei Wege: Der Besitzer gibt sie auf
  #   (/freistadt aufgeben), oder das Team raeumt sie (/freistadt raeumen <name>). In
  #   beiden Faellen bekommt der BESITZER seinen Anteil am eingesetzten Preis plus das
  #   Guthaben der Stadtkasse - auch wenn er gerade nicht da ist.
  # BEIDE RUECKFRAGEN NENNEN ALLE DREI ZAHLEN und nicht nur die Summe: Ein Besitzer soll
  #   nachrechnen koennen, woher sie kommt. Mit einer einzigen Zahl haelt er die
  #   Stadtkasse fuer vergessen.
  # {danach} IST DER BEFEHL zum Bestaetigen - eine Rueckfrage ohne ihn ist eine
  #   Sackgasse. Lass ihn in der Zeile stehen.
  aufgabe:
    frage: "<kopf>{stadt} aufgeben?</kopf>\n<fliesstext>Zurueck: {erstattung} vom Gruendungspreis und {kasse} aus der Stadtkasse, zusammen <betont>{zusammen}</betont>.</fliesstext>\n<fliesstext>Dann: {danach}</fliesstext>"
    raeumung-frage: "<kopf>{stadt} raeumen?</kopf>\n<fliesstext>Ihr Besitzer bekommt {erstattung} vom Gruendungspreis und {kasse} aus der Stadtkasse, zusammen <betont>{zusammen}</betont>.</fliesstext>\n<fliesstext>Dann: {danach}</fliesstext>"
    # {name} - den getippten Namen gibt es nicht. Ein eigener Satz und nicht
    #   grundstueck.keine-stadt: Jener gilt fuer einen STANDORT, das Team tippt
    #   einen Namen.
    name-unbekannt: "<warnung>Eine Freistadt {name} gibt es nicht.</warnung><fliesstext> Die Namen zeigt /freistadt.</fliesstext>"
    beendet: "<bestaetigung>{stadt} ist aufgeloest.</bestaetigung><fliesstext> Ausgezahlt: {zusammen}. Das Feld ist wieder frei.</fliesstext>"
    # DER SATZ, OHNE DEN DIESER BEFEHL EIN DIEBSTAHL WAERE: Ein Stadtbuerger hat sein
    #   Grundstueck BEZAHLT. Nennt darum den Ausweg - zurueckkaufen kann der Besitzer.
    noch-buerger: "<warnung>In {stadt} gehoert noch jemand anderem ein Grundstueck.</warnung>\n<fliesstext>Kauf es zurueck, dann laesst sich die Stadt aufloesen - sie verfaellt ohnehin nicht, solange dort jemand wohnt.</fliesstext>"
    # Die Stadt ist weg, das Geld haengt. SAGT AUSDRUECKLICH, WAS ZU TUN IST: Hier ist
    #   etwas Unumkehrbares geschehen, und der Betrag steht im Serverprotokoll.
    geld-haengt: "<warnung>{stadt} ist aufgeloest, aber die Auszahlung von {zusammen} ging nicht durch.</warnung>\n<fliesstext>Sag es dem Betreiber - der Betrag steht im Serverprotokoll.</fliesstext>"

  # DER VERFALL [Plan 16, Teil E5]. Eine Stadt, die zwoelf Monate unbesucht ist UND
  #   keinen Stadtbuerger hat, geht in den Zustand verfallen: Dort baut niemand mehr,
  #   auch ihr Besitzer nicht. Feld, Name und Guthaben behaelt sie - und ihr Besitzer
  #   weckt sie, indem er sie BETRITT.
  # ZWEI WARNUNGEN SIND ZWEI STUFEN und nicht zwei verschickte Nachrichten: Welche ein
  #   Besitzer beim Anmelden liest, entscheidet allein der Abstand zum Verfall. Wer
  #   nichts tut, liest sie beim naechsten Mal wieder - ein Zaehler "schon gewarnt"
  #   stuende falsch, sobald eine Nachricht verloren geht.
  # {tage} UND KEIN DATUM: Ein Datum muesste in der Zone des Servers gelesen werden,
  #   und der Spieler sitzt vielleicht in einer anderen. "Noch 42 Tage" ist ueberall
  #   dasselbe. Beide Warnungen sind GEZAEHLTE Saetze - die Einzahlform steht fuer den
  #   letzten Tag.
  verfall:
    warnung-frueh:
      eins: "<fliesstext>Deine Freistadt {stadt} verfaellt morgen, wenn niemand sie betritt.</fliesstext>"
      viele: "<fliesstext>Deine Freistadt {stadt} verfaellt in {tage} Tagen, wenn niemand sie betritt.</fliesstext>"
    # DRINGENDER IM TON, und das ist der ganze Sinn von zwei Stufen: Wer zwei Wochen
    #   vorher denselben Satz liest wie zwei Monate vorher, liest ihn nicht mehr.
    #   Nennt darum auch, was zu tun ist.
    warnung-spaet:
      eins: "<warnung>Deine Freistadt {stadt} verfaellt MORGEN!</warnung>\n<fliesstext>Geh hin, oder vergib ein Grundstueck - ein Stadtbuerger haelt sie dauerhaft.</fliesstext>"
      viele: "<warnung>Deine Freistadt {stadt} verfaellt in {tage} Tagen!</warnung>\n<fliesstext>Geh hin, oder vergib ein Grundstueck - ein Stadtbuerger haelt sie dauerhaft.</fliesstext>"
    # DER DRITTE ZUSTAND HAT SEINEN EIGENEN SATZ [23.11.2026]: Die Frist ist abgelaufen,
    #   der taegliche Lauf hat die Stadt aber noch nicht abgeraeumt - wer sich in diesem
    #   Fenster anmeldet, liest DIESE Zeile. UNGEZAEHLT, weil es hier keine Zahl gibt:
    #   vorher lief der Fall in warnung-spaet mit 0 Resttagen, also in die Mehrzahlform,
    #   und der Besitzer las "verfaellt in 0 Tagen!".
    faellig: "<warnung>Deine Freistadt {stadt} verfaellt JETZT!</warnung>\n<fliesstext>Geh sofort hin, oder vergib ein Grundstueck - ein Stadtbuerger haelt sie dauerhaft.</fliesstext>"
    # SAGT AUSDRUECKLICH, DASS NICHTS VERLOREN IST: Ohne diese Haelfte hielte ein
    #   Besitzer seine 400.000 Mark fuer verbrannt und suchte den Betreiber.
    verfallen: "<warnung>Deine Freistadt {stadt} ist verfallen.</warnung>\n<fliesstext>Feld, Name und Guthaben hat sie noch - betritt sie, dann wacht sie wieder auf.</fliesstext>"
    aufgewacht: "<bestaetigung>{stadt} ist wieder aktiv.</bestaetigung><fliesstext> Hier baut wieder, wer darf.</fliesstext>"

  # DIE DREI WORTE FUER {was} - was einer Stadt zur AUFLAGE fehlt [Plan 16].
  #   Sie gehen als Wert in ZWEI fremde Saetze: warp.stadt-ohne-auflage, wenn ein
  #   Fremder nicht in die Stadt reisen kann, und shop.absage.kein-ladenrecht, wenn in
  #   ihr kein neuer Kistenshop entstehen darf. Darum stehen sie hier bei der Auflage
  #   und nicht bei einem der beiden Befehle.
  # KEIN FARBTAG: Sie sind Werte und werden als Blatt in den fertigen Satz gesetzt -
  #   ihre Farbe ist die der Zeile, in der sie landen.
  # Wenn du sie aenderst, lies beide Saetze: Sie beginnen mit "Es fehlt: ".
  auflage:
    ohne-regeln: "ein Regeltext"
    ohne-buerger: "ein vergebenes Grundstueck"
    ohne-beides: "ein Regeltext und ein vergebenes Grundstueck"

laden:
  # Die Ueberschrift ueber der Liste - die EINZIGE Zeile dieses Befehls in kopf.
  kopf: "<kopf>Die Markthalle</kopf>"
  # {name} {ort} - eine Zeile je Ladeneinheit. {ort} ist die Stelle der Ladentruhe als
  #   x/y/z, damit ein Spieler hingehen kann, bevor er mietet.
  zeile: "<fliesstext>  {name}</fliesstext><gedaempft> - Truhe bei {ort}</gedaempft>"
  # Es gibt noch keine Einheiten. Diese Zeile MUSS es geben: Wer nur die Ueberschrift
  #   sieht, haelt es fuer einen Fehler. Ab Werk ist das der Normalfall - die
  #   Markthalle ist von Hand zu bauen (Plan 2.1).
  leer: "<fliesstext>  Es gibt noch keine Ladeneinheiten - die Markthalle wird noch gebaut.</fliesstext>"

  # Die LETZTE Zeile von /laden: der eigene Laden. Zwei Faelle, zwei Saetze -
  #   welcher zutrifft, weiss das Programm.
  stand:
    # {laden} {bis} {resttage} {miete} - der eigene Laden. Die Miete ist die VEREINBARTE
    #   und nicht die aus der config.yml: Wer fuer 500 gemietet hat, liest 500.
    # NOCH: {resttage} zaehlt die RESTLAUFZEIT und nicht die Vertragslaenge - am
    #   Abschlusstag steht hier eine andere Zahl als in laden.gemietet.kopf, und das
    #   ist richtig. Ohne das Wort "noch" sah es am 09.11.2026 wie ein Fehler aus.
    eigener: "<fliesstext>Dein Laden: {laden}, bis {bis} (noch {resttage} Tage), {miete} je Tag.</fliesstext>"
    # Diese Zeile MUSS es geben: Wer die Liste sieht und keinen Laden hat, soll
    #   erfahren, wie man mietet. Ohne sie waere /laden mieten nur in der Hilfe
    #   zu finden.
    keiner: "<fliesstext>Du hast noch keinen Laden - mit /laden mieten und dem Namen eines Standes nimmst du einen.</fliesstext>"

  # Drei Zeilen fuer einen Abschluss, und jede bindet etwas anderes: den Ort, das Geld
  #   jetzt, das Geld taeglich. Die dritte nennt den Befehl zum Verlaengern.
  gemietet:
    # {laden} {bis} {miettage} - was gemietet wurde und bis wann der Vertrag laeuft.
    # MIETTAGE ist die LAENGE des Vertrags, beide Tage eingeschlossen - nicht die
    #   Restlaufzeit. Die steht in laden.stand.eigener und ist am Abschlusstag um
    #   eins kleiner.
    kopf: "<bestaetigung>Du hast {laden} gemietet.</bestaetigung><fliesstext> Der Vertrag laeuft {miettage} Tage, bis zum {bis}.</fliesstext>"
    # {betrag} - abgebucht, ohne Lizenz: Der Spieler hatte sie schon.
    # KEIN {lizenz}: Sie ist nicht geflossen, und eine 0 in der Zeile liesse ihn
    #   glauben, er haette sie geschenkt bekommen.
    kosten: "<fliesstext>Abgebucht: {betrag} Kaution.</fliesstext>"
    # {betrag} {lizenz} - abgebucht, MIT der einmaligen Lizenz darin. Beide Zahlen:
    #   Wer 55.000 abgebucht sieht und 5.000 Kaution erwartet hat, soll in derselben
    #   Zeile lesen, warum.
    erstmals: "<fliesstext>Abgebucht: {betrag} - darin die einmalige Ladenlizenz ueber {lizenz}.</fliesstext>"
    # {miete} - was taeglich faellig wird, und wie man verlaengert.
    taeglich: "<fliesstext>Taeglich faellig: {miete}. Verlaengern mit /laden verlaengern.</fliesstext>"

  # {laden} {bis} {resttage} - verlaengert. Kostet nichts: Gezahlt wird taeglich.
  # NOCH: Hier stand die RESTLAUFZEIT und das Wort "das sind" - wer frueh
  #   verlaengert, las "das sind 13 Tage" nach einer Verlaengerung um 7. Die Zahl
  #   war richtig, das Wort falsch.
  verlaengert: "<bestaetigung>{laden} ist verlaengert - bis {bis}, noch {resttage} Tage.</bestaetigung>"

  gekuendigt:
    # {laden} - gekuendigt.
    kopf: "<hinweis>Du hast {laden} gekuendigt.</hinweis>"
    # {betrag} - die Kaution zurueck. Eine eigene Zeile, weil es sein kann, dass
    #   keine hinterlegt war (laeden.kaution auf 0) - dann waere "0 Mark zurueck"
    #   eine Zeile, die nach einem Fehler aussieht.
    kaution: "<bestaetigung>Kaution zurueck: +{betrag}</bestaetigung>"

  # Der taegliche Lauf (Plan 7.1, Teil C): Die Miete wird jeden Tag abgebucht, auch
  #   wenn der Mieter nicht da ist - sonst waere Wegbleiben der Weg, einen Stand
  #   kostenlos zu halten. Diese Zeilen liest er, wenn er gerade online ist; sonst beim
  #   naechsten Beitritt die Zeile verzug.
  #
  # Es gibt KEINE Zeile fuer die gelungene Abbuchung, und das ist Absicht: Eine
  #   taegliche Meldung "500 Mark Ladenmiete abgebucht" liest beim dritten Mal niemand
  #   mehr - und dann liest er auch die Warnung nicht. Was gebucht wurde, steht in
  #   /mark verlauf.
  #
  # Alle fuenf Saetze sind EINZEILIG: Sie gehen ueber eineZeile hinaus, und die wirft
  #   bei einem Umbruch. Zwei Gedanken trennt der Farbwechsel, wie bei gemietet.kopf.
  miete:
    # {laden} {betrag} {ausfall} {schranke} - das Geld fehlte. BEIDE Zahlen: "Ausfall 2
    #   von 3" sagt, wie viel Luft noch ist; "zweiter Ausfall" allein kann der zweite
    #   von zwanzig sein. Als Ordnungszahl und nicht als "noch 1 Tage" - eine Mehrzahl
    #   laesst sich hier nicht beugen.
    gewarnt: "<hinweis>Die Miete fuer {laden} ({betrag}) konnte nicht abgebucht werden.</hinweis><fliesstext> Das war Ausfall {ausfall} von {schranke} - beim letzten wird geraeumt, und die Kaution verfaellt.</fliesstext>"
    # {laden} {ausfall} {schranke} {kaution} - der Laden ist weg. Die Kaution STEHT in
    #   der Zeile: Sie soll das Weglaufen teurer machen als das Kuendigen, und das
    #   wirkt nur, wenn der Spieler die Zahl sieht.
    geraeumt: "<warnung>{laden} ist geraeumt - Ausfall {ausfall} von {schranke}.</warnung><fliesstext> Die Kaution ueber {kaution} ist verfallen.</fliesstext>"
    # {laden} {bis} - die Mietdauer war um, ohne dass verlaengert wurde. Kein Vorwurf:
    #   Er hat jeden Tag gezahlt, und darum kommt die Kaution zurueck - die Zeile
    #   darunter ist gekuendigt.kaution, dieselbe Gutschrift mit demselben Satz.
    abgelaufen: "<hinweis>Dein Vertrag ueber {laden} ist abgelaufen - er lief bis {bis}.</hinweis><fliesstext> Mit /laden mieten nimmst du wieder einen Stand.</fliesstext>"
    # {stapel} - was aus der Ladentruhe wurde. Steht unter jeder Raeumung und jedem
    #   Ablauf, bei dem etwas in der Truhe lag. Nach dem Doppelpunkt und ohne Verb,
    #   damit die Zeile auch bei einem einzigen Stapel richtig steht.
    ins-fach: "<fliesstext>Die Ladentruhe ist ins Abholfach gewandert: {stapel} Stapel. Hol sie mit /laden abholfach.</fliesstext>"
    # {laden} {betrag} {ausfall} {schranke} - beim Beitritt, wenn Ausfaelle offen sind.
    #   Die einzige Stelle, an der ein Spieler von einem Ausfall erfaehrt, den er
    #   verschlafen hat: Der Lauf laeuft, waehrend er offline ist.
    verzug: "<hinweis>Dein Laden {laden} ist in Verzug - Ausfall {ausfall} von {schranke}.</hinweis><fliesstext> Sorge fuer {betrag} auf dem Konto, sonst wird geraeumt.</fliesstext>"

  # Das Abholfach (Plan 7.1, Teil C): Was in der Truhe eines geraeumten Ladens lag,
  #   wird NIE geloescht. Es wartet hier, beliebig lange, ohne Verfall und ohne
  #   Obergrenze.
  #
  # Geholt wird mit einem BEFEHL und nicht in einem Fenster, und das ist kein
  #   Schoenheitsfehler: Ein offenes Fenster ist ein Zustand zwischen Spieler und
  #   Datenbank, und wer es im falschen Augenblick schliesst, haette die Ware zweimal.
  abholfach:
    # {stapel} - was wartet. Beim Beitritt und unter /laden. Ein LEERES Fach sagt hier
    #   nichts: Der haeufigste Fall ist, dass noch nie etwas drin lag.
    stand: "<fliesstext>Abholfach: {stapel} Stapel. /laden abholfach holt sie.</fliesstext>"
    # Nur wer ausdruecklich fragt, bekommt diese Antwort.
    leer: "<fliesstext>Dein Abholfach ist leer.</fliesstext>"
    # {stapel} - geholt.
    geholt: "<bestaetigung>{stapel} Stapel aus dem Abholfach geholt.</bestaetigung>"
    # {stapel} - es ist etwas uebrig, weil das Inventar vollgelaufen ist. Eine eigene
    #   Zeile: Der haeufigste Fall ist, dass alles passt, und dann waere "noch 0
    #   Stapel" eine Zeile, die nach einem Fehler aussieht.
    bleibt: "<fliesstext>Noch im Fach: {stapel} Stapel - dein Inventar hat keinen Platz mehr.</fliesstext>"
    # {stapel} - gar kein Platz, es ist nichts herausgegangen.
    kein-platz: "<warnung>Dein Inventar ist voll. Im Abholfach: {stapel} Stapel.</warnung>"
    # {stapel} - ein Stapel liess sich nicht in einen Gegenstand zurueckverwandeln,
    #   etwa nach einem Minecraft-Update. Er LIEGT NOCH DA und ist nicht verloren; was
    #   es war, steht mit Beschriftung im Serverprotokoll.
    unlesbar: "<warnung>Nicht herausgegeben: {stapel} Stapel. Das bleibt liegen - bitte sag es dem Team.</warnung>"

  absage:
    # {laden} - diesen Namen gibt es in laeden.einheiten nicht.
    keine-einheit: "<warnung>Einen Stand namens {laden} gibt es nicht.</warnung>\n<fliesstext>/laden zeigt, welche es gibt.</fliesstext>"
    # {laden} - der Stand gehoert jemand anderem.
    schon-vermietet: "<warnung>{laden} ist schon vermietet.</warnung>"
    # {laden} ist SEIN Laden und nicht der gewuenschte - sonst sucht er, welchen er hat.
    #   Plan 7.1: ein Laden je Spieler, damit nicht drei Leute die Halle besitzen.
    schon-ein-laden: "<warnung>Du hast schon einen Laden: {laden}.</warnung>\n<fliesstext>Mit /laden kuendigen gibst du ihn zurueck.</fliesstext>"
    # {kosten} {guthaben} {fehlt} - das Guthaben reicht nicht. Die dritte Zahl rechnet
    #   das Programm: Ein Spieler soll nicht subtrahieren muessen, um zu wissen, wie
    #   viel er noch verdienen muss.
    zu-wenig-geld: "<warnung>Der Abschluss kostet {kosten}, du hast {guthaben} - es fehlen {fehlt}.</warnung>"
    # {laden} {resttage} {dauer} - noch zu frueh. BEIDE Zahlen: "noch 40 Tage" allein sagt
    #   nicht, dass bei 7 Tagen Mietdauer erst ab dem zweiten Tag verlaengert werden
    #   kann.
    noch-zu-frueh: "<hinweis>{laden} laeuft noch {resttage} Tage - verlaengern geht, sobald weniger als {dauer} Tage uebrig sind.</hinweis>"
    kein-laden: "<warnung>Du hast keinen Laden.</warnung>\n<fliesstext>/laden zeigt, welche Staende frei sind.</fliesstext>"
    # Die Markthalle ist ein ORT. Nur das Mieten haengt daran; verlaengern und
    #   kuendigen gehen von ueberall, sie beruehren nur den eigenen Vertrag.
    falsche-welt: "<warnung>Die Markthalle steht in Altfurt - dort wird gemietet.</warnung>"
    # Die Datenbank hat geschwiegen. Was geschah, steht im Serverprotokoll.
    gestoert: "<warnung>Das hat gerade nicht geklappt - versuch es noch einmal.</warnung>"

  # Muster fuer DateTimeFormatter, kein Satz - der Tag in den Mietzeilen. Wird beim
  # LADEN uebersetzt, ein unbrauchbares Muster ist also eine Klage und kein Absturz
  # mitten in einem Abschluss, der gerade Geld gekostet hat. Ein EIGENES Muster neben
  # spielzeit.tag-muster: Jenes ist der Tag einer Zeile ueber die heutige Spielzeit,
  # dies ein Vertragsende - eine Aenderung am einen soll das andere nicht mitdrehen.
  tag-muster: "dd.MM.yyyy"

# Der Tagesbonus (Plan 8.2, Teil G/H): Das taegliche Einloggen bringt den
# Grundbetrag, das regelmaessige Spielen die SERIE - jeder Tag in Folge gibt mehr.
# Die Zahlen stehen im Abschnitt tagesbonus der config.yml.
#
# Drei Nachrichten fuer eine Zahlung, und sie unterscheiden sich NICHT im Betrag,
#   sondern in dem, was sie ueber die Serie sagen. Welche zutrifft, entscheidet das
#   Programm; die Worte gehoeren dir.
tagesbonus:
  gezahlt:
    # {betrag} {morgen} - der erste Tag einer Serie: entweder der allererste Bonus
    #   oder ein Neuanfang nach einer gerissenen Serie.
    # KEIN {serie}, denn sie ist 1 - "Tag 1 deiner Serie" liest sich wie eine
    #   Zaehlung, die nichts bedeutet. {morgen} ist der Betrag des ZWEITEN Tages und
    #   damit der Grund, morgen wiederzukommen.
    erster: "<bestaetigung>Tagesbonus: +{betrag}</bestaetigung><fliesstext> - komm morgen wieder, dann sind es {morgen}.</fliesstext>"
    # {betrag} {serie} - ein fortgesetzter Serientag. {serie} ist immer mindestens 2;
    #   den ersten Tag traegt erster darueber.
    serie: "<bestaetigung>Tagesbonus: +{betrag}</bestaetigung><fliesstext> - {serie} Tage in Folge.</fliesstext>"
    # {betrag} {serie} - derselbe Tag, aber es ist seine LAENGSTE Serie. Ein eigener
    #   Satz, damit der Spieler seinen Rekord liest und ihn nicht aus zwei gleichen
    #   Zahlen schliessen muss.
    bestmarke: "<bestaetigung>Tagesbonus: +{betrag}</bestaetigung><hinweis> - {serie} Tage in Folge, so lange wie noch nie!</hinweis>"
  # Die Zeile unter /mark. Drei Faelle, drei Saetze - welcher zutrifft, weiss das
  #   Programm.
  stand:
    # {serie} {laengste} {morgen} - heute schon bekommen. Die laufende Serie sagt, was
    #   morgen auf dem Spiel steht; die laengste, was zu schlagen waere.
    serie: "<fliesstext>Tagesbonus: {serie} Tage in Folge (am laengsten {laengste}), morgen {morgen}.</fliesstext>"
    # {betrag} {serie} - heute noch offen. Ohne eingestellte Mindestzeit faellt der
    #   Bonus beim Einloggen, also sieht ein Spieler diese Zeile kaum; wenn die Kasse
    #   ihn nicht annehmen konnte, ist sie seine einzige Auskunft.
    offen: "<fliesstext>Tagesbonus: heute noch offen - Tag {serie} bringt {betrag}.</fliesstext>"
    # {minuten} {betrag} {serie} - nur erreichbar, wenn tagesbonus.mindest-minuten
    #   gesetzt ist. Gezaehlt werden TAETIGE Minuten (siehe messstelle), nicht
    #   Anwesenheit. Ohne diese Zeile liest ein Spieler nichts von einem Bonus und
    #   haelt ihn fuer abgeschafft.
    wartet: "<fliesstext>Tagesbonus: noch {minuten} taetige Minuten, dann bringt Tag {serie} {betrag}.</fliesstext>"
# DIE KISTENSHOPS (Plan 7.4). Ein Shop ist eine Kiste mit einem Schild daran: erste
# Zeile der Besitzer, zweite die Menge je Handel, dritte die Preise in der Form
# "B 100 : S 80", vierte die Ware oder ein Fragezeichen. B ist, was ein Kunde ZAHLT,
# S, was er BEKOMMT - diese zwei Buchstaben stehen im Programm und sind hier nicht zu
# aendern, weil jedes Wiki seit zehn Jahren sie nennt.
#
# ACHT ABSAGEN FUER DAS SCHILD, nicht eine. Das ist die teuerste Entscheidung dieses
#   Abschnitts und die wichtigste: Jede nennt, WAS falsch ist, und die naechste Haelfte
#   des Satzes sagt, wie es richtig geht. Ein Spieler, der am Schild steht und bloss
#   "das geht nicht" liest, bricht nach dem zweiten Versuch ab. Die Vorbilder haben hier
#   genau einen Satz und dafuer ein Forum voller Fragen.
# {zeile} IST EINE ZAHL AUS DEM PROGRAMM, nicht aus diesem Wort. Welche Schildzeile
#   falsch ist, weiss nur der Leser des Schildes. Schreib also nicht "Zeile 2" in den
#   Satz - setz {zeile} ein, dann stimmt die Zahl auch, wenn das Schildformat sich
#   einmal aendert.
# {hoechstmenge} und {hoechstpreis} KOMMEN EBENFALLS AUS DEM PROGRAMM. Dieselbe Regel:
#   Tipp die Zahl nicht ab.
# DIE VIER ZEILEN UNTER schutz: SIND HANDBALKEN ueber dem Gegenstandsgurt, wie bei
#   wache.schutz. Genau EINE Zeile, keine Umbruchmarke - eine zweite verschwaende sich
#   stumm, und darum ist sie beim Laden eine Klage mit Zeilennummer.
shop:
  # {menge} {ware} - der Shop steht. {ware} ist derselbe Kurzname, der auf der vierten
  #   Schildzeile landet: Der Spieler soll die Meldung mit dem Schild vor sich
  #   vergleichen koennen.
  # EIN PLUS VOR DEM NAMEN heisst: die Ware ist mehr als ihr Material - verzaubert,
  #   benannt, beschaedigt oder mit Inhalt. Fuenfzehn Zeichen tragen nicht mehr, und
  #   ganz zu schliessen ist diese Luecke auf einer Schildzeile nicht; ein Kunde soll
  #   aber SEHEN, dass hier nicht die gewoehnliche Ware liegt.
  angelegt: "<bestaetigung>Shop angelegt: {menge}x {ware}</bestaetigung>"
  # Die ZUSATZZEILE fuer einen Bundshop - sie kommt HINTER die anderen und ersetzt
  #   keine. Ein Bundshop ist ein gewoehnlicher Shop mit einer Eigenschaft mehr.
  angelegt-bund: "<kopf>Bundshop: unbegrenzter Vorrat, unbegrenzter Platz, unbegrenztes Geld.</kopf>"
  # {preis} - was ein Kunde zahlt. Kommt nur, wenn es einen Kaufpreis gibt.
  preis-kauf: "<fliesstext>Kunden kaufen fuer <betont>{preis}</betont>.</fliesstext>"
  # {preis} - was ein Kunde bekommt. Kommt nur, wenn es einen Verkaufspreis gibt.
  # ZWEI ZEILEN UND NICHT EINE MIT BEIDEN ZAHLEN: Ein Shop kann nur kaufen, nur
  #   verkaufen oder beides. Eine gemeinsame Zeile muesste im Nurverkaufsfall eine Null
  #   nennen, und eine Null als Preis weist das Programm ausdruecklich ab.
  preis-verkauf: "<fliesstext>Kunden verkaufen fuer <betont>{preis}</betont>.</fliesstext>"
  # {ware} - das Schild ist weg, der Shop damit auch. SAGT AUSDRUECKLICH, DASS DIE WARE
  #   IN DER KISTE BLEIBT: Ein abgebauter Shop ist kein Verlust, aber das weiss nur, wer
  #   es gesagt bekommt. Wer es nicht liest, baut sein Schild nie wieder ab.
  abgebaut: "<hinweis>Shop abgebaut: {ware}</hinweis><fliesstext> - die Ware bleibt in der Kiste.</fliesstext>"
  # Sein Laden ist weg, weil die TAGESGEBUEHR nicht zu zahlen war [Teil E6].
  #   {stadt} {gebuehr}. Kein absage-Satz, obwohl es eine ist: Eine Absage liest er,
  #   waehrend er ein Schild beschreibt - diese Zeile kommt aus dem taeglichen Lauf,
  #   ohne dass er etwas getan hat.
  # SAGT AUSDRUECKLICH, DASS DIE WARE NOCH DA IST. Ohne das sucht er sein Lager -
  #   und findet es, denn beim Abbau bleibt die Ware immer in der Kiste.
  ladengebuehr-weg: "<warnung>Dein Laden in {stadt} ist abgebaut.</warnung>\n<fliesstext>Die Tagesgebuehr von {gebuehr} war nicht zu zahlen. Deine Ware liegt noch in der Kiste - setz ein neues Schild, wenn du wieder zahlen kannst.</fliesstext>"
  # DIE ABSAGEN. Jede zweite Haelfte ist die Hilfe - lass sie stehen, auch wenn du die
  #   erste umschreibst.
  absage:
    # {zeile} - in der Mengenzeile steht keine Zahl.
    menge-keine-zahl: "<warnung>Zeile {zeile} ist keine Zahl.</warnung><fliesstext>\nDort gehoert die Menge hin, die ein Kunde je Klick bekommt - zum Beispiel 16.</fliesstext>"
    # {zeile} {hoechstmenge} - eine Zahl, aber keine moegliche. Die Obergrenze ist ein
    #   voller Kisteninhalt: mehr liesse sich nicht ausgeben.
    menge-ausserhalb: "<warnung>Zeile {zeile}: die Menge geht von 1 bis {hoechstmenge}.</warnung><fliesstext>\nMehr als eine volle Kiste kann ein Handel nicht hergeben.</fliesstext>"
    # {zeile} - die Preiszeile hat nicht die eine Form. DER SATZ, DER AM MEISTEN
    #   ERKLAEREN MUSS: Die Form ist nicht zu erraten. Lass das Beispiel darin stehen.
    preis-form: "<warnung>Zeile {zeile} ist keine Preiszeile.</warnung><fliesstext>\nSo geht es: <betont>B 100</betont> (Kunden kaufen), <betont>S 80</betont> (Kunden verkaufen) oder <betont>B 100 : S 80</betont> (beides).</fliesstext>"
    # {zeile} - die Form stimmt, aber hinter dem Buchstaben steht keine ganze Zahl.
    # NENNT, WAS NICHT GEHT: Punkt, Komma und ein angehaengtes Wort sind die drei
    #   Versuche, die jeder macht. Das Programm nimmt NUR Ziffern - genau darum, weil
    #   die Vorbilder mehr angenommen haben und daran zwei Geldfehler hatten.
    preis-keine-zahl: "<warnung>Zeile {zeile}: der Preis ist keine ganze Zahl.</warnung><fliesstext>\nNur Ziffern - kein Punkt, kein Komma, kein k und kein Mio.</fliesstext>"
    # {zeile} {hoechstpreis} - der Preis liegt ausserhalb.
    preis-ausserhalb: "<warnung>Zeile {zeile}: der Preis geht von 0 bis {hoechstpreis}.</warnung><fliesstext>\nEine 0 bedeutet: diese Richtung gibt es nicht.</fliesstext>"
    # {zeile} - beide Preise sind null. EINE EIGENE ABSAGE und nicht die darueber: Null
    #   ist fuer EINE der beiden Richtungen erlaubt, nur beide zusammen sind der Fehler.
    preis-beide-null: "<warnung>Zeile {zeile}: beide Preise sind 0.</warnung><fliesstext>\nEiner von beiden genuegt - aber einer muss es sein, sonst ist es ein Geschenk und kein Shop.</fliesstext>"
    # {zeile} - der Ankaufspreis liegt ueber dem Verkaufspreis. DIE ABSAGE, DIE AM
    #   MEISTEN GELD RETTET, und sie muss WARUM sagen: Ein Spieler, der nur "nicht
    #   erlaubt" liest, haelt es fuer Willkuer. Wer fuer 100 verkauft und fuer 120
    #   ankauft, schenkt jedem Kunden bei jedem Durchlauf 20 Mark - aus seinem eigenen
    #   Guthaben, bis es leer ist.
    preis-verdreht: "<warnung>Zeile {zeile}: du kaufst teurer an, als du verkaufst.</warnung><fliesstext>\nDas ist eine Maschine, die dein Guthaben an jeden Kunden ausschuettet. S darf nicht ueber B liegen.</fliesstext>"
    # {zeile} - die vierte Zeile ist leer.
    ware-fehlt: "<warnung>Zeile {zeile} ist leer.</warnung><fliesstext>\nDort gehoert die Ware hin - ihr Name, oder ein <betont>?</betont> fuer das, was in der Kiste liegt.</fliesstext>"
    # Neben dem Schild steht keine Kiste, in der ein Shop sein darf. NENNT DIE DREI:
    #   Ein Ofen, ein Spender und eine Shulkerkiste sehen aus wie Behaelter und sind
    #   ausgeschlossen, jedes aus einem eigenen Grund. Ohne diese Zeile sucht der
    #   Spieler den Fehler bei seinem Schild.
    keine-kiste: "<warnung>Neben dem Schild steht keine Kiste.</warnung><fliesstext>\nEs geht eine Kiste, eine Redstonetruhe oder ein Fass - direkt daneben, darueber oder darunter, nicht diagonal.</fliesstext>"
    # An der Kiste darf dieser Spieler nicht. DER FALL, DEN KEIN VORBILD SELBST
    #   SCHLIESST: Das Schild haengt auf eigenem Grund, die Kiste steht einen Block
    #   weiter auf fremdem. Ohne diese Pruefung verkaufte der Shop die Ware eines
    #   anderen.
    fremde-kiste: "<warnung>An dieser Kiste darfst du nicht.</warnung><fliesstext>\nSie steht auf fremdem Grund - ein Shop braucht eine Kiste, an die du selbst herankommst.</fliesstext>"
    # An der Kiste haengt schon der Shop eines ANDEREN. DIE ANDERE HAELFTE DES
    #   KISTENSCHUTZES: Wer die Kiste nicht oeffnen kann, haengt sonst ein eigenes
    #   Schild daneben und verkauft die fremde Ware auf sein Konto. Die Zeile
    #   darueber passt hier NICHT - draussen vor der Stadt gehoert kein Ort jemandem,
    #   und wer "fremder Grund" liest, sucht eine Parzelle, die es nicht gibt.
    # NENNT KEINEN NAMEN: Wer das liest, steht vor dem anderen Schild und liest ihn
    #   dort.
    fremder-shop: "<warnung>An dieser Kiste haengt schon ein fremder Shop.</warnung><fliesstext>\nZwei Schilder an einer Kiste handeln mit derselben Ware - nimm eine eigene Kiste.</fliesstext>"
    # An diesem Schild haengt schon ein Shop. KOMMT AUCH DEM BESITZER: Preise aendert
    #   man durch Abbauen und neu Setzen, denn nur so geht die Aenderung durch die
    #   Datenbank. Ein umgeschriebenes Schild zeigte etwas anderes an, als der Shop
    #   handelt.
    schon-ein-shop: "<warnung>Hier haengt schon ein Shop.</warnung><fliesstext>\nZum Aendern bau das Schild ab und setz ein neues - so bleibt das Schild bei dem, was der Shop wirklich tut.</fliesstext>"
    # Das Fragezeichen, aber die Kiste sagt nicht, was gemeint ist. NENNT BEIDE FAELLE:
    #   Der Spieler sieht von aussen nicht, welcher vorliegt. UND SAGT, DASS VERZAUBERT
    #   ZWEI ARTEN SIND - das ist von aussen nicht zu erraten.
    ware-unklar: "<warnung>Die Kiste sagt nicht, was du handeln willst.</warnung><fliesstext>\nFuer ein <betont>?</betont> muss genau EINE Art darin liegen. Eine verzauberte und eine gewoehnliche Spitzhacke sind zwei Arten.</fliesstext>"
    # {getippt} - den getippten Gegenstand gibt es nicht. GIBT IHM SEINE EIGENE EINGABE
    #   ZURUECK: Oft ist es ein Leerzeichen zu viel, und das sieht nur, wer liest, was
    #   das Programm gelesen hat.
    ware-unbekannt: "<warnung>Den Gegenstand <betont>{getippt}</betont> gibt es nicht.</warnung><fliesstext>\nLeg die Ware in die Kiste und schreib ein <betont>?</betont> - das geht immer, auch bei verzauberten Sachen.</fliesstext>"
    # Ein Bundshop, aber das Recht dafuer fehlt.
    kein-bundrecht: "<warnung>Bundshops darfst du nicht anlegen.</warnung><fliesstext>\nLass die erste Zeile leer, dann wird es dein eigener Shop.</fliesstext>"
    # {stadt} {was} - die Freistadt hat noch kein LADENRECHT [Plan 16, Teil E3].
    #   EIN EIGENER SATZ und nicht fremde-kiste: Jener sagt "sie steht auf fremdem
    #   Grund", und der Spieler suchte einen Eigentuemer, den es nicht gibt - er
    #   kaufte ein Grundstueck, das nichts aendert. Hier darf NIEMAND einen Laden
    #   anlegen, auch der Stadtbesitzer nicht.
    # {stadt} nennt sie beim Namen: Wer in einer fremden Stadt baut, kennt ihn nicht
    #   immer. {was} nennt, WAS fehlt - die drei Worte dazu stehen bei
    #   freistadt.auflage. Ohne die Angabe weiss selbst der Besitzer nur, DASS etwas
    #   fehlt, und nicht, was er tun soll.
    kein-ladenrecht: "<warnung>{stadt} hat noch kein Ladenrecht</warnung>\n<fliesstext>Es fehlt: {was}. Bestehende Laeden handeln weiter.</fliesstext>"
    # {gebuehr} - die Stadt nimmt eine Ladengebuehr, und sein Geld reicht nicht
    #   [Teil E6]. EIN ANDERER SATZ als kein-ladenrecht: Dort darf NIEMAND einen Laden
    #   anlegen, hier darf er nur gerade nicht. Wer "kein Ladenrecht" laese, wartete
    #   auf den Stadtbesitzer statt Mark zu verdienen.
    # NENNT DEN BETRAG: Eine Absage, die nicht sagt, wie viel fehlt, laesst ihn raten -
    #   und raten heisst hier, Mark zu sammeln, ohne zu wissen, wie viele.
    ladengebuehr-zu-teuer: "<warnung>Ein Laden in dieser Stadt kostet {gebuehr} - das hast du nicht.</warnung><fliesstext>\nDie Gebuehr geht in die Stadtkasse; sie stellt der Betreiber ein.</fliesstext>"
    # Die Datenbank hat geschwiegen. SAGT AUSDRUECKLICH "NOCH EINMAL VERSUCHEN": Eine
    #   Absage ohne Ausweg liest ein Spieler als Verbot, baut sein Schild ab und kommt
    #   nicht wieder.
    gestoert: "<warnung>Der Shop liess sich nicht anlegen.</warnung><fliesstext>\nDas Schild bleibt stehen - versuch es noch einmal. Bleibt es dabei, sieh im Serverprotokoll nach.</fliesstext>"
  # DER SCHUTZ. Fuenf Handbalken - genau EINE Zeile, keine Umbruchmarke. Welchen ein
  #   Spieler liest, entscheidet das Programm daran, WAS er angefasst hat und WEM der
  #   Shop gehoert.
  # GILT UEBERALL, auch in der Wildnis: Hier entscheidet nicht der Ort, sondern der
  #   Shop. Ein Shop am Wegesrand waere sonst von jedem abbaubar.
  schutz:
    # {besitzer} - das Schild eines anderen. Derselbe Aufbau wie
    #   wache.schutz.fremde-parzelle: Absage warnung, der fremde Name betont. Das
    #   Leerzeichen vor dem Namen gehoert zum Stueck in warnung - lass es, wo es ist.
    fremdes-schild: "<warnung>Dieser Shop gehoert <betont>{besitzer}</betont></warnung>"
    # {besitzer} - die Kiste eines fremden Shops. EIN EIGENER SATZ und nicht derselbe:
    #   Der Spieler soll lesen, WARUM eine gewoehnlich aussehende Kiste geschuetzt ist -
    #   naemlich weil ein Schild daran haengt. Sonst sucht er den Fehler bei sich.
    fremde-kiste: "<warnung>Diese Kiste ist der Shop von <betont>{besitzer}</betont></warnung>"
    # Ein Bundshop - der hat keinen Besitzer, den man nennen koennte. DER DRITTE SATZ
    #   OHNE PLATZHALTER: Ein Wert, in dem manchmal ein Mensch und manchmal eine
    #   Einrichtung steht, zwingt zu einem Satz, der fuer beide passt - und solche
    #   Saetze lesen sich wie eine Fehlermeldung.
    bundshop: "<warnung>Das ist ein Shop des Bundes</warnung>"
    # Der Block, der ein fremdes Shopschild TRAEGT. DIE UEBERRASCHENDSTE DER VIER
    #   ABSAGEN, denn der Block sieht nach nichts aus - ein Stein unter einem
    #   Stehschild. Der Satz muss den Grund nennen, sonst haelt der Spieler ihn fuer
    #   kaputt.
    traeger: "<warnung>Daran haengt ein fremdes Shopschild</warnung>"
    # Geschuetzt, aber niemand nennbar - die Datenbank hat geschwiegen. DER FUENFTE
    #   SATZ FUER EINEN SELTENEN FALL: Das Programm fragt zwei Dinge, "ist hier eine
    #   Shopkiste" (bei Stoerung JA, also schuetzen) und "wem gehoert sie" (bei
    #   Stoerung niemandem, also keinen Namen erfinden). Gehen die zwei auseinander,
    #   bleibt die Kiste zu - und dieser Satz sagt es. Ohne ihn stuende dort "Diese
    #   Kiste ist der Shop von -", und das liest sich wie ein kaputtes Programm.
    # NENNT DEN AUSWEG wie absage.gestoert: eine Absage ohne Ausweg liest ein
    #   Spieler als Verbot.
    nicht-lesbar: "<warnung>Diese Kiste ist geschuetzt - versuch es noch einmal</warnung>"
  # DER HANDEL. Rechtsklick kauft, Linksklick verkauft, mit Schleichtaste ein
  #   ganzer Stapel - so hat Lumia es gemacht.
  # ALLES HANDBALKEN, genau EINE Zeile, keine Umbruchmarke. Der Grund ist derselbe wie
  #   beim Schutz, nur von der anderen Seite: Ein Spieler, der zwanzig Stapel kauft,
  #   klickt zwanzigmal, und zwanzig Chatzeilen waeren ein Regen. Nachzulesen ist jeder
  #   Handel ohnehin unter /mark verlauf.
  # {preis}, {gebuehr} und {erloes} kommen fertig mit ihrer Waehrung - schreib kein
  #   zweites "Mark" dahinter.
  handel:
    # {menge} {ware} {preis} - gekauft.
    # KEINE GEBUEHR IN DIESER ZEILE: Beim Kauf zahlt sie der SHOPBESITZER. Der Kunde
    #   zahlt den Preis, der am Schild steht, und nichts darueber - eine Zeile, die ihm
    #   den Abzug eines anderen nennt, liest sich wie ein Abzug bei ihm.
    gekauft: "<bestaetigung>Gekauft: {menge}x {ware}</bestaetigung><fliesstext> fuer </fliesstext><betont>{preis}</betont>"
    # {menge} {ware} {preis} - verkauft, ohne Gebuehr.
    verkauft: "<bestaetigung>Verkauft: {menge}x {ware}</bestaetigung><fliesstext> fuer </fliesstext><betont>{preis}</betont>"
    # {menge} {ware} {preis} {gebuehr} {erloes} - verkauft, und der Staat hat etwas
    #   genommen. EIN EIGENER SATZ und nicht der darueber mit einer 0 darin: "fuer 100
    #   Mark (100 minus 0)" liest sich wie ein Fehler.
    # UND KEIN STILLER ABZUG: Wer 100 am Schild liest und 95 bekommt, sucht den Fehler
    #   beim Shop. Alle drei Zahlen stehen darin, damit die Zeile nachzurechnen ist -
    #   eine Zusage, die eine ihrer Zahlen nicht nennt, traegt keine.
    verkauft-gebuehr: "<bestaetigung>Verkauft: {menge}x {ware}</bestaetigung><fliesstext> fuer </fliesstext><betont>{erloes}</betont><fliesstext> von {preis}, {gebuehr} Marktgebuehr</fliesstext>"
    # DIE ABSAGEN. Jede nennt, WAS fehlt - "das geht nicht" laesst einen Kunden dreimal
    #   klicken und dann aufhoeren. Genau daran haben die Vorbilder ihre Forenfragen.
    # Rechtsklick an einem Shop, der nur ankauft. SAGT, WAS STATTDESSEN GEHT: Ein Shop
    #   mit nur einem Preis sieht aus wie jeder andere, und ohne diesen Hinweis probiert
    #   niemand die andere Maustaste.
    verkauft-nicht: "<warnung>Dieser Shop verkauft nichts</warnung><fliesstext> - mit Linksklick kannst du ihm etwas verkaufen.</fliesstext>"
    # Linksklick an einem Shop, der nur verkauft - mit demselben Hinweis.
    kauft-nicht-an: "<warnung>Dieser Shop kauft nichts an</warnung><fliesstext> - mit Rechtsklick kaufst du bei ihm.</fliesstext>"
    # Der eigene Shop - hier wird nicht gehandelt. Kommt NUR beim Rechtsklick: Beim
    #   Linksklick baut der Besitzer sein Schild ab, und zwei Antworten auf eine Tat
    #   liest niemand als zwei.
    # NICHT in warnung: Das ist kein Fehler des Spielers, sondern eine Auskunft.
    eigener-shop: "<fliesstext>Das ist dein eigener Shop - nimm die Ware aus der Kiste.</fliesstext>"
    # Die Warenprobe des Shops ist nicht mehr zu deuten. DER EINZIGE FALL, DEN NUR DER
    #   BESITZER BEHEBEN KANN - darum sagt der Satz, dass man es ihm sagen soll.
    #   Entsteht, wenn ein Spielupdate die Form der Gegenstaende aendert; die Ware liegt
    #   dann noch in der Kiste, der Shop handelt sie aber nicht mehr.
    ware-unlesbar: "<warnung>Dieser Shop handelt nicht mehr</warnung><fliesstext> - sag es seinem Besitzer.</fliesstext>"
    # {ware} - die Shopkiste hat nicht genug. MIT DER WARE DARIN, damit der Kunde weiss,
    #   was er wiederholen soll.
    # Er hat die Regeln noch nicht angenommen (Plan 10.1) - nur am BUNDstand.
    # Der Handel zwischen zwei Spielern bleibt offen. Die Zeile nennt den WEG:
    # Eine Absage, die nicht sagt, was zu tun ist, schickt den Spieler ins Forum.
    nicht-angemeldet: "<warnung>Erst annehmen: /regeln</warnung>"
    ausverkauft: "<warnung>Ausverkauft: {ware}</warnung>"
    # {menge} {ware} - der Kunde hat nicht genug. MIT DER MENGE DES SHOPS: Ein Shop, der
    #   16 Stueck je Handel nimmt, lehnt auch 15 ab - ohne die Zahl sieht der Kunde
    #   seine Ware im Rucksack und die Absage auf dem Schirm.
    keine-ware: "<warnung>Du brauchst {menge}x {ware}</warnung>"
    # Im Rucksack des Kunden ist kein Platz.
    kein-platz: "<warnung>In deinem Rucksack ist kein Platz</warnung>"
    # Die Shopkiste ist voll. EIN EIGENER SATZ und nicht derselbe wie beim Rucksack: Der
    #   Kunde kann daran nichts aendern, und ein Satz, der ihn zum Aufraeumen auffordert,
    #   schickt ihn ins Leere.
    kiste-voll: "<warnung>Die Kiste dieses Shops ist voll</warnung>"
    # {preis} - der Kunde kann nicht zahlen. Der Preis ist der fuer EINEN Handel, nicht
    #   fuer den Stapel, den er nicht bekommt.
    kein-geld: "<warnung>Dafuer brauchst du {preis}</warnung>"
    # Der Shopbesitzer kann nicht zahlen - der haeufigste Fall, in dem ein Ankaufstand
    #   dasteht und nicht handelt. NENNT DEN BESITZER NICHT: Wer wie viel Geld hat, ist
    #   nicht die Sache eines Kunden, und der Name steht am Schild.
    shop-pleite: "<warnung>Dieser Shop kann das nicht zahlen</warnung>"
    # Etwas ist MITTEN im Handel schiefgegangen. EIN EIGENER SATZ und nicht
    #   absage.gestoert: Jener sagt "der Shop liess sich nicht anlegen, das Schild bleibt
    #   stehen", und das hat mit einem Handelsklick nichts zu tun.
    # SAGT AUSDRUECKLICH, DASS KEIN GELD WEG IST. Das ist die Zusage, die der Handel
    #   wirklich haelt: Was nach dem Zahlen scheitert, wird erstattet.
    gestoert: "<warnung>Der Handel ist nicht zustande gekommen</warnung><fliesstext> - dein Geld ist nicht weg.</fliesstext>"
  # Der SCHLUESSEL: /shop freigeben <spieler>. Seit dem 08.11.2026 ist das Oeffnen einer
  #   fremden Shopkiste ganz verwehrt - der Preis dafuer ist, dass ein Fremder einem Shop
  #   auch nichts schenken kann. Diese Saetze heben ihn auf.
  freigabe:
    # Die Freigabe ist eingetragen. NENNT AUSDRUECKLICH, was sie erlaubt und was nicht:
    #   Sonst muesste der Besitzer raten, wie weit er gerade Vertrauen verschenkt hat.
    #   Das zweite Schild bleibt verwehrt, und das ist keine Feinheit - es ist der Weg,
    #   auf dem jemand fremde Ware auf SEIN Konto verkaufen koennte.
    erteilt: "<bestaetigung>{spieler} darf jetzt an diesen Shop</bestaetigung><fliesstext> - Kiste oeffnen und abbauen. Ein eigenes Schild daran haengen kann er nicht.</fliesstext>"
    gesperrt: "<hinweis>{spieler} darf nicht mehr an diesen Shop.</hinweis>"
    # Eine eigene Zeile und keine stille Wiederholung: Wer zweimal freigibt, soll wissen,
    #   dass beim ersten Mal schon alles stimmte - sonst sucht er den Fehler.
    schon-frei: "<fliesstext>{spieler} darf schon an diesen Shop.</fliesstext>"
    nicht-frei: "<fliesstext>{spieler} durfte ohnehin nicht an diesen Shop.</fliesstext>"
    kopf: "<kopf>An diesem Shop duerfen {anzahl} ausser dir:</kopf>"
    zeile: "<fliesstext>  {spieler}</fliesstext>"
    # Eine eigene Zeile und nicht eine leere Liste: "niemand" ist hier genau die
    #   Auskunft, auf die es ankommt.
    leer: "<fliesstext>Ausser dir darf niemand an diesen Shop.</fliesstext>"
    # NENNT DIE REICHWEITE, wie blockbuch.kein-block: Wer auf ein Schild drei Meter
    #   weiter schaut, soll nicht raten, ob dort kein Shop ist oder der Blick zu weit
    #   ging.
    kein-schild: "<fliesstext>Du siehst kein Shopschild an</fliesstext><gedaempft> (Reichweite {reichweite} Bloecke). Stell dich vor dein Schild und tippe /shop freigeben \\<name>.</gedaempft>"
    # Freigeben darf NUR der Besitzer - nicht das Team und nicht ein schon Freigegebener.
    #   Sonst waere der Schluessel selbst weitergebbar, und nach zwei Schritten wuesste
    #   niemand mehr, wer eigentlich Zutritt hat.
    nicht-deiner: "<warnung>Dieser Shop gehoert dir nicht.</warnung><fliesstext> Freigeben darf nur, wem der Laden gehoert.</fliesstext>"
    bundshop: "<fliesstext>Ein Bundshop gehoert niemandem - freigeben kann ihn darum auch niemand. Wer an ihn darf, entscheidet das Recht freimarken.shop.bund.</fliesstext>"
    selbst: "<fliesstext>An deinen eigenen Shop darfst du ohnehin.</fliesstext>"
    unbekannt: "<warnung>Den Spieler {name} kennt dieser Server nicht.</warnung>"
    gestoert: "<warnung>Die Freigabe liess sich nicht speichern</warnung><fliesstext> - es hat sich NICHTS geaendert. Der Grund steht im Serverprotokoll.</fliesstext>"
  # Die eigene Shopliste, /shop liste [seite]. Sie steht fuer sich und braucht keinen
  #   Blick auf ein Schild - wer dreissig Laeden hat, sucht genau darum nach ihnen.
  liste:
    leer: "<fliesstext>Du hast noch keinen Kistenshop. Einer entsteht aus einem Schild an einer Kiste - die erste Zeile bleibt leer, dann Menge, Preis und Ware.</fliesstext>"
    # {anzahl} {seite} {seiten} - die Seite steht auch bei einer einzigen da: Wer
    #   "Seite 1 von 1" liest, weiss sofort, dass nichts fehlt.
    kopf: "<kopf>Deine Kistenshops ({anzahl}) - Seite {seite} von {seiten}</kopf>"
    # {welt} {x} {y} {z} {menge} {ware} {kauf} {verkauf} - eine Zeile je Laden. {kauf}
    #   und {verkauf} sind die beiden Wortstuecke darunter ODER NICHTS: ein leerer Wert
    #   verschwindet rueckstandslos. Darum stehen die Trenner in den Wortstuecken.
    zeile: "<fliesstext>  {welt} {x}/{y}/{z} · {menge}x {ware}{kauf}{verkauf}</fliesstext>"
    # {preis} - ein Wortstueck fuer die Zeile darueber, kein Satz. Kein Farbtag.
    #   KUNDEN KAUFEN zu diesem Preis, der Shop verkauft also.
    kauf: " · Kauf {preis}"
    # {preis} - das Gegenstueck: Kunden verkaufen an diesen Laden.
    verkauf: " · Ankauf {preis}"
    # {naechste} - nur, wenn es eine naechste Seite gibt. Nennt die ZAHL, damit der
    #   Spieler nicht raten muss, wie man blaettert.
    weiter: "<gedaempft>/shop liste {naechste} zeigt die naechste Seite</gedaempft>"
    # {seite} {seiten} - und nennt, wie viele es gibt: Eine Absage ohne diese Zahl
    #   schickt den Spieler ins Probieren.
    keine-seite: "<fliesstext>Seite {seite} gibt es nicht - deine Shops stehen auf {seiten} Seiten.</fliesstext>"
    gestoert: "<warnung>Deine Shopliste liess sich nicht lesen</warnung><fliesstext> - deine Laeden sind deswegen NICHT weg. Der Grund steht im Serverprotokoll.</fliesstext>"
  # DER ANKAUF DES BUNDES AM SCHILD (Plan 7.1, gebaut 10.11.2026). Ein Bundschild mit
  #   S-Preis IST der Bundesmarkt: Der Preis kommt aus bundesmarkt.ankauf und nicht vom
  #   Schild, der Tagesdeckel bundesmarkt.tagesdeckel gilt, und gebucht wird
  #   bundesmarkt_verkauf. /markt verkaufen ist dafuer weggefallen.
  #
  # Die ersten drei Zeilen liest ein BETREIBER beim Beschreiben eines Schildes (nur er
  #   hat freimarken.shop.bund), die letzten drei ein KUNDE am fertigen Stand.
  bund:
    # SECHS ZEILEN STANDEN HIER am Mittag des 10.11.2026 und sind am Nachmittag wieder
    #   gegangen - mit der Tafel bundesmarkt.ankauf. Sie sagten, was an einer Tafel
    #   schiefgehen kann; ohne Tafel gibt es keinen dieser Faelle: Der Preis steht auf
    #   dem Schild, ein Schildpreis ist eine ganze Mark, und beide Preise auf einem
    #   Schild halten die Regeln des Kistenshops selbst.
    #
    # Geblieben ist der Deckel - der Grund des ganzen Schrittes (Plan 7.4). Er kommt nur,
    #   wenn bundesmarkt.tagesdeckel ueber 0 steht.
    deckel: "<hinweis>Heute ist genug verkauft - morgen kauft der Bund wieder.</hinweis>"

# Die Freie Truhe (Plan 7.2, Schritt 8 Teil D): eine offene Kiste in der Markthalle, aus
#   der jeder nehmen und in die jeder legen darf.
#
# ZWEI PAARE MIT ZWEI BLICKWINKELN stehen hier, und beide sind eine Entscheidung vom
#   10.11.2026: offen/offen-frei - mit Deckel eine Zahl, ohne Deckel ein eigener Satz,
#   denn "noch 0 Stueck" waere das Gegenteil der Wahrheit. Und zurueck/behalten: Das eine
#   sagt, was dableibt, das andere, was mitkommt. Die Rueckgabezeile steht VOR der
#   Bilanz - erst der Grund, dann die Zahl.
#
# WER NICHTS GENOMMEN HAT, LIEST NICHTS. Hineinlegen ist der halbe Zweck dieser Truhe und
#   kein Vorgang, der eine Meldung braucht.
truhe:
  # {frei} - beim Oeffnen, VOR dem Nehmen. Wer erst beim Schliessen erfaehrt, dass er am
  #   Deckel ist, hat die Ware schon in der Hand und bekommt sie weggenommen.
  offen: "<fliesstext>Freie Truhe - heute kannst du noch <betont>{frei}</betont> Gegenstaende behalten. Hineinlegen darfst du immer.</fliesstext>"
  # Ohne Deckel (freie-truhe.entnahme-je-tag: 0) - ein eigener Satz und keine Zahl.
  offen-frei: "<fliesstext>Freie Truhe - nimm, was du brauchst, und lege hinein, was du nicht brauchst.</fliesstext>"
  # {deckel} - die Truhe bleibt zu. Nennt den DECKEL und nicht den Rest: Der Rest ist 0,
  #   und eine 0 beantwortet die Frage nicht, die der Spieler jetzt hat.
  deckel: "<hinweis>Heute hast du deine {deckel} Gegenstaende aus der Freien Truhe</hinweis><fliesstext> - morgen ist sie wieder voll.</fliesstext>"
  # Einer zur Zeit: Gezaehlt wird die Differenz zwischen Oeffnen und Schliessen, und bei
  #   zwei Zuschauern waere sie nicht die Entnahme eines Spielers.
  # NUR WENN GEZAEHLT WIRD geht dieser Satz heraus - also bei einem Deckel
  #   (freie-truhe.entnahme-je-tag) oder einer Verbotsliste. Ab Werk steht beides auf
  #   "aus", und dann sehen alle gemeinsam hinein und niemand liest diese Zeile.
  besetzt: "<hinweis>Jemand sieht gerade in die Freie Truhe</hinweis><fliesstext> - einen Augenblick.</fliesstext>"
  # Der Tagesstand liess sich nicht lesen. Beim Oeffnen heisst das: bleibt zu. Beim
  #   Schliessen: alles geht zurueck. Beides ist die sichere Seite.
  gestoert: "<warnung>Die Freie Truhe antwortet gerade nicht</warnung><fliesstext> - dein Tagesstand liess sich nicht lesen. Der Grund steht im Serverprotokoll.</fliesstext>"
  # {stueck} {frei} - beim Schliessen, nur mit Deckel und nur, wenn er etwas genommen hat.
  behalten: "<fliesstext>{stueck} Gegenstaende behalten - heute noch <betont>{frei}</betont> frei.</fliesstext>"
  # {stueck} {deckel} - was ueber dem Deckel lag. MIT der Zahl des Deckels: Wer liest
  #   "7 gehen zurueck", sucht den Fehler; wer die Regel liest, kennt sie.
  zurueck: "<hinweis>{stueck} Gegenstaende gehen zurueck in die Truhe</hinweis><fliesstext> - mehr als {deckel} am Tag nimmt niemand mit.</fliesstext>"
  # {ware} - der Materialname, wie der Spieler ihn im Tooltip liest. Erkannt wird beim
  #   SCHLIESSEN: In eine offene Kiste legt man auf sieben verschiedene Weisen.
  verboten: "<hinweis>{ware} gehoert nicht in die Freie Truhe</hinweis><fliesstext> - du bekommst es zurueck.</fliesstext>"

blockbuch:
  # Die Saetze der Moderationsauskunft /freimarken blockbuch. Sie reden NICHT mit einem
  #   Spieler ueber sein eigenes Tun, sondern mit einem Moderator ueber das Tun eines
  #   anderen - darum nennen sie Namen, Zeiten und Orte, und darum unterscheiden sie
  #   gelungene von ABGEWIESENEN Versuchen.
  # Muster fuer DateTimeFormatter, kein Satz. Wird beim LADEN uebersetzt.
  # Das Jahr steht HIER mit Absicht drin, anders als bei zeit.verlauf-muster: Die Frist
  #   ist einstellbar bis zu zehn Jahren, und dann ist das Jahr genau die Angabe, die
  #   fehlt.
  zeit-muster: "dd.MM.yyyy HH:mm"
  # Die Ueberschrift der Abfrage an einem Block. {ort} ist kurz - Weltname ohne
  #   freimarken: davor, dann x/y/z. {anzahl} ist die Zahl der gezeigten Zeilen, nicht
  #   die Zahl aller: Mehr als blockbuch.zeilen-je-abfrage kommen nie.
  kopf-ort: "<kopf>Blockbuch</kopf><fliesstext> an {ort} - {anzahl} Eintraege:</fliesstext>"
  # Die Ueberschrift der Abfrage nach einem Spieler.
  kopf-spieler: "<kopf>Blockbuch</kopf><fliesstext> von {spieler} - {anzahl} Eintraege:</fliesstext>"
  # Eine GELUNGENE Tat. {zeit} {spieler} {tat} {block} - der Ort fehlt, er steht in der
  #   Ueberschrift; zwanzig Zeilen mit derselben Koordinate waeren zwanzigmal dasselbe.
  # Einzug und Farbe stehen HIER, nicht am Sendeort.
  zeile: "<fliesstext>  {zeit}  {spieler} {tat} {block}</fliesstext>"
  # Eine ABGEWIESENE Tat - ein eigener Satz und nicht ein eingesetztes Wort.
  # DAS ZEICHEN UND DIE FARBE SIND DER ZWECK: Ein Dutzend dieser Zeilen an einer fremden
  #   Parzelle ist der Fund, nach dem die Moderation sucht - und es ist einer, bei dem
  #   gar nichts passiert ist. Eine Zeile, die sich nur in einem Wort unterscheidet,
  #   faellt beim Durchlesen nicht auf.
  zeile-abgewiesen: "<gedaempft>  {zeit}</gedaempft><warnung>  x {spieler} {tat} {block}</warnung>"
  # Dieselben zwei Zeilen fuer die Abfrage nach einem SPIELER: Dort ist der Ort die
  #   wichtigste Angabe - "wo war der" ist die ganze Frage -, und der Name steht in der
  #   Ueberschrift.
  zeile-mit-ort: "<fliesstext>  {zeit}  {ort} {tat} {block}</fliesstext>"
  zeile-mit-ort-abgewiesen: "<gedaempft>  {zeit}</gedaempft><warnung>  x {ort} {tat} {block}</warnung>"
  # An diesem Block steht nichts. SAGT, WARUM das sein kann - ohne diesen Hinweis sucht
  #   der Moderator den Fehler im Plugin, obwohl die Welt abgewaehlt oder die Frist um
  #   sein kann.
  leer-ort: "<fliesstext>Zu {ort} steht nichts im Blockbuch - die Welt kann abgewaehlt sein, oder die Frist hat es geholt.</fliesstext>"
  leer-spieler: "<fliesstext>Zu {spieler} steht nichts im Blockbuch.</fliesstext>"
  # Der Blick ging ins Leere. NENNT DIE REICHWEITE: Wer einen Block weit weg anschaut,
  #   soll nicht raten, ob das Buch leer ist oder der Blick zu weit ging.
  kein-block: "<fliesstext>Du siehst keinen Block an</fliesstext><gedaempft> (Reichweite {reichweite} Bloecke). Nach einem Spieler fragt /freimarken blockbuch spieler \\<name>.</gedaempft>"
  # Das Buch schreibt in dieser Welt nichts. EIN EIGENER SATZ und nicht leer-ort: Hier
  #   steht nichts, weil nichts aufgeschrieben WIRD - nicht weil nichts geschehen ist.
  #   Genau den Unterschied muss ein Moderator kennen, bevor er jemanden freispricht.
  aus: "<hinweis>In dieser Welt schreibt das Blockbuch nichts</hinweis><fliesstext> - was hier geschah, steht nirgends. Einstellbar unter blockbuch.welten in der config.yml.</fliesstext>"
  # Die Ablage hat geschwiegen. AUCH DAS ist nicht "hier steht nichts": Ein Netzfehler
  #   darf nicht aussehen wie ein Freispruch.
  gestoert: "<warnung>Das Blockbuch antwortet nicht</warnung><fliesstext> - der Grund steht im Serverprotokoll. Das ist KEIN Freispruch.</fliesstext>"
  # Den Namen kennt der Server nicht. Wichtig, damit ein Tippfehler nicht als leeres
  #   Buch durchgeht - sonst waere die Antwort ein Freispruch fuer einen Namen, den
  #   niemand traegt.
  unbekannt: "<warnung>Den Spieler {name} kennt dieser Server nicht.</warnung>"
  # Die Woerter fuer die drei Taten. KEINE Farbtags: Sie werden in die Zeilen darueber
  #   eingesetzt und sind dort ein Blatt - ein Tag darin stuende woertlich im Chat.
  tat:
    setzen: "setzte"
    abbauen: "baute ab"
    benutzen: "benutzte"

# DIE MEERINSELN VON HAFENWERDER (Plan 6.2, Schritt 10).
#
# Der siebzehnte Bereich - und der erste, dessen Besitz nicht in einer gebauten Stadt
# liegt, sondern im Meer. Darum klingt hier nichts nach Stadtverwaltung: Eine Insel hat
# keinen Namen, keine Kasse, keine Buerger und keine Auflage. Sie hat eine ADRESSE
# (die Feldnummer als x/z, wie eine Parzellennummer) und einen Festpreis.
#
# FUENF SAETZE DIENEN ZWEI ZWEIGEN: hier.* beantwortet "/werder hafen" ("was ist hier")
# UND die Absage von "/werder hafen nehmen" bei denselben drei Lagen - offenes Meer,
# Ankunftsinsel, fremde Insel. Zwei Satzpaare dafuer waeren zwei Beschreibungen
# derselben Stelle, und eine von ihnen wuerde eines Tages anders.
werder:
  # {anzahl} - die Ueberschrift ueber den eigenen Inseln. Die Einzahl nennt die Zahl
  #   NICHT: "Deine Meerinsel: 1" waere eine Zahl, die niemand braucht.
  kopf:
    eins: "<kopf>Deine Meerinsel</kopf>"
    viele: "<kopf>Deine Meerinseln: {anzahl}</kopf>"
  # {feld} - eine Zeile je Insel. Die Feldnummer IST die Adresse: Hin kommt man mit dem
  #   Boot, und wer die Zahlen kennt, findet sie auf der Karte.
  zeile: "<fliesstext>  Insel {feld}</fliesstext>"
  # {preis} - du hast keine. Diese Zeile MUSS es geben: Wer nur die Ueberschrift sieht,
  #   haelt es fuer einen Fehler, und am ersten Tag ist das der Normalfall. Sie nennt
  #   den Preis, denn das ist die naechste Frage.
  leer: "<fliesstext>  Du hast keine Meerinsel - eine kostet {preis}. Fahr nach Hafenwerder und nimm eine mit /werder hafen nehmen.</fliesstext>"
  hier:
    # Offenes Meer - dasselbe, was der Handbalken wache.schutz.insel-meer sagt, nur als
    #   Chatzeile und als ganzer Satz.
    meer: "<fliesstext>Hier ist offenes Meer</fliesstext><gedaempft> - es gehoert niemandem, und gebaut wird hier nicht.</gedaempft>"
    # Feld 0/0. Sie wird nie vergeben, darum nennt der Satz keinen Weg, sie zu nehmen.
    ankunft: "<fliesstext>Das ist die Ankunftsinsel</fliesstext><gedaempft> - sie gehoert allen und bleibt frei. Deine eigene nimmst du auf einer anderen.</gedaempft>"
    # {feld} {preis} - eine freie Insel, mit Ausweg und Preis.
    frei: "<hinweis>Insel {feld} ist frei.</hinweis>\n<fliesstext>Nimm sie mit /werder hafen nehmen - sie kostet {preis}.</fliesstext>"
    # {feld} - die eigene.
    eigene: "<bestaetigung>Insel {feld} gehoert dir.</bestaetigung>"
    # {feld} {besitzer} - die eines anderen. Der Name ist ein BLATT: Er kommt von
    #   Bukkit und nicht aus einer Datei.
    fremd: "<fliesstext>Insel {feld} gehoert </fliesstext><betont>{besitzer}</betont><fliesstext>.</fliesstext>"
  # {feld} {preis} {danach} - genommen. {danach} ist das Guthaben, das bleibt: 75.000
  #   liest man, ohne es zu fuehlen - was danach bleibt, fuehlt man.
  genommen: "<bestaetigung>Insel {feld} gehoert jetzt dir - {preis} abgebucht.</bestaetigung>\n<fliesstext>Es bleiben {danach}.</fliesstext>"
  # {feld} - genommen, und es hat nichts gekostet (inseln.preis: 0). Ein eigener Satz
  #   und keine 0 im Satz darueber: "0 abgebucht, es bleiben 1.200" schreibt niemand.
  genommen-gratis: "<bestaetigung>Insel {feld} gehoert jetzt dir.</bestaetigung>"
  # {werbung} - NUR DIE FARBE ist hier deine; der Satz steht in der config.yml unter
  # hinweise.rang-werbung. Angehaengt wird er allein unter absage.genug: Dort ist der
  # Rang der Grund. Unter "hier ist Meer" waere er eine Antwort auf eine Frage, die
  # niemand gestellt hat.
  rang-werbung: "<hinweis>{werbung}</hinweis>"
  absage:
    # Jenseits der Weltgrenze. Die Grenze haelt ihn dort ohnehin auf; der Satz steht
    #   fuer den Fall, dass ihn jemand hinbringt.
    ausserhalb: "<warnung>Hier enden die Inseln von Hafenwerder.</warnung>"
    # {hoechstzahl} - so viele Inseln darf dieser Spieler halten. Die Zahl kommt aus
    #   einem RECHT (freimarken.inseln.<zahl>) und ist darum fuer jeden eine andere.
    genug:
      eins: "<warnung>Du hast schon eine Meerinsel - mehr erlaubt dein Rang nicht.</warnung>"
      viele: "<warnung>Du hast schon {hoechstzahl} Meerinseln - mehr erlaubt dein Rang nicht.</warnung>"
    # {preis} {fehlt} - das Guthaben reicht nicht.
    zu-wenig: "<warnung>Eine Insel kostet {preis} - dir fehlen {fehlt}.</warnung>"
    # Die Ablage hat geschwiegen. Ein eigener Satz und kein stilles Nein: Wer 75.000
    #   Mark ausgeben will und irgendeine Absage liest, versucht es wieder.
    gestoert: "<warnung>Die Inseln sind gerade nicht nachsehbar - versuch es noch einmal.</warnung>"
    # Es gibt gar keine Inselwelt - inseln.welt zeigt auf eine Welt ohne Inselraster,
    #   oder die Welt fehlt. Der Befehl wird trotzdem angemeldet: Einen Befehl, den es
    #   je nach Einstellungsdatei gibt oder nicht, versteht kein Spieler.
    keine-welt: "<warnung>Es gibt keine Inselwelt</warnung><fliesstext> - der Betreiber findet den Grund im Startprotokoll.</fliesstext>"
    # {welt} - er steht nicht in Hafenwerder. MIT dem Weg dorthin, denn das ist die
    #   Frage, die er jetzt hat.
    falsche-welt: "<fliesstext>Meerinseln gibt es nur in {welt}</fliesstext><gedaempft> - hin kommst du durch den Hafen in Altfurt oder mit /warp {welt}.</gedaempft>"
# DIE SKYBLOCKINSELN VON WOLKENWERDER (Plan 4.1 und 6.2, Schritt 11).
#
# Der achtzehnte Bereich. Er klingt anders als der der Meerinseln, und das hat einen
# Grund: Dort KAUFT man eine Insel, auf der man steht und die schon daliegt. Hier
# bekommt man eine ZUGETEILT - sie entsteht in dem Augenblick, in dem man sie nimmt,
# und sie kostet nichts.
#
# DARUM NENNT KEIN SATZ EINE STELLE, DIE MAN SICH AUSSUCHT: Genommen wird das naechste
# freie Feld, von der Mitte der Welt aus nach aussen. Wer in der Leere steht und
# "/wolke nehmen" tippt, bekommt NICHT das Feld unter sich - es gibt keines.
#
# {feld} ist ueberall die Adresse als x/z, genau wie bei der Meerinsel und wie eine
# Parzellennummer. Ein Spieler soll nicht lernen muessen, dass dieselbe Zahl in drei
# Welten dreimal anders geschrieben wird.
wolke:
  # {anzahl} - die Ueberschrift ueber den eigenen Inseln. Die Einzahl nennt die Zahl
  #   NICHT: "Deine Wolkeninsel: 1" waere eine Zahl, die niemand braucht.
  kopf:
    eins: "<kopf>Deine Wolkeninsel</kopf>"
    viele: "<kopf>Deine Wolkeninseln: {anzahl}</kopf>"
  # {feld} - eine Zeile je Insel. Hin kommt man mit /wolke heim.
  zeile: "<fliesstext>  Insel {feld}</fliesstext>"
  # {feld} {mitbauer} - dieselbe Zeile, wenn Mitbauer eingetragen sind. Ein eigener
  #   Satz und kein Platzhalter, der manchmal leer ist: Ein "Mitbauer: " ohne Namen
  #   dahinter sieht aus wie ein Fehler.
  zeile-mitbauer: "<fliesstext>  Insel {feld} · Mitbauer: </fliesstext><betont>{mitbauer}</betont>"
  # Du hast keine. Diese Zeile MUSS es geben: Wer nur die Ueberschrift sieht, haelt es
  #   fuer einen Fehler, und am ersten Tag ist das der Normalfall. Sie nennt KEINEN
  #   Preis - eine Wolkeninsel ist ab Werk gratis, und "kostet 0 Mark" ist keine
  #   Auskunft.
  leer: "<fliesstext>  Du hast keine Wolkeninsel - hol dir eine mit /wolke nehmen. Sie kostet nichts.</fliesstext>"
  # {hoechstzahl} - du darfst noch eine nehmen. Die Zahl kommt aus einem RECHT
  #   (freimarken.wolken.<zahl>) und ist darum fuer jeden eine andere.
  noch-frei:
    eins: "<fliesstext>  Du darfst eine Insel halten - /wolke nehmen</fliesstext>"
    viele: "<fliesstext>  Du darfst {hoechstzahl} Inseln halten - /wolke nehmen</fliesstext>"
  # {hoechstzahl} - du hast so viele, wie dein Rang erlaubt. Ein eigener Satz, denn das
  #   ist die Antwort auf die Frage, die sonst offen bliebe: Warum keine weitere?
  voll:
    eins: "<fliesstext>  Mehr als eine Insel erlaubt dein Rang nicht.</fliesstext>"
    viele: "<fliesstext>  Mehr als {hoechstzahl} Inseln erlaubt dein Rang nicht.</fliesstext>"
  # {feld} {preis} {danach} - genommen und bezahlt. Nur, wenn der Betreiber einen Preis
  #   gesetzt hat; ab Werk gilt der Satz darunter.
  genommen: "<bestaetigung>Insel {feld} gehoert jetzt dir - {preis} abgebucht.</bestaetigung>\n<fliesstext>Es bleiben {danach}.</fliesstext>"
  # {feld} - genommen, und es hat nichts gekostet (der Normalfall). Zwei Zeilen: Die
  #   zweite sagt, was in der Truhe liegt, denn das ist der erste Handgriff.
  genommen-gratis: "<bestaetigung>Insel {feld} gehoert jetzt dir.</bestaetigung>\n<fliesstext>In der Truhe liegt, was du zum Anfangen brauchst - Lava und Eis machen den Steingenerator.</fliesstext>"
  # {feld} - die Insel ist eingetragen, aber die Bloecke stehen NICHT. Diesen Satz gibt
  #   es in keinem anderen Bereich: In jeder anderen Welt macht der Weltgenerator das
  #   Gelaende, hier das Plugin. Ohne diese Zeile reist der Spieler hin und faellt.
  aufbau-gestoert: "<warnung>Insel {feld} gehoert dir, aber sie liess sich nicht aufsetzen.</warnung>\n<fliesstext>Sag es dem Betreiber - mit /wolke zuruecksetzen ist es zu beheben.</fliesstext>"
  # {werbung} - NUR DIE FARBE ist hier deine; der Satz steht in der config.yml unter
  # hinweise.rang-werbung. Angehaengt wird er allein unter absage.grenze: Bei "die Welt
  # ist voll" hilft kein Rang, und ein Hinweis darauf waere dann falsch.
  rang-werbung: "<hinweis>{werbung}</hinweis>"
  absage:
    # {hoechstzahl} - so viele Inseln darf dieser Spieler halten.
    grenze:
      eins: "<warnung>Du hast schon eine Wolkeninsel - mehr erlaubt dein Rang nicht.</warnung>"
      viele: "<warnung>Du hast schon {hoechstzahl} Wolkeninseln - mehr erlaubt dein Rang nicht.</warnung>"
    # Jedes Feld der Welt ist vergeben. Der Satz nennt keinen Ausweg, denn der Spieler
    #   hat keinen - er gehoert dem Betreiber (eine groessere welten.wolkenwerder.kante).
    welt-voll: "<warnung>In Wolkenwerder ist kein Feld mehr frei.</warnung>\n<fliesstext>Sag es dem Betreiber - die Welt laesst sich vergroessern.</fliesstext>"
    # {preis} {fehlt} - das Guthaben reicht nicht. Erscheint nur, wenn der Betreiber
    #   einen Preis gesetzt hat.
    zu-wenig: "<warnung>Eine Wolkeninsel kostet {preis} - dir fehlen {fehlt}.</warnung>"
    # Die Ablage hat geschwiegen. Ein eigener Satz und kein stilles Nein: Wer nichts
    #   liest, tippt den Befehl wieder.
    gestoert: "<warnung>Die Wolkeninseln sind gerade nicht nachsehbar - versuch es noch einmal.</warnung>"
    # Es gibt gar keine Wolkenwelt - wolken.welt zeigt auf eine Welt ohne Wolkenraster,
    #   oder der Eintrag welten.wolkenwerder fehlt in der config.yml. Der Befehl wird
    #   trotzdem angemeldet: Einen Befehl, den es je nach Datei gibt oder nicht,
    #   versteht kein Spieler.
    keine-welt: "<warnung>Es gibt keine Wolkenwelt</warnung><fliesstext> - der Betreiber findet den Grund im Startprotokoll.</fliesstext>"
  # Du hast keine Insel - fuer /wolke heim und fuer die Mitbauer. MIT Ausweg.
  keine-insel: "<fliesstext>Du hast keine Wolkeninsel</fliesstext><gedaempft> - hol dir eine mit /wolke nehmen.</gedaempft>"
  mitbauer:
    # {spieler} - eingetragen. Er darf ab jetzt alles, was der Eigentuemer darf; das
    #   steht im Satz, denn es ist mehr, als die meisten erwarten.
    dazu: "<bestaetigung>{spieler} darf jetzt auf deiner Insel bauen.</bestaetigung>"
    # {spieler} - ausgetragen.
    weg: "<hinweis>{spieler} darf nicht mehr auf deiner Insel bauen.</hinweis>"
    # {spieler} - der stand schon drin. Ein eigener Satz und nicht dieselbe
    #   Bestaetigung: Wer "darf jetzt" liest, obwohl nichts geschehen ist, haelt seine
    #   Liste fuer laenger, als sie ist.
    schon: "<fliesstext>{spieler} darf dort schon bauen.</fliesstext>"
    # {spieler} - der stand nicht drin.
    nicht-dabei: "<fliesstext>{spieler} ist auf dieser Insel kein Mitbauer.</fliesstext>"
    # {spieler} - den Namen kennt der Server nicht. Ein stilles Nichtstun waere die
    #   schlimmere Antwort: Der Besitzer glaubte, sein Freund duerfe bauen.
    unbekannt: "<warnung>Den Spieler {spieler} kennt dieser Server nicht.</warnung>"
    # Sich selbst eintragen geht nicht - der Eigentuemer darf ohnehin alles.
    selbst: "<fliesstext>Dich selbst musst du nicht eintragen - dir gehoert die Insel.</fliesstext>"
    # {eigentuemer} - die Insel, auf der du stehst, gehoert einem anderen. MIT seinem
    #   Namen: In einer Welt ohne Wege kommt man nur hierher, wenn man geflogen ist.
    fremd: "<warnung>Diese Insel gehoert <betont>{eigentuemer}</betont> - Mitbauer setzt nur der Eigentuemer.</warnung>"
  # DIE HERAUSFORDERUNGEN - /wolke aufgaben zeigt die Tafel, /wolke abgeben gibt ab.
  #
  # Die Stufe einer Insel ist die Zahl ihrer erfuellten Herausforderungen, und an ihr
  # haengt die Erzausbeute des Generators (wolken.erze in der config.yml). Darum nennt
  # die Zusage die neue Stufe: Sie ist die eigentliche Belohnung, das Geld kommt dazu.
  aufgaben:
    # {erfuellt} {gesamt} - die Ueberschrift der Tafel. ZWEI Zahlen nebeneinander und
    #   darum kein eins/viele: "1 von 10" braucht keine Mehrzahlform.
    kopf: "<kopf>Herausforderungen auf dieser Insel: {erfuellt} von {gesamt}</kopf>"
    # {name} {verlangt} {belohnung} - eine offene Aufgabe. {verlangt} ist eine Liste wie
    #   "64x cobblestone, 1x furnace" - die Namen stehen so in der config.yml und auf
    #   den Shopschildern, damit ein Gegenstand im ganzen Spiel gleich heisst.
    offen: "<fliesstext>  <betont>{name}</betont> · {verlangt} <gedaempft>· {belohnung}</gedaempft></fliesstext>"
    # {name} {verlangt} - dieselbe Zeile ohne Lohn. Ein eigener Satz und kein
    #   Platzhalter, der manchmal leer ist: Ein "·" ohne Betrag dahinter sieht aus wie
    #   ein Fehler. Eine Aufgabe ohne Lohn ist erlaubt - sie zahlt in Stufe.
    offen-ohne-lohn: "<fliesstext>  <betont>{name}</betont> · {verlangt}</fliesstext>"
    # {name} - erfuellt. OHNE die Gegenstaende: Was weg ist, ist weg, und die Tafel soll
    #   zeigen, was noch zu tun ist.
    fertig: "<gedaempft>  {name} · erfuellt</gedaempft>"
    # In dieser Welt gibt es keine Herausforderungen (wolken.aufgaben.an ist aus oder
    #   die Liste ist leer). Ein stummer Befehl waere hier das Schlimmste: Der Spieler
    #   haelt die Tafel fuer kaputt und tippt sie wieder.
    aus: "<fliesstext>In Wolkenwerder gibt es keine Herausforderungen</fliesstext><gedaempft> - der Betreiber schaltet sie in der config.yml ein.</gedaempft>"
  abgabe:
    # {name} {belohnung} {stufe} - erfuellt. Die STUFE steht darin, weil sie die
    #   eigentliche Belohnung ist: An ihr haengt, was der Kobbelsteingenerator ausspuckt.
    erteilt: "<bestaetigung>{name} erfuellt - {belohnung} gutgeschrieben.</bestaetigung>\n<fliesstext>Deine Insel ist jetzt auf Stufe {stufe} - der Steingenerator gibt mehr und besseres Erz.</fliesstext>"
    # {name} {stufe} - dieselbe Zusage ohne Lohn.
    erteilt-ohne-lohn: "<bestaetigung>{name} erfuellt.</bestaetigung>\n<fliesstext>Deine Insel ist jetzt auf Stufe {stufe} - der Steingenerator gibt mehr und besseres Erz.</fliesstext>"
    # {name} {fehlt} - es fehlt etwas. Die Zahl ist das FEHLENDE und nicht das
    #   Verlangte: Wer 40 von 64 Kobbelsteinen hat, will wissen, dass 24 fehlen.
    fehlt: "<warnung>Fuer {name} fehlt dir noch: </warnung><betont>{fehlt}</betont>"
    # {name} - steht auf dieser Insel schon. Je Insel EINMAL; wer seine Insel freigibt,
    #   gibt ihren Fortschritt mit auf.
    schon: "<fliesstext>{name} ist auf dieser Insel schon erfuellt.</fliesstext>"
    # {name} - das getippte Wort steht nicht in der Liste. MIT dem Wort, damit ein
    #   Spieler seinen Tippfehler liest.
    unbekannt: "<warnung>Die Herausforderung {name} gibt es nicht</warnung><fliesstext> - /wolke aufgaben zeigt alle.</fliesstext>"
    # {eigentuemer} - die Insel gehoert einem anderen, und du bist dort kein Mitbauer.
    #   Ein eigener Satz neben mitbauer.fremd: Dort darf NUR der Eigentuemer, hier auch
    #   jeder Mitbauer - zwei Regeln mit einem Satz zu beschreiben hiesse, dass der Satz
    #   in einem der beiden Faelle falsch ist.
    fremd: "<warnung>Diese Insel gehoert <betont>{eigentuemer}</betont> - abgeben darf nur, wer dort bauen darf.</warnung>"
    # {name} - gezaehlt war genug da, genommen wurde zu wenig. Der Fall liegt zwischen
    #   zwei Augenblicken: Was ein Spieler dazwischen wegwirft, ist weg. Alles Genommene
    #   ist zurueck, und nichts ist eingetragen.
    weggekommen: "<warnung>Bei {name} ist unterwegs etwas abhandengekommen - nichts ist abgegeben.</warnung>\n<fliesstext>Sieh in deinem Rucksack nach und versuch es noch einmal.</fliesstext>"
  # DIE NAMEN DER HERAUSFORDERUNGEN - je Aufgabe der config.yml eine Zeile.
  #
  # Dieselbe Bauart wie beruf.name: Welche es gibt, steht in der config.yml
  # (wolken.aufgaben.liste), wie sie heissen, hier. Wer dort eine hinzufuegt, traegt
  # hier eine Zeile mit demselben Namen ein.
  #
  # Fehlt die Zeile, sagt es das Startprotokoll, und in der Tafel steht der Pfad. Die
  # Aufgabe bleibt abgebbar - sie wegzulassen machte eine STUFE unerreichbar, und damit
  # ein Erz, das niemand mehr bekommt.
  #
  # WORTE und keine Saetze: Sie werden in die Tafel, in die Zusage und in jede Absage
  # eingesetzt. Ein Farbtag darin ueberschriebe die Farbe der Zeile, in der er landet.
  # DIE PUNKTZAHL UND DIE RANGLISTE - /wolke punkte zaehlt, /wolke rangliste zeigt.
  #
  # Die Punktzahl entscheidet NICHTS: Sie steht in der Rangliste, und das ist alles. Die
  # Erzausbeute haengt an der Stufe und damit an den Herausforderungen.
  punkte:
    # {chunks} - die Zaehlung laeuft. Die Zahl steht darin, weil sie die Wartezeit
    #   erklaert: 64 Chunks sind bei einem je Takt gut drei Sekunden. Ohne diese Zeile
    #   haelt ein Spieler den Befehl fuer wirkungslos und tippt ihn wieder.
    laeuft: "<fliesstext>Deine Insel wird gezaehlt - {chunks} Chunks. Das Ergebnis kommt gleich.</fliesstext>"
    # {punkte} - fertig.
    fertig: "<kopf>Deine Insel bringt {punkte} Punkte.</kopf>\n<fliesstext>Wie du stehst, zeigt /wolke rangliste.</fliesstext>"
    # {sekunden} - zu frueh. Die Abklingzeit haengt an der INSEL und nicht am Spieler:
    #   Gezaehlt wird ein Feld, und jede Zaehlung liest Millionen Bloecke.
    zu-frueh: "<hinweis>Diese Insel wurde gerade gezaehlt - in {sekunden} Sekunden geht es wieder.</hinweis>"
    # Auf dieser Insel zaehlt schon jemand.
    laeuft-schon: "<hinweis>Auf dieser Insel zaehlt gerade schon jemand - warte, bis es durch ist.</hinweis>"
    # Es gibt keine Punktetabelle (wolken.punkte.tabelle ist leer). Dann waere jede
    #   Insel 0 wert, und die Rangliste zeigte nur ihr Alter.
    aus: "<fliesstext>In Wolkenwerder werden keine Punkte gezaehlt</fliesstext><gedaempft> - der Betreiber fuellt dafuer wolken.punkte.tabelle.</gedaempft>"
  rangliste:
    # Die Ueberschrift.
    kopf: "<kopf>Die besten Wolkeninseln</kopf>"
    # {rang} {spieler} {feld} {punkte} {stufe} - eine Zeile je Platz. Die STUFE steht
    #   neben den Punkten, und das ist der Witz dieser Liste: Die Punkte sagen, was
    #   gebaut wurde, die Stufe, was geleistet wurde.
    zeile: "<fliesstext>  {rang}. <betont>{spieler}</betont> · {punkte} Punkte · Stufe {stufe} <gedaempft>· Insel {feld}</gedaempft></fliesstext>"
    # Es gibt noch keine Insel. Am ersten Tag ist das der Normalfall - und eine
    #   Ueberschrift ueber einer leeren Liste sieht aus wie ein Fehler.
    leer: "<fliesstext>In Wolkenwerder hat noch niemand eine Insel - die erste kannst du mit /wolke nehmen haben.</fliesstext>"
  # DAS BIOM - /wolke biom zeigt es, /wolke biom <name> wechselt es.
  #
  # Das Biom entscheidet, WAS erscheint und WAS waechst: swamp gibt Schleim und damit
  # Kolben, snowy_plains gibt Eis und damit Wasser, mushroom_fields laesst kein Monster
  # erscheinen, desert laesst es nie regnen.
  biom:
    # {biom} {preis} - welches Biom die Insel hat und was ein Wechsel kostet.
    stand: "<fliesstext>Diese Insel liegt im Biom <betont>{biom}</betont> · ein Wechsel kostet {preis}</fliesstext>"
    # {biome} - was zur Wahl steht.
    wahl: "<gedaempft>  Zur Wahl: {biome} - /wolke biom \\<name></gedaempft>"
    # {biom} {preis} {danach} - gewechselt und bezahlt. Die zweite Zeile ist keine
    #   Hoeflichkeit: Biome stehen IM Chunk, und der Client hat ihn schon. Ohne diesen
    #   Hinweis haelt ein Spieler den bezahlten Wechsel fuer wirkungslos.
    gesetzt: "<bestaetigung>Das Biom deiner Insel ist jetzt {biom} - {preis} abgebucht.</bestaetigung>\n<fliesstext>Es bleiben {danach}. Sichtbar wird es, wenn du die Gegend neu betrittst.</fliesstext>"
    # {biom} - dieselbe Zusage, wenn der Wechsel gratis ist.
    gesetzt-gratis: "<bestaetigung>Das Biom deiner Insel ist jetzt {biom}.</bestaetigung>\n<fliesstext>Sichtbar wird es, wenn du die Gegend neu betrittst.</fliesstext>"
    # {biom} {biome} - dieses Biom gibt es nicht. MIT der ganzen Liste: Wer sich
    #   vertippt hat, soll nicht erst einen zweiten Befehl brauchen.
    nicht-angeboten: "<warnung>Das Biom {biom} gibt es hier nicht.</warnung>\n<fliesstext>Zur Wahl: {biome}</fliesstext>"
    # Es gibt gar keine Biomwahl - wolken.biome ist leer.
    keine-wahl: "<fliesstext>In Wolkenwerder gibt es keine Biomwahl</fliesstext><gedaempft> - der Betreiber fuellt dafuer wolken.biome.</gedaempft>"
    # {preis} {fehlt} - das Guthaben reicht nicht.
    zu-wenig: "<warnung>Ein Biomwechsel kostet {preis} - dir fehlen {fehlt}.</warnung>"
    # {eigentuemer} - die Insel gehoert einem anderen. Ein eigener Satz neben
    #   mitbauer.fremd und abgabe.fremd: Abgeben darf jeder Mitbauer, das Biom wechseln
    #   und zuruecksetzen nur der Eigentuemer.
    nicht-deine: "<warnung>Diese Insel gehoert <betont>{eigentuemer}</betont> - das Biom aendert nur der Eigentuemer.</warnung>"
  zuruecksetzen:
    # Die Rueckfrage. Zurueckgesetzt wird nur der Quader der STARTINSEL - was daneben
    #   steht, bleibt. Der Fortschritt bleibt auch: Die erfuellten Herausforderungen
    #   gehoeren der Insel, und die Gegenstaende dafuer sind weg.
    warnung: "<hinweis>Das setzt die Startinsel wieder hin - Wiese, Baum und eine neue Truhe.</hinweis>\n<fliesstext>Was an ihrer Stelle steht, ist danach weg. Dein Fortschritt bleibt. Noch einmal mit /wolke zuruecksetzen bestaetigen</fliesstext>"
    # {feld} - die Startinsel steht wieder.
    erteilt: "<bestaetigung>Die Startinsel auf Feld {feld} steht wieder.</bestaetigung>\n<fliesstext>In der Truhe liegt, was du zum Anfangen brauchst.</fliesstext>"
  aufgabe:
    erster-stein: "Erster Stein"
    holzfaeller: "Holzfaeller"
    kohlebrenner: "Kohlebrenner"
    baecker: "Baecker"
    steinmetz: "Steinmetz"
    erstes-eisen: "Erstes Eisen"
    kupferschmied: "Kupferschmied"
    goldschmied: "Goldschmied"
    rotsteinkundiger: "Rotsteinkundiger"
    diamantschleifer: "Diamantschleifer"

# Die Rangleiter (Plan 9, Schritt 12): Wer lange genug taetig gespielt hat und die
# Taten vorweisen kann, steigt von selbst auf - ohne Antrag, ohne Team. Welche Stufen
# es gibt, was sie verlangen und was sie geben, steht im Abschnitt raenge der
# config.yml. HIER stehen nur die Worte.
#
# {rang} ist der SCHLUESSEL aus der config.yml - also reisender, siedler, buerger oder
#   wie du deine Stufen genannt hast. Eine Liste der Rangnamen gibt es hier nicht und
#   kann es nicht geben: Du legst sie selbst an.
# DAS HAUPTMENUE - /menu [21.11.2026, Schritt 13 Teil B].
#
# Ein Menue ist ein FORMULAR und keine Schriftrolle (Plan 9a.5): je Eintrag ein Name und
#   EINE Zeile Erklaerung, in Alltagssprache. Der Titel traegt den Namen des Ortes
#   (Plan 9a.1).
#
# WAS IM MENUE STEHT, entscheidet das Programm - welche Befehle es gibt, weiss es. Wie sie
#   heissen und was sie erklaeren, steht hier. Ein Klick fuehrt den Befehl aus, den die
#   Zeile klick nennt; Recht und Geld prueft dann derselbe Befehl, den der Spieler auch
#   von Hand tippt.
menue:
  titel: "<kopf>Der Freimarkenbund</kopf>"
  # {befehl} - die Zeile unter jedem Eintrag. Sie nennt den Befehl ausdruecklich: So lernt
  #   ein Spieler ihn, statt vom Menue abhaengig zu bleiben.
  klick: "<gedaempft>Klick: /{befehl}</gedaempft>"
  # Ein Menue ist ein Inventar, und die Konsole hat keines.
  keine-konsole: "<fliesstext>/menu zeigt ein Menue - auf der Konsole gibt es keines.</fliesstext>"
  # Ein Gegenstand der Tafel ist unbekannt - ein Baufehler. Der Spieler soll einen Satz
  #   lesen und nicht in ein leeres Fenster sehen; der Grund steht im Serverprotokoll.
  gestoert: "<warnung>Das Menue liess sich nicht oeffnen</warnung><fliesstext> - der Grund steht im Serverprotokoll.</fliesstext>"
  # JE EINTRAG ZWEI ZEILEN: name ist der Anzeigename des Gegenstands, erklaerung die Zeile
  #   darunter. Beide gehen in den GEGENSTAND und nicht in den Chat - Paper uebersetzt
  #   Gegenstandsnamen nicht, darum loest das Plugin sie beim Bauen des Menues auf.
  eintrag:
    parzelle:
      name: "<kopf>Deine Parzellen</kopf>"
      erklaerung: "<fliesstext>Grund nehmen, ansehen, Mitbauer eintragen</fliesstext>"
    mark:
      name: "<kopf>Dein Guthaben</kopf>"
      erklaerung: "<fliesstext>Kontostand, Verlauf, Goldmark tauschen</fliesstext>"
    rang:
      name: "<kopf>Dein Rang</kopf>"
      erklaerung: "<fliesstext>Welche Stufe du hast - und was zur naechsten fehlt</fliesstext>"
    beruf:
      name: "<kopf>Dein Beruf</kopf>"
      erklaerung: "<fliesstext>Beruf waehlen, ansehen, aufgeben</fliesstext>"
    markt:
      name: "<kopf>Der Bundesmarkt</kopf>"
      erklaerung: "<fliesstext>Was der Bund ankauft, und zu welchem Preis</fliesstext>"
    laden:
      name: "<kopf>Die Markthalle</kopf>"
      erklaerung: "<fliesstext>Einen Laden mieten, verlaengern, kuendigen</fliesstext>"
    freistadt:
      name: "<kopf>Die Freistaedte</kopf>"
      erklaerung: "<fliesstext>Staedte ansehen, gruenden, Grundstuecke kaufen</fliesstext>"
    werder:
      name: "<kopf>Hafenwerder</kopf>"
      erklaerung: "<fliesstext>Eine Meerinsel nehmen und sichern</fliesstext>"
    wolke:
      name: "<kopf>Wolkenwerder</kopf>"
      erklaerung: "<fliesstext>Deine Wolkeninsel, ihr Biom und die Herausforderungen</fliesstext>"
    hilfe:
      name: "<kopf>Alle Befehle</kopf>"
      erklaerung: "<fliesstext>Die ganze Liste, nach Bereichen geordnet</fliesstext>"
    regeln:
      name: "<kopf>Die Regeln</kopf>"
      erklaerung: "<fliesstext>Was auf diesem Server gilt</fliesstext>"

# DIE REGELN - /regeln [21.11.2026, Schritt 13 Teil B].
#
# WER DIE REGELN MACHT, ist der Betreiber: Was hier steht, ist ein Vorschlag und kein
#   Gesetz. Der Text ist EIN Satz, und die Folge BACKSLASH-n trennt seine Zeilen -
#   schreibe so viele, wie du brauchst. Im Fenster wird jede Zeile ein eigener Block, im
#   Chat eine eigene Zeile.
#
# ZWEI FORMEN, und beide kommen aus denselben Zeilen: Ein Spieler bekommt ein FENSTER (es
#   haelt das Spiel an, waehrend er liest), die Konsole und /regeln chat bekommen den
#   Chat.
# WESSEN CLIENT KEINE FENSTER KENNT - ein alter ueber ViaProxy -, der sieht beim bloassen
#   /regeln NICHTS: Der Server schickt das Fenster hinaus und erfaehrt nicht, dass es
#   unterwegs verworfen wurde. Sein Weg ist /regeln chat, und darum steht der in der
#   Beschreibung des Befehls (befehl.beschreibung.regeln) - die liest jeder Client in
#   seiner Befehlsliste. Geht das Fenster wegen eines Fehlers auf dem SERVER nicht auf,
#   kommt der Chat von selbst, und das Plugin sagt es einmal im Serverprotokoll.
regeln:
  # Im Chat die erste Zeile, im Fenster der Titel. Darum GENAU EINE Zeile.
  kopf: "<kopf>Die Regeln des Freimarkenbundes</kopf>"
  text: "<fliesstext>- Baue nur auf eigenem Grund. Eine Parzelle gehoert dem, der sie genommen hat.</fliesstext>\n<fliesstext>- Nimm nichts, was dir nicht gehoert. Diebstahl aus Kisten und Laeden wird geahndet.</fliesstext>\n<fliesstext>- Kein Angriff auf andere Spieler in den geschuetzten Welten.</fliesstext>\n<fliesstext>- Keine Hilfsmittel, die dir Vorteile verschaffen - kein Durchblick durch Stein, kein Fliegen, keine Makros.</fliesstext>\n<fliesstext>- Sei anstaendig im Chat. Beleidigung und fremde Werbung haben hier keinen Platz.</fliesstext>"
  # Die Zeile unter dem Text, nur im Chat - im Fenster ist der Knopf das Ende. Darf leer
  #   bleiben: fuss: ""
  fuss: "<gedaempft>Wer dagegen handelt, verliert Rang, Grund oder den Zugang.</gedaempft>"
  # Der Knopf, der das Fenster schliesst. Auch er GENAU EINE Zeile.
  knopf: "<betont>Gelesen</betont>"

# DIE ANMELDUNG IM BUERGERAMT - /regeln annehmen [21.11.2026, Schritt 13 Teil C].
#
# WER ZUM ERSTEN MAL ANKOMMT, bekommt beim Beitritt ein FENSTER mit zwei Knoepfen: den
#   Regeltext von oben, darunter die Frage, und dann Annehmen oder Spaeter. Erst nach der
#   Annahme handelt er am Bundesmarkt; alles andere kann er von Anfang an.
# DER REGELTEXT STEHT NICHT HIER, sondern oben unter regeln.text - das Formular zeigt
#   genau jenen. Ein zweiter Text hier waere derselbe an zwei Orten, und du aenderst
#   eines Tages nur einen.
# WELCHE FASSUNG GILT, steht in der config.yml unter anmeldung.fassung. Aenderst du die
#   Regeln inhaltlich, erhoehe sie - sonst gilt die alte Zustimmung weiter.
# WER KEIN FENSTER BEKOMMT - ein alter Client ueber ViaProxy -, liest dieselben Zeilen im
#   Chat samt hinweis: Das ist die einzige Zeile, die ihm den Weg nennt, und darum darf
#   sie nicht leer bleiben.
anmeldung:
  # Im Chat die erste Zeile, im Fenster der Titel. Darum GENAU EINE Zeile.
  kopf: "<kopf>Aufnahme in den Freimarkenbund</kopf>"
  # Die Frage unter dem Regeltext - der ganze Unterschied zwischen Lesen und Annehmen.
  # Sie DARF mehrzeilig sein (Umbruchmarke), wenn du ausfuehrlicher fragen willst.
  frage: "<hinweis>Nimmst du diese Regeln an? Mit der Annahme wirst du Buerger des Bundes.</hinweis>"
  # Die zwei Knoepfe des Fensters. Beide GENAU EINE Zeile - ein Knopf traegt keine
  # zweite. Der erste tippt /regeln annehmen, der zweite schliesst nur; beim naechsten
  # Beitritt kommt das Fenster wieder.
  annehmen: "<bestaetigung>Ich nehme an</bestaetigung>"
  spaeter: "<gedaempft>Spaeter</gedaempft>"
  # Nach der Annahme - die Aufnahme in den Bund. Plan 10.1: Fiktion und Technik fallen
  # zusammen, also liest er hier keine Quittung, sondern eine Begruessung.
  angenommen: "<bestaetigung>Angenommen - willkommen im Freimarkenbund!</bestaetigung>\n<fliesstext>Mit /parzelle nehmen bekommst du deine erste Parzelle, und sie ist gratis.</fliesstext>"
  # Auf ein zweites /regeln annehmen. Ein eigener Satz und nicht derselbe wie oben: Eine
  # zweite Begruessung sieht aus, als haette die erste nicht gewirkt.
  schon-angenommen: "<fliesstext>Du hast die Regeln schon angenommen.</fliesstext>"
  # DIE BRUECKE FUER EINEN ALTEN CLIENT. Wer kein Fenster sehen kann, liest die Regeln im
  # Chat und diese Zeile - sie nennt den Befehl ausgeschrieben, weil er so zu tippen ist.
  hinweis: "<hinweis>Tippe /regeln annehmen, um die Regeln anzunehmen.</hinweis>"
  # Die Konsole kann nicht zustimmen - eine Zustimmung ist die Erklaerung eines Menschen.
  nur-spieler: "<fliesstext>Annehmen kann nur ein Spieler - die Konsole stimmt fuer niemanden zu.</fliesstext>"
  # Wenn anmeldung.an auf false steht und jemand den Befehl doch tippt.
  nicht-verlangt: "<fliesstext>Auf diesem Server ist keine Anmeldung noetig.</fliesstext>"

# DER RUNDGANG DURCH ALTFURT - Plan 10.2 [21.11.2026, Schritt 13 Teil D].
#
# WER EINE STATION BETRITT, liest zwei Zeilen: ihren Namen mit dem Fortschritt (die Zeile
#   station-entdeckt hier) und ihren eigenen Text. Beim zweiten Betreten nichts - ein
#   Stationstext bei jedem Schritt durch dieselbe Tuer waere eine Plage.
#
# DIE STATIONEN SELBST STEHEN NICHT HIER, denn welche es gibt, bestimmst du in der
#   config.yml unter rundgang.stationen. Je Station gehoeren ZWEI Zeilen hierher, und ihr
#   Schluessel folgt dem Namen aus der config.yml:
#
#     rundgang:
#       station:
#         buergeramt:
#           name: "Das Buergeramt"
#           text: "<fliesstext>Hier bekommst du deine erste Parzelle - gratis, mit /parzelle nehmen.</fliesstext>"
#         zunfthaus:
#           name: "Das Zunfthaus"
#           text: "<fliesstext>Hier waehlst du einen Beruf mit /beruf. Er bestimmt, womit du am besten verdienst.</fliesstext>"
#
#   DER NAME IST EIN WORT und traegt KEINE Farbe: Er wird in die Zeile station-entdeckt
#     eingesetzt, und ein Farbtag darin ueberschriebe die Farbe jener Zeile.
#   DER TEXT DARF MEHRZEILIG sein (Umbruchmarke) - eine Station, die zwei Dinge erklaert,
#     braucht zwei Zeilen.
#   FEHLT EINE DER ZWEI ZEILEN, bleibt die Station begehbar und zeigt ihren Pfad. Das
#     Startprotokoll nennt jede Station, der eine Zeile fehlt.
rundgang:
  # {station} {gesehen} {alle} - die Kopfzeile einer gerade entdeckten Station. BEIDE
  # Zahlen: "Station 2" sagt nicht, wie weit es noch ist, und ein Einstieg soll zeigen,
  # wann er fertig ist.
  station-entdeckt: "<kopf>{station}</kopf><gedaempft> - Station {gesehen} von {alle}</gedaempft>"
  # Der Abschluss - er kommt GENAU EINMAL. Hier gehoert hin, was ein Neuling als
  # Naechstes tun soll (Plan 10: "ein sichtbares naechstes Ziel"); darum darf die Zeile
  # mehrzeilig sein.
  abgeschlossen: "<bestaetigung>Rundgang geschafft - du kennst Altfurt!</bestaetigung>\n<fliesstext>Jetzt fehlt nur noch deine erste Parzelle: /parzelle nehmen, und sie ist gratis.</fliesstext>"


# ALLE BEFEHLE - /hilfe [21.11.2026, Schritt 13 Teil B].
#
# DIE BESCHREIBUNG EINES BEFEHLS STEHT HIER NICHT: Sie steht einmal unter
#   befehl.beschreibung und wird in zeile eingesetzt. Dieselbe Zeile zeigt auch die
#   Befehlsliste des Servers - ein zweiter Ort fuer dasselbe Wort wuerde veralten.
#
# WELCHE GRUPPEN es gibt und welcher Befehl in welche gehoert, entscheidet das Programm.
#   WIE SIE HEISSEN, steht hier. Gezeigt wird nur, was der Spieler auch tippen darf; eine
#   Gruppe, von der nichts uebrig bleibt, verschwindet mit ihrer Ueberschrift.
hilfe:
  kopf: "<kopf>Alle Befehle des Freimarkenbundes</kopf>"
  gruppe:
    grund: "<betont>Grund und Bauen</betont>"
    geld: "<betont>Geld und Handel</betont>"
    selbst: "<betont>Rang und Beruf</betont>"
    reisen: "<betont>Reisen und Treffen</betont>"
    welten: "<betont>Eigene Welten</betont>"
    bund: "<betont>Der Bund</betont>"
    # 22.11.2026: Schritt 14. Eine eigene Gruppe und kein Eintrag unter Geld - die
    #   Lotterie ist kein Handel.
    spiele: "<betont>Kleine Spiele in Altfurt</betont>"
  # {befehl} ohne Schraegstrich - der steht hier. {beschreibung} kommt aus
  #   befehl.beschreibung und traegt darum keine Farbe; gefaerbt wird sie hier.
  zeile: "<hinweis>/{befehl}</hinweis><gedaempft> - </gedaempft><fliesstext>{beschreibung}</fliesstext>"
  # Die Zeile unter der Liste. Darf leer bleiben: fuss: ""
  fuss: "<gedaempft>Jeder Befehl ohne Zusatz zeigt, was er kann.</gedaempft>"

raenge:
  # {rang} - die neue Stufe. Diese Zeile MUSS stehen: Wer neue Rechte bekommt und nicht
  #   liest, warum, haelt sie fuer einen Zufall.
  aufgestiegen: "<bestaetigung>Du bist jetzt {rang}!</bestaetigung>"
  # {rang} - die Stufe darueber, gesendet unmittelbar nach dem Aufstieg. Dieselbe
  #   Aufgabe wie {morgen} beim Tagesbonus: der Grund, weiterzuspielen.
  # DARF LEER BLEIBEN. Eine leere Zeile heisst hier nicht "kaputt", sondern "ich will
  #   den Ausblick nicht" - dann faellt sie weg, und der Aufstieg steht allein da.
  naechster: "<fliesstext>Als naechstes: {rang}.</fliesstext>"
  # Es gibt keine Stufe mehr darueber. Ein eigener Satz, damit der Spieler es LIEST und
  #   es nicht aus einer fehlenden Zeile schliessen muss.
  # DARF ebenfalls LEER BLEIBEN.
  hoechste: "<kopf>Damit stehst du auf der hoechsten Stufe.</kopf>"

  # /RANG - die Auskunft ueber den eigenen Stand [20.11.2026]. Vorher sah ein Spieler
  #   seinen Rang nur im Augenblick des Aufstiegs.
  schau:
    kopf: "<kopf>Dein Rang</kopf>"
    # {rang} - der Schluessel aus deiner config.yml, also siedler oder buerger.
    jetzt: "<fliesstext>Du bist <betont>{rang}</betont>.</fliesstext>"
    # {rang} der EINGETRAGENE, {gilt} der geltende Schluessel. Diese Zeile kommt, wenn in
    #   der Ablage eine Stufe steht, die in raenge.leiter nicht mehr vorkommt - etwa nach
    #   dem Umbenennen einer Stufe. Sie gehoert gelesen und gemeldet.
    unbekannt: "<warnung>Eingetragen ist {rang} - diese Stufe gibt es nicht mehr. Es gilt {gilt}; bitte melde das dem Team.</warnung>"
    # {rang} - die naechste Stufe. Darunter stehen ihre Bedingungen, je zwei Zeilen: was
    #   verlangt ist (aus mark.muenzhaus.bedingung.*) und was du hast.
    naechste: "<fliesstext>Als naechstes: <betont>{rang}</betont>. Dafuer zaehlt:</fliesstext>"
    # {stand} - was du hast. Zwei Saetze, weil die FARBE den Unterschied macht.
    stand-erfuellt: "<bestaetigung>    du hast {stand} - geschafft</bestaetigung>"
    stand-offen: "<fliesstext>    du hast {stand}</fliesstext>"
    # DARF LEER BLEIBEN - dann faellt die Zeile weg.
    fuss: "<gedaempft>/rang leiter zeigt alle Stufen.</gedaempft>"
  # /RANG LEITER - die ganze Leiter, je Stufe eine Zeile in einem von drei Zustaenden.
  leiter:
    kopf: "<kopf>Die Rangleiter</kopf>"
    # {rang} je Zeile. erreicht heisst "an oder unter deiner Stufe".
    erreicht: "<fliesstext>  {rang} - erreicht</fliesstext>"
    jetzt: "<betont>  {rang} - hier stehst du</betont>"
    offen: "<gedaempft>  {rang} - offen</gedaempft>"
  # raenge.an: false oder eine leere Leiter.
  aus: "<fliesstext>Auf diesem Server gibt es keine Raenge.</fliesstext>"
  # Die Ablage hat nicht geantwortet. KEIN Rueckfall auf die unterste Stufe: Der sieht
  #   aus wie eine Auskunft und ist eine Vermutung.
  gestoert: "<warnung>Dein Rang liess sich nicht lesen</warnung><fliesstext> - versuche es noch einmal. Der Grund steht im Serverprotokoll.</fliesstext>"
  # /rang zeigt den Rang EINES Spielers - die Konsole ist keiner.
  keine-konsole: "<fliesstext>/rang zeigt den Rang eines Spielers - auf der Konsole gibt es keinen.</fliesstext>"

muenzhaus:
  # DIE NAMEN DER KATALOGPOSTEN. Je Posten eine Zeile, und der Schluessel links ist
  # genau der aus der config.yml unter muenzhaus.katalog.
  #
  # EIN POSTEN OHNE ZEILE FAELLT NICHT WEG - er bleibt kaufbar und zeigt dann seinen
  # Pfad statt eines Namens. Das ist der kleinere Schaden: Ein weggefallener Posten
  # waere Kosmetik, die niemand mehr bekommt, und der Spieler suchte den Fehler bei
  # sich. Der Startlauf sagt dir, welcher Name fehlt.
  #
  # KEIN FARBTAG: Der Name wird in andere Saetze eingesetzt - in die Tafel, in die
  # Rueckfrage, in jede Absage - und ein Tag darin ueberschriebe die Farbe der Zeile,
  # in der er landet.
  #
  # Traegst du einen Posten in die config.yml ein, traegst du seinen Namen hier ein.
  posten:
    kuerbishut: "Kuerbishut"
    blumenkiste: "Blumenkiste"
    musikscheibe: "Musikscheibe"
    rathausglocke: "Rathausglocke"

# DIE LOTTERIE IN ALTFURT - /lotterie [22.11.2026, Schritt 14].
#
# DAS ERSTE LOS AM TAG IST GRATIS, jedes weitere kostet mehr. Darum hat die Standzeile
#   drei Formen: gratis, mit Preis, und "fuer heute ist Schluss". Eine einzige Zeile mit
#   einem Preis von 0 waere es nicht geworden - "kostet 0 Mark" schreibt so niemand.
#
# DER NAME DES GEWINNS KOMMT AUS DER config.yml und steht NICHT hier. Was ein Gewinn
#   heisst, gehoert zu seiner Beschreibung unter lotterie.gewinne.<name>.name - dort
#   steht auch sein Gewicht und seine Menge. Dadurch braucht ein neuer Gewinn keine Zeile
#   in dieser Datei. Er kommt unten als {gewinn} herein.
#
# JE GEWINNART EINE ZEILE: Mark ist ein Betrag, ein Gegenstand ist ein Ding, und
#   Goldmark ist etwas, das man sonst kaufen muss. Die zwei unteren sind GEZAEHLT, haben
#   also eins und viele - "1 Diamanten" waere falsch.
lotterie:
  # Die Ueberschrift von /lotterie. GENAU EINE Zeile.
  kopf: "<kopf>Die Lotterie von Altfurt</kopf>"
  # Steht anstelle des Preises, wenn das Los gratis war - sonst stuende dort "(Los: 0)".
  #   KEIN Farbtag: Das Wort wird in andere Saetze eingesetzt, und ein Tag darin
  #   ueberschriebe die Farbe der Zeile, in der es landet.
  gratis-wort: "gratis"
  stand:
    # {gezogen} wie viele Lose heute schon gezogen sind, {hoechste} die Tagesgrenze.
    gratis: "<bestaetigung>Dein naechstes Los ist gratis.</bestaetigung> <gedaempft>Heute gezogen: {gezogen} von {hoechste}.</gedaempft>"
    # {preis} was das naechste Los kostet.
    preis: "<fliesstext>Dein naechstes Los kostet <geld>{preis}</geld>.</fliesstext> <gedaempft>Heute gezogen: {gezogen} von {hoechste}.</gedaempft>"
    genug: "<hinweis>Du hast heute alle {hoechste} Lose gezogen - morgen ist wieder eines gratis.</hinweis>"
    # {staffel} rechnet das Programm aus deinen Zahlen: "1. gratis - 2. 500 - ...".
    #   Die Zahlen darin sind NACKT - ohne Einheit und ohne Tausenderpunkt, denn sie
    #   kommen aus dem Kern, und der kennt die Sprachdatei nicht. Darum nennt diese
    #   Zeile die Einheit selbst: Bei fuenf Stufen waere "500 Mark - 1.000 Mark -
    #   2.000 Mark" eine Wand, und der Betreiber soll die Staffel auf einen Blick sehen.
    staffel: "<gedaempft>Die Staffel in Mark: {staffel}</gedaempft>"
    hinweis: "<gedaempft>Ziehen mit /lotterie ziehen</gedaempft>"
  gezogen:
    # {gewinn} der Name aus der config.yml, {menge} der Betrag beziehungsweise die
    #   Stueckzahl, {preis} was das Los gekostet hat - auch 0, denn das gratis Los ist
    #   der Kern der ganzen Einrichtung.
    # {menge} traegt seine EINHEIT schon: Sie kommt aus waehrung.betrag
    #   beziehungsweise waehrung.goldmark - dort steht das Wort fuer einen Betrag, und
    #   von dort kommt jeder Betrag, den ein Spieler liest. Darum steht hier kein "Mark".
    mark: "<bestaetigung>{gewinn}:</bestaetigung> <geld>{menge}</geld> <gedaempft>(Los: {preis})</gedaempft>"
    goldmark:
      eins: "<bestaetigung>{gewinn}:</bestaetigung> <geld>{menge}</geld> <gedaempft>(Los: {preis})</gedaempft>"
      viele: "<bestaetigung>{gewinn}:</bestaetigung> <geld>{menge}</geld> <gedaempft>(Los: {preis})</gedaempft>"
    gegenstand:
      eins: "<bestaetigung>Gewonnen: {gewinn}</bestaetigung> <gedaempft>(Los: {preis})</gedaempft>"
      viele: "<bestaetigung>Gewonnen: {menge} x {gewinn}</bestaetigung> <gedaempft>(Los: {preis})</gedaempft>"
  # {preis} was das Los kostet, {guthaben} was du hast. BEIDE Zahlen, damit es eine
  #   Antwort ist und nicht nur ein Nein.
  zu-wenig: "<warnung>Das naechste Los kostet {preis} - du hast {guthaben}.</warnung>"
  heute-genug: "<hinweis>Du hast heute alle {hoechste} Lose gezogen - morgen ist wieder eines gratis.</hinweis>"
  # {fehlt} wie viele Stueck NICHT hineinpassen. Gefragt wird VOR der Zahlung und VOR der
  #   Zaehlung: Hier ist nichts abgebucht, und das Los ist NICHT verbraucht.
  kein-platz:
    eins: "<warnung>In deinem Rucksack fehlt Platz fuer 1 Stueck - dein Los ist nicht verbraucht.</warnung>"
    viele: "<warnung>In deinem Rucksack fehlt Platz fuer {fehlt} Stueck - dein Los ist nicht verbraucht.</warnung>"
  # Bezahlt, aber der Gewinn kam nicht an. Nach einer genauen Platzrechnung kann das
  #   nicht eintreten - es ist also ein Fehler im Programm oder in der Welt. Der Spieler
  #   soll lesen, dass sein Geld zurueck ist.
  erstattet: "<warnung>Der Gewinn kam nicht an - deine {preis} sind zurueck.</warnung>"
  # Eine Ablage oder eine Kasse hat geschwiegen. Es ist NICHTS passiert: kein Geld, kein
  #   Gewinn, und das Los ist nicht gezaehlt.
  gestoert: "<warnung>Die Lotterie antwortet gerade nicht - es ist nichts passiert.</warnung>"
  aus: "<hinweis>In Altfurt wird gerade nicht gezogen.</hinweis>"
  nur-spieler: "<warnung>Ein Los zieht ein Spieler. Von der Konsole geht das nicht.</warnung>"

# DER ANGELWETTBEWERB IN ALTFURT - /wettbewerb [22.11.2026, Schritt 14].
#
# DAS FENSTER geht taeglich zur eingestellten Uhrzeit auf (ab Werk 18:00) und bleibt die
#   eingestellte Dauer offen. Wer mitmachen will, meldet sich an und zahlt Startgeld; alle
#   Startgelder plus dem Zuschuss des Betreibers bilden den TOPF, und der geht nach der
#   eingestellten Verteilung an die Sieger.
#
# DIE ANSAGEN duerfen LEER bleiben. Dann erfaehrt man vom Wettbewerb nur ueber
#   /wettbewerb - das ist eine denkbare Serverform und kein Versehen. Wer sie behaelt,
#   hat eine Zeile im Chat, wenn das Fenster aufgeht, und eine Siegerliste am Ende.
#
# DIE SIEBEN WOCHENTAGE unten werden nur genannt, wenn der Wettbewerb NICHT taeglich
#   laeuft. Bei allen sieben Tagen ist "um 18:00" die ganze Auskunft.
wettbewerb:
  # Die Ueberschrift von /wettbewerb. GENAU EINE Zeile.
  kopf: "<kopf>Der Angelwettbewerb von Altfurt</kopf>"
  # {bis} wann das Fenster zugeht (Ortszeit), {topf} was darin liegt, {teilnehmer} wie
  #   viele dabei sind.
  offen: "<bestaetigung>Der Wettbewerb laeuft bis {bis}.</bestaetigung> <fliesstext>Im Topf: <geld>{topf}</geld> von {teilnehmer} Teilnehmern.</fliesstext>"
  # {beginn} wann der naechste aufgeht - nur die Uhrzeit, wenn taeglich; sonst mit Tagen.
  geschlossen: "<hinweis>Gerade laeuft kein Wettbewerb. Der naechste beginnt um {beginn}.</hinweis>"
  # {punkte} deine Punkte, {platz} dein Platz. GEZAEHLT - "1 Punkte" waere falsch.
  eigener-stand:
    eins: "<fliesstext>Du hast 1 Punkt und liegst auf Platz {platz}.</fliesstext>"
    viele: "<fliesstext>Du hast {punkte} Punkte und liegst auf Platz {platz}.</fliesstext>"
  # {startgeld} was die Teilnahme kostet.
  mitmachen: "<gedaempft>Mitmachen mit /wettbewerb anmelden ({startgeld})</gedaempft>"
  rangliste:
    kopf: "<betont>Die Rangliste</betont>"
    # {platz} die Zahl, {name} der Spieler, {punkte} seine Punkte. Die zwei Leerzeichen
    #   am Anfang sind die EINRUECKUNG - sie stehen hier, damit du sie sehen kannst.
    platz: "<fliesstext>  {platz}. {name} - {punkte}</fliesstext>"
    leer: "<gedaempft>  Noch ist niemand dabei.</gedaempft>"
  # {startgeld} was gezahlt wurde, {topf} was danach im Topf liegt.
  angemeldet: "<bestaetigung>Du bist dabei - {startgeld} gezahlt.</bestaetigung> <fliesstext>Im Topf: <geld>{topf}</geld></fliesstext>"
  schon-dabei: "<hinweis>Du bist schon angemeldet.</hinweis>"
  kein-lauf: "<hinweis>Gerade laeuft kein Wettbewerb. Der naechste beginnt um {beginn}.</hinweis>"
  # BEIDE Zahlen, damit es eine Antwort ist und nicht nur ein Nein.
  zu-wenig: "<warnung>Das Startgeld ist {startgeld} - du hast {guthaben}.</warnung>"
  aus: "<hinweis>In Altfurt wird gerade nicht gewertet.</hinweis>"
  gestoert: "<warnung>Der Wettbewerb antwortet gerade nicht - es ist nichts passiert.</warnung>"
  nur-spieler: "<warnung>Anmelden kann ein Spieler. Von der Konsole geht das nicht.</warnung>"
  ansage:
    # AN ALLE, wenn das Fenster aufgeht. Darf leer bleiben: beginn: ""
    beginn: "<kopf>Der Angelwettbewerb hat begonnen!</kopf> <fliesstext>Bis {bis}, Startgeld {startgeld} - /wettbewerb anmelden</fliesstext>"
    # AN ALLE am Ende. {teilnehmer} wie viele dabei waren, {topf} was verteilt wurde.
    ende: "<kopf>Der Angelwettbewerb ist zu Ende.</kopf> <fliesstext>{teilnehmer} Teilnehmer, <geld>{topf}</geld> im Topf:</fliesstext>"
    # Je Sieger eine Zeile. {preis} ist der Unterschied zur Rangliste oben.
    sieger: "<fliesstext>  {platz}. {name} - {punkte} Punkte, <geld>{preis}</geld></fliesstext>"
    niemand: "<gedaempft>Niemand war dabei.</gedaempft>"
  # An den Sieger allein. Er liest sie auch dann, wenn die Ansagen oben leer sind.
  gewonnen: "<bestaetigung>Platz {platz} im Angelwettbewerb mit {punkte} Punkten:</bestaetigung> <geld>{preis}</geld>"
  # DIE SIEBEN WOCHENTAGE. Sie werden in {beginn} eingesetzt, wenn der Wettbewerb nicht
  #   taeglich laeuft - KEIN Farbtag, er ueberschriebe die Farbe der Zeile.
  tag:
    montag: "Montag"
    dienstag: "Dienstag"
    mittwoch: "Mittwoch"
    donnerstag: "Donnerstag"
    freitag: "Freitag"
    samstag: "Samstag"
    sonntag: "Sonntag"

# ----------------------------------------------------------------------------
# SCHRITT 16a TEIL A: DIE TEAMROLLEN (Plan 12c.2)
#
# Alle Zeilen dieses Abschnitts sind BETREIBERTEXTE - /team haengt an
# freimarken.team, und das gehoert ab Werk nur Operatoren. Sie stehen trotzdem
# hier und nicht im Programm: Wer seine Rollen auf englische Namen umstellt,
# soll auch die Zeilen darum herum umstellen koennen.
#
# WELCHE ROLLEN es gibt, steht in der config.yml unter team.rollen - nicht
# hier. Dieser Abschnitt gibt ihnen nur ihre NAMEN, unter team.rolle.<name>.
# ----------------------------------------------------------------------------
team:
  # Die Ueberschrift von /team. GENAU EINE Zeile.
  kopf: "<kopf>Das Team des Freimarkenbunds</kopf>"
  # Eine Zeile je Mensch. {spieler} sein Name, {rollen} alle seine Rollen als
  #   fertige Aufzaehlung - ein Verwalter mit drei Rollen ist EINE Person.
  zeile: "<fliesstext>  {spieler} - <betont>{rollen}</betont></fliesstext>"
  # OHNE spitze Klammern um die Argumente formuliert: Sie waeren hier unbekannte
  #   Farbtags und damit eine Klage beim Laden. Wer sie trotzdem schreiben will, setzt
  #   zwei Backslashes davor - siehe BEISPIEL ESCAPE im Kopf dieser Datei.
  leer: "<gedaempft>Niemand hat eine Teamrolle. Vergeben wird eine mit /team gib - welche es gibt, zeigt /team rollen.</gedaempft>"
  # Der Trenner zwischen zwei Rollennamen. DARF LEER BLEIBEN: trenner-wort: ""
  #   KEIN Farbtag - das Wort landet mitten in einer anderen Zeile.
  trenner-wort: ", "
  # Steht anstelle des Vergebers, wenn die Rolle von der Konsole kam. Das ist der
  #   Normalfall beim Aufsetzen eines Servers - dort gibt es noch niemanden, der
  #   eine Rolle vergeben koennte. KEIN Farbtag, siehe trenner-wort.
  zeigen:
    kopf: "<kopf>Die Teamrollen von {spieler}</kopf>"
    # {rolle} ihr Name, {seit} die Vergabezeit nach zeit-muster, {von} wer sie
    #   vergeben hat. Die ZEIT steht mit darin, weil die Frage, die diesen Befehl
    #   ausloest, fast immer "seit wann" oder "von wem" ist.
    zeile: "<fliesstext>  <betont>{rolle}</betont> <gedaempft>- seit {seit}, von {von}</gedaempft></fliesstext>"
    von-konsole-wort: "der Konsole"
    # DIE ZEILE, DIE DEN BEFEHL RECHTFERTIGT: Die Rolle steht in der Datenbank,
    #   aber nicht mehr in der config.yml. Ihre Rechte wirken NICHT - im Spiel
    #   sieht das aus, als waere sie nie vergeben worden.
    unbekannt: "<warnung>    Die config.yml kennt \"{rolle}\" nicht mehr - diese Rolle gibt KEINE Rechte. Entweder wieder eintragen oder mit /team nimm abnehmen.</warnung>"
    leer: "<gedaempft>{spieler} hat keine Teamrolle.</gedaempft>"
  rollen:
    kopf: "<kopf>Die Teamrollen dieses Servers</kopf>"
    # {rolle} ihr Name, {rechte} wie viele Rechte sie vergibt. Die ZAHL und nicht
    #   die Namen: Eine Rolle hat bis zu einem Dutzend, und eine Zeile, die alle
    #   nennt, liest niemand mehr. Was darin steht, sagt die config.yml.
    zeile:
      eins: "<fliesstext>  <betont>{rolle}</betont> <gedaempft>- 1 Recht</gedaempft></fliesstext>"
      viele: "<fliesstext>  <betont>{rolle}</betont> <gedaempft>- {rechte} Rechte</gedaempft></fliesstext>"
    leer: "<hinweis>Dieser Server hat keine Teamrollen eingetragen. Sie stehen in der config.yml unter team.rollen.</hinweis>"
  # {spieler} der Betroffene, {rolle} die Rolle. Beide Namen in jeder Antwort:
  #   Wer zehn Rollen hintereinander vergibt, soll jede Zeile einzeln lesen koennen.
  vergeben: "<bestaetigung>{spieler} ist jetzt {rolle}.</bestaetigung>"
  hatte-schon: "<hinweis>{spieler} ist schon {rolle} - es ist nichts passiert.</hinweis>"
  genommen: "<bestaetigung>{spieler} ist nicht mehr {rolle}.</bestaetigung>"
  hatte-nicht: "<hinweis>{spieler} ist nicht {rolle} - es ist nichts passiert.</hinweis>"
  # Entzogen, UND die config.yml kennt die Rolle nicht mehr. Dasselbe Ergebnis aus
  #   einem anderen Grund: Der Betreiber hat einen Altbestand aufgeraeumt und soll
  #   das lesen - sonst sucht er die Rolle in seiner Datei und findet sie nicht.
  genommen-unbekannt: "<bestaetigung>{spieler} ist nicht mehr {rolle}.</bestaetigung> <gedaempft>Diese Rolle stand nur noch in der Datenbank.</gedaempft>"
  # {rolle} was getippt wurde, {rollen} die Liste der vorhandenen. Die Liste gehoert
  #   dazu: Der haeufigste Fall ist ein Vertipper.
  unbekannte-rolle: "<warnung>Die Rolle \"{rolle}\" gibt es nicht.</warnung> <gedaempft>Es gibt: {rollen}</gedaempft>"
  # DER RIEGEL: Eine Rolle vergibt nur, wer jedes ihrer Rechte selbst hat. {fehlende}
  #   nennt sie alle - wer eine Vollmacht weitergeben will, die er nicht hat, soll
  #   lesen, welche das ist, und es nicht fuer einen Fehler des Befehls halten.
  zu-wenig-rechte: "<warnung>Du kannst \"{rolle}\" nicht vergeben oder entziehen - dir fehlen Rechte, die diese Rolle gibt:</warnung> <gedaempft>{fehlende}</gedaempft>"
  kein-team: "<hinweis>Dieser Server hat keine Teamrollen eingetragen - es gibt nichts zu vergeben. Sie stehen in der config.yml unter team.rollen.</hinweis>"
  # {name} wie getippt. Vergeben wird auch an ABWESENDE - das ist der Normalfall.
  #   Diese Absage trifft nur den, der noch nie auf diesem Server war.
  unbekannter-spieler: "<warnung>Den Spieler \"{name}\" kennt dieser Server nicht.</warnung>"
  gestoert: "<warnung>Die Teamrollen antworten gerade nicht - es ist nichts passiert.</warnung>"
  # Das Muster fuer {seit} in zeigen.zeile. Buchstaben nach java.time:
  #   dd Tag, MM Monat, yyyy Jahr, HH Stunde, mm Minute. Ein kaputtes Muster ist
  #   eine Klage mit Zeilennummer und kein Wurf mitten im Befehl.
  zeit-muster: "dd.MM.yyyy HH:mm"
  # DIE NAMEN DER ROLLEN - je Rolle aus team.rollen in der config.yml eine Zeile.
  #   Eine OFFENE FAMILIE wie beruf.name.* : Wer dort eine sechste Rolle anlegt,
  #   gibt ihr hier ihren Namen. Fehlt die Zeile, steht in /team ihr Pfad - der
  #   Server startet trotzdem, denn es ist ein Verwaltungstext und kein Spieltext.
  #   KEIN Farbtag: Die Namen werden in andere Zeilen eingesetzt.
  rolle:
    helfer: "Helfer"
    moderator: "Moderator"
    verwalter: "Verwalter"
    eventleiter: "Eventleiter"
    baumeister: "Baumeister"

# ----------------------------------------------------------------------------
# SCHRITT 16a TEIL C: MELDEN UND BEARBEITEN (Plan 12c.3)
#
# ZWEI LESERSCHAFTEN in einem Abschnitt: Alles unter melden: liest ein
# gewoehnlicher Spieler, alles unter meldung: ein Moderator. Sie stehen
# zusammen, weil es EIN Vorgang ist - wer den Wortlaut der einen Seite aendert,
# soll die andere daneben sehen.
#
# DIE ANTWORT AN DEN MELDER ist der Kern des ganzen Teils. Plan 12c.3 begruendet
# das Meldewesen mit ihr: "Der Melder bekommt eine Rueckmeldung - sonst meldet
# beim zweiten Mal niemand mehr." Darum hat jeder Ausgang seinen eigenen Satz:
# Wer liest "deine Meldung wurde bearbeitet", weiss nicht, ob man ihm geglaubt
# hat.
# ----------------------------------------------------------------------------
melden:
  # {nummer} die Nummer der Meldung, {spieler} wen er gemeldet hat. Die Nummer
  #   gehoert hinein, auch wenn der Melder sie nie tippt: Sie ist das, was er
  #   nennen kann, wenn er nachfragt.
  angelegt: "<bestaetigung>Deine Meldung zu {spieler} ist aufgenommen (Nummer {nummer}).</bestaetigung> <gedaempft>Ein Moderator sieht sie sich an - du bekommst Bescheid.</gedaempft>"
  aus: "<hinweis>Auf diesem Server wird nicht gemeldet.</hinweis>"
  # {sekunden} wie lange er noch warten muss. Die ZAHL gehoert hinein - eine
  #   Absage ohne sie laesst ihn raten, und er versucht es sofort wieder.
  abklingzeit:
    eins: "<hinweis>Noch 1 Sekunde, dann kannst du wieder melden.</hinweis>"
    viele: "<hinweis>Noch {sekunden} Sekunden, dann kannst du wieder melden.</hinweis>"
  # {grenze} wie viele unerledigte Meldungen erlaubt sind. Der Satz muss sagen,
  #   dass die Meldung VERSCHOBEN und nicht verweigert ist - sonst liest der
  #   Melder eine Absage und meldet nicht wieder.
  zu-viele-offene:
    eins: "<hinweis>Du hast schon 1 unerledigte Meldung. Sobald sie bearbeitet ist, kannst du wieder melden.</hinweis>"
    viele: "<hinweis>Du hast schon {grenze} unerledigte Meldungen. Sobald eine davon bearbeitet ist, kannst du wieder melden.</hinweis>"
  selbst: "<warnung>Dich selbst kannst du nicht melden.</warnung>"
  # {mindestens} und {hoechstens} kommen aus dem Programm. DREI Saetze fuer drei
  #   Faelle: Der Spieler soll wissen, was er aendern muss.
  grund-zu-kurz:
    eins: "<warnung>Schreib dazu, was passiert ist - mindestens 1 Zeichen.</warnung>"
    viele: "<warnung>Schreib dazu, was passiert ist - mindestens {mindestens} Zeichen.</warnung>"
  grund-zu-lang:
    eins: "<warnung>Das ist zu lang - hoechstens 1 Zeichen.</warnung>"
    viele: "<warnung>Das ist zu lang - hoechstens {hoechstens} Zeichen.</warnung>"
  # Der Satz nennt NICHT, welches Zeichen stoert: Wer Farben faelschen wollte,
  #   braucht keine Anleitung.
  grund-zeichen: "<warnung>In deinem Grund steht ein Zeichen, das dort nicht hingehoert. Schreib ihn in gewoehnlichen Worten.</warnung>"
  unbekannter-spieler: "<warnung>Den Spieler {name} kennt dieser Server nicht.</warnung>"
  # Nicht aus Prinzip: Eine Meldung hat einen ORT, weil der Moderator hinspringt.
  #   Die Konsole steht nirgends.
  nur-spieler: "<warnung>Melden kann ein Spieler - eine Meldung haelt den Ort fest, und die Konsole steht nirgends.</warnung>"
  gestoert: "<warnung>Die Meldung konnte nicht aufgenommen werden - versuch es noch einmal.</warnung>"
  # AN ALLE ANWESENDEN MODERATOREN, wenn eine Meldung eingeht.
  #   DARF LEER BLEIBEN: ansage: ""
  #   Auf einem Server mit zehn Moderatoren und vielen Meldungen ist eine Zeile
  #   je Meldung eine Belaestigung, und /meldung gibt es ohnehin. Der Wortlaut
  #   IST der Schalter - genau wie bei den Ansagen des Angelwettbewerbs.
  ansage: "<hinweis>Neue Meldung {nummer}:</hinweis> <fliesstext>{melder} meldet {betroffener} - {grund}</fliesstext> <gedaempft>/meldung {nummer}</gedaempft>"
  antwort:
    # {anzahl} wie viele Antworten warten. Sie kommen beim Beitritt - ein
    #   Moderator erledigt eine Meldung um drei Uhr nachts, und eine Chatzeile
    #   ginge an niemanden.
    kopf:
      eins: "<kopf>Es gibt eine Antwort auf deine Meldung:</kopf>"
      viele: "<kopf>Es gibt {anzahl} Antworten auf deine Meldungen:</kopf>"
    # {nummer}, {betroffener} wen er gemeldet hatte, {vermerk} was der
    #   Bearbeiter geschrieben hat. ZWEI Saetze fuer zwei Ausgaenge: Wer liest
    #   "bearbeitet", weiss nicht, ob man ihm geglaubt hat.
    abgeschlossen: "<bestaetigung>  Meldung {nummer} ({betroffener}): bearbeitet.</bestaetigung> <fliesstext>{vermerk}</fliesstext>"
    abgewiesen: "<hinweis>  Meldung {nummer} ({betroffener}): kein Verstoss.</hinweis> <fliesstext>{vermerk}</fliesstext>"
    # Steht anstelle des Vermerks, wenn der Bearbeiter keinen geschrieben hat.
    #   KEIN Farbtag - das Wort landet mitten in einer anderen Zeile.
    ohne-vermerk-wort: "Danke fuer die Meldung."

meldung:
  liste:
    # {anzahl} wie viele unerledigte es gibt.
    kopf:
      eins: "<kopf>1 offene Meldung</kopf>"
      viele: "<kopf>{anzahl} offene Meldungen</kopf>"
    # {nummer}, {melder}, {betroffener}, {grund} (in der Liste gekuerzt),
    #   {alter} wie lange sie liegt, {stand} das Wort von unten.
    #   Das ALTER und nicht der Zeitpunkt: Was zaehlt, ist wie lange sie liegt.
    zeile: "<fliesstext>  <betont>{nummer}</betont> {melder} an {betroffener}: {grund}</fliesstext> <gedaempft>({alter}, {stand})</gedaempft>"
    leer: "<gedaempft>Es liegt keine Meldung an.</gedaempft>"
    hinweis: "<gedaempft>/meldung NUMMER zeigt sie, dahinter annehmen, abschliessen, abweisen oder hin</gedaempft>"
  zeigen:
    kopf: "<kopf>Meldung {nummer}</kopf> <gedaempft>({stand})</gedaempft>"
    wer: "<fliesstext>  {melder} meldet {betroffener}</fliesstext> <gedaempft>- {alter}</gedaempft>"
    # Der GANZE Grund, nicht der gekuerzte: Hier ist Platz, und genau dafuer
    #   oeffnet man eine Meldung einzeln.
    grund: "<fliesstext>  {grund}</fliesstext>"
    ort: "<gedaempft>  Ort: {welt} {x}/{y}/{z} - /meldung {nummer} hin</gedaempft>"
    bearbeiter: "<gedaempft>  In Arbeit bei {bearbeiter}</gedaempft>"
    vermerk: "<gedaempft>  Vermerk: {vermerk}</gedaempft>"
  genommen: "<bestaetigung>Meldung {nummer} ist jetzt bei dir.</bestaetigung>"
  # Der NAME ist der Zweck des Satzes: Ein blosses "zu spaet" liesse den
  #   zweiten Moderator ratlos.
  schon-genommen: "<hinweis>Meldung {nummer} hat schon {bearbeiter}.</hinweis>"
  abgeschlossen: "<bestaetigung>Meldung {nummer} ist abgeschlossen - {melder} bekommt Bescheid.</bestaetigung>"
  abgewiesen: "<bestaetigung>Meldung {nummer} ist abgewiesen - {melder} bekommt Bescheid.</bestaetigung>"
  schon-erledigt: "<hinweis>Meldung {nummer} ist schon {stand}.</hinweis>"
  unbekannt: "<warnung>Eine Meldung mit der Nummer {nummer} gibt es nicht.</warnung>"
  vermerk-zu-lang:
    eins: "<warnung>Der Vermerk ist zu lang - hoechstens 1 Zeichen.</warnung>"
    viele: "<warnung>Der Vermerk ist zu lang - hoechstens {hoechstens} Zeichen.</warnung>"
  hin:
    unterwegs: "<bestaetigung>Unterwegs zum Ort von Meldung {nummer} in {welt}.</bestaetigung>"
    # Das kommt vor: Eine Meldung aus Kornmark ueberlebt den Reset der Welt.
    welt-fehlt: "<warnung>Die Welt {welt} gibt es nicht mehr - dorthin fuehrt kein Weg.</warnung>"
  gestoert: "<warnung>Die Meldungen antworten gerade nicht - es ist nichts passiert.</warnung>"
  # Gilt fuer DREI Zweige: hin, annehmen und abschliessen/abweisen. EIN Satz,
  #   weil die Aussage dieselbe ist - und darum NICHT unter hin:, sonst aendert
  #   ein Betreiber hier unwissentlich die Absage von zwei anderen Zweigen.
  nur-spieler: "<warnung>Das kann ein Spieler - von der Konsole geht es nicht.</warnung>"
  # DIE VIER STAENDE. Sie werden in die Zeilen oben EINGESETZT - kein Farbtag,
  #   er ueberschriebe die Farbe der Zeile.
  stand:
    offen: "offen"
    in-arbeit: "in Arbeit"
    abgeschlossen: "abgeschlossen"
    abgewiesen: "abgewiesen"
  # DAS ALTER einer Meldung, eingesetzt in die Zeilen oben.
  #   {anzahl} ist die Zahl. ABKUERZUNGEN ab Werk, und das ist Absicht: "Min."
  #   beugt sich nicht, also gibt es kein "vor 1 Minuten". Wer ausschreibt, hat
  #   die Beugung selbst zu verantworten - und in einer Uebersichtsliste ist die
  #   kurze Form ohnehin die bessere.
  alter:
    minuten: "vor {anzahl} Min."
    stunden: "vor {anzahl} Std."
    tage: "vor {anzahl} Tg."
    soeben: "soeben"
strafe:
  # {nummer} die Nummer der Strafe, {spieler} wen es trifft, {art} stumm,
  #   rauswurf oder bann, {dauer} wie lange, {grund} warum. Die NUMMER gehoert
  #   hinein: Sie ist das, was der Moderator tippt, wenn er die Strafe aufheben
  #   will.
  verhaengt: "<bestaetigung>{spieler}: {art} - {dauer} (Nummer {nummer}).</bestaetigung> <fliesstext>{grund}</fliesstext>"
  # OHNE {dauer} - fuer einen Rauswurf. Ein eigener Satz, weil die Restzeit dort
  #   null ist: Im Startlauf stand "Rauswurf fuer 0 Sek.", und eine Dauer von
  #   null Sekunden ist keine Angabe.
  verhaengt-ohne-dauer: "<bestaetigung>{spieler}: {art} (Nummer {nummer}).</bestaetigung> <fliesstext>{grund}</fliesstext>"
  # {art} welche Art gefehlt hat.
  ohne-recht: "<warnung>Fuer {art} fehlt dir das Recht.</warnung>"
  # {art} die Art, {hoechstens} wie lange ohne das Recht erlaubt waere. Die
  #   GRENZE gehoert hinein - wer nur "zu lang" liest, tippt als naechstes
  #   dieselbe Zahl. Nach Plan 12c.2 ist das die Grenze zwischen Moderator und
  #   Verwalter.
  ohne-recht-dauerhaft: "<warnung>Fuer {art} darfst du hoechstens {hoechstens} verhaengen.</warnung> <gedaempft>Laenger oder dauerhaft kann ein Verwalter.</gedaempft>"
  # {spieler} wer im Team ist. Der Satz muss sagen, WARUM es nicht geht - sonst
  #   haelt der Moderator es fuer einen Fehler und versucht es noch dreimal.
  ohne-recht-team: "<warnung>{spieler} ist selbst im Team.</warnung> <gedaempft>Das kann ein Verwalter entscheiden.</gedaempft>"
  # Beim AUFHEBEN fehlt nicht das Recht fuer eine Art, sondern das zum
  #   Zuruecknehmen - darum ein eigener Satz. Ein gemeinsamer muesste eine Art
  #   nennen, die es hier nicht gibt.
  ohne-recht-aufheben: "<warnung>Zum Aufheben fehlt dir das Recht.</warnung>"
  # {nummer} die Strafe. Nach Plan 12c.2 Absicht: Wer nicht dauerhaft sperren
  #   darf, nimmt auch keinen dauerhaften Bann zurueck. Der Satz muss das SAGEN,
  #   sonst haelt der Moderator es fuer einen Fehler.
  ohne-recht-dauerhaft-aufheben: "<warnung>Strafe {nummer} ist zu schwer fuer dich - sie aufzuheben kann ein Verwalter.</warnung>"
  selbst: "<warnung>Dich selbst kannst du nicht bestrafen.</warnung>"
  # Beim AUFHEBEN: "bestrafen" waere dort falsch. Der Riegel dahinter war offen -
  #   ein stummgeschalteter Moderator mit dem Recht zum Aufheben las im eigenen
  #   Verlauf seine Nummer und war frei.
  selbst-aufheben: "<warnung>Deine eigene Strafe kannst du nicht aufheben.</warnung>"
  # {nummer} die Strafe. Mit der Nummer und nicht mit dem Namen: Wer aufhebt, hat
  #   die Nummer getippt.
  ohne-recht-team-aufheben: "<warnung>Strafe {nummer} trifft ein Teammitglied - sie aufzuheben kann ein Verwalter.</warnung>"
  # {mindestens} und {hoechstens} kommen aus dem Programm. DREI Saetze fuer drei
  #   Faelle: Der Moderator soll wissen, was er aendern muss - mitten im Vorfall.
  grund-zu-kurz:
    eins: "<warnung>Schreib dazu, warum - mindestens 1 Zeichen.</warnung>"
    viele: "<warnung>Schreib dazu, warum - mindestens {mindestens} Zeichen.</warnung>"
  grund-zu-lang:
    eins: "<warnung>Der Grund ist zu lang - hoechstens 1 Zeichen.</warnung>"
    viele: "<warnung>Der Grund ist zu lang - hoechstens {hoechstens} Zeichen.</warnung>"
  # Der Satz nennt NICHT, welches Zeichen stoert: Wer Farben faelschen wollte,
  #   braucht keine Anleitung. Der Grund steht in der oeffentlichen Bannliste.
  grund-zeichen: "<warnung>Im Grund steht ein Zeichen, das dort nicht hingehoert. Schreib ihn in gewoehnlichen Worten.</warnung>"
  unbekannter-spieler: "<warnung>Den Spieler {name} kennt dieser Server nicht.</warnung>"
  # {wort} was getippt wurde, {beispiele} die brauchbaren Formen. Die BEISPIELE
  #   sind der Zweck des Satzes: Wer 10 getippt hat, braucht 10m - und soll das
  #   hier lesen und nicht erraten.
  unbekannte-dauer: "<warnung>{wort} ist keine Dauer.</warnung> <gedaempft>Zahl und Einheit, zum Beispiel: {beispiele}</gedaempft>"
  # {spieler}, {art}, {nummer} die geltende Strafe, {bis} wann sie endet. Die
  #   NUMMER ist der Weg aus der Absage heraus: aufheben, dann neu verhaengen.
  schon-gestraft: "<warnung>{spieler} hat schon {art} bis {bis} (Nummer {nummer}).</warnung> <gedaempft>Erst aufheben, dann neu verhaengen.</gedaempft>"
  unbekannt: "<warnung>Eine Strafe mit der Nummer {nummer} gibt es nicht.</warnung>"
  # {nummer}, {art} - ein Rauswurf ist vorbei, sobald er geschieht.
  nicht-fortwirkend: "<hinweis>Strafe {nummer} ist ein {art} - daran ist nichts aufzuheben.</hinweis>"
  aufgehoben: "<bestaetigung>Strafe {nummer} gegen {spieler} ({art}) ist aufgehoben.</bestaetigung>"
  # {nummer}, {wer} wer sie aufgehoben hat.
  schon-aufgehoben: "<hinweis>Strafe {nummer} hat {wer} schon aufgehoben.</hinweis>"
  gestoert: "<warnung>Das konnte nicht geschrieben werden - versuch es noch einmal.</warnung>"
  # {arten} die Zweige, die es gibt. Steht bei /strafe ohne weitere Angabe -
  #   ohne diesen Satz endet der Befehl in Brigadiers englischer Fehlermeldung.
  hinweis: "<kopf>/strafe ARTEN SPIELER DAUER GRUND</kopf>\n<fliesstext>Arten: {arten}</fliesstext>\n<gedaempft>/strafe aufheben NUMMER GRUND - /strafe verlauf SPIELER - /bannliste</gedaempft>"
  # AN ALLE ANWESENDEN, wenn eine Strafe faellt.
  #   DARF LEER BLEIBEN: ansage: ""
  #   Wer zusieht, wie jemand grieft, und nichts geschieht, meldet beim naechsten
  #   Mal nicht - die Ansage ist die Antwort an alle, die zugesehen haben. Der
  #   zweite Weg, sie abzuschalten, ist moderation.strafen.ansagen: false.
  ansage: "<hinweis>{spieler}: {art} - {dauer}.</hinweis> <fliesstext>{grund}</fliesstext>"
  # Desgleichen ohne Dauer - darf auch leer bleiben.
  ansage-ohne-dauer: "<hinweis>{spieler}: {art}.</hinweis> <fliesstext>{grund}</fliesstext>"
  # Desgleichen bei einer Aufhebung - darf auch leer bleiben.
  ansage-aufhebung: "<bestaetigung>{spieler} ist wieder frei ({art}).</bestaetigung> <fliesstext>{grund}</fliesstext>"
  getroffen:
    # WAS DER BESTRAFTE LIEST. Plan 12c.3: "der Grund wird dem Betroffenen
    #   angezeigt. Eine Strafe, die niemand erklaert, erzeugt nur Wiederkehr."
    #   Darum steht {grund} in JEDEM dieser Saetze, und zwar ungekuerzt.
    #
    # {grund} warum, {wer} wer ihn hinausgeworfen hat. Dieser Satz IST der
    #   Rauswurf - mehr bleibt von ihm nicht. Ein Kick ohne Grund ist ein
    #   Verbindungsabbruch, von dem der Spieler annimmt, sein Netz sei
    #   ausgefallen.
    rauswurf: "<warnung>Du wurdest hinausgeworfen.</warnung>\n<fliesstext>{grund}</fliesstext>\n<gedaempft>von {wer}</gedaempft>"
    # {grund}, {bis} wann die Sperre endet, {dauer} wie lange noch. ZWEI Saetze
    #   fuer befristet und dauerhaft: Wer dauerhaft gesperrt ist, soll das lesen
    #   und nicht ein Datum im Jahr 2126, das ihn fuer einen Augenblick hoffen
    #   laesst.
    bann: "<warnung>Du bist gesperrt bis {bis} (noch {dauer}).</warnung>\n<fliesstext>{grund}</fliesstext>"
    bann-dauerhaft: "<warnung>Du bist dauerhaft gesperrt.</warnung>\n<fliesstext>{grund}</fliesstext>\n<gedaempft>Wenn du das fuer falsch haeltst, schreib uns.</gedaempft>"
    # {grund}, {dauer} wie lange noch.
    stumm: "<warnung>Du bist stummgeschaltet - noch {dauer}.</warnung> <fliesstext>{grund}</fliesstext>"
    stumm-dauerhaft: "<warnung>Du bist dauerhaft stummgeschaltet.</warnung> <fliesstext>{grund}</fliesstext>"
    # {befehl} welcher Befehl, {grund}, {dauer}. Ein EIGENER Satz: Wer /msg
    #   tippt und "du bist stummgeschaltet" liest, haelt es fuer einen Fehler -
    #   er hat ja nicht in den Chat geschrieben.
    befehl: "<warnung>{befehl} ist gesperrt, solange du stumm bist - noch {dauer}.</warnung> <fliesstext>{grund}</fliesstext>"
  verlauf:
    # {anzahl} wie viele Strafen, {spieler} wessen.
    kopf:
      eins: "<kopf>1 Strafe gegen {spieler}</kopf>"
      viele: "<kopf>{anzahl} Strafen gegen {spieler}</kopf>"
    # {nummer}, {art}, {stand} gilt, abgelaufen oder aufgehoben, {wann} wann
    #   verhaengt, {grund} gekuerzt. Der STAND macht die Liste lesbar: Ohne ihn
    #   saehe ein Moderator drei Banne, von denen zwei zurueckgenommen wurden.
    zeile: "<fliesstext>  {nummer} {art} ({stand}) {wann} - {grund}</fliesstext>"
    leer: "<fliesstext>Gegen {spieler} steht nichts.</fliesstext>"
    hinweis: "<gedaempft>/strafe aufheben NUMMER GRUND</gedaempft>"
  art:
    # Die Worte fuer die drei Arten. KEIN Farbtag - sie landen mitten in
    #   anderen Zeilen.
    stumm: "stumm"
    rauswurf: "Rauswurf"
    bann: "Sperre"
  stand:
    # Wo eine Strafe steht. KEIN Farbtag, siehe oben.
    gilt: "gilt"
    abgelaufen: "abgelaufen"
    aufgehoben: "aufgehoben"
  dauer:
    # {anzahl} die Zahl. KEIN Farbtag - diese Worte werden EINGESETZT.
    #
    # ABKUERZUNGEN, und das hat einen gemessenen Grund: Ein eingesetztes Wort
    #   ist im Programm Art.WORT und kennt keine Mehrzahl - "Min." beugt sich
    #   nicht. Wer ausschreibt ("1 Minuten"), verantwortet die Beugung selbst.
    dauerhaft: "dauerhaft"
    sekunden: "{anzahl} Sek."
    minuten: "{anzahl} Min."
    stunden: "{anzahl} Std."
    tage: "{anzahl} Tg."
  wer:
    # Steht anstelle eines Namens, wenn die Konsole gestraft hat. KEIN Farbtag.
    konsole: "der Konsole"
  # Wie ein Zeitpunkt geschrieben wird. Ein Muster fuer DateTimeFormatter, kein
  #   Satz: Ein unbrauchbares Muster ist eine Klage beim Laden. Gerechnet wird
  #   in die Zone aus zeit.zone - bei einer Sperre ist das die Zeit, auf die
  #   jemand wartet.
  zeit-muster: "dd.MM.yyyy HH:mm"

bannliste:
  # {anzahl} wie viele gesperrt sind.
  kopf:
    eins: "<kopf>1 Spieler ist gesperrt</kopf>"
    viele: "<kopf>{anzahl} Spieler sind gesperrt</kopf>"
  # {spieler}, {bis} wann die Sperre endet, {grund} gekuerzt. Plan 12c.4:
  #   "Bannliste mit Grund und Dauer - oeffentlich, wie im Vorbild." Beides ist
  #   unbequem, und genau deshalb gehoert es dazu: Die Liste zwingt zu
  #   Begruendungen, die standhalten.
  zeile: "<fliesstext>  {spieler} bis {bis} - {grund}</fliesstext>"
  leer: "<bestaetigung>Niemand ist gesperrt.</bestaetigung>"
  # Steht, wenn moderation.strafen.bannliste-oeffentlich auf false steht. Eine
  #   leere Liste waere die falsche Antwort - sie behauptet, niemand sei gesperrt.
  ohne-recht: "<warnung>Die Bannliste ist auf diesem Server nicht oeffentlich.</warnung>"
  gestoert: "<warnung>Die Bannliste ist gerade nicht lesbar - versuch es noch einmal.</warnung>"

einsehen:
  # {bis} der Zeitpunkt nach zeit-muster, {dauer} wie lange noch. BEIDES: Den
  #   Zeitpunkt merkt man sich, die Restdauer sagt, ob es noch reicht.
  #
  # Derselbe Satz beim VERLAENGERN - ein erneutes /einsehen an setzt die Frist
  #   neu, und in beiden Faellen gilt die Einsicht ab jetzt genauso lange.
  an: "<bestaetigung>Du siehst jetzt in fremde Behaelter - bis {bis} (noch {dauer}).</bestaetigung> <gedaempft>Nehmen kannst du nichts.</gedaempft>"
  aus: "<bestaetigung>Du siehst nicht mehr ein.</bestaetigung>"
  # Ein EIGENER Satz: Wer "ist jetzt aus" liest auf etwas, das nie an war,
  #   glaubt, er habe eben noch eingesehen - und das ist die Annahme, mit der
  #   man eine fremde Kiste fuer die eigene haelt.
  war-aus: "<hinweis>Du hast gar nicht eingesehen.</hinweis>"
  stand-an: "<fliesstext>Du siehst ein bis {bis} (noch {dauer}).</fliesstext>"
  stand-aus: "<fliesstext>Du siehst nicht ein.</fliesstext>"
  # DER SATZ, OHNE DEN DAS WERKZEUG UNBRAUCHBAR IST. Plan 12c.3: "hinsehen
  #   duerfen, anfassen nicht" - und das "nicht" muss man LESEN koennen: Ein
  #   Klick, der nichts tut, sieht aus wie ein Fehler des Servers.
  #
  # Er kommt gedrosselt, eine Zeile je zwei Sekunden - sonst wird aus einem
  #   gehaltenen Klick ein Chatregen.
  nur-sehen: "<warnung>Einsehen heisst hinsehen - nehmen kannst du hier nichts.</warnung>"
  # Nicht aus Prinzip: Einsehen ist der Zustand EINES Spielers, der in eine
  #   Kiste klickt. Was darin steht, liest der Betreiber ueber den Manager.
  nur-spieler: "<warnung>Einsehen kann ein Spieler - die Konsole klickt nicht in Kisten.</warnung>"
  # Wie ein Zeitpunkt geschrieben wird. OHNE Datum: Die Einsicht gilt Minuten,
  #   und ein Datum davor waere Platz ohne Auskunft.
  zeit-muster: "HH:mm:ss"
