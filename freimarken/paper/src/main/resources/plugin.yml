name: Freimarken
version: '${version}'
main: de.freimarken.paper.FreimarkenPlugin
api-version: '26.3'
description: Besitzleiter, Wirtschaft und Verwaltung des Freimarkenbunds
authors: [Friedrich]
website: https://friedrich-dietrich.de

# Keine commands-Liste: Befehle werden ueber die Lifecycle-API als Brigadier-Befehle
# angemeldet. Dort stehen Argumenttypen, Vervollstaendigung und Rechte je Zweig - hier
# stuenden nur Platzhalter.

permissions:
  freimarken.bauen.ueberall:
    description: Baut und oeffnet auf jeder Parzelle, auch auf fremder
    default: op
  # Besitz von Hand umschreiben: /freimarken besitz uebertragen <x> <z> <spieler>
  # und /freimarken besitz freigeben <x> <z> bestaetigen.
  #
  # Getrennt von freimarken.geld, obwohl beide Betreibereingriffe sind: Eine falsche
  # Buchung heilt eine Gegenbuchung, ein freigegebener Besitz nicht - die Stelle ist
  # wieder Bauland, und der Naechste nimmt sie. Jeder Versuch steht im Serverprotokoll,
  # mit Absender, Stelle, bisherigem und neuem Eigentuemer.
  #
  # Kistenshops wechseln NICHT mit: Die Tabelle kistenshop haengt an Welt und
  # Schildkoordinate, nicht an der Parzelle. Ein Shop des Vorbesitzers liegt danach auf
  # fremdem Grund und ist fuer beide verschlossen - die Antwort des Befehls sagt es.
  freimarken.besitz:
    description: "Besitz auf einen anderen Spieler uebertragen oder fremden Besitz freigeben"
    default: op

  # Geld von Hand buchen: /freimarken geld <spieler> <betrag>, ein Minus zieht ab.
  # EIGENES Recht und nicht freimarken.verwalten: Jene Zweige zeigen etwas oder tauschen
  # Einstellwerte aus, dieser aendert eine BUCHUNG. Jeder Versuch steht im
  # Serverprotokoll, und die Buchung steht im Verlauf des Spielers.
  #
  # BEIDE Waehrungen haengen hier [23.11.2026]: /freimarken geld und /freimarken goldgeld
  # (BundBefehle.geldbaum setzt fuer beide dasselbe requires). Das muss in der description
  # stehen - wer das Recht verteilt, liest sie, und eine Goldmark ist achthundert Mark.
  freimarken.geld:
    description: Einem Spieler Mark ODER Goldmark gutschreiben oder abziehen
    default: op
  # Das Hauptmenue oeffnen: /menu [21.11.2026]. Fuer JEDEN - es zeigt nur die
  # Eintraege, deren Recht der Oeffner hat (Menuetafel.fuerRechte), und ein Klick fuehrt
  # einen Befehl aus, der seine Rechte noch einmal selbst prueft.
  freimarken.menu:
    description: Das Hauptmenue oeffnen
    default: true
  # Die Regeln lesen: /regeln [21.11.2026]. Fuer JEDEN, und zwar notwendig: Wer die
  # Regeln nicht lesen darf, kann sich nicht an sie halten.
  freimarken.regeln:
    description: Die Regeln des Servers lesen
    default: true
  # Die Befehlsliste lesen: /hilfe [21.11.2026]. Fuer JEDEN - sie zeigt ohnehin nur,
  # was der Leser selbst tippen darf.
  freimarken.hilfe:
    description: Alle Befehle nach Bereichen lesen
    default: true
  # Ein Los ziehen: /lotterie und /lotterie ziehen [22.11.2026, Schritt 14]. EIN Recht
  # fuer Ansehen und Mitmachen, nicht zwei: Der Stand sagt nur, was ein Los kostet, und
  # wer das nicht lesen darf, soll auch nicht ziehen - zwei Rechte waeren hier eine
  # Unterscheidung ohne Fall. Fuer JEDEN, denn das erste Los am Tag ist gratis und
  # damit die taegliche Gelegenheit, die niemanden etwas kostet.
  freimarken.lotterie:
    description: Ein Los der Lotterie in Altfurt ziehen
    default: true
  # Am Angelwettbewerb teilnehmen: /wettbewerb und /wettbewerb anmelden [22.11.2026,
  # Schritt 14]. EIN Recht fuer Ansehen und Mitmachen, wie bei der Lotterie: Wer die
  # Rangliste nicht lesen darf, soll auch nicht antreten. Fuer JEDEN - die Teilnahme
  # kostet Startgeld, und wer es zahlt, soll mitspielen koennen.
  freimarken.wettbewerb:
    description: Am Angelwettbewerb in Altfurt teilnehmen
    default: true
  # Den eigenen Rang nachsehen: /rang und /rang leiter [20.11.2026]. Fuer JEDEN -
  # darum default true. Ohne diese Anmeldung antwortet Bukkit mit der Vorgabe OP, und
  # der Befehl waere fuer einen gewoehnlichen Spieler verborgen UND verwehrt, waehrend
  # im Programm "jeder" steht.
  freimarken.rang:
    description: Den eigenen Rang, die naechste Stufe und die Leiter ansehen
    default: true
  freimarken.verwalten:
    description: Darf die Welt nachsehen, sich zu einer Parzelle versetzen und die Einstellungen neu laden
    default: op
  # Ein EIGENES Recht und nicht freimarken.bauen.ueberall: Wer einen Bundshop anlegt,
  # legt einen Preis des Servers fest - mit unbegrenztem Vorrat und unbegrenztem Geld.
  # Das ist eine andere Vollmacht als die, einen Block auf fremdem Grund zu setzen.
  freimarken.shop.bund:
    description: Legt Bundshops an und baut sie ab - ohne Besitzer, mit unbegrenztem Vorrat
    default: op
  # ANGEMELDET SEIT DEM 10.11.2026, und das war ein Fund: Ein Recht, das hier fehlt,
  # gehoert NUR Operatoren. Bukkit antwortet auf ein unangemeldetes Recht mit seiner
  # Vorgabe, und die ist OP - der Zweig bleibt einem gewoehnlichen Spieler also verborgen
  # und verwehrt. /beruf und /markt waren damit seit ihrem Bau fuer niemanden ausser dem
  # Betreiber erreichbar, waehrend im Programm "jeder" steht; die Spieltests liefen als
  # Operator und sahen es nicht. GrenzeTest.31al haelt das jetzt.
  freimarken.beruf:
    description: Waehlt einen Beruf und sieht die Lohnsaetze - jeder
    default: true
  freimarken.beruf.spezialisierung:
    # Ein RECHT und keine Rangzahl: Raenge sind auf diesem Server Rechte, und eine
    # Rangzahl hier waere eine zweite Quelle fuer dieselbe Frage. Wer den Rang Buerger
    # vergibt, vergibt dieses Recht mit.
    description: Darf eine Spezialisierung halten - ein Rangvorteil
    default: op
  freimarken.markt:
    description: Sieht, was der Bundesmarkt ankauft, und was heute noch zu holen ist
    default: true
  freimarken.reisen:
    description: Darf mit /warp zwischen den Welten reisen
    default: true
  freimarken.zurueck:
    description: Darf mit /zurueck zum letzten Ort
    default: true
  freimarken.tpa:
    description: Darf mit /tpa einen Spieler fragen und Anfragen annehmen
    default: true
  freimarken.sofort:
    # Ueberspringt die drei Sekunden Wartezeit vor jedem Teleport. Fuer Betreiber und
    # ihre Werkzeuge: /freimarken parzelle soll nicht abbrechen, weil man sich dabei dreht.
    description: Reist ohne Wartezeit
    default: op
  freimarken.spawnpunkt.setzen:
    # Oeffnet allein /spawnpoint. Bett und Respawn-Anker bleiben auch damit gesperrt -
    # sie sind kein Werkzeug des Betreibers, sondern eine abgeschaltete Spielmechanik.
    description: Darf trotz der Sperre einen Spawnpunkt setzen
    default: op
  freimarken.laden:
    description: Darf die Ladeneinheiten der Markthalle sehen
    default: true
  freimarken.laden.mieten:
    # Ein zweites Recht und nicht freimarken.laden: Die Liste ist eine Auskunft, das
    # Mieten bewegt Geld. Plan 9 haengt "Laden mieten" am Rang Siedler - bis Schritt 12
    # den Aufstieg bringt, steht es hier auf true. Wer schon heute staffeln will, nimmt
    # es weg und gibt es einer Gruppe.
    description: Darf einen Laden mieten, verlaengern und kuendigen
    default: true
  freimarken.werder:
    # Die Auskunft: die eigenen Inseln sehen und nachsehen, was an einer Stelle liegt.
    description: Darf die eigenen Meerinseln sehen
    default: true
  freimarken.werder.nehmen:
    # Ein zweites Recht und nicht freimarken.werder: Das Ansehen ist eine Auskunft, das
    # Nehmen bewegt 75.000 Mark. Plan 9 haengt es spaeter an einen Rang - bis Schritt 12
    # den Aufstieg bringt, steht es hier auf true. Wer schon heute staffeln will, nimmt
    # es weg und gibt es einer Gruppe.
    description: Darf eine Meerinsel auf Hafenwerder nehmen
    default: true
  freimarken.wolke:
    # Die Auskunft: die eigenen Wolkeninseln sehen, heimreisen, Mitbauer setzen.
    description: Darf die eigenen Wolkeninseln sehen
    default: true
  freimarken.wolke.nehmen:
    # Ein zweites Recht, OBWOHL die Insel gratis ist - und gerade deshalb: Gratis heisst
    # nicht folgenlos. Jedes Nehmen belegt ein Rasterfeld auf Dauer und setzt 810
    # Bloecke in die Welt. Ein Betreiber, der Wolkenwerder erst oeffnen will, wenn sie
    # eingerichtet ist, braucht genau diesen Schalter; die andere Haelfte davon ist
    # wolken.hoechstzahl: 0.
    description: Darf eine Skyblockinsel auf Wolkenwerder nehmen
    default: true
  freimarken.freistadt:
    description: Darf die Liste der Freistaedte sehen
    default: true
  freimarken.freistadt.gruenden:
    # Ein zweites Recht und nicht freimarken.freistadt: Die Liste ist eine Auskunft, das
    # Gruenden bewegt 400.000 Mark. Plan 9 haengt es spaeter am Rang Buerger - bis
    # Schritt 12 den Aufstieg bringt, steht es hier auf true. Wer schon heute staffeln
    # will, nimmt es weg und gibt es einer Gruppe.
    description: Darf eine eigene Freistadt gruenden
    default: true
  freimarken.freistadt.grundstueck:
    # Ein DRITTES Recht: Gruenden bewegt 400.000 Mark, Zuschneiden bewegt nichts und
    # arbeitet nur auf dem eigenen Feld. Der eigentliche Riegel ist der Besitz der
    # Stadt - dieses Recht ist die Stelle, an der ein Betreiber den ganzen Zweig
    # abschalten kann, ohne die Staedte anzutasten.
    description: Darf in der eigenen Freistadt Grundstuecke zuschneiden
    default: true
  freimarken.freistadt.kaufen:
    # Die ANDERE Seite: grundstueck gehoert dem Stadtbesitzer, der sein Feld teilt und
    # Preise setzt. Kaufen tut jemand, der (noch) keine Stadt hat - und das ist der Weg,
    # auf dem man STADTBUERGER wird.
    #
    # BERICHTIGT [12.11.2026]: Hier stand, Schritt 12 haenge den Rang Buerger daran.
    # Das war eine Zusage, die der Plan nicht gibt - und sie war in sich gedreht: Sie
    # machte den RANG Buerger zur Voraussetzung fuer den Weg, auf dem man STADTBUERGER
    # wird. Der Rang kommt aus Spielzeit, die Stadtbuergerschaft aus Grundbesitz.
    description: Darf ein angebotenes Grundstueck in einer Freistadt kaufen
    default: true
  freimarken.freistadt.rechte:
    # Ein FUENFTES Recht, und es trennt eine neue Sache ab: Die drei davor gehen um Geld
    # und um Flaechen, dieses um die REGELN eines Gebiets - was fremde Leute im
    # Stadtgebiet duerfen. Wer es wegnimmt, laesst die Staedte ohne Buergerrechte laufen;
    # alles bleibt dann beim Stadtbesitzer, und die Staedte selbst bleiben unberuehrt.
    #
    # Das ANZEIGEN haengt nicht daran: Was in einer Stadt gilt, liest jeder, der dort
    # steht - ein Buerger muss wissen, was er darf, ohne den Besitzer zu fragen.
    description: Darf Buergerrechte und Regeln der eigenen Freistadt einstellen
    default: true
  freimarken.freistadt.kasse:
    # Ein SECHSTES Recht, und es trennt das Geld ab: Buergerrechte setzen heisst
    # entscheiden, was Fremde duerfen; abheben heisst Geld bewegen. Ein Betreiber, der
    # das eine erlauben und das andere sperren will, soll das koennen - mit einem
    # gemeinsamen Recht waere jede Einschraenkung eine doppelte.
    #
    # Das ANSEHEN haengt nicht daran: Was eine Freistadt einnimmt, liest jeder, der
    # dort steht. In einer Freistadt ist der Haushalt keine Privatsache - und ein
    # Buerger, der eine Marktgebuehr gezahlt hat, soll sehen, wo sie geblieben ist.
    description: Darf Geld aus der Kasse der eigenen Freistadt nehmen
    default: true
  freimarken.freistadt.aufgeben:
    # Ein SIEBTES Recht und nicht freimarken.freistadt.gruenden [Teil E6]: Ein
    # Betreiber kann das Gruenden offen lassen und das Aufgeben schliessen - etwa
    # auf einem Server, der Staedte nur vom Team beenden lassen will.
    #
    # Ab Werk erlaubt: Wer 400.000 Mark eingesetzt hat, soll aussteigen koennen.
    # Was er zurueckbekommt, stellt freistaedte.erstattung-prozent ein - und eine
    # Stadt, in der jemand anderem ein Grundstueck gehoert, laesst sich ohnehin
    # nicht aufloesen.
    description: Darf die eigene Freistadt aufgeben
    default: true
  freimarken.freistadt.raeumen:
    # Das EINZIGE Recht dieses Befehls, das ueber eigenen Besitz hinausgeht, und
    # darum nur fuer Operatoren: Wer es hat, loescht eine Stadt, fuer die ein
    # anderer gezahlt hat. Die Erstattung geht an DESSEN Konto, nicht an das
    # eigene - auch wenn er gerade nicht da ist.
    #
    # Gebraucht wird es fuer VERFALLENE Staedte: Die verschwinden nicht von selbst,
    # weil ein Zeitgeber keine Stadt mit 400.000 Mark Einsatz loeschen soll.
    description: Darf fremde Freistaedte raeumen
    default: op
  freimarken.spielzeit:
    description: Darf die eigene gemessene Spielzeit sehen
    default: true
  freimarken.spielzeit.andere:
    # Ein zweites Recht und nicht freimarken.verwalten: Spielzeit ist eine Messung und
    # keine Verwaltung. Ein Moderator soll sie lesen koennen, ohne die Einstellungen neu
    # laden zu duerfen.
    description: Darf die Spielzeit anderer anwesender Spieler sehen
    default: op
  freimarken.spielmodus.frei:
    # Fuer Baumeister und Betreiber. Ohne dieses Recht wuerde ein Spieler im Kreativmodus
    # beim Betreten Altfurts mitten im Bauen auf Abenteuer heruntergestuft.
    description: Behaelt den eigenen Spielmodus in jeder Welt
    default: op
  freimarken.shop:
    # default: true, anders als freimarken.blockbuch - hier verschenkt jemand Zutritt zu
    # SEINEM Laden, und das ist keine Verwaltungshandlung, sondern Teil des Handelns. Wer
    # einen Shop anlegen darf, darf ihn auch teilen.
    #
    # Das Recht deckt nur den BEFEHL. Wer an welche Kiste darf, entscheidet weiterhin
    # Kistenshop.offenFuer - und dort steht die Freigabe als vierter Fall.
    #
    # EIN Recht fuer den ganzen Baum, auch fuer /shop liste: Die Liste zeigt nur die
    # eigenen Laeden, und wer einen Shop anlegen darf, darf wissen, welche er hat. Ein
    # zweites Recht nur fuers Nachsehen waere eine Schranke ohne Gegenstand.
    description: Darf eigene Kistenshops auflisten und fuer andere freigeben
    default: true
  freimarken.blockbuch:
    # Ein eigenes Recht und NICHT freimarken.verwalten - dieselbe Begruendung wie bei
    # freimarken.spielzeit.andere: Das Blockbuch zu lesen ist Moderation und keine
    # Verwaltung. Wer es bekommen soll, soll nicht gleichzeitig Welten anlegen und
    # Spieler quer durch die Stadt versetzen koennen.
    #
    # default: op, weil die Auskunft nennt, wer wann wo war. Ein Spieler, der sie frei
    # lesen koennte, saehe damit auch, wann ein anderer nicht da ist und wo er baut -
    # und das ist die Vorarbeit fuer einen Einbruch, nicht seine Aufklaerung.
    description: Darf das Blockbuch lesen - wer wann wo was getan hat
    default: op
  # DIE TEAMROLLEN [Schritt 16a Teil A]: /team, /team rollen, /team zeigen.
  #
  # ZWEI Rechte und nicht eines: Das Ansehen ist eine Auskunft, das Vergeben ein
  # Eingriff - dieselbe Trennung wie bei freimarken.laden und freimarken.laden.mieten.
  # Ein Helfer soll nachsehen koennen, wen er ansprechen kann, ohne selbst Rollen
  # verteilen zu duerfen.
  #
  # default: op, weil die Liste nennt, wer wen befoerdert hat. Das ist eine
  # Verwaltungsauskunft; die Teamliste FUER SPIELER kommt nach Plan 12c.4 auf die
  # Spielerseite, und dort steht sie ohne Vergabezeiten und ohne Vergeber.
  freimarken.team:
    description: Darf das Team und die Rollen dieses Servers ansehen
    default: op
  freimarken.team.vergeben:
    # NICHT der einzige Riegel: Das Teambuch laesst eine Rolle nur von jemandem
    # vergeben, der JEDES ihrer Rechte selbst hat. Ohne diese zweite Pruefung
    # braeuchte ein Moderator mit diesem Recht nur einen Komplizen zum Verwalter zu
    # machen und haette ueber ihn freimarken.besitz. Dieses Recht entscheidet also, WER
    # ueberhaupt vergeben darf; WAS er vergeben darf, entscheiden seine eigenen Rechte.
    description: Darf Teamrollen vergeben und entziehen - nur solche, deren Rechte er selbst hat
    default: op
  # DAS MELDEWESEN [Schritt 16a Teil C]: /melden und /meldung.
  #
  # default: true fuer /melden, und das ist der Sinn der Einrichtung: Wer einen Vorfall
  # sieht, soll ihn melden koennen, ohne jemanden zu suchen. Die Bremsen gegen Missbrauch
  # sind KEINE Rechtefrage, sondern Zahlen in der config.yml (Abklingzeit und Hoechstzahl
  # offener Meldungen je Melder) - ein Recht waere alles oder nichts, und "nichts" heisst
  # hier, dass ein Vorfall nicht gemeldet wird.
  freimarken.melden:
    description: Darf einen Spieler mit Grund melden
    default: true
  freimarken.meldungen:
    # Ein eigenes Recht und NICHT freimarken.verwalten - dieselbe Begruendung wie bei
    # freimarken.blockbuch: Meldungen zu bearbeiten ist Moderation und keine Verwaltung.
    # Wer sie bekommen soll, soll nicht gleichzeitig Welten anlegen koennen.
    #
    # Es ist EIN Recht fuer Sehen und Bearbeiten, nicht zwei - anders als bei
    # freimarken.team und freimarken.team.vergeben. Der Grund ist der Inhalt: Eine
    # Meldung NENNT den Vorfall samt Namen und Ort. Wer sie lesen darf, hat schon alles
    # gesehen, was es zu sehen gibt; ein zweites Recht fuers Bearbeiten waere eine
    # Unterscheidung ohne Schutzwirkung.
    #
    # default: op, weil die Liste nennt, wer wen gemeldet hat. Das ist unter Spielern
    # Zuendstoff; der eigene Meldungsstand kommt nach Plan 12c.4 auf die Spielerseite,
    # und dort sieht jeder nur seine eigenen.
    description: Darf Meldungen sehen, annehmen, abschliessen und abweisen
    default: op
  # DIE STRAFEN [Schritt 16a Teil B]: /strafe und /bannliste.
  #
  # SECHS Rechte fuer drei Arten, und die drei zusaetzlichen sind der eigentliche
  # Inhalt dieses Teils. Plan 12c.2 trennt den Moderator vom Verwalter genau hier: Der
  # eine bannt ZEITLICH, der andere DAUERHAFT. Ohne eigene Rechte waere das eine Zeile
  # Papier.
  #
  # Je ART ein Recht und nicht eines fuer alle: Getrennte Rollen fuer Strafen sind nach
  # Plan 12c.2 Absicht, und ein Helfer soll kicken koennen, ohne bannen zu duerfen.
  freimarken.strafen.stumm:
    description: Darf einen Spieler stummschalten - mit Dauer und Grund
    default: op
  freimarken.strafen.rauswurf:
    description: Darf einen Spieler hinauswerfen - mit Grund
    default: op
  freimarken.strafen.bann:
    description: Darf einen Spieler sperren - mit Dauer und Grund
    default: op
  freimarken.strafen.dauerhaft:
    # DER TRAGENDE RIEGEL dieses Teils. Er greift auf ZWEI Weisen, und beide sind
    # noetig: bei einer Strafe OHNE Ende und bei einer, deren Dauer ueber
    # moderation.strafen.hoechste-stunden.<art> liegt. Wer nur das fehlende Ende
    # pruefte, haette einen Moderator, der 3650d tippt - formal befristet und
    # praktisch endgueltig.
    #
    # Es gilt auch beim AUFHEBEN einer unbegrenzten Strafe. Sonst nimmt ein Moderator
    # den dauerhaften Bann zurueck, den ein Verwalter verhaengt hat, und die
    # Unterscheidung waere in der einen Richtung gesichert und in der anderen offen.
    description: Darf dauerhaft oder laenger als die eingestellte Hoechstdauer strafen
    default: op
  freimarken.strafen.aufheben:
    # Ein eigenes Recht und nicht bei den Artrechten: Wer seine eigene Strafe
    # zurueckholen kann, kann sie auch zur Drohung machen. Fuer eine UNBEGRENZTE
    # braucht es zusaetzlich freimarken.strafen.dauerhaft.
    description: Darf eine Strafe zuruecknehmen - mit Grund
    default: op
  freimarken.strafen.team:
    # Der Riegel gegen zwei Moderatoren im Streit: Wer im Team ist, wird nur von
    # jemandem mit diesem Recht gestraft. Ohne ihn bannen sie einander, und wer
    # schneller tippt, hat gewonnen. Das ist die Entsprechung zu dem Riegel aus Teil A,
    # der verhindert, dass ein Moderator sich einen Komplizen zum Verwalter macht -
    # dieselbe Gefahr aus der anderen Richtung.
    #
    # Ob der Betroffene im Team ist, sagt die Teamtabelle und nicht Bukkit: Er kann
    # offline sein, und offline hat niemand Rechte.
    description: Darf jemanden strafen, der selbst im Team ist
    default: op
  freimarken.bannliste:
    # default: true - Plan 12c.4 macht die Bannliste ausdruecklich oeffentlich: "Sie
    # zwingt zu Begruendungen, die standhalten, und genau deshalb gehoert sie dazu."
    # Ob sie es wirklich ist, entscheidet zusaetzlich
    # moderation.strafen.bannliste-oeffentlich; steht die auf false, liest sie nur, wer
    # selbst bannen darf.
    description: Darf die oeffentliche Bannliste mit Grund und Dauer lesen
    default: true
  # FUENF Obergrenzen kommen ueber ein Recht mit Zahl: freimarken.parzellen.8 erlaubt
  # acht Parzellen, freimarken.gruppe.4 vier Felder je zusammengelegter Gruppe,
  # freimarken.inseln.2 zwei Meerinseln, freimarken.wolken.2 zwei Wolkeninseln,
  # freimarken.freistaedte.2 zwei Freistaedte. Die Vorsilben heissen nach der SACHE und
  # nicht nach dem Befehl - darum inseln neben /werder und wolken neben /wolke. Die
  # hoechste Zahl gewinnt, der Wert aus der config.yml ist die Untergrenze. Hier steht
  # kein Eintrag dafuer, weil die Zahl frei waehlbar ist - eingetragen wird sie in der
  # Rechteverwaltung, nicht hier.
  #
  # Je Grenze gibt es dazu einen ZUSCHLAG fuer eine Mitgliedschaft:
  # freimarken.extra.parzellen.<n>, .extra.gruppe.<n>, .extra.inseln.<n>,
  # .extra.wolken.<n>, .extra.freistaedte.<n>. Er kommt auf den Rang und ersetzt ihn
  # nicht.
