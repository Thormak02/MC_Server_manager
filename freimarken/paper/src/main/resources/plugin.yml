name: Freimarken
version: '${version}'
main: de.freimarken.paper.FreimarkenPlugin
api-version: '26.3'
description: Besitzleiter, Wirtschaft und Verwaltung des Freimarkenbunds
authors: [Friedrich]
website: https://friedrich-dietrich.de

# Keine commands-Liste: Befehle werden ueber die Lifecycle-API als Brigadier-Befehle
# angemeldet. Dort stehen Argumenttypen, Vervollstaendigung und Rechte je Zweig - hier
# stuenden nur Platzhalter.

permissions:
  freimarken.bauen.ueberall:
    description: Baut und oeffnet auf jeder Parzelle, auch auf fremder
    default: op
  freimarken.verwalten:
    description: Darf die Welt nachsehen, sich zu einer Parzelle versetzen und die Einstellungen neu laden
    default: op
  # Ein EIGENES Recht und nicht freimarken.bauen.ueberall: Wer einen Bundshop anlegt,
  # legt einen Preis des Servers fest - mit unbegrenztem Vorrat und unbegrenztem Geld.
  # Das ist eine andere Vollmacht als die, einen Block auf fremdem Grund zu setzen.
  freimarken.shop.bund:
    description: Legt Bundshops an und baut sie ab - ohne Besitzer, mit unbegrenztem Vorrat
    default: op
  # ANGEMELDET SEIT DEM 10.11.2026, und das war ein Fund: Ein Recht, das hier fehlt,
  # gehoert NUR Operatoren. Bukkit antwortet auf ein unangemeldetes Recht mit seiner
  # Vorgabe, und die ist OP - der Zweig bleibt einem gewoehnlichen Spieler also verborgen
  # und verwehrt. /beruf und /markt waren damit seit ihrem Bau fuer niemanden ausser dem
  # Betreiber erreichbar, waehrend im Programm "jeder" steht; die Spieltests liefen als
  # Operator und sahen es nicht. GrenzeTest.31al haelt das jetzt.
  freimarken.beruf:
    description: Waehlt einen Beruf und sieht die Lohnsaetze - jeder
    default: true
  freimarken.beruf.spezialisierung:
    # Ein RECHT und keine Rangzahl: Raenge sind auf diesem Server Rechte, und eine
    # Rangzahl hier waere eine zweite Quelle fuer dieselbe Frage. Wer den Rang Buerger
    # vergibt, vergibt dieses Recht mit.
    description: Darf eine Spezialisierung halten - ein Rangvorteil
    default: op
  freimarken.markt:
    description: Sieht, was der Bundesmarkt ankauft, und was heute noch zu holen ist
    default: true
  freimarken.reisen:
    description: Darf mit /warp zwischen den Welten reisen
    default: true
  freimarken.zurueck:
    description: Darf mit /zurueck zum letzten Ort
    default: true
  freimarken.tpa:
    description: Darf mit /tpa einen Spieler fragen und Anfragen annehmen
    default: true
  freimarken.sofort:
    # Ueberspringt die drei Sekunden Wartezeit vor jedem Teleport. Fuer Betreiber und
    # ihre Werkzeuge: /freimarken parzelle soll nicht abbrechen, weil man sich dabei dreht.
    description: Reist ohne Wartezeit
    default: op
  freimarken.spawnpunkt.setzen:
    # Oeffnet allein /spawnpoint. Bett und Respawn-Anker bleiben auch damit gesperrt -
    # sie sind kein Werkzeug des Betreibers, sondern eine abgeschaltete Spielmechanik.
    description: Darf trotz der Sperre einen Spawnpunkt setzen
    default: op
  freimarken.laden:
    description: Darf die Ladeneinheiten der Markthalle sehen
    default: true
  freimarken.laden.mieten:
    # Ein zweites Recht und nicht freimarken.laden: Die Liste ist eine Auskunft, das
    # Mieten bewegt Geld. Plan 9 haengt "Laden mieten" am Rang Siedler - bis Schritt 12
    # den Aufstieg bringt, steht es hier auf true. Wer schon heute staffeln will, nimmt
    # es weg und gibt es einer Gruppe.
    description: Darf einen Laden mieten, verlaengern und kuendigen
    default: true
  freimarken.freistadt:
    description: Darf die Liste der Freistaedte sehen
    default: true
  freimarken.freistadt.gruenden:
    # Ein zweites Recht und nicht freimarken.freistadt: Die Liste ist eine Auskunft, das
    # Gruenden bewegt 400.000 Mark. Plan 9 haengt es spaeter am Rang Buerger - bis
    # Schritt 12 den Aufstieg bringt, steht es hier auf true. Wer schon heute staffeln
    # will, nimmt es weg und gibt es einer Gruppe.
    description: Darf eine eigene Freistadt gruenden
    default: true
  freimarken.spielzeit:
    description: Darf die eigene gemessene Spielzeit sehen
    default: true
  freimarken.spielzeit.andere:
    # Ein zweites Recht und nicht freimarken.verwalten: Spielzeit ist eine Messung und
    # keine Verwaltung. Ein Moderator soll sie lesen koennen, ohne die Einstellungen neu
    # laden zu duerfen.
    description: Darf die Spielzeit anderer anwesender Spieler sehen
    default: op
  freimarken.spielmodus.frei:
    # Fuer Baumeister und Betreiber. Ohne dieses Recht wuerde ein Spieler im Kreativmodus
    # beim Betreten Altfurts mitten im Bauen auf Abenteuer heruntergestuft.
    description: Behaelt den eigenen Spielmodus in jeder Welt
    default: op
  freimarken.shop:
    # default: true, anders als freimarken.blockbuch - hier verschenkt jemand Zutritt zu
    # SEINEM Laden, und das ist keine Verwaltungshandlung, sondern Teil des Handelns. Wer
    # einen Shop anlegen darf, darf ihn auch teilen.
    #
    # Das Recht deckt nur den BEFEHL. Wer an welche Kiste darf, entscheidet weiterhin
    # Kistenshop.offenFuer - und dort steht die Freigabe als vierter Fall.
    #
    # EIN Recht fuer den ganzen Baum, auch fuer /shop liste: Die Liste zeigt nur die
    # eigenen Laeden, und wer einen Shop anlegen darf, darf wissen, welche er hat. Ein
    # zweites Recht nur fuers Nachsehen waere eine Schranke ohne Gegenstand.
    description: Darf eigene Kistenshops auflisten und fuer andere freigeben
    default: true
  freimarken.blockbuch:
    # Ein eigenes Recht und NICHT freimarken.verwalten - dieselbe Begruendung wie bei
    # freimarken.spielzeit.andere: Das Blockbuch zu lesen ist Moderation und keine
    # Verwaltung. Wer es bekommen soll, soll nicht gleichzeitig Welten anlegen und
    # Spieler quer durch die Stadt versetzen koennen.
    #
    # default: op, weil die Auskunft nennt, wer wann wo war. Ein Spieler, der sie frei
    # lesen koennte, saehe damit auch, wann ein anderer nicht da ist und wo er baut -
    # und das ist die Vorarbeit fuer einen Einbruch, nicht seine Aufklaerung.
    description: Darf das Blockbuch lesen - wer wann wo was getan hat
    default: op
  # Zwei Obergrenzen kommen ueber ein Recht mit Zahl: freimarken.parzellen.8 erlaubt acht
  # Parzellen, freimarken.gruppe.4 vier Felder je zusammengelegter Gruppe. Die hoechste
  # Zahl gewinnt, der Wert aus der config.yml ist die Untergrenze. Hier steht kein Eintrag
  # dafuer, weil die Zahl frei waehlbar ist - eingetragen wird sie in der
  # Rechteverwaltung, nicht hier.
