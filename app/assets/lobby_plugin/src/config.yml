# MCSMLobby - wird vom MC Server Manager aus den Gateway-Routen erzeugt.
# Manuelle Aenderungen bleiben beim naechsten Manager-Update ueberschrieben,
# AUSSER unter "regions" (Portale) - die ergaenzt du selbst.
cooldown_ms: 3000
messages:
  transfer: "&aVerbinde zu &e%server%&a..."
compass:
  enabled: true
  slot: 4
  name: "&bServer-Auswahl &7(Rechtsklick)"
gui:
  title: "Server auswaehlen"
  rows: 3
# Ziel fuer /lobby (host leer = dieser Server IST die Lobby).
lobby:
  host: ""
  port: 25565
# Live-Status: pingt die Server regelmaessig und faerbt das Menue
# (gruen=online, lila=schlaeft, rot=offline).
status:
  enabled: true
  interval_seconds: 8
# Vom Manager befuellt (LISTE, damit Aliase mit Punkten wie 1.21.11-spigot nicht
# als YAML-Pfad zerfallen). Beispiel:
servers: []
#  - key: "1.21.11-spigot"
#    display: "&aDavid (Spigot)"
#    host: "1.21.11-spigot.mc.friedrich-dietrich.de"
#    port: 25565
#    material: GRASS_BLOCK
#    slot: 11
#    sleep: true
# Begehbare Portale: in diesen Quader laufen -> Transfer. Selbst ergaenzen:
regions: []
#  - world: world
#    min: [10, 64, 10]
#    max: [12, 67, 12]
#    target: "1.21.11-spigot"
